  function renderExerciseNameDatalist(){
    var names = knownExerciseNames();
    if(!names.length) return "";
    return '<datalist id="exercise-name-options">' +
      names.map(function(n){ return '<option value="' + escapeHtml(n) + '"></option>'; }).join("") +
      '</datalist>';
  }
  function renderImportNameWarnings(){
    var warnings = state.importNameWarnings;
    if(!warnings || !warnings.length) return "";
    var rows = warnings.map(function(w){
      return '<div style="margin-bottom:6px;">”' + escapeHtml(w.imported) + '” — historiassa on samankaltainen liike ”' + escapeHtml(w.historical) + '”.</div>';
    }).join("");
    return renderBanner("", "tieto", "Tarkista liikkeiden kirjoitusasu",
      '<div style="margin-bottom:6px;">' + rows + '</div>' +
      'Liikkeet tunnistetaan nimen perusteella, joten eri kirjoitusasu aloittaa historian alusta. Korjaa nimi tiedostoon ja tuo ohjelma uudelleen, jos kyseessä on sama liike.',
      '<button class="btn-secondary btn-sm btn-auto" data-dismiss-import-warning type="button">Sulje</button>');
  }
  function renderOhjelma(){
    var hasWeeks = state.program.weeks && state.program.weeks.length > 0;
    var groupsToShow = state.program.days;

    // Ylärivi: vasemmalla viikko/kaikki-valitsin (kun viikkoja on), oikealla
    // kirjauspäivän sirpale. Näkyvä otsikko on ruudunlukijalle sr-only-tekstinä.
    // Käytössä olevan ohjelman nimi näytetään vasta, kun kirjastossa on
    // useampi ohjelma — yhdellä ohjelmalla rivi olisi pelkkää toistoa.
    var programRow = allPrograms().length > 1
      ? '<div class="program-row"><span class="chip chip-success">Käytössä</span><b class="program-row-name">' + escapeHtml(programDisplayName(state.program)) + '</b>' +
        '<button type="button" class="btn-tertiary btn-sm" data-open-settings="ohjelma">Vaihda</button></div>'
      : "";
    var html = programRow + renderImportNameWarnings() +
      (shouldShowFirstLogHint() ? renderFirstLogHint() : "") +
      '<div class="date-picker-row">' +
      (hasWeeks ? renderWeekModeSwitch() : '<span>Kirjataan päivälle</span>') +
      '<span class="sr-only">Kirjataan päivälle</span>' + renderDateChip() + '</div>';
    html += renderPainEntry();

    if(hasWeeks && !state.showAllWeeks){
      html += renderWeekStepper();
      groupsToShow = state.program.days.filter(function(d){ return d.week === state.activeWeek; });
    }

    var wide = isWideLayout();
    var list = "";
    if(groupsToShow.length === 0){
      list += renderEmptyState("ohjelma", "Tällä viikolla ei ole liikkeitä", "Lisää viikolle treenipäiviä ja liikkeitä muokkaustilassa.",
        '<button type="button" class="btn-secondary btn-sm btn-auto" data-edit-program>' + icon("muokkaa", 18) + '<span>Muokkaa ohjelmaa</span></button>', true);
    }
    // Seuraavaksi vuorossa on ensimmäinen päivä, jota ei ole tehty kokonaan;
    // vain se saa "Aloita"/"Jatka"-painikkeen.
    var nextKey = null;
    groupsToShow.forEach(function(day){ if(nextKey === null && !isDayFullyDone(day)) nextKey = dayKey(day); });
    groupsToShow.forEach(function(day){
      // Jokainen treenipäivä on oma korttinsa, oletuksena kiinni
      // (state.expandedDaySummaries avaa sen), jotta ohjelmanäkymä pysyy
      // skannattavana useamman päivän ohjelmissa. Avattuna sama kortti toimii
      // otsikkona ja liikkeet seuraavat sen alla.
      var expanded = !!state.expandedDaySummaries[dayKey(day)];
      list += renderDayCard(day, expanded, dayKey(day) === nextKey);
      if(expanded){
        list += '<div class="day-exercises">';
        // Leveällä näytöllä sarjat kirjataan oikean palstan paneelissa, joten
        // listan kortti näyttää vain otsikon.
        day.exercises.forEach(function(ex){ list += renderExercise(ex, wide); });
        list += '</div>';
      }
    });
    // Kenttä, josta ohjelmaan kuulumattoman liikkeen sai lisätä käsin, on
    // poistettu näkymästä: yksittäisen liikkeen lisääminen ei ole hyödyllinen
    // ilman laajempaa ohjelman muokkausta (lisää/poista/järjestä), joka on
    // vasta suunnitteilla. Liikkeiden lukurakenne (state.manualExercises,
    // allExercises, getExerciseGroupList) on jätetty koskematta, joten
    // toiminnon palauttaminen vaatii vain syöttökentän ja sen käsittelijän
    // palauttamisen. Lista renderöidään yhä, jos taulukkoon joskus tulee
    // sisältöä muuta kautta.
    if(state.manualExercises.length){
      list += '<div class="day-heading">Lisätyt liikkeet</div>';
      state.manualExercises.forEach(function(ex){ list += renderExercise(ex, wide); });
    }
    list += renderProgramNotes();
    if(!wide) return html + list;
    // Tabletti: päivät ja liikkeet vasemmalla, avattu liike sarjoineen
    // oikealla kiinnitettynä, jolloin kirjaus ei vieritä listaa pois.
    var openEx = state.openExercise ? findExerciseById(state.openExercise) : null;
    var pane = openEx ? renderExercise(openEx) : renderEmptyState("ohjelma", "Valitse liike", "Avaa liike vasemmalta, niin sen sarjat kirjataan tässä.", "", true);
    return '<div class="ohjelma-cols"><div class="ohjelma-list">' + html + list + '</div><aside class="ohjelma-pane" aria-label="Avattu liike">' + pane + '</aside></div>';
  }
  function tehoBadge(ex){
    if(!ex.intensity) return "";
    var label, cls;
    if(ex.intensity.isMax){
      // MAX erottuu ääriviivamerkkinä, prosenttiteho täytettynä harmaana.
      label = "MAX"; cls = "chip-brass";
    } else if(ex.intensity.percents && ex.intensity.percents.length){
      label = ex.intensity.percents.map(function(p){ return String(p).replace(".", ","); }).join("/") + " %";
      cls = "chip-muted";
    } else {
      return "";
    }
    return '<span class="chip ' + cls + '" style="margin-left:8px;">' + escapeHtml(label) + '</span>';
  }
  // Päivän nimi kortissa. Viikkonäkymässä pelkkä päivän oma nimi, koska viikko
  // näkyy jo valitsimessa; koko ohjelman näkymässä viikon nimi edellä, jotta
  // päivät erottuvat toisistaan.
  function dayCardTitle(day){
    return state.showAllWeeks ? dayDisplayName(day) : (day.label || dayLabelFromName(day));
  }
  function renderDayCard(day, expanded, isNext){
    var totalKg = 0;
    var latestDate = null;
    var doneCount = 0;
    day.exercises.forEach(function(ex){
      var logged = state.exerciseLogIndex[ex.id];
      if(!logged) return;
      doneCount++;
      if(latestDate === null || logged.date > latestDate) latestDate = logged.date;
      (logged.data.sets || []).forEach(function(s){
        var w = toNumber(s.weight), r = toNumber(s.reps);
        if(isFinite(w) && isFinite(r)) totalKg += w * r;
      });
    });
    var total = day.exercises.length;
    var fullyDone = isDayFullyDone(day);
    var ring, statusParts = [], borderStyle = "";
    if(fullyDone){
      ring = '<div class="day-ring done' + (state.justDoneDay === dayKey(day) ? " pop" : "") + '" aria-hidden="true">✓</div>';
      borderStyle = "border-color:rgba(111,174,111,0.35);";
      statusParts.push("Tehty");
      if(latestDate) statusParts.push(capitalize(formatDateFI(latestDate)));
    } else if(doneCount > 0){
      ring = '<div class="day-ring partial" aria-hidden="true">' + doneCount + "/" + total + '</div>';
      statusParts.push("Kesken");
      statusParts.push(plural(total, "liike", "liikettä"));
    } else {
      ring = '<div class="day-ring" aria-hidden="true"></div>';
      statusParts.push(plural(total, "liike", "liikettä"));
    }
    if(totalKg > 0) statusParts.push(totalKg.toLocaleString("fi-FI") + " kg nostettu");
    var key = escapeHtml(dayKey(day));
    // Seuraavaksi vuorossa oleva päivä saa ensisijaisen toimintopainikkeen;
    // avoinna oleva ja tehty päivä saavat pelkän nuolen.
    var right;
    if(isNext && !expanded && !fullyDone){
      right = '<button class="btn-primary btn-sm btn-auto" data-start-day data-key="' + key + '" type="button">' + (doneCount > 0 ? "Jatka" : "Aloita") + '</button>';
    } else {
      right = '<div class="chevron" style="' + (expanded ? "transform:rotate(90deg); color:var(--brass);" : "") + '">›</div>';
    }
    return '<div class="exercise" style="' + borderStyle + (expanded ? " margin-bottom:8px;" : "") + '">' +
      '<div class="day-card-head">' +
      '<div class="day-card-main" data-toggle-day-summary data-key="' + key + '" role="button" tabindex="0" aria-expanded="' + (expanded ? "true" : "false") + '">' +
      ring +
      '<div style="min-width:0;"><div class="exercise-name">' + escapeHtml(dayCardTitle(day)) + '</div>' +
      '<div class="exercise-target">' + escapeHtml(statusParts.join(" · ")) + '</div></div>' +
      '</div>' + right + '</div>' +
      '</div>';
  }
  function renderExercise(ex, noLedger){
    var open = state.openExercise === ex.id;
    var isSaved = isExerciseLogged(ex);
    var parts = [];
    if(ex.sets) parts.push(ex.sets + " sarjaa");
    if(ex.reps) parts.push(ex.reps + (ex.unit ? " " + ex.unit : ""));
    if(ex.weight) parts.push(ex.weight + " kg");
    if(ex.notes) parts.push(ex.notes);
    // Menetelmä (rest-pause, Cluster, drop) kuuluu tavoiteriville, mutta vain
    // kerran: jäsennin on osalle riveistä jo kopioinut sen huomautukseen.
    if(ex.method && String(ex.notes || "").indexOf(ex.method) === -1) parts.push(ex.method);
    var target = parts.join(" · ");
    var badge = isSaved
      ? '<div class="saved-badge' + (state.justSavedEx === ex.id ? " pop" : "") + '" title="Tallennettu">✓</div>'
      : '';
    // Avoinna oleva liike suljetaan aina nuolesta erikseen, koskematta
    // tallennustilaan — muuten (kiinni) koko otsikkorivi avaa liikkeen.
    var chevronHtml = open
      ? '<button type="button" class="chevron-btn" data-close-ex data-id="' + ex.id + '" aria-label="Sulje liike"><span class="chevron">›</span></button>'
      : '<div class="chevron">›</div>';
    // Otsikkona katalogin liikenimi; väline, variaatio ja lihasryhmä ovat
    // pienenä tarkenteena sen alla. Katalogin ulkopuolinen nimi sellaisenaan.
    var nameParts = catalogPartsFor(ex.name);
    var title = nameParts ? nameParts.liike : ex.name;
    var detailHtml = (nameParts && nameParts.details.length)
      ? '<div class="exercise-detail">' + escapeHtml(nameParts.details.join(" · ")) + '</div>'
      : '';
    // Otsikkorivi on pelkkä säiliö; painikkeena toimii sen sisällä oleva nimiosa.
    // Näin sulkunuoli ei jää interaktiivisen elementin sisään (nested-interactive).
    return '<div class="exercise ' + (open ? "open" : "") + '" style="' + (isSaved ? "border-color:rgba(111,174,111,0.35);" : "") + '">' +
      '<div class="exercise-head">' +
      '<div class="exercise-head-main" data-toggle-ex data-id="' + ex.id + '" role="button" tabindex="0" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<div class="exercise-name">' + escapeHtml(title) + tehoBadge(ex) + '</div>' + detailHtml +
      (target ? '<div class="exercise-target">' + escapeHtml(target) + '</div>' : '') +
      '</div><div style="display:flex; align-items:center;">' + badge + chevronHtml + '</div></div>' +
      (open && !noLedger ? renderLedger(ex) : '') +
      '</div>';
  }
  function autoCalcHint(info, id){
    if(!info) return "";
    var text;
    if(info.type === "max"){
      var maxWeightStr = String(info.weight).replace(".", ",") + " kg";
      if(info.isMax){
        text = "Paino perustuu manuaalisesti syötettyyn 1RM:ään (" + maxWeightStr + ") — muokattavissa.";
      } else {
        var pctStr = (info.percents || []).map(function(p){ return String(p).replace(".", ",") + " %"; }).join(" / ");
        text = "Paino laskettu " + pctStr + " liikkeen 1RM:stä (" + maxWeightStr + ") — muokattavissa.";
      }
    } else if(info.type === "formula"){
      var parts = (info.perSet || []).map(function(p, i){
        var label = "S" + (i+1) + ": ";
        if(p.status === "hit") return label + "tavoite täyttyi → nosto";
        if(p.status === "near") return label + "jäi 1 vajaaksi → sama paino";
        if(p.status === "missed") return label + "jäi ≥2 vajaaksi → kevennys";
        if(p.status === "deload") return label + "kevennys";
        return label + "ei vertailudataa";
      });
      text = (info.plateau ? "Ei kehitystä kolmeen kertaan — ehdotetaan kevennystä (−10 %). " : "") +
        "Ehdotus edellisen kerran (" + info.date + ") sarjoista, tavoite " +
        info.targetReps + " toistoa. " + parts.join(" · ") + " — muokattavissa.";
    } else if(info.type === "saved"){
      text = "Tämä merkintä on jo tallennettu (" + capitalize(formatDateFI(info.date)) + ") — arvot ladattu aiemmasta tallennuksesta, ei tuoreesta laskennasta.";
    } else if(info.warmupAdjust){
      // Ei ehdotusta mutta lämmittelysäädön tila: näytetään pelkkä säätöteksti.
      text = "";
    } else {
      return "";
    }
    var html = '<div style="font-size:11.5px; color:var(--mist); margin-bottom:10px; line-height:1.4;">' + text;
    if(info.type === "saved"){
      html += '<button class="btn-secondary" data-recalc data-id="' + id + '" type="button" style="margin-top:8px; padding:8px; font-size:12px; width:auto; display:block;">Poista merkintä ja laske uudelleen</button>';
    }
    var wa = info.warmupAdjust;
    if(wa){
      var waText;
      var rw = String(wa.refWeight).replace(".", ",");
      // Selite puhuu asteikon sanoin (kevyt … äärirajoilla), ei RPE-luvuin.
      if(wa.status === "learning"){
        waText = "Lämmittely " + rw + " kg × " + wa.refReps + " kirjattu (" + warmupFeelWord(wa.refRpe) +
          ") — ei vielä vertailudataa tälle painolle, työsarjoja ei säädetty.";
      } else if(wa.factor === 1){
        waText = "Lämmittely " + rw + " kg × " + wa.refReps + " tuntui tavanomaiselta (" +
          warmupFeelWord(wa.refRpe) + ") — työsarjat ennallaan.";
      } else {
        // Yksi desimaali, koska +2,5 % pyöristyisi liukuluvun takia "+2 %":ksi.
        var pct = Math.round((wa.factor - 1) * 1000) / 10;
        waText = "Lämmittely " + rw + " kg × " + wa.refReps + " oli tällä kertaa " + warmupFeelWord(wa.refRpe) +
          " (aiemmin tavallisesti " + warmupFeelWord(wa.baseline) + ") → työsarjat " +
          (pct > 0 ? "+" : "") + String(pct).replace(".", ",") + " %.";
      }
      html += '<div style="margin-top:6px; color:var(--chalk);">' + escapeHtml(waText) + '</div>';
    }
    html += '</div>';
    return html;
  }
  // Valmentajan selitys menetelmälle (esim. "Cluster = ...") kulkee ohjelman
  // mukana ja näytetään juuri sen liikkeen kohdalla, jota se koskee — muuten
  // liikkeille, joille painoa ei voi laskea, ei jäisi mitään ohjetta.
  function renderMethodNote(ex){
    if(!ex.methodNote) return "";
    return '<div style="background:rgba(201,162,39,0.10); border-left:2px solid var(--brass); border-radius:var(--radius-sm); padding:8px 10px; margin-bottom:10px; font-size:12px; line-height:1.5;">' +
      (ex.method ? '<b style="color:var(--brass);">' + escapeHtml(ex.method) + ':</b> ' : '') +
      escapeHtml(ex.methodNote) + '</div>';
  }
  // Aktiivinen sarja: se, jonka kenttä on viimeksi saanut fokuksen, tai
  // ensimmäinen keskeneräinen. Vain sen alla näkyvät ±2,5 kg -säätimet.
  function activeSetIndex(ex, sets){
    if(state.activeSet && state.activeSet.id === ex.id && sets[state.activeSet.idx]) return state.activeSet.idx;
    for(var i=0;i<sets.length;i++){ if(!sets[i].done) return i; }
    return sets.length - 1;
  }
  function renderLedger(ex){
    var sets = state.draftSets[ex.id] || [{ weight:"", reps:"", notes:"", done:false }];
    // Liikkeen väline, variaatio ja lihasryhmä ovat otsikon tarkenteessa
    // (renderExercise); erillistä variaatiolistaa ei enää näytetä.
    var hint = renderMethodNote(ex) + autoCalcHint(state.autoCalcInfo[ex.id], ex.id);
    var active = activeSetIndex(ex, sets);
    var extras = state.setExtra[ex.id] || {};
    var warmCount = 0;
    var rowParts = sets.map(function(s, idx){
      // Sarjan numero on pelkkä visuaalinen merkki — hyväksyntä tehdään aina
      // erillisestä, selvästi nimetystä painikkeesta.
      if(isWarmupRow(s)){
        // Lämmittelyrivi: L-numero, paino, toistot, valmis; RPE-valitsin ja
        // poisto omalla rivillään aina näkyvissä (ei huomiokenttää).
        warmCount++;
        // Tuntuma sanallisena asteikkona (WARMUP_SCALE); data-rpe on yhä luku,
        // joten käsittelijä ja tallennus ovat ennallaan. Painikkeen nimi
        // sisältää näkyvän sanan ja kuvauksen; valitun pykälän kuvaus näkyy
        // rivin alla ja luetaan ruudunlukijalle aria-live-alueena.
        var feelId = "feel-" + ex.id + "-" + idx;
        var selectedStep = null;
        var rpeButtons = WARMUP_SCALE.map(function(step){
          var on = s.rpe === step.rpe;
          if(on) selectedStep = step;
          return '<button type="button" class="weight-step-btn" data-warmup-rpe data-id="' + ex.id + '" data-idx="' + idx + '" data-rpe="' + step.rpe + '" aria-pressed="' + (on ? "true" : "false") + '" aria-label="Lämmittely ' + warmCount + ': ' + escapeHtml(step.label) + ' – ' + escapeHtml(step.desc) + '"' + (on ? ' style="background:var(--brass); color:var(--ink);"' : '') + '>' + escapeHtml(step.label) + '</button>';
        }).join("");
        return '<div class="ledger-row has-extra">' +
          '<div class="set-num' + (s.done ? " done" : "") + '" aria-hidden="true">' + (s.done ? "✓" : "L" + warmCount) + '</div>' +
          '<input class="ledger-input" type="text" inputmode="decimal" placeholder="kg" aria-label="Lämmittely ' + warmCount + ' paino kiloina" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="weight" value="' + escapeHtml(s.weight) + '">' +
          '<input class="ledger-input" type="text" inputmode="numeric" placeholder="toistot" aria-label="Lämmittely ' + warmCount + ' toistot" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="reps" value="' + escapeHtml(s.reps) + '">' +
          '<button type="button" class="set-done-btn" data-toggle-done data-id="' + ex.id + '" data-idx="' + idx + '" aria-pressed="' + (s.done ? "true" : "false") + '" aria-label="' + (s.done ? "Lämmittely " + warmCount + " merkitty valmiiksi" : "Merkitse lämmittely " + warmCount + " valmiiksi") + '">✓</button>' +
          '<div></div>' +
          '</div>' +
          '<div class="set-extra warmup-feel">' +
          '<div class="warmup-feel-head">' +
          '<span id="' + feelId + '-q" class="warmup-feel-q">Miltä lämmittely tuntui?</span>' +
          '<button class="btn-danger btn-sm btn-auto" data-remove-set data-id="' + ex.id + '" data-idx="' + idx + '" type="button" aria-label="Poista lämmittely ' + warmCount + '" style="padding:6px 10px; margin-left:auto;">' + icon("poista", 18) + '</button>' +
          '</div>' +
          '<div class="warmup-feel-btns" role="group" aria-labelledby="' + feelId + '-q">' + rpeButtons + '</div>' +
          '<div class="warmup-feel-desc" id="' + feelId + '-d" aria-live="polite">' + (selectedStep ? escapeHtml(selectedStep.label) + ': ' + escapeHtml(selectedStep.desc) + '.' : WARMUP_FEEL_PROMPT) + '</div>' +
          '</div>';
      }
      var extraOpen = !!(extras[idx] || (s.notes && String(s.notes).length));
      return '<div class="ledger-row' + (extraOpen ? " has-extra" : "") + '">' +
        '<div class="set-num' + (s.done ? " done" : "") + (s.done && state.justDone && state.justDone.id === ex.id && state.justDone.idx === idx ? " pop" : "") + '" aria-hidden="true">' + (s.done ? "✓" : String(idx+1)) + '</div>' +
        '<input class="ledger-input" type="text" inputmode="decimal" placeholder="kg" aria-label="Sarja ' + (idx+1) + ' paino kiloina" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="weight" value="' + escapeHtml(s.weight) + '">' +
        '<input class="ledger-input" type="text" inputmode="numeric" placeholder="toistot" aria-label="Sarja ' + (idx+1) + ' toistot" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="reps" value="' + escapeHtml(s.reps) + '">' +
        '<button type="button" class="set-done-btn" data-toggle-done data-id="' + ex.id + '" data-idx="' + idx + '" aria-pressed="' + (s.done ? "true" : "false") + '" aria-label="' + (s.done ? "Sarja " + (idx+1) + " merkitty valmiiksi" : "Merkitse sarja " + (idx+1) + " valmiiksi") + '">✓</button>' +
        '<button type="button" class="set-more' + (extraOpen ? " on" : "") + '" data-set-more data-id="' + ex.id + '" data-idx="' + idx + '" aria-expanded="' + (extraOpen ? "true" : "false") + '" aria-label="Sarjan ' + (idx+1) + ' huomio ja poisto">' + icon("valikko", 18) + '</button>' +
        '</div>' +
        (extraOpen
          ? '<div class="set-extra">' +
            '<input class="ledger-input" type="text" placeholder="Huomio (valinnainen)" aria-label="Sarja ' + (idx+1) + ' huomiot" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="notes" value="' + escapeHtml(s.notes) + '">' +
            '<button class="btn-danger btn-sm btn-auto" data-remove-set data-id="' + ex.id + '" data-idx="' + idx + '" type="button" aria-label="Poista sarja ' + (idx+1) + '" style="padding:6px 10px;">' + icon("poista", 18) + '</button>' +
            '</div>'
          : '') +
        '<div class="weight-step-row' + (active === idx ? "" : " hidden") + '" data-step-row data-id="' + ex.id + '" data-idx="' + idx + '">' +
        '<button class="weight-step-btn" data-weight-step data-id="' + ex.id + '" data-idx="' + idx + '" data-step="-2.5" type="button" aria-label="Vähennä sarjan ' + (idx+1) + ' painoa 2,5 kg">−2,5 kg</button>' +
        '<button class="weight-step-btn" data-weight-step data-id="' + ex.id + '" data-idx="' + idx + '" data-step="2.5" type="button" aria-label="Lisää sarjan ' + (idx+1) + ' painoa 2,5 kg">+2,5 kg</button>' +
        '</div>';
    });
    // Rivit on tuotettu yhdellä silmukalla todellisilla indekseillä; tässä
    // ne vain jaetaan lämmittely- ja työsarjalohkoihin näyttöä varten.
    var warmHtml = "", workHtml = "";
    rowParts.forEach(function(h, i){ if(isWarmupRow(sets[i])) warmHtml += h; else workHtml += h; });
    var total = sets.reduce(function(sum, s){
      if(isWarmupRow(s)) return sum;
      var w = parseFloat(String(s.weight).replace(",", ".")), r = parseFloat(String(s.reps).replace(",", "."));
      return sum + ((isFinite(w) && isFinite(r)) ? w*r : 0);
    }, 0);
    var allDone = isExerciseFullyDone(ex, ex.id);
    var warmupCount = warmupRows(ex.id).length;
    return '<div class="ledger">' +
      hint +
      (warmupCount ? '<div class="ledger-head" style="margin-top:4px;">Lämmittely</div>' + warmHtml : '') +
      '<button class="add-set-btn" data-add-warmup data-id="' + ex.id + '" type="button" style="margin:' + (warmupCount ? '10px' : '0') + ' 0 12px;">+ Lisää lämmittelysarja</button>' +
      '<div class="ledger-row ledger-head"><div></div><div>Paino</div><div>Toistot</div><div></div><div></div></div>' +
      workHtml +
      '<button class="add-set-btn" data-add-set data-id="' + ex.id + '" type="button">+ Lisää sarja</button>' +
      '<div class="subtotal"><span>Nostettu yhteensä</span><b>' + (total>0 ? total.toLocaleString("fi-FI") : "0") + ' kg</b></div>' +
      '<div class="ledger-save">' +
      (allDone ? "" : '<div style="font-size:var(--fs-xs); color:var(--mist); margin-bottom:8px; text-align:center;">Merkitse jokainen sarja valmiiksi (✓) ennen tallennusta.</div>') +
      '<button class="btn-primary" data-save-ex data-id="' + ex.id + '" type="button"' + (allDone ? "" : " disabled") + '>Tallenna merkintä</button>' +
      '</div>' +
      renderSwapExercise(ex) +
      '</div>';
  }
  var VARIANT_ADD_NEW = "__addnew__";
  var VARIANT_PLAIN = "__plain__";

  function knownMuscleGroups(){
    var seen = {};
    var groups = [];
    allExerciseVariants().forEach(function(row){
      if(row.lihasryhma && !seen[row.lihasryhma]){ seen[row.lihasryhma] = true; groups.push(row.lihasryhma); }
    });
    groups.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return groups;
  }
  function muscleGroupForLiike(liike){
    // Liikkeen lihasryhmä on sen ensimmäisen katalogirivin mukainen.
    var rows = variantRowsForLiike(liike);
    return (rows.length && rows[0].lihasryhma) ? rows[0].lihasryhma : null;
  }
  // Liikkeen väline samalla säännöllä; käyttäjän omilla liikkeillä ei ole
  // välinettä, jolloin palautetaan null eikä sitä näytetä.
  function equipmentForLiike(liike){
    var rows = variantRowsForLiike(liike);
    return (rows.length && rows[0].valine) ? rows[0].valine : null;
  }
  function variantPickerValid(){
    var p = state.variantPicker;
    if(!p) return false;
    if(p.addNew) return !!String(p.newLiike || "").trim();
    if(!p.liike) return false;
    // Kelvollinen valinta on sellainen, jota vastaava rivi löytyy katalogista:
    // jos jokin taso on vielä valitsematta eikä liikkeellä ole sen tason
    // perusversiota, riviä ei löydy eikä vaihtoa voi vahvistaa.
    return !!findVariantRow(p.liike, p.variaatio, p.lisavariaatio);
  }
  function variantSelectOptions(list, selected, hasPlain, placeholder){
    var html = '<option value=""' + (selected ? "" : " selected") + '>' + escapeHtml(placeholder) + '</option>';
    if(hasPlain){
      html += '<option value="' + VARIANT_PLAIN + '"' + (selected === VARIANT_PLAIN ? " selected" : "") + '>Ei variaatiota</option>';
    }
    list.forEach(function(opt){
      html += '<option value="' + escapeHtml(opt) + '"' + (selected === opt ? " selected" : "") + '>' + escapeHtml(opt) + '</option>';
    });
    return html;
  }
  function renderVariantPickerAddNew(){
    var p = state.variantPicker;
    var groups = knownMuscleGroups();
    var groupOptions = '<option value="">Lihasryhmä (valinnainen)</option>';
    groups.forEach(function(g){
      groupOptions += '<option value="' + escapeHtml(g) + '"' + (p.newLihasryhma === g ? " selected" : "") + '>' + escapeHtml(g) + '</option>';
    });
    return '<input type="text" class="ledger-input" data-variant-new-liike autocomplete="off" placeholder="Liikkeen nimi" aria-label="Uuden liikkeen nimi" value="' + escapeHtml(p.newLiike || "") + '" style="margin-bottom:8px;">' +
      '<div id="variant-name-hint">' + (p.nameHint ? renderVariantNameHint(p.nameHint) : "") + '</div>' +
      '<input type="text" class="ledger-input" data-variant-new-variaatio autocomplete="off" placeholder="Variaatio (valinnainen)" aria-label="Variaatio" value="' + escapeHtml(p.newVariaatio || "") + '" style="margin-bottom:8px;">' +
      '<input type="text" class="ledger-input" data-variant-new-lisavariaatio autocomplete="off" placeholder="Lisävariaatio (valinnainen)" aria-label="Lisävariaatio" value="' + escapeHtml(p.newLisavariaatio || "") + '" style="margin-bottom:8px;">' +
      '<select class="ledger-input" data-variant-new-lihasryhma aria-label="Lihasryhmä">' + groupOptions + '</select>' +
      '<div style="margin-top:8px;"><button type="button" data-variant-cancel-new style="background:none; border:none; color:var(--mist); font-size:12px; text-decoration:underline; padding:6px 4px; cursor:pointer;">‹ Takaisin listaan</button></div>';
  }
  function renderVariantNameHint(similar){
    // Sama sanamuoto ja tyyli kuin renderImportNameWarnings — ei estä tallennusta.
    return '<div class="banner" style="margin-bottom:8px;"><div class="banner-icon">' + icon("tieto", 20) + '</div><div class="banner-body">' +
      'Listalla on jo samankaltainen liike ”' + escapeHtml(similar) + '”. Liikkeet tunnistetaan nimen perusteella, joten eri kirjoitusasu aloittaa historian alusta.' +
      '</div></div>';
  }
  // Liikelista lihasryhmittäin <optgroup>-ryhminä. Yhteinen sekä liikkeen
  // vaihdolle että ohjelmarakentajalle, jotta molemmat näyttävät saman listan
  // samassa järjestyksessä — myös käyttäjän itse lisäämien liikkeiden osalta.
  function exerciseOptionsByGroup(selected){
    var byGroup = {};
    var groupOrder = [];
    knownBaseExerciseNames().forEach(function(name){
      var g = muscleGroupForLiike(name) || "Muut";
      if(!byGroup[g]){ byGroup[g] = []; groupOrder.push(g); }
      byGroup[g].push(name);
    });
    groupOrder.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    var html = "";
    groupOrder.forEach(function(g){
      html += '<optgroup label="' + escapeHtml(g) + '">';
      byGroup[g].forEach(function(name){
        html += '<option value="' + escapeHtml(name) + '"' + (selected === name ? " selected" : "") + '>' + escapeHtml(name) + '</option>';
      });
      html += '</optgroup>';
    });
    return html;
  }
  function renderVariantPicker(){
    var p = state.variantPicker;
    if(p.addNew) return renderVariantPickerAddNew();
    var html = '<select class="ledger-input" data-variant-liike aria-label="Liike" style="margin-bottom:8px;">' +
      '<option value=""' + (p.liike ? "" : " selected") + '>Valitse liike…</option>' +
      exerciseOptionsByGroup(p.liike) +
      '<option value="' + VARIANT_ADD_NEW + '">+ Liike ei löydy listalta — lisää uusi</option>' +
      '</select>';
    if(p.liike){
      var vOpts = variaatioOptionsFor(p.liike);
      if(vOpts.options.length){
        html += '<select class="ledger-input" data-variant-variaatio aria-label="Variaatio" style="margin-bottom:8px;">' +
          variantSelectOptions(vOpts.options, p.variaatio === null ? (p.variaatioTouched ? VARIANT_PLAIN : "") : p.variaatio, vOpts.hasPlain, "Valitse variaatio…") +
          '</select>';
      }
      var lOpts = lisavariaatioOptionsFor(p.liike, p.variaatio);
      if(lOpts.options.length){
        html += '<select class="ledger-input" data-variant-lisavariaatio aria-label="Lisävariaatio" style="margin-bottom:8px;">' +
          variantSelectOptions(lOpts.options, p.lisavariaatio === null ? (p.lisavariaatioTouched ? VARIANT_PLAIN : "") : p.lisavariaatio, lOpts.hasPlain, "Valitse lisävariaatio…") +
          '</select>';
      }
      var previewName = composeVariantName(p.liike, p.variaatio, p.lisavariaatio);
      var previewRow = findVariantRow(p.liike, p.variaatio, p.lisavariaatio);
      html += '<div style="color:var(--mist); font-size:12.5px; line-height:1.5; margin-top:2px;">Uusi nimi: <b style="color:var(--chalk);">' + escapeHtml(previewName) + '</b>' +
        (previewRow && previewRow.valine ? ' · ' + escapeHtml(previewRow.valine) : "") +
        (previewRow && previewRow.lihasryhma ? ' · ' + escapeHtml(previewRow.lihasryhma) : "") + '</div>';
    }
    return html;
  }
  function renderSwapExercise(ex){
    if(!isProgramExercise(ex.id)) return "";
    if(state.swapExercise !== ex.id){
      return '<div style="text-align:center; margin-top:12px;">' +
        '<button class="btn-tertiary btn-sm" data-swap-open data-id="' + ex.id + '" type="button">' + icon("muokkaa", 16) + '<span>Vaihda liike toiseksi</span></button></div>';
    }
    var occurrences = programExerciseOccurrences(ex.name).length;
    var html = '<div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">' +
      '<p style="color:var(--mist); font-size:12.5px; line-height:1.5; margin:0 0 10px;">Korvaa <b style="color:var(--chalk);">' + escapeHtml(ex.name) + '</b> toisella liikkeellä. Sarjat, toistot ja teho säilyvät ennallaan. Jo tallennetut merkinnät jäävät Historiaan vanhalla nimellä.</p>';
    // Teholiikkeillä (MAX/prosentti) säilyy entinen vapaa tekstikenttä; muille
    // näytetään ohjattu valinta liikekatalogista.
    var guided = !ex.intensity;
    if(guided){
      html += renderVariantPicker();
    } else {
      html += '<input type="text" id="swap-name-input" class="ledger-input" list="exercise-name-options" autocomplete="off" placeholder="Uusi liike" aria-label="Korvaavan liikkeen nimi" value="">' +
        renderExerciseNameDatalist();
    }
    if(occurrences > 1){
      // Ohjatussa valinnassa paneeli piirtyy uudelleen jokaisesta valinnasta,
      // joten valintaruudun tila luetaan tilasta — muuten käyttäjän poisrasti
      // palautuisi huomaamatta päälle seuraavassa piirrossa.
      var allWeeksChecked = guided ? (state.variantPicker.allWeeks !== false) : true;
      html += '<label style="display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--mist); font-size:12.5px; cursor:pointer;">' +
        '<input type="checkbox" id="swap-all-weeks"' + (allWeeksChecked ? " checked" : "") + ' style="width:18px; height:18px; accent-color:var(--brass); flex-shrink:0;">' +
        'Vaihda kaikissa viikoissa (' + occurrences + ' kohtaa)</label>';
    }
    return html + '<div style="display:flex; gap:8px; margin-top:12px;">' +
      '<button class="btn-secondary" data-swap-cancel type="button">Peruuta</button>' +
      '<button class="btn-primary" data-swap-confirm data-id="' + ex.id + '" type="button"' +
      ((guided && !variantPickerValid()) ? " disabled" : "") + '>Vaihda</button>' +
      '</div></div>';
  }
  // Lähdetiedoston ohjeteksti ei ole roskaa: se kulkee ohjelman mukana
  // (state.program.notes) ja näytetään omana osionaan, jotta mikään
  // alkuperäisestä tiedostosta ei katoa käyttäjän näkymättömiin.
  function renderNotesList(notes){
    var byFile = [];
    var index = {};
    notes.forEach(function(n){
      var key = n.file || "";
      if(index[key] === undefined){ index[key] = byFile.length; byFile.push({ file: key, lines: [] }); }
      byFile[index[key]].lines.push(n.text);
    });
    var multi = byFile.length > 1;
    return byFile.map(function(group){
      return (multi && group.file ? '<div style="color:var(--brass); font-size:11.5px; font-weight:700; margin:10px 0 4px;">' + escapeHtml(group.file) + '</div>' : '') +
        group.lines.map(function(t){
          return '<div style="color:var(--mist); font-size:12.5px; line-height:1.55; margin-bottom:4px;">' + escapeHtml(t) + '</div>';
        }).join("");
    }).join("");
  }
  function renderProgramNotes(){
    var notes = state.program && state.program.notes;
    if(!notes || !notes.length) return "";
    return '<div class="day-heading">Ohjelman muistiinpanot</div>' +
      '<div class="exercise" style="padding:14px 16px;">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">' +
      '<div style="color:var(--mist); font-size:12.5px;">' + notes.length + ' riviä ohjetekstiä tuodusta ohjelmasta.</div>' +
      '<button class="btn-secondary" data-toggle-program-notes type="button" style="width:auto; padding:8px 14px; font-size:12.5px;">' + (state.showProgramNotes ? "Piilota" : "Näytä") + '</button>' +
      '</div>' +
      (state.showProgramNotes ? '<div style="margin-top:10px;">' + renderNotesList(notes) + '</div>' : '') +
      '</div>';
  }

  // ---------- PDF-tuonnin tarkistusnäkymä ----------
  // Esitäyttää jäsennystuloksen muokattavaksi. Tallennus tapahtuu vasta
  // "Valmis"-painikkeesta, joka kutsuu samaa applyImportedProgram-polkua kuin
  // CSV-tuonti — ei omaa tallennuslogiikkaa.
  function noAutoCalcReason(ex){
    if(ex.kind === "duration") return "Kestoperusteinen liike — painoa ei ehdoteta.";
    if(ex.kind === "circuit") return "Kirjataan vapaasti — painoa ei ehdoteta.";
    return "Painoehdotusta ei lasketa: tavoite on menetelmäkohtainen.";
  }
  // ---------- Muokkaustilan näkymä ----------

      ' aria-label="' + escapeHtml(label) + '"' + (disabled ? " disabled" : "") + '>' + icon(iconName, 18) + '</button>';
  }
  function editorMoveButtons(scope, key, index, count){

  function editorMenuButton(menuKey, open){

  // Poisto ja "Aloita uudelleen" vaativat vahvistuksen: ensimmäinen painallus
  // vaihtaa painikkeen tuhoavaksi "Vahvista"-painikkeeksi, toinen suorittaa.
  function editorDeleteButton(target, label){

  function fmtSignedKg(diff){
    var rounded = Math.round(diff * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return "+" + str + " kg";
    if(rounded < 0) return "−" + str + " kg";
    return "0 kg";
  }
  function fmtSignedPct(pct){
    if(pct === null || !isFinite(pct)) return "";
    var rounded = Math.round(pct * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return " (+" + str + " %)";
    if(rounded < 0) return " (−" + str + " %)";
    return " (0 %)";
  }
  function renderDeltaValue(current, past){

    return '<span style="color:' + color + '; font-variant-numeric:tabular-nums; font-weight:600;">' + fmtSignedKg(diff) + fmtSignedPct(pct) + '</span>';
  }
  function renderOneRepMaxChart(points, name){
    // Viiva on liukuva paras (sama luku kuin kortissa), päiväkohtaiset arviot
    // katkoviivana sen alla, jotta submaksimaaliset päivät näkyvät mutta
    // eivät hallitse käyrää.
    var bestPoints = points.map(function(p){
      var b = bestWithin(points, p.date, ONE_REP_MAX_WINDOW_DAYS) || p;
      return { date: p.date, value: b.value };
    });
    var daily = points.map(function(p){ return p.value; });
    return renderProgressChart(bestPoints, name + " — 1RM, paras " + Math.round(ONE_REP_MAX_WINDOW_DAYS / 7) + " viikolta", "kg", daily);
  }
  function renderProgressChart(points, titlePrefix, unit, secondary){
    // Staattinen, yleiskäyttöinen SVG-viivakäyrä (käytetään sekä liikkeen
    // laskennalliselle 1RM:lle että treenipäivän kokonaispainolle). Vaaka-akseli
    // skaalataan todellisen ajan mukaan, jotta treenitauot näkyvät käyrässä.
    // Toimii myös yhden pisteen sarjalla: silloin piirretään pelkkä keskitetty
    // piste ilman viivaa (polyline/polygon jäävät ilman pinta-alaa yhdellä
    // koordinaatilla).
    if(!points || points.length === 0) return "";
    var i;
    var times = [], values = [];
    for(i=0;i<points.length;i++){
      times.push(new Date(points[i].date + "T00:00:00").getTime());
      values.push(points[i].value);
    }
    var tMin = times[0], tMax = times[times.length - 1];
    var vMin = values[0], vMax = values[0];
    for(i=1;i<values.length;i++){
      if(values[i] < vMin) vMin = values[i];
      if(values[i] > vMax) vMax = values[i];
    }
    // Toissijainen sarja (päiväkohtaiset arviot) vaikuttaa asteikkoon.
    var sec = (secondary && secondary.length === points.length) ? secondary : null;
    if(sec){ for(i=0;i<sec.length;i++){ if(sec[i] < vMin) vMin = sec[i]; if(sec[i] > vMax) vMax = sec[i]; } }
    var calcMin, calcMax;
    if(vMax === vMin){
      calcMin = vMin - 1;
      calcMax = vMax + 1;
    } else {
      var pad = (vMax - vMin) * 0.08;
      calcMin = vMin - pad;
      calcMax = vMax + pad;
    }
    function round1(v){ return Math.round(v * 10) / 10; }
    function xAt(t){
      if(tMax === tMin) return 175;
      return round1(40 + (t - tMin) / (tMax - tMin) * 270);
    }
    function yAt(v){ return round1(110 - (v - calcMin) / (calcMax - calcMin) * 98); }
    function fmtValue(v){ return String(v).replace(".", ","); }

    var coords = [];
    for(i=0;i<points.length;i++){
      coords.push({ x: xAt(times[i]), y: yAt(values[i]) });
    }
    var last = coords[coords.length - 1];
    var linePoints = coords.map(function(c){ return c.x + "," + c.y; }).join(" ");
    var secondaryLine = "";
    if(sec && coords.length > 1){
      var secPoints = coords.map(function(c, idx){ return c.x + "," + yAt(sec[idx]); }).join(" ");
      secondaryLine = '<polyline points="' + secPoints + '" fill="none" stroke="var(--mist)" stroke-width="1.2" stroke-dasharray="3 3" stroke-linejoin="round"></polyline>';
    }
    var areaPoints = coords[0].x + ",110 " + linePoints + " " + last.x + ",110";

    var dots = "";
    if(coords.length <= 14){
      dots = coords.map(function(c){
        return '<circle cx="' + c.x + '" cy="' + c.y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
      }).join("");
    } else {
      dots = '<circle cx="' + coords[0].x + '" cy="' + coords[0].y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
    }
    dots += '<circle cx="' + last.x + '" cy="' + last.y + '" r="3.5" fill="var(--brass)" stroke="none"></circle>';

    var label = (points.length === 1)
      ? titlePrefix + " " + formatDateShortFI(points[0].date) + ", " + fmtValue(values[0]) + " " + unit
      : titlePrefix + " " +
        formatDateShortFI(points[0].date) + "–" + formatDateShortFI(points[points.length - 1].date) + ", " +
        fmtValue(values[0]) + " " + unit + " → " + fmtValue(values[values.length - 1]) + " " + unit;
    var safeLabel = escapeHtml(label);

    var xAxisLabels = (points.length === 1)
      ? '<text x="175" y="126" text-anchor="middle" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>'
      : '<text x="40" y="126" text-anchor="start" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>' +
        '<text x="310" y="126" text-anchor="end" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[points.length - 1].date)) + '</text>';

    return '<svg viewBox="0 0 320 130" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block; height:auto; margin:2px 0 12px;" role="img" aria-label="' + safeLabel + '">' +
      '<title>' + safeLabel + '</title>' +
      '<line x1="40" y1="12" x2="310" y2="12" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<line x1="40" y1="110" x2="310" y2="110" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<polygon points="' + areaPoints + '" fill="rgba(201,162,39,0.10)" stroke="none"></polygon>' +
      secondaryLine +
      '<polyline points="' + linePoints + '" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      dots +
      '<text x="34" y="' + round1(yAt(vMax) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMax) + '</text>' +
      '<text x="34" y="' + round1(yAt(vMin) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMin) + '</text>' +
      xAxisLabels +
      '</svg>';
  }
  function renderKehitysCard(item){
    var p = item.progress;
    var entries = [
      ["Kuukauden aikana", renderDeltaValue(p.current, p.month), p.month],
      ["Puolen vuoden aikana", renderDeltaValue(p.current, p.halfYear), p.halfYear],
      ["Vuoden aikana", renderDeltaValue(p.current, p.year), p.year],

    ];
    function fmtSet(set){ return set ? String(set.weight).replace(".", ",") + " kg × " + set.reps : ""; }
    var weeks = Math.round(ONE_REP_MAX_WINDOW_DAYS / 7);
    var currentLine = "Paras 1RM viimeiseltä " + plural(weeks, "viikolta", "viikolta") + ": " +

  function renderTotalWeightCard(points){

  // Päivän yhteenveto: liikkeiden määrä ja nostettu kokonaispaino.
  function historyDaySummary(entry){
    var keys = Object.keys((entry && entry.exercises) || {});
    var totalKg = 0;
    keys.forEach(function(k){
      ((entry.exercises[k] || {}).sets || []).forEach(function(s){
        var w = toNumber(s.weight), r = toNumber(s.reps);
        if(isFinite(w) && isFinite(r)) totalKg += w * r;
      });
    });
    var parts = [plural(keys.length, "liike", "liikettä")];
    if(totalKg > 0) parts.push(totalKg.toLocaleString("fi-FI") + " kg");
    return parts.join(" · ");
  }
  function renderHistoryDate(date){
    var expanded = state.expandedHistoryDate === date;
    var entry = state.historyCache[date];
    var inner = "";
    if(expanded){
      var keys = Object.keys((entry && entry.exercises) || {});
      if(keys.length === 0){
        inner = '<div style="color:var(--mist); font-size:var(--fs-sm); margin-top:8px;">Ei kirjattuja liikkeitä.</div>';
      } else {
        inner = keys.map(function(key){
          var data = entry.exercises[key];
          var name = data.name || key;
          var setsStr = (data.sets || []).map(function(s, i){
            return (i+1) + ": " + (s.weight || "–") + " kg × " + (s.reps || "–") + (s.notes ? " (" + escapeHtml(s.notes) + ")" : "");
          }).join(" · ");
          return '<div style="margin-top:10px;"><div style="font-weight:600; font-size:var(--fs-md);">' + escapeHtml(name) + '</div>' +
            '<div style="color:var(--mist); font-size:var(--fs-sm); font-variant-numeric:tabular-nums; margin-top:2px;">' + setsStr + '</div></div>';
        }).join("");
      }
      // Poisto on toissijainen toiminto: pieni tekstipainike kortin alareunassa,
      // ei pääsisällön kanssa yhtä näkyvä palkki. Vahvistus vaihtaa sen
      // tuhoavaksi painikkeeksi.
      var confirming = state.confirmingDeleteDate === date;
      inner += '<div style="display:flex; justify-content:flex-end; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);">' +
        '<button class="' + (confirming ? "btn-danger btn-sm btn-auto" : "btn-tertiary btn-sm") + '" data-delete-history data-date="' + date + '" type="button"' + (confirming ? "" : ' style="color:var(--danger-text);"') + '>' +
        icon("poista", 16) + '<span>' + (confirming ? "Vahvista poisto" : "Poista päivä") + '</span></button></div>';
    }
    return '<div class="history-date">' +
      '<div class="history-date-head" data-history-date data-date="' + date + '" role="button" tabindex="0" aria-expanded="' + (expanded ? "true" : "false") + '">' +
      '<span style="min-width:0;"><span style="display:block;">' + capitalize(formatDateFI(date)) + '</span>' +
      (entry ? '<span style="display:block; color:var(--mist); font-size:var(--fs-sm); font-weight:400; margin-top:2px;">' + escapeHtml(historyDaySummary(entry)) + '</span>' : '') +
      '</span>' +
      '<span class="chevron" style="display:inline-block;' + (expanded ? "transform:rotate(90deg);color:var(--brass);" : "") + '">›</span>' +
      '</div>' + inner + '</div>';
  }
  function maxExerciseNames(){
    var names = {};

      settingsP("Palauta varmuuskopio tai siirrä tietosi toiselta laitteelta. Ohjelma palautuu sellaisena kuin se oli varmuuskopion hetkellä; omat liikkeet, 1RM-arvot ja merkinnät yhdistetään olemassa oleviin ohittaen jo olemassa olevat, joten sama tiedosto voidaan tuoda turvallisesti useaan kertaan.", "16px 0 12px") +

  function renderAsetukset(){
    var section = state.settingsSection;

  // (consentGiven + STORAGE_CONSENT_KEY) on täsmälleen sama kuin ennen.
  function renderConsentGate(){
    function feature(iconName, text){
      return '<div class="welcome-feature"><div class="choice-icon">' + icon(iconName, 22) + '</div>' +
        '<div class="welcome-feature-text">' + text + '</div></div>';

      '<div class="welcome-features">' +

      feature("kehitys", 'Painoehdotukset ja kehityksen seuranta <b>joka liikkeelle</b>') +
      feature("suoja", 'Tiedot pysyvät <b>vain omalla laitteellasi</b> — mitään ei lähetetä verkkoon') +

      '<div class="welcome-terms"><b>Koekäyttöversio.</b> Tämä sovellus on tekijän omistama koekäyttöversio, ei julkinen julkaisu. Sisältöä ei saa kopioida, jakaa eteenpäin eikä käyttää kaupallisesti. Jatkamalla vahvistat, että olet tietoinen tästä ja käytät sovellusta vain tekijän luvalla.</div>' +

  // Tablettiasettelu: vähintään 768 px leveällä näytöllä Ohjelma-näkymä on
  // kaksipalstainen (ks. renderOhjelma). Palstamäärän vaihtuessa näkymä
  // piirretään uudelleen.
  var wideQuery = window.matchMedia ? window.matchMedia("(min-width: 768px)") : null;
  function isWideLayout(){ return !!(wideQuery && wideQuery.matches); }
  if(wideQuery){
    var onWideChange = function(){ if(state.program && !state.loading && !state.editMode) render(); };
    if(wideQuery.addEventListener) wideQuery.addEventListener("change", onWideChange);
    else if(wideQuery.addListener) wideQuery.addListener(onWideChange);
  }
  function render(){
    var app = document.getElementById("app");
    var apply = function(){
      if(state.consentChecked && !state.consentGiven){
        app.className = "";
        app.innerHTML = '<main>' + renderConsentGate() + '</main>';
        return;
      }
      // Alanavigaatio on kelluva ja peittäisi sisällön lopun ilman lisätilaa.
      var appClass = ((state.program && !state.loading) || state.editMode) ? "has-bottom-nav" : "";
      if(state.program && !state.loading && !state.editMode && state.view === "ohjelma" && isWideLayout()) appClass += " wide";
      app.className = appClass;
      // header/nav/main-maamerkit: ruudunlukijalla pääsee suoraan sisältöön.
      app.innerHTML = '<header>' + renderHeader() + '</header><main>' + renderBody() + '</main>' + renderSheet() + (state.editMode ? renderEditBar() : "");
    };
    // Palautetaan siirtymäolio, jotta harvat kutsujat jotka lukevat juuri
    // piirretyn DOM:in (ks. data-swap-open) voivat odottaa päivitystä.
    if(document.startViewTransition){ return document.startViewTransition(apply); }
    else{ apply(); }
  }

  // ---------- events (delegated, attached once) ----------
  var app = document.getElementById("app");

  app.addEventListener("click", async function(e){
    var el;
    // Valmis-merkkien animaatioliput elävät vain yhden käyttäjätoimen ajan.
    state.justDone = null; state.justSavedEx = null; state.justDoneDay = null;
    if(state.editMode){
      // Painallus muualle nollaa odottavan vahvistuksen.
      var ed0 = state.editor;
      if(ed0.confirmDelete && !e.target.closest("[data-edit-delete],[data-edit-restart]")){ ed0.confirmDelete = null; render(); }
      if(ed0.confirmCancel && !e.target.closest("[data-edit-cancel]")){ ed0.confirmCancel = false; render(); }
    }
    if(e.target.closest("#consent-accept-btn")){
      state.consentGiven = true;
      try{ await storeSet(STORAGE_CONSENT_KEY, "1"); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
      render();
      return;
    }
    if(e.target.closest("[data-toggle-homescreen-hint]")){
      state.homescreenHintExpanded = !state.homescreenHintExpanded;
      render();
      return;
    }
    if(e.target.closest("[data-dismiss-first-log-hint]")){
      state.firstLogHintDismissed = true;
      try{ await storeSet(STORAGE_FIRST_LOG_HINT_KEY, "1"); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
      render();
      return;
    }
    if((el = e.target.closest("[data-open-sheet]"))){
      state.sheet = el.dataset.openSheet;
      // Fokus siirtyy paneelin sulkupainikkeeseen: ruudunlukija ilmoittaa
      // dialogin, ja Escape toimii heti ilman erillistä napautusta.
      afterRender(function(){ var c = document.querySelector(".sheet [data-close-sheet]"); if(c) c.focus(); });
      return;
    }
    if((el = e.target.closest("[data-pick-exercise]"))){
      if(state.editMode && state.editor.form){
        var picked = el.dataset.pickExercise;
        state.editor.form.name = picked;
        if(el.hasAttribute("data-pick-free")){
          var similarPick = findSimilarName(picked, knownBaseExerciseNames());
          if(similarPick && normalizeName(similarPick) !== normalizeName(picked)) showToast("Listalla on jo samankaltainen liike ”" + similarPick + "” — tarkista kirjoitusasu", 4500);
        }
      }
      closeSheet();
      return;
    }
    if(e.target.closest("[data-new-program-activate]")){ await acceptPendingProgram(true); return; }
    if(e.target.closest("[data-new-program-shelve]")){ await acceptPendingProgram(false); return; }
    if(e.target.closest("[data-new-program-cancel]")){ closeSheet(); return; }
    if(e.target.closest("[data-close-sheet]")){
      // Vain tausta tai sulkupainike sulkee; paneelin sisällön napautus ei.
      var closeEl = e.target.closest("[data-close-sheet]");
      if(closeEl.classList.contains("sheet-backdrop") && e.target !== closeEl) return;
      closeSheet();
      return;
    }
    if(e.target.closest("[data-dismiss-homescreen-hint]")){
      state.showHomescreenHint = false;
      state.homescreenHintDismissed = true;
      try{ await storeSet(STORAGE_HOMESCREEN_HINT_KEY, "1"); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
      render();
      return;
    }
    if(e.target.closest("[data-export-reminder-now]")){
      await exportAllCSV();
      return;
    }
    if(e.target.closest("[data-dismiss-export-reminder]")){
      // Vain kuluvaksi istunnoksi: ei tallenneta mitään, joten muistutus
      // palaa sivun uudelleenlatauksen jälkeen jos kynnys on yhä ylitetty.
      state.exportReminderDismissed = true;
      render();
      return;
    }
    if(e.target.closest("#feedback-send-btn")){
      var feedbackInput = document.getElementById("feedback-text");
      var feedbackText = feedbackInput ? feedbackInput.value.trim() : "";
      if(!feedbackText){ showToast("Kirjoita palaute ennen lähettämistä"); return; }
      var feedbackSubject = "Treenipäiväkirja – palaute (v" + APP_VERSION + ")";
      var feedbackBody = feedbackText +
        "\n\n---\nVersio: " + APP_VERSION +
        "\nTallennustila: " + state.storageMode +
        "\nSelain: " + navigator.userAgent;
      window.location.href = "mailto:" + FEEDBACK_EMAIL +
        "?subject=" + encodeURIComponent(feedbackSubject) +
        "&body=" + encodeURIComponent(feedbackBody);
      return;
    }
    if(e.target.closest("[data-dismiss-pdf-error]")){
      state.pdfImportError = null;
      render();
      return;
    }
    if(e.target.closest("[data-toggle-program-notes]")){
      state.showProgramNotes = !state.showProgramNotes;
      render();
      return;
    }
    if(e.target.closest("[data-restore-confirm]")){
      if(state.pendingRestore) await applyBackupRestore(state.pendingRestore);
      return;
    }
    if(e.target.closest("[data-restore-cancel]")){
      cancelBackupRestore();
      return;
    }
    if((el = e.target.closest("[data-settings-section]"))){
      state.settingsSection = el.dataset.settingsSection;
      state.confirmingReset = false;
      state.programRename = null;
      state.confirmingDeleteProgram = null;
      if(state.settingsSection === "muutokset" && changelogHasNew()){
        state.changelogSeen = CHANGELOG[0].date;
        try{ await storeSet(STORAGE_CHANGELOG_SEEN_KEY, state.changelogSeen); }
        catch(e){ /* hiljainen virhe, ei kriittinen */ }
      }
      render();
      return;
    }
    if(e.target.closest("[data-settings-back]")){
      state.settingsSection = null;
      state.confirmingReset = false;
      state.confirmingDeleteMax = null;
      state.programRename = null;
      state.confirmingDeleteProgram = null;
      render();
      return;
    }
    if((el = e.target.closest("[data-open-settings]"))){
      state.view = "asetukset";
      state.settingsSection = el.dataset.openSettings;
      render();
      return;
    }
    if((el = e.target.closest("[data-program-activate]"))){ await activateProgram(el.dataset.programActivate); return; }
    if((el = e.target.closest("[data-program-rename-save]"))){
      var rnInput = document.querySelector("[data-program-name-input]");
      await renameProgram(el.dataset.programRenameSave, rnInput ? rnInput.value : "");
      return;
    }
    if(e.target.closest("[data-program-rename-cancel]")){ state.programRename = null; render(); return; }
    if((el = e.target.closest("[data-program-rename]"))){
      state.programRename = el.dataset.programRename;
      state.confirmingDeleteProgram = null;
      afterRender(function(){ var i = document.querySelector("[data-program-name-input]"); if(i){ i.focus(); i.select(); } });
      return;
    }
    if((el = e.target.closest("[data-program-delete]"))){
      var delId = el.dataset.programDelete;
      if(state.confirmingDeleteProgram !== delId){ state.confirmingDeleteProgram = delId; render(); return; }
      await deleteProgram(delId);
      return;
    }
    if(e.target.closest("[data-edit-program]")){ await startProgramEdit(); return; }
    if(e.target.closest("[data-edit-cancel]")){ cancelProgramEdit(); return; }
    if(e.target.closest("[data-edit-done]")){ await finishProgramEdit(); return; }
    if((el = e.target.closest("[data-edit-open-week]"))){
      var wk = el.dataset.editOpenWeek;
      state.editor.openWeeks[wk] = !state.editor.openWeeks[wk];
      render();
      return;
    }
    if((el = e.target.closest("[data-edit-open-day]"))){
      var dk = el.dataset.editOpenDay;
      state.editor.openDays[dk] = !state.editor.openDays[dk];
      render();
      return;
    }
    if((el = e.target.closest("[data-edit-menu]"))){
      var mk = el.dataset.editMenu;
      state.editor.menuFor = state.editor.menuFor === mk ? null : mk;
      render();
      return;
    }
    if((el = e.target.closest("[data-edit-move]"))){
      var mdir = parseInt(el.dataset.dir, 10), mscope = el.dataset.scope, mkey = el.dataset.key;
      if(mscope === "week") editorMoveWeek(mkey, mdir);
      else if(mscope === "day") editorMoveDay(mkey, mdir);
      else editorMoveExercise(mkey, mdir);
      return;
    }
    if((el = e.target.closest("[data-edit-copy]"))){
      var ct = el.dataset.editCopy;
      if(ct.indexOf("week:") === 0) editorCopyWeek(ct.slice(5)); else editorCopyDay(ct.slice(4));
      return;
    }
    if(e.target.closest("[data-edit-copy-last-week]")){
      // Tavallisin rakentamisen työnkulku: viikko 1 valmiiksi ja loput sen
      // kopioina, joten painike kopioi aina viimeisen viikon.
      var lastWeeks = state.programDraft.weeks;
      if(lastWeeks.length) editorCopyWeek(lastWeeks[lastWeeks.length - 1]); else showToast("Lisää ensin viikko");
      return;
    }
    if(e.target.closest("[data-edit-add-week]")){ editorAddWeek(); return; }
    if((el = e.target.closest("[data-edit-add-day]"))){ editorAddDay(el.dataset.editAddDay === "" ? null : el.dataset.editAddDay); return; }
    if((el = e.target.closest("[data-edit-add-exercise]"))){ editorOpenForm(el.dataset.editAddExercise, null); return; }
    if((el = e.target.closest("[data-edit-exercise]"))){ editorOpenForm(null, el.dataset.editExercise); return; }
    if(e.target.closest("[data-edit-form-cancel]")){ editorCloseForm(); return; }
    if(e.target.closest("[data-edit-form-save]")){ editorSaveForm(); return; }
    if((el = e.target.closest("[data-edit-restart]"))){
      var rt = el.dataset.editRestart;
      if(el.dataset.needsConfirm && state.editor.confirmDelete !== "restart:" + rt){

        return;
      }

    }
    if((el = e.target.closest("[data-edit-delete]"))){
      var dt = el.dataset.editDelete;

        render();
        return;
      }
      if(dt.indexOf("week:") === 0) editorDeleteWeek(dt.slice(5));
      else if(dt.indexOf("day:") === 0) editorDeleteDay(dt.slice(4));
      else editorDeleteExercise(dt.slice(3));

    if(e.target.closest("[data-builder-start]")){

      var dateInput = el.querySelector("input[type=date]");

        try{ dateInput.showPicker(); }catch(err){ dateInput.focus(); }

    if((el = e.target.closest("[data-tab]"))){
      // Kesken oleva tuonti ei ole vielä tallessa missään, joten välilehden
      // vaihto ei saa hukata sitä vahingossa.
      if(state.editMode){
        var guardWord = state.editor.mode === "new" ? "rakentaminen" : (state.editor.mode === "import" ? "tuonti" : "muokkaus");
        showToast("Viimeistele tai peruuta ohjelman " + guardWord + " ensin");
        return;
      }
      state.view = el.dataset.tab;
      state.confirmingReset = false;
      // Asetukset avautuu aina riviluetteloon, ei edelliseen alinäkymään.
      state.settingsSection = null;
      state.programRename = null;
      state.confirmingDeleteProgram = null;
      // Vahvistamaton palautus ei jää roikkumaan taustalle, jos käyttäjä
      // siirtyy pois Asetuksista.
      state.pendingRestore = null;
      if(state.view === "historia" && state.historyDates === undefined){ await loadHistory(); }
      else if(state.view === "kehitys" && state.kehitys === undefined){ await loadKehitys(); }

    if((el = e.target.closest("[data-week-nav]"))){
      var weeks = state.program.weeks;
      var curIdx = weeks.indexOf(state.activeWeek);
      if(curIdx === -1) curIdx = 0;
      var newIdx = curIdx + (el.dataset.weekNav === "next" ? 1 : -1);
      if(newIdx >= 0 && newIdx < weeks.length){ state.activeWeek = weeks[newIdx]; render(); }
      return;
    }
    if((el = e.target.closest("[data-swap-open]"))){
      state.swapExercise = el.dataset.id;
      // Ohjattu valinta esitäytetään nykyisestä nimestä, jos se tunnistetaan
      // katalogista — muuten aloitetaan tyhjästä.
      var swapEx = findExerciseById(el.dataset.id);
      var match = swapEx ? resolveCatalogMatch(swapEx.name) : null;
      state.variantPicker = match
        ? { liike: match.liike, variaatio: match.variaatio, lisavariaatio: match.lisavariaatio, addNew: false }
        : { liike: null, variaatio: null, lisavariaatio: null, addNew: false };
      var swapTransition = render();
      // Näkymäsiirtymä päivittää DOM:in vasta omassa callbackissaan, joten
      // fokus siirretään vasta kun kenttä on varmasti olemassa.
      var focusSwapInput = function(){

        if(swapInput) swapInput.focus();

      if(swapTransition && swapTransition.updateCallbackDone){ swapTransition.updateCallbackDone.then(focusSwapInput); }
      else{ focusSwapInput(); }
