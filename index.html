  // ---------- Varmuuskopion muoto ----------
  // Varmuuskopio on yksi CSV-tiedosto, joka jakautuu osioihin. Merkinnät ovat
  // ensimmäisenä samana taulukkona kuin ennenkin, jotta tiedosto avautuu yhä
  // taulukkolaskennassa ja jotta vanhat, pelkät merkinnät sisältävät
  // vientitiedostot tuodaan muuttumattomina. Osio alkaa omalla #-rivillään.
  var BACKUP_SECTION_ENTRIES   = "#MERKINNÄT";
  var BACKUP_SECTION_PROGRAM   = "#OHJELMA";
  var BACKUP_SECTION_NOTES     = "#OHJELMAN MUISTIINPANOT";
  var BACKUP_SECTION_EXERCISES = "#OMAT LIIKKEET";
  var BACKUP_SECTION_MAX       = "#1RM";

  function csvRows(rows){
    return rows.map(function(r){
      return r.map(function(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
  }
  // Teho kirjoitetaan takaisin samaan muotoon, josta parseIntensity() sen lukee,
  // jotta tuonti tuottaa täsmälleen saman intensity-olion kuin viennin hetkellä.
  function intensityToText(intensity){
    if(!intensity) return "";
    if(intensity.isMax) return "MAX";
    if(intensity.percents && intensity.percents.length){
      return intensity.percents.map(function(p){ return String(p) + " %"; }).join(", ");
    }
    return "";
  }
  function backupProgramRows(){
    var rows = [["Viikko","Treenipäivä","Tunniste","Liike","Sarjat","Toistot","Yksiköt","Paino","Huomautus","Teho","Tyyppi","Menetelmä","Sarjakohtaiset","Menetelmäselite","Painoehdotus","Viikon nimi","Päivän tunniste","Päivän nimi"]];
    var labels = state.program.weekLabels || {};
    state.program.days.forEach(function(day){
      (day.exercises || []).forEach(function(ex){
        rows.push([
          day.week == null ? "" : day.week,
          day.name,
          ex.id,
          ex.name,
          ex.sets, ex.reps, ex.unit, ex.weight, ex.notes,
          intensityToText(ex.intensity),
          ex.kind || "plain",
          ex.method || "",
          (ex.perSet && ex.perSet.length) ? ex.perSet.join("|") : "",
          ex.methodNote || "",
          ex.autoCalc === false ? "ei" : "kyllä",
          (day.week != null && labels[day.week]) ? labels[day.week] : "",
          day.id || "",
          day.label || ""
        ]);
      });
    });
    return rows;
  }

  async function exportAllCSV(){
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var rows = [["Päivämäärä","Liike","Sarja","Paino (kg)","Toistot","Huomiot","Tyyppi","Tunniste"]];
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        Object.keys(entry.exercises || {}).forEach(function(exKey){
          var data = entry.exercises[exKey];
          var exName = data.name || exKey;
          var kind = data.kind || "plain";
          (data.sets || []).forEach(function(s, idx){
            // Tunniste on merkinnän liike-id. Sen avulla tuonti sitoo merkinnän
            // täsmälleen samaan ohjelman liikkeeseen kuin viennin hetkellä,
            // ilman nimien varaan jäävää arvausta.
            rows.push([date, exName, idx+1, s.weight || "", s.reps || "", s.notes || "", kind, exKey]);
          });
        });
      }
      var parts = ['"' + BACKUP_SECTION_ENTRIES + '"', csvRows(rows)];

      if(state.program && state.program.days && state.program.days.length){
        parts.push('"' + BACKUP_SECTION_PROGRAM + '"', csvRows(backupProgramRows()));
        var progNotes = state.program.notes;
        if(progNotes && progNotes.length){
          var noteRows = [["Tiedosto","Teksti"]];
          progNotes.forEach(function(n){ noteRows.push([n.file || "", n.text || ""]); });
          parts.push('"' + BACKUP_SECTION_NOTES + '"', csvRows(noteRows));
        }
      }
      if(state.userExercises && state.userExercises.length){
        var exRows = [["Liike","Variaatio","Lisävariaatio","Lihasryhmä"]];
        state.userExercises.forEach(function(r){
          exRows.push([r.liike || "", r.variaatio || "", r.lisavariaatio || "", r.lihasryhma || ""]);
        });
        parts.push('"' + BACKUP_SECTION_EXERCISES + '"', csvRows(exRows));
      }
      var maxKeys = Object.keys(state.manualMax);
      if(maxKeys.length){
        // state.manualMax on avaimenaan liikkeen nimi pienin kirjaimin. Nimi
        // kirjoitetaan tiedostoon isolla alkukirjaimella luettavuuden vuoksi ja
        // luetaan takaisin samalla trim+toLowerCase-säännöllä, jota kaikki
        // lukupaikat käyttävät — kierros on siis silti tarkka.
        var maxRows = [["Liike","1RM (kg)","Päivitetty"]];
        var maxNames = maxExerciseNames();
        maxKeys.sort().forEach(function(key){
          var entry = state.manualMax[key];
          if(!entry || !isFinite(entry.weight)) return;
          // Nimi kirjoitetaan ohjelman kirjoitusasussa, jos liike on ohjelmassa —
          // muuten pelkkä iso alkukirjain, kuten Asetusten 1RM-listassa.
          maxRows.push([maxNames[key] || capitalize(key), String(entry.weight).replace(".", ","), entry.date || ""]);
        });
        if(maxRows.length > 1) parts.push('"' + BACKUP_SECTION_MAX + '"', csvRows(maxRows));
      }
      var csv = parts.join("\n\n");
      // UTF-8-BOM eteen, jotta Excel (etenkin Windowsilla) ei arvaa merkistöksi
      // ANSI/Windows-1252:tä ja muuta ä/ö-merkkejä symboleiksi tiedostoa avattaessa.
      var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "treenipaivakirja_" + todayISO() + ".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Varmuuskopio tallennettu");
      // render() tehdään tässä, jotta muistutusbanneri katoaa heti onnistuneen
      // viennin jälkeen riippumatta siitä, piirtääkö kutsupaikka uudelleen.
      state.lastExportDate = todayISO();
      state.exportReminderDismissed = false;
      try{ await storeSet(STORAGE_LAST_EXPORT_KEY, state.lastExportDate); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
      render();
    }catch(e){ showToast("Viennin luonti epäonnistui"); }
  }

  // Jakaa varmuuskopiotiedoston osioihin #-merkkirivien perusteella. Ennen
  // ensimmäistä merkkiriviä oleva teksti luetaan merkinnöiksi: vanhoissa
  // vientitiedostoissa ei ole merkkirivejä lainkaan, ja ne on silti voitava
  // tuoda ennallaan.
  function splitBackupSections(text){
    var lines = String(text).replace(/^\uFEFF/, "").split(/\r\n|\n|\r/);
    var sections = {};
    var current = BACKUP_SECTION_ENTRIES;
    var buffer = [];
    function flush(){
      var body = buffer.join("\n").trim();
      if(body) sections[current] = sections[current] ? sections[current] + "\n" + body : body;
      buffer = [];
    }
    lines.forEach(function(line){
      var raw = line.trim();
      // Merkkirivi on yksi solu, jossa on vain #-alkuinen nimi. Ehto rajaa pois
      // tavalliset datarivit, joiden ensimmäinen solu sattuisi alkamaan #:llä.
      if(/^"?#[^",;\t]*"?$/.test(raw)){
        flush();
        current = raw.replace(/^"|"$/g, "").trim().toUpperCase();
        return;
      }
      buffer.push(line);
    });
    flush();
    return sections;
  }

  function parseBackupNotes(text){
    var notes = [];
    if(!text) return notes;
    parseCSV(text).forEach(function(row){
      var t = String(row["teksti"] || "").trim();
      if(!t) return;
      notes.push({ file: String(row["tiedosto"] || "").trim(), text: t });
    });
    return notes;
  }

  // Lukee ohjelmaosion takaisin täsmälleen samaan muotoon, jossa se oli
  // state.program-kentässä: samat päivät, samat liike-id:t ja samat valinnaiset
  // kentät. Valinnaiset kentät asetetaan vain jos ne olivat täytettyjä, jottei
  // CSV:stä tuotuun ohjelmaan ilmesty tyhjiä PDF-kenttiä.
  function parseBackupProgram(text, notesText){
    var rows = parseCSV(text);
    if(!rows.length) return null;
    var dayMap = new Map();
    var weekOrder = [];
    var weekLabels = {};
    var counter = 0;
    var fallbackPrefix = "bak-" + Date.now();
    rows.forEach(function(row){
      var name = String(row["liike"] || "").trim();
      if(!name) return;
      var week = String(row["viikko"] || "").trim();
      var dayName = String(row["treenipäivä"] || row["treenipaiva"] || "").trim() ||
                    (week ? "Viikko " + week : "Ohjelma");
      var key = week + "|" + dayName;
      if(!dayMap.has(key)){
        // Päivän tunniste ja nimi sekä viikon nimi ovat uudempien varmuuskopioiden
        // sarakkeita; vanhoissa ne puuttuvat ja ensureProgramShape täydentää.
        // Avainjärjestys on sama kuin parseProgramCSV():ssä, jotta palautettu
        // ohjelma on JSON-muodossaankin täsmälleen viedyn kaltainen.
        var dayObj = {};
        var dayId = String(row["päivän tunniste"] || row["paivan tunniste"] || "").trim();
        var dayLabel = String(row["päivän nimi"] || row["paivan nimi"] || "").trim();
        if(dayId) dayObj.id = dayId;
        if(dayLabel) dayObj.label = dayLabel;
        dayObj.name = dayName; dayObj.week = week || null; dayObj.exercises = [];
        dayMap.set(key, dayObj);
        if(week && weekOrder.indexOf(week) === -1) weekOrder.push(week);
        var weekLabel = String(row["viikon nimi"] || "").trim();
        if(week && weekLabel) weekLabels[week] = weekLabel;
      }
      var ex = {
        id: String(row["tunniste"] || "").trim() || (fallbackPrefix + "-" + counter),
        name: name,
        sets: String(row["sarjat"] || "").trim(),
        reps: String(row["toistot"] || "").trim(),
        unit: String(row["yksiköt"] || row["yksikot"] || "").trim(),
        weight: String(row["paino"] || "").trim(),
        notes: String(row["huomautus"] || "").trim(),
        intensity: parseIntensity(row["teho"]),
        kind: String(row["tyyppi"] || "").trim() || "plain",
        autoCalc: String(row["painoehdotus"] || "").trim().toLowerCase() !== "ei"
      };
      counter++;
      var method = String(row["menetelmä"] || row["menetelma"] || "").trim();
      if(method) ex.method = method;
      var perSet = String(row["sarjakohtaiset"] || "").trim();
      if(perSet) ex.perSet = perSet.split("|").map(function(s){ return s.trim(); });
      var methodNote = String(row["menetelmäselite"] || row["menetelmaselite"] || "").trim();
      if(methodNote) ex.methodNote = methodNote;
      dayMap.get(key).exercises.push(ex);
    });
    var days = [];
    dayMap.forEach(function(day){ days.push(day); });
    if(!days.length) return null;
    var program = { days: days, weeks: weekOrder, weekLabels: weekLabels };
    ensureProgramShape(program);
    var notes = parseBackupNotes(notesText);
    if(notes.length) program.notes = notes;
    return program;
  }

  function parseBackupManualMax(text){
    var out = {};
    parseCSV(text).forEach(function(row){
      var name = String(row["liike"] || "").trim();
      if(!name) return;
      var weight = toNumber(row["1rm (kg)"] !== undefined ? row["1rm (kg)"] : row["1rm"]);
      if(!isFinite(weight) || weight <= 0) return;
      out[name.toLowerCase()] = { weight: weight, date: String(row["päivitetty"] || row["paivitetty"] || "").trim() || todayISO() };
    });
    return out;
  }

  function parseBackupUserExercises(text){
    var out = [];
    parseCSV(text).forEach(function(row){
      var liike = String(row["liike"] || "").trim();
      if(!liike) return;
      out.push({
        liike: liike,
        variaatio: String(row["variaatio"] || "").trim() || null,
        lisavariaatio: String(row["lisävariaatio"] || row["lisavariaatio"] || "").trim() || null,
        lihasryhma: String(row["lihasryhmä"] || row["lihasryhma"] || "").trim() || null
      });
    });
    return out;
  }

  function parseEntriesCSV(text){
    text = text.replace(/^\uFEFF/, "");
    var rows = parseCSV(text);
    // Pelkkä otsikkorivi ilman merkintöjä on kelvollinen: varmuuskopio voi
    // sisältää ohjelman ja omat liikkeet ennen kuin yhtään treeniä on kirjattu.
    if(rows.length === 0) return {};
    var headers = Object.keys(rows[0]);
    function findCol(cands){
      return headers.find(function(h){ return cands.some(function(c){ return h === c || h.indexOf(c) !== -1; }); });
    }
    var cDate = findCol(["päivämäärä","paivamaara","date","pvm"]);
    var cName = findCol(["liike","exercise","harjoitus"]);
    var cSet  = findCol(["sarja","set"]);
    var cW    = findCol(["paino","weight","kg"]);
    var cReps = findCol(["toistot","toistoa","reps"]);
    var cNote = findCol(["huomiot","huomio","notes","kommentti"]);
    var cKind = findCol(["tyyppi","kind"]);
    var cId   = findCol(["tunniste"]);
    if(!cDate || !cName) throw new Error("Tiedostosta puuttuu päivämäärä- tai liikesarake. Käytä tällä sovelluksella tehtyä vientitiedostoa.");

    var byDate = {};
    var counters = {};
    rows.forEach(function(row){
      var date = (row[cDate] || "").trim();
      var name = (row[cName] || "").trim();
      if(!date || !name) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      var kind = cKind ? ((row[cKind] || "").trim().toLowerCase() || "plain") : "plain";
      if(["max","percent","plain"].indexOf(kind) === -1) kind = "plain";
      var setNo = cSet ? parseInt(row[cSet], 10) : NaN;
      var exId = cId ? String(row[cId] || "").trim() : "";

      if(!byDate[date]) { byDate[date] = []; counters[date] = null; }
      var blocks = byDate[date];
      var lastBlock = blocks.length ? blocks[blocks.length-1] : null;
      // Tunniste erottaa saman liikkeen kaksi eri esiintymää samana päivänä
      // (esim. MAX-sarja ja prosenttisarjat) myös silloin kun nimi ja tyyppi
      // ovat samat.
      var startsNew = !lastBlock || lastBlock.name !== name || lastBlock.kind !== kind ||
                      lastBlock.id !== exId || (isFinite(setNo) && setNo === 1);
      if(startsNew){
        lastBlock = { name: name, kind: kind, id: exId, sets: [] };
        blocks.push(lastBlock);
      }
      lastBlock.sets.push({
        weight: cW ? String(row[cW] || "").trim() : "",
        reps: cReps ? String(row[cReps] || "").trim() : "",
        notes: cNote ? String(row[cNote] || "").trim() : ""
      });
    });
    return byDate;
  }

  // Varmuuskopion CSV:ssä on vain päivämäärä ja liikkeen nimi — ei ohjelman
  // liike-id:tä, joka syntyy uudelleen jokaisessa ohjelman tuonnissa. Ilman
  // sidontaa tuodut merkinnät jäisivät irrallisiksi: ne näkyisivät Historiassa
  // ja Kehityksessä (jotka lukevat nimen perusteella) mutta eivät Ohjelma-
  // näkymässä, joka kysyy liike-id:llä onko treeni tehty.
  //
  // Sidonta tehdään treenipäivä kerrallaan: jokainen tuotu päivä osoitetaan
  // sille ohjelman päivälle, jonka liikkeisiin sen nimet parhaiten täsmäävät.
  // Päivät käydään aikajärjestyksessä ja kukin ohjelmapäivä varataan kerran,
  // jolloin peräkkäiset samanmuotoiset treenit osuvat viikoille 1, 2, 3 …
  // Nimi yksin ei riitä, koska sama liike toistuu ohjelmassa joka viikko.
  function matchImportedDatesToProgramDays(byDate){
    var matches = {};
    if(!state.program || !state.program.days || !state.program.days.length) return matches;
    var dates = Object.keys(byDate).sort();
    var used = {};
    dates.forEach(function(date){
      var logged = {};
      byDate[date].forEach(function(block){ logged[normalizeName(block.name)] = true; });
      var bestIdx = null, bestScore = 0, bestUsed = true;
      state.program.days.forEach(function(day, idx){
        var score = 0;
        (day.exercises || []).forEach(function(ex){
          if(logged[normalizeName(ex.name)]) score++;
        });
        if(score === 0) return;
        var isUsed = !!used[idx];
        // Paras osuma voittaa; tasatilanteessa vielä varaamaton päivä ja
        // ohjelmajärjestyksessä aiempi viikko.
        if(score > bestScore || (score === bestScore && bestUsed && !isUsed)){
          bestIdx = idx; bestScore = score; bestUsed = isUsed;
        }
      });
      if(bestIdx !== null){ used[bestIdx] = true; matches[date] = state.program.days[bestIdx]; }
    });
    return matches;
  }

  // Varmuuskopion luku: tiedosto jäsennetään kokonaan, mutta mitään ei
  // tallenneta vielä. Jos tiedostossa on ohjelma, palautus korvaisi nykyisen
  // ohjelman, joten se vahvistetaan erikseen. Pelkät merkinnät sisältävä vanha
  // vientitiedosto tuodaan suoraan kuten ennenkin.
  async function readBackupFile(file){
    var text;
    try{ text = await readFileAsText(file); }
    catch(e){ showToast("Tiedoston luku epäonnistui"); return; }

    var sections = splitBackupSections(text);
    var byDate = {};
    if(sections[BACKUP_SECTION_ENTRIES]){
      try{ byDate = parseEntriesCSV(sections[BACKUP_SECTION_ENTRIES]); }
      catch(e){ showToast(e.message || "Tuonti epäonnistui", 4500); return; }
    }
    var program = sections[BACKUP_SECTION_PROGRAM]
      ? parseBackupProgram(sections[BACKUP_SECTION_PROGRAM], sections[BACKUP_SECTION_NOTES])
      : null;
    var userExercises = sections[BACKUP_SECTION_EXERCISES]
      ? parseBackupUserExercises(sections[BACKUP_SECTION_EXERCISES])
      : [];
    var manualMax = sections[BACKUP_SECTION_MAX]
      ? parseBackupManualMax(sections[BACKUP_SECTION_MAX])
      : {};

    if(!program && !userExercises.length && !Object.keys(manualMax).length && Object.keys(byDate).length === 0){
      showToast("Tiedostosta ei löytynyt tuotavaa sisältöä", 4000);
      return;
    }
    var restore = { byDate: byDate, program: program, userExercises: userExercises,
                    manualMax: manualMax, fileName: file.name };
    if(!program){
      await applyBackupRestore(restore);
      return;
    }
    state.pendingRestore = restore;
    render();
  }

  function cancelBackupRestore(){
    state.pendingRestore = null;
    render();
  }

  // Palauttaa varmuuskopion sisällön: ensin omat liikkeet, sitten ohjelma ja
  // vasta lopuksi merkinnät. Järjestys on olennainen — merkinnät sidotaan
  // ohjelman liike-id:eihin, joten ohjelman on oltava paikallaan ensin.
  async function applyBackupRestore(restore){
    state.pendingRestore = null;
    var parts = [];

    if(restore.userExercises && restore.userExercises.length){
      var addedEx = await mergeUserExerciseVariants(restore.userExercises);
      if(addedEx) parts.push(plural(addedEx, "oma liike", "omaa liikettä"));
    }

    if(restore.manualMax && Object.keys(restore.manualMax).length){
      var maxRes = await mergeManualMax(restore.manualMax);
      if(maxRes.added){
        var maxMsg = plural(maxRes.added, "1RM-arvo", "1RM-arvoa");
        if(maxRes.skipped) maxMsg += " (ohitettu " + maxRes.skipped + " jo olemassa olevaa)";
        parts.push(maxMsg);
      }
    }

    if(restore.program){
      state.program = restore.program;
      await saveProgram();
      // Ohjelma vaihtui, joten näkymän kesken jääneet tilat nollataan samoin
      // kuin ohjelman tuonnissa. Merkintöihin ei kosketa.
      state.manualExercises = [];
      state.draftSets = {};
      state.dirtySets = {};
      state.openExercise = null;
      state.swapExercise = null;
      state.showAllWeeks = false;
      state.showProgramNotes = false;
      parts.push("ohjelma (" + plural(restore.program.days.length, "treenipäivä", "treenipäivää") + ")");
    }

    var entryMsg = await importEntriesData(restore.byDate);
    if(entryMsg) parts.push(entryMsg);

    if(restore.program){
      await computeDefaultActiveWeek();
      state.view = "ohjelma";
    }
    state.todayEntry = await loadEntry(state.draftDate);
    state.exerciseLogIndex = await buildExerciseLogIndex();
    var lead = restore.program ? "Varmuuskopio palautettu: " : "Tuotu: ";
    showToast(parts.length ? lead + parts.join(", ") : "Tiedostosta ei löytynyt tuotavaa sisältöä", 5000);
    render();
  }

  // Merkintöjen tuonti. Palauttaa yhteenvetotekstin; kutsuja päättää ilmoituksen,
  // koska sama polku palvelee sekä pelkkää merkintöjen tuontia että koko
  // varmuuskopion palautusta.
  async function importEntriesData(byDate){
    var dates = Object.keys(byDate);
    if(dates.length === 0) return "";

    var dayMatches = matchImportedDatesToProgramDays(byDate);
    var addedBlocks = 0, skippedBlocks = 0, touchedNames = {}, failedDates = 0, boundBlocks = 0;
    for(var i=0;i<dates.length;i++){
      var date = dates[i];
      var matchedDay = dayMatches[date];
      var takenProgramIds = {};
      var entry = await loadEntry(date);
      if(!entry.exercises) entry.exercises = {};
      var existingKeys = Object.keys(entry.exercises);
      var signatures = {};
      existingKeys.forEach(function(k){
        var d = entry.exercises[k];
        var sig = (d.name || "").trim().toLowerCase() + "|" + (d.kind || "plain") + "|" +
          (d.sets || []).map(function(s){ return (s.weight||"") + "x" + (s.reps||""); }).join(";");
        signatures[sig] = true;
      });

      var counter = 0;
      byDate[date].forEach(function(block){
        var sig = block.name.trim().toLowerCase() + "|" + block.kind + "|" +
          block.sets.map(function(s){ return (s.weight||"") + "x" + (s.reps||""); }).join(";");
        if(signatures[sig]){ skippedBlocks++; return; }
        var newId = null;
        // Varmuuskopiossa on liikkeen alkuperäinen id. Jos se on tällä päivällä
        // vapaana, merkintä palautuu täsmälleen samalle avaimelle kuin ennen
        // vientiä — ja jos id kuuluu nykyiseen ohjelmaan, sidonta on eksakti
        // eikä nimien varaan jäävää arvausta tarvita lainkaan.
        if(block.id && !takenProgramIds[block.id] && !entry.exercises.hasOwnProperty(block.id)){
          takenProgramIds[block.id] = true;
          newId = block.id;
          if(isProgramExercise(newId)) boundBlocks++;
        }
        if(!newId && matchedDay){
          // Sama liike voi esiintyä päivässä kahdesti (esim. MAX + prosentti),
          // joten kukin ohjelmarivi varataan vain kerran päivää kohti eikä
          // päivällä jo olevan merkinnän päälle kirjoiteta.
          var normBlock = normalizeName(block.name);
          for(var p=0;p<matchedDay.exercises.length;p++){
            var pex = matchedDay.exercises[p];
            if(takenProgramIds[pex.id]) continue;
            if(normalizeName(pex.name) !== normBlock) continue;
            if(entry.exercises.hasOwnProperty(pex.id)) continue;
            takenProgramIds[pex.id] = true;
            newId = pex.id;
            boundBlocks++;
            break;
          }
        }
        if(!newId){
          do { newId = "imp-" + date + "-" + (counter++); } while(entry.exercises.hasOwnProperty(newId));
        }
        entry.exercises[newId] = {
          name: block.name,
          sets: block.sets,
          kind: block.kind,
          loggedAt: date + "T12:00:00.000Z"
        };
        signatures[sig] = true;
        touchedNames[block.name.trim().toLowerCase()] = block.name;
        addedBlocks++;
      });

      try{ await storeSet("entries:" + date, JSON.stringify(entry)); }
      catch(e){ failedDates++; }
    }

    var names = Object.keys(touchedNames);
    for(var j=0;j<names.length;j++){ await rebuildTrackersForName(touchedNames[names[j]]); }

    state.historyDates = undefined;
    state.historyCache = {};
    state.kehitys = undefined;
    state.draftSets = {};
    state.dirtySets = {};
    state.autoCalcInfo = {};
    state.openExercise = null;
    state.swapExercise = null;
    state.todayEntry = await loadEntry(state.draftDate);
    state.exerciseLogIndex = await buildExerciseLogIndex();

    var msg = plural(addedBlocks, "merkintä", "merkintää");
    if(skippedBlocks > 0) msg += " (ohitettu " + skippedBlocks + " jo olemassa olevaa)";
    // Kerrotaan erikseen, jos osa jäi ilman ohjelmavastinetta: ne näkyvät
    // Historiassa ja Kehityksessä mutta eivät Ohjelma-näkymän merkintöinä.
    if(addedBlocks > boundBlocks) msg += " — " + (addedBlocks - boundBlocks) + " ei täsmännyt ohjelman liikkeisiin";
    if(failedDates > 0) msg += " — " + failedDates + " päivän tallennus epäonnistui";
    return msg;
  }

  async function resetAll(){
    try{
      await storeDelete(STORAGE_PROGRAM_KEY);
      await storeDelete(STORAGE_LASTSET_KEY);
      await storeDelete(STORAGE_MANUAL_MAX_KEY);
      await storeDelete(STORAGE_USER_EXERCISES_KEY);
      await storeDelete(STORAGE_SIMULATION_KEY);
      await storeDelete(STORAGE_LAST_EXPORT_KEY);
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      for(var i=0;i<keys.length;i++){ await storeDelete(keys[i]); }
    }catch(e){}
    state.program = null;
    state.manualExercises = [];
    state.userExercises = [];
    state.pendingRestore = null;
    state.importNameWarnings = [];
    state.draftSets = {};
    state.openExercise = null;
    state.swapExercise = null;
    state.expandedDaySummaries = {};
    state.historyDates = undefined;
    state.historyCache = {};
    state.confirmingReset = false;
    state.lastExportDate = null;
    state.exportReminderDismissed = false;
    state.lastSet = {};
    state.manualMax = {};
    state.simulation = { active: false, dates: [] };
    state.autoCalcInfo = {};
    state.dirtySets = {};
    state.kehitys = undefined;
    state.activeWeek = null;
    state.showAllWeeks = false;
    state.exerciseLogIndex = {};
    state.view = "ohjelma";
    stopRestTimer();
    showToast("Kaikki tiedot tyhjennetty");
    render();
  }

  function showToast(msg, durationMs){
    var t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div"); t.id = "toast"; t.className = "toast";
      // role=status + aria-live: ilmoitukset ("Merkintä tallennettu", virheet)
      // välittyvät myös ruudunlukijalle, ei pelkästään näkyvänä tekstinä.
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.classList.remove("show"); }, durationMs || 2200);
  }

  // ---------- lepoajastin ----------
  // Ajastin ei koskaan kutsu koko sovelluksen render()-funktiota tikityksen
  // takia (se rakentaisi #app:n DOM:n uudelleen sekunnin välein ja rikkoisi
  // esim. kesken olevan tekstikentän fokuksen). Ylivuoto piirretään suoraan
  // document.body:hyn #app:n ulkopuolelle, samaan tapaan kuin showToast, joten
  // render()-kutsut #app:lle eivät koskaan kosketa sitä. render() kutsutaan
  // vain kolmessa merkittävässä tilasiirtymässä: käynnistys, pysäytys, päättyminen.
  var wakeLockSentinel = null;

  function ensureRestTimerOverlay(){
    var el = document.getElementById("rest-timer-overlay");
    if(el) return el;
    el = document.createElement("div");
    el.id = "rest-timer-overlay";
    // Tausta peittää koko näytön (fokusansan ja taustan himmennyksen vuoksi),
    // mutta itse ajastin on neliönmuotoinen, näytön levyinen kortti keskellä.
    el.style.cssText = "position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; background:rgba(18,22,29,.82); transition:background-color .3s;";
    // Modaali: ruudunlukija tunnistaa dialogiksi eikä lue taustan sisältöä.
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", "Lepoajastin");
    el.setAttribute("tabindex", "-1");
    el.innerHTML =
      '<div id="rest-timer-card" style="width:100%; max-width:480px; aspect-ratio:1/1; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--surface); border-radius:28px; box-shadow:0 8px 24px rgba(0,0,0,.45); transition:background-color .3s;">' +
      '<div style="color:var(--mist); font-size:16px; letter-spacing:.1em; text-transform:uppercase;">Lepo</div>' +
      // Sekunneittain muuttuvaa lukemaa ei lueta ääneen (olisi jatkuvaa hälyä);
      // päättymisestä kerrotaan erikseen status-alueen kautta.
      '<div id="rest-timer-count" aria-hidden="true" style="color:var(--brass); font-weight:800; font-variant-numeric:tabular-nums; font-size:clamp(56px, 18vw, 120px); line-height:1; margin-top:4px;">--:--</div>' +
      '<div id="rest-timer-status" role="status" aria-live="polite" style="color:var(--chalk); font-size:16px; min-height:22px; margin-top:6px;"></div>' +
      '<div style="display:flex; gap:12px; margin-top:28px; width:100%; max-width:340px;">' +
      '<button id="rest-timer-minimize-btn" type="button" class="btn-secondary" style="min-height:44px;">Pienennä</button>' +
      '<button id="rest-timer-stop-btn" type="button" class="btn-secondary" style="min-height:44px; color:var(--danger-text); border-color:var(--danger);">Lopeta lepo</button>' +
      '</div>' +
      '</div>';
    document.body.appendChild(el);
    document.getElementById("rest-timer-minimize-btn").addEventListener("click", function(){
      minimizeRestTimer();
    });
    document.getElementById("rest-timer-stop-btn").addEventListener("click", function(){ stopRestTimer(); });
    // Fokus ei saa karata taustalle modaalin ollessa auki. inert hoitaa tämän
    // uusissa selaimissa; vanhemmille jää tämä kierrätys kahden painikkeen välillä.
    el.addEventListener("keydown", function(e){
      if(e.key !== "Tab") return;
      var first = document.getElementById("rest-timer-minimize-btn");
      var last = document.getElementById("rest-timer-stop-btn");
      if(!first || !last) return;
      if(document.activeElement === el){ e.preventDefault(); (e.shiftKey ? last : first).focus(); }
      else if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    });
    return el;
  }
  var restTimerPrevFocus = null;
  function activateRestTimerOverlay(el){
    // Fokus siirretään modaaliin ja tausta poistetaan kohdistusjärjestyksestä.
    if(!restTimerPrevFocus) restTimerPrevFocus = document.activeElement;
    var app = document.getElementById("app");
    if(app) app.inert = true;
    try{ el.focus(); }catch(e){}
  }
  function releaseRestTimerOverlay(){
    var app = document.getElementById("app");
    if(app) app.inert = false;
    if(restTimerPrevFocus && document.contains(restTimerPrevFocus)){
      try{ restTimerPrevFocus.focus(); }catch(e){}
    }
    restTimerPrevFocus = null;
  }

  function ensureRestTimerMiniBar(){
    var el = document.getElementById("rest-timer-mini");
    if(el) return el;
    el = document.createElement("div");
    el.id = "rest-timer-mini";
    // Asettuu kelluvan alanavigaation yläpuolelle (navi: 12px + 58px korkea).
    el.style.cssText = "position:fixed; bottom:calc(env(safe-area-inset-bottom) + 82px); left:16px; right:16px; margin:0 auto; max-width:448px; z-index:79; display:none; align-items:center; justify-content:center; gap:10px; padding:10px 16px; border-radius:999px; background:var(--brass); color:var(--ink); font-weight:800; font-size:15px; cursor:pointer;";
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.innerHTML =
      '<span>Lepo · <span id="rest-timer-mini-count" style="font-variant-numeric:tabular-nums;">--:--</span></span>' +
      '<span style="font-size:12px; text-decoration:underline;">Näytä</span>';
    document.body.appendChild(el);
    el.addEventListener("click", function(){ restoreRestTimer(); });
    el.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); restoreRestTimer(); }
    });
    return el;
  }

  function minimizeRestTimer(){
    var el = document.getElementById("rest-timer-overlay");
    if(el) el.style.display = "none";
    var mini = ensureRestTimerMiniBar();
    mini.style.display = "flex";
    paintRestTimerCount(computeRestRemaining());
    // Modaali väistyi: tausta takaisin käyttöön ja fokus näkyvään palkkiin,
    // jotta näppäimistökäyttäjä ei menetä paikkaansa.
    var app = document.getElementById("app");
    if(app) app.inert = false;
    restTimerPrevFocus = null;
    try{ mini.focus(); }catch(e){}
  }

  function restoreRestTimer(){
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    activateRestTimerOverlay(el);
  }

  function computeRestRemaining(){
    if(!state.restTimer) return 0;
    return Math.max(0, Math.round((state.restTimer.endAt - Date.now()) / 1000));
  }

  function paintRestTimerCount(remaining){
    var mins = Math.floor(remaining / 60), secs = remaining % 60;
    var text = mins + ":" + (secs < 10 ? "0" + secs : secs);
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.textContent = text;
    var miniCountEl = document.getElementById("rest-timer-mini-count");
    if(miniCountEl) miniCountEl.textContent = text;
  }

  function updateRestTimerDisplay(){
    if(!state.restTimer) return;
    var remaining = computeRestRemaining();
    paintRestTimerCount(remaining);
    if(remaining <= 0){ finishRestTimer(); }
  }

  async function persistRestTimer(data){
    // Paras yritys -tallennus: jos se epäonnistuu, ajastin toimii silti tämän
    // istunnon ajan setIntervalin ja state.restTimerin varassa.
    try{
      if(data){ await storeSet(STORAGE_REST_TIMER_KEY, JSON.stringify(data)); }
      else{ await storeDelete(STORAGE_REST_TIMER_KEY); }
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  async function requestRestWakeLock(){
    // Wake Lock estää vain näytön automaattisen himmenemisen/sammumisen levon
    // aikana — se EI estä käyttäjää itse lukitsemasta puhelinta virtapainikkeella
    // eikä sovelluksesta poistumista, joten se ratkaisee vain osan ongelmasta.
    try{
      if(state.restTimer && "wakeLock" in navigator){
        wakeLockSentinel = await navigator.wakeLock.request("screen");
      }
    }catch(e){ wakeLockSentinel = null; }
  }
  function releaseRestWakeLock(){
    if(wakeLockSentinel){
      try{ wakeLockSentinel.release(); }catch(e){}
      wakeLockSentinel = null;
    }
  }

  function playRestTimerSound(){
    try{
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      var ctx = new AudioCtx();
      var beepAt = function(t){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      };
      var now = ctx.currentTime;
      beepAt(now); beepAt(now + 0.45); beepAt(now + 0.9);
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1600);
    }catch(e){ /* Web Audio ei käytettävissä, ei kriittinen */ }
  }

  function vibrateRestTimerEnd(){
    // HUOM: iOS Safari ei tue Vibration API:a lainkaan — navigator.vibrate
    // puuttuu tai ei tee mitään, joten värinä ei toimi iPhonella. Ääni yhdessä
    // ruudun väriväläyksen kanssa on iOS:lla ainoa luotettava ilmoituskanava.
    try{ if(navigator.vibrate){ navigator.vibrate([200,100,200,100,400]); } }catch(e){}
  }

  function notifyRestTimerEnd(){
    // Parhaan yrityksen lisäominaisuus: iOS Safari ei pysty näyttämään
    // ilmoitusta luotettavasti kun sovellusprosessi on kokonaan taustalla tai
    // suljettu, koska se vaatisi push-palvelimen — sovelluksella ei ole eikä
    // roadmapin/README:n mukaisesti tule olemaan palvelinpuolta. Toimii
    // parhaiten Androidilla tai kun sivu on auki taustavälilehtenä.
    try{
      if("Notification" in window && Notification.permission === "granted"){
        new Notification("Lepo ohi", { body: "Seuraava sarja odottaa.", tag: "treenipk-rest" });
      }
    }catch(e){}
  }

  function finishRestTimer(){
    clearInterval(window.__restTimerInterval);
    state.restTimer = null;
    persistRestTimer(null);
    releaseRestWakeLock();
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    activateRestTimerOverlay(el);
    var flashCard = document.getElementById("rest-timer-card");
    if(flashCard) flashCard.style.background = "var(--brass)";
    paintRestTimerCount(0);
    // Kirkkaalla taustavälähdyksellä lukemat ja teksti vaihtuvat tummiksi,
    // jotta ne pysyvät luettavina — muuten ne sulautuisivat samaan brass-väriin.
    // Ilmoitus EI sulkeudu itsestään (aiemmin 3 sekunnin setTimeout) — käyttäjän
    // on suljettava se itse "Pienennä"- tai "Lopeta lepo" -painikkeesta, jotta
    // ilmoitus ei ehdi jäädä huomaamatta ennen katoamistaan.
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.style.color = "var(--ink)";
    var statusEl = document.getElementById("rest-timer-status");
    if(statusEl){ statusEl.textContent = "Lepo ohi"; statusEl.style.color = "var(--ink)"; }
    playRestTimerSound();
    vibrateRestTimerEnd();
    if(document.hidden) notifyRestTimerEnd();
    render();
  }

  function stopRestTimer(){
    clearInterval(window.__restTimerInterval);
    state.restTimer = null;
    persistRestTimer(null);
    releaseRestWakeLock();
    var el = document.getElementById("rest-timer-overlay");
    if(el) el.style.display = "none";
    var card = document.getElementById("rest-timer-card");
    if(card) card.style.background = "var(--surface)";
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    releaseRestTimerOverlay();
    render();
  }

  function startRestTimer(seconds){
    if(!state.restTimerEnabled) return;
    clearInterval(window.__restTimerInterval);
    state.restTimer = { endAt: Date.now() + seconds * 1000, seconds: seconds };
    persistRestTimer(state.restTimer);
    requestRestWakeLock();
    // Ilmoituslupa kysytään vain ensimmäisellä käynnistyskerralla: jos selain on
    // jo joskus vastannut (granted/denied), Notification.permission ei enää ole
    // "default", joten kysely ei toistu uudestaan myöhemmillä käynnistyksillä.
    try{
      if("Notification" in window && Notification.permission === "default"){
        Notification.requestPermission();
      }
    }catch(e){}
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    activateRestTimerOverlay(el);
    var startCard = document.getElementById("rest-timer-card");
    if(startCard) startCard.style.background = "var(--surface)";
    // Palautetaan värit oletukseen, jos edellinen ajastin ehti juuri päättyä
    // (surface-taustalla lukemat eivät saa jäädä tummiksi edellisen
    // väläytyksen jäljiltä).
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.style.color = "var(--brass)";
    var statusEl = document.getElementById("rest-timer-status");
    if(statusEl){ statusEl.textContent = ""; statusEl.style.color = "var(--chalk)"; }
    updateRestTimerDisplay();
    window.__restTimerInterval = setInterval(updateRestTimerDisplay, 1000);
    render();
  }

  function handleRestTimerVisibilityChange(){
    if(!state.restTimer) return;
    // setInterval hidastuu tai pysähtyy kokonaan taustalla/lukitulla näytöllä,
    // joten jäljellä oleva aika lasketaan aina uudelleen oikeasta kellonajasta
    // sen sijaan että luotettaisiin tikityksen kertymään.
    updateRestTimerDisplay();
    if(state.restTimer && document.visibilityState === "visible"){
      requestRestWakeLock();
    }
  }
  document.addEventListener("visibilitychange", handleRestTimerVisibilityChange);
  window.addEventListener("focus", handleRestTimerVisibilityChange);
  window.addEventListener("pageshow", handleRestTimerVisibilityChange);

  function renderHeader(){

  // Tunnistaa valitut tiedostot päätteestä: kaikki PDF:t menevät PDF-tuontiin,
  // muuten ensimmäinen tiedosto luetaan CSV:nä.
  function handleProgramFiles(files){
    var list = Array.prototype.slice.call(files || []);
    if(!list.length) return;
    var pdfs = list.filter(function(f){ return /\.pdf$/i.test(f.name) || f.type === "application/pdf"; });
    if(pdfs.length === list.length){ handlePdfFiles(pdfs); return; }
    var csv = list.filter(function(f){ return !/\.pdf$/i.test(f.name); })[0];

  // Suorittaa fn:n vasta kun render() on piirtänyt uuden DOM:in — myös
  // näkymäsiirtymän kanssa, jolloin piirto tapahtuu viiveellä.
  function afterRender(fn){
    var t = render();
    if(t && t.updateCallbackDone){ t.updateCallbackDone.then(fn, fn); }
    else { fn(); }
  }
  // Liikevalitsimen rivit: koko katalogi variaatioineen lihasryhmittäin sekä
  // ohjelmassa ja historiassa jo olevat nimet, joita katalogissa ei ole.
  function exercisePickEntries(){
    var seen = {}, entries = [];
    function add(name, group){
      var norm = normalizeName(name);
      if(!norm || seen[norm]) return;
      seen[norm] = true;
      entries.push({ name: name, group: group });
    }
    allExerciseVariants().forEach(function(row){
      add(composeVariantName(row.liike, row.variaatio, row.lisavariaatio), row.lihasryhma || "Muut");
    });
    knownExerciseNames().forEach(function(name){ add(name, "Ohjelmassa ja historiassa"); });
    return entries;
  }
  // Hakusanat kohdistuvat nimeen ja lihasryhmään; jokaisen sanan on osuttava.
  function renderExercisePickList(query){
    var q = String(query || "").trim();
    var tokens = q.toLowerCase().split(/\s+/).filter(function(x){ return x; });
    var entries = exercisePickEntries().filter(function(e){
      var hay = (e.name + " " + e.group).toLowerCase();
      return tokens.every(function(x){ return hay.indexOf(x) !== -1; });
    });
    var exact = entries.some(function(e){ return normalizeName(e.name) === normalizeName(q); });
    var html = "";
    if(q && !exact){
      // Liikelista on ehdotus, ei rajoite: kirjoitetun nimen saa aina käyttöön.
      html += '<button type="button" class="pick-item pick-free" data-pick-exercise="' + escapeHtml(q) + '" data-pick-free>' + icon("plus", 16) + '<span>Käytä nimeä ”' + escapeHtml(q) + '”</span></button>';
    }
    var groups = {}, order = [];
    entries.forEach(function(e){
      if(!groups[e.group]){ groups[e.group] = []; order.push(e.group); }
      groups[e.group].push(e.name);
    });
    order.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    order.forEach(function(g){
      html += '<div class="pick-group">' + escapeHtml(g) + '</div>';
      groups[g].sort(function(a, b){ return a.localeCompare(b, "fi"); }).forEach(function(name){
        html += '<button type="button" class="pick-item" data-pick-exercise="' + escapeHtml(name) + '">' + escapeHtml(name) + '</button>';
      });
    });
    if(!html) html = '<div style="color:var(--mist); font-size:var(--fs-sm); padding:8px 2px;">Ei osumia.</div>';
    return html;
  }

  function renderOhjelma(){
    var hasWeeks = state.program.weeks && state.program.weeks.length > 0;
    var groupsToShow = state.program.days;

    // Ylärivi: vasemmalla viikko/kaikki-valitsin (kun viikkoja on), oikealla
    // kirjauspäivän sirpale. Näkyvä otsikko on ruudunlukijalle sr-only-tekstinä.
    var html = renderImportNameWarnings() +
      (shouldShowFirstLogHint() ? renderFirstLogHint() : "") +
      '<div class="date-picker-row">' +
      (hasWeeks ? renderWeekModeSwitch() : '<span>Kirjataan päivälle</span>') +
      '<span class="sr-only">Kirjataan päivälle</span>' + renderDateChip() + '</div>';

    if(hasWeeks && !state.showAllWeeks){
      html += renderWeekStepper();
      groupsToShow = state.program.days.filter(function(d){ return d.week === state.activeWeek; });
    }

    if(groupsToShow.length === 0){
      html += '<div class="empty">Tälle viikolle ei löytynyt liikkeitä.</div>';
    }
    // Seuraavaksi vuorossa on ensimmäinen päivä, jota ei ole tehty kokonaan;
    // vain se saa "Aloita"/"Jatka"-painikkeen.
    var nextKey = null;
    groupsToShow.forEach(function(day){ if(nextKey === null && !isDayFullyDone(day)) nextKey = dayKey(day); });
    groupsToShow.forEach(function(day){
      // Jokainen treenipäivä on oma korttinsa, oletuksena kiinni
      // (state.expandedDaySummaries avaa sen), jotta ohjelmanäkymä pysyy
      // skannattavana useamman päivän ohjelmissa. Avattuna sama kortti toimii
      // otsikkona ja liikkeet seuraavat sen alla.
      var expanded = !!state.expandedDaySummaries[dayKey(day)];
      html += renderDayCard(day, expanded, dayKey(day) === nextKey);
      if(expanded){
        html += '<div class="day-exercises">';
        day.exercises.forEach(function(ex){ html += renderExercise(ex); });
        html += '</div>';
      }
    });
    // Kenttä, josta ohjelmaan kuulumattoman liikkeen sai lisätä käsin, on
    // poistettu näkymästä: yksittäisen liikkeen lisääminen ei ole hyödyllinen
    // ilman laajempaa ohjelman muokkausta (lisää/poista/järjestä), joka on
    // vasta suunnitteilla. Liikkeiden lukurakenne (state.manualExercises,
    // allExercises, getExerciseGroupList) on jätetty koskematta, joten
    // toiminnon palauttaminen vaatii vain syöttökentän ja sen käsittelijän
    // palauttamisen. Lista renderöidään yhä, jos taulukkoon joskus tulee
    // sisältöä muuta kautta.
    if(state.manualExercises.length){
      html += '<div class="day-heading">Lisätyt liikkeet</div>';
      state.manualExercises.forEach(function(ex){ html += renderExercise(ex); });
    }
    html += renderProgramNotes();
    return html;
  }
  function tehoBadge(ex){
    if(!ex.intensity) return "";

      label = "MAX"; cls = "chip-brass";
    } else if(ex.intensity.percents && ex.intensity.percents.length){
      label = ex.intensity.percents.map(function(p){ return String(p).replace(".", ","); }).join("/") + " %";
      cls = "chip-muted";
    } else {
      return "";

    return '<span class="chip ' + cls + '" style="margin-left:8px;">' + escapeHtml(label) + '</span>';

  // Päivän nimi kortissa. Viikkonäkymässä pelkkä päivän oma nimi, koska viikko

  function renderDayCard(day, expanded, isNext){
    var totalKg = 0;
    var latestDate = null;
    var doneCount = 0;
    day.exercises.forEach(function(ex){
      var logged = state.exerciseLogIndex[ex.id];
      if(!logged) return;
      doneCount++;
      if(latestDate === null || logged.date > latestDate) latestDate = logged.date;
      (logged.data.sets || []).forEach(function(s){
        var w = toNumber(s.weight), r = toNumber(s.reps);
        if(isFinite(w) && isFinite(r)) totalKg += w * r;
      });
    });
    var total = day.exercises.length;
    var fullyDone = isDayFullyDone(day);

      ring = '<div class="day-ring done" aria-hidden="true">✓</div>';

      statusParts.push("Tehty");
      if(latestDate) statusParts.push(capitalize(formatDateFI(latestDate)));
    } else if(doneCount > 0){
      ring = '<div class="day-ring partial" aria-hidden="true">' + doneCount + "/" + total + '</div>';
      statusParts.push("Kesken");
      statusParts.push(plural(total, "liike", "liikettä"));

    var right;

    }

      '<div class="day-card-head">' +
      '<div class="day-card-main" data-toggle-day-summary data-key="' + key + '" role="button" tabindex="0" aria-expanded="' + (expanded ? "true" : "false") + '">' +
      ring +

      '<div class="exercise-target">' + escapeHtml(statusParts.join(" · ")) + '</div></div>' +
      '</div>' + right + '</div>' +

  function renderExercise(ex){
    var open = state.openExercise === ex.id;
    var isSaved = isExerciseLogged(ex);
    var parts = [];
    if(ex.sets) parts.push(ex.sets + " sarjaa");
    if(ex.reps) parts.push(ex.reps + (ex.unit ? " " + ex.unit : ""));
    if(ex.weight) parts.push(ex.weight + " kg");
    if(ex.notes) parts.push(ex.notes);
    // Menetelmä (rest-pause, Cluster, drop) kuuluu tavoiteriville, mutta vain
    // kerran: jäsennin on osalle riveistä jo kopioinut sen huomautukseen.
    if(ex.method && String(ex.notes || "").indexOf(ex.method) === -1) parts.push(ex.method);
    var target = parts.join(" · ");
    var badge = isSaved
      ? '<div title="Tallennettu" style="width:22px; height:22px; border-radius:50%; background:var(--success); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; margin-left:8px;">✓</div>'
      : '';

      : '<div class="chevron">›</div>';

    return '<div class="exercise ' + (open ? "open" : "") + '" style="' + (isSaved ? "border-color:rgba(111,174,111,0.35);" : "") + '">' +
      '<div class="exercise-head">' +
      '<div class="exercise-head-main" data-toggle-ex data-id="' + ex.id + '" role="button" tabindex="0" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<div class="exercise-name">' + escapeHtml(ex.name) + tehoBadge(ex) + '</div>' +

      '</div><div style="display:flex; align-items:center;">' + badge + chevronHtml + '</div></div>' +
      (open ? renderLedger(ex) : '') +
      '</div>';

  function autoCalcHint(info, id){
    if(!info) return "";
    var text;
    if(info.type === "max"){
      var maxWeightStr = String(info.weight).replace(".", ",") + " kg";
      if(info.isMax){
        text = "Paino perustuu manuaalisesti syötettyyn 1RM:ään (" + maxWeightStr + ") — muokattavissa.";
      } else {
        var pctStr = (info.percents || []).map(function(p){ return String(p).replace(".", ",") + " %"; }).join(" / ");
        text = "Paino laskettu " + pctStr + " liikkeen 1RM:stä (" + maxWeightStr + ") — muokattavissa.";
      }
    } else if(info.type === "formula"){
      var progressionStr = String(Math.round(info.progressionPercent * 100) / 100).replace(".", ",");
      text = "Paino laskettu Epley-kaavalla edellisestä merkinnästä (" + String(info.refWeight).replace(".", ",") + " kg × " + info.refReps + " toistoa, " + info.date + "), tavoitteena " + progressionStr + " % kehitys — muokattavissa.";
    } else if(info.type === "saved"){
      text = "Tämä merkintä on jo tallennettu (" + capitalize(formatDateFI(info.date)) + ") — arvot ladattu aiemmasta tallennuksesta, ei tuoreesta laskennasta.";
    } else {
      return "";
    }
    var html = '<div style="font-size:11.5px; color:var(--mist); margin-bottom:10px; line-height:1.4;">' + text;
    if(info.type === "saved"){
      html += '<button class="btn-secondary" data-recalc data-id="' + id + '" type="button" style="margin-top:8px; padding:8px; font-size:12px; width:auto; display:block;">Poista merkintä ja laske uudelleen</button>';
    }
    html += '</div>';
    return html;
  }
  function renderVariantInfo(ex){
    // Näkyy aina kun liike tunnistetaan katalogista ja sillä on variaatioita —
    // myös teholiikkeille, joilla ohjattua valintaa ei ole.
    var match = resolveCatalogMatch(ex.name);
    if(!match) return "";
    var vOpts = variaatioOptionsFor(match.liike);
    if(!vOpts.options.length) return "";
    var row = findVariantRow(match.liike, match.variaatio, match.lisavariaatio);
    var lihasryhma = (row && row.lihasryhma) ? row.lihasryhma : muscleGroupForLiike(match.liike);
    return '<div style="color:var(--mist); font-size:11.5px; line-height:1.5; margin-bottom:10px;">' +
      'Tunnetut variaatiot: ' + escapeHtml(vOpts.options.join(", ")) +
      (lihasryhma ? '<br>Lihasryhmä: ' + escapeHtml(lihasryhma) : "") +
      '</div>';

  // Valmentajan selitys menetelmälle (esim. "Cluster = ...") kulkee ohjelman

  function activeSetIndex(ex, sets){
    if(state.activeSet && state.activeSet.id === ex.id && sets[state.activeSet.idx]) return state.activeSet.idx;
    for(var i=0;i<sets.length;i++){ if(!sets[i].done) return i; }
    return sets.length - 1;

  function renderLedger(ex){
    var sets = state.draftSets[ex.id] || [{ weight:"", reps:"", notes:"", done:false }];

    var rows = sets.map(function(s, idx){
      // Sarjan numero on pelkkä visuaalinen merkki — hyväksyntä tehdään aina

        '<input class="ledger-input" type="text" inputmode="numeric" placeholder="toistot" aria-label="Sarja ' + (idx+1) + ' toistot" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="reps" value="' + escapeHtml(s.reps) + '">' +
        '<button type="button" class="set-done-btn" data-toggle-done data-id="' + ex.id + '" data-idx="' + idx + '" aria-pressed="' + (s.done ? "true" : "false") + '" aria-label="' + (s.done ? "Sarja " + (idx+1) + " merkitty valmiiksi" : "Merkitse sarja " + (idx+1) + " valmiiksi") + '">✓</button>' +

            '<button class="btn-danger btn-sm btn-auto" data-remove-set data-id="' + ex.id + '" data-idx="' + idx + '" type="button" aria-label="Poista sarja ' + (idx+1) + '" style="padding:6px 10px;">' + icon("poista", 18) + '</button>' +
            '</div>'

        '<div class="weight-step-row' + (active === idx ? "" : " hidden") + '" data-step-row data-id="' + ex.id + '" data-idx="' + idx + '">' +
        '<button class="weight-step-btn" data-weight-step data-id="' + ex.id + '" data-idx="' + idx + '" data-step="-2.5" type="button" aria-label="Vähennä sarjan ' + (idx+1) + ' painoa 2,5 kg">−2,5 kg</button>' +
        '<button class="weight-step-btn" data-weight-step data-id="' + ex.id + '" data-idx="' + idx + '" data-step="2.5" type="button" aria-label="Lisää sarjan ' + (idx+1) + ' painoa 2,5 kg">+2,5 kg</button>' +

      '<div class="ledger-save">' +
      (allDone ? "" : '<div style="font-size:var(--fs-xs); color:var(--mist); margin-bottom:8px; text-align:center;">Merkitse jokainen sarja valmiiksi (✓) ennen tallennusta.</div>') +
      '<button class="btn-primary" data-save-ex data-id="' + ex.id + '" type="button"' + (allDone ? "" : " disabled") + '>Tallenna merkintä</button>' +
      '</div>' +
      renderSwapExercise(ex) +
      '</div>';

  var VARIANT_ADD_NEW = "__addnew__";

  function knownMuscleGroups(){

      if(row.lihasryhma && !seen[row.lihasryhma]){ seen[row.lihasryhma] = true; groups.push(row.lihasryhma); }

  function fmtSignedKg(diff){
    var rounded = Math.round(diff * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return "+" + str + " kg";
    if(rounded < 0) return "−" + str + " kg";
    return "0 kg";
  }
  function fmtSignedPct(pct){
    if(pct === null || !isFinite(pct)) return "";
    var rounded = Math.round(pct * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return " (+" + str + " %)";
    if(rounded < 0) return " (−" + str + " %)";
    return " (0 %)";
  }
  function renderDeltaValue(current, past){
    if(past === null || past === undefined){
      return '<span style="color:var(--mist);">Ei dataa</span>';
    }
    var diff = current - past;
    var pct = (past !== 0) ? (diff / past * 100) : null;
    var color = diff > 0 ? "var(--brass)" : (diff < 0 ? "var(--danger-text)" : "var(--mist)");
    return '<span style="color:' + color + '; font-variant-numeric:tabular-nums; font-weight:600;">' + fmtSignedKg(diff) + fmtSignedPct(pct) + '</span>';
  }
  function renderOneRepMaxChart(points, name){

  function renderProgressChart(points, titlePrefix, unit){
    // Staattinen, yleiskäyttöinen SVG-viivakäyrä (käytetään sekä liikkeen
    // laskennalliselle 1RM:lle että treenipäivän kokonaispainolle). Vaaka-akseli
    // skaalataan todellisen ajan mukaan, jotta treenitauot näkyvät käyrässä.
    // Toimii myös yhden pisteen sarjalla: silloin piirretään pelkkä keskitetty
    // piste ilman viivaa (polyline/polygon jäävät ilman pinta-alaa yhdellä
    // koordinaatilla).
    if(!points || points.length === 0) return "";
    var i;
    var times = [], values = [];
    for(i=0;i<points.length;i++){
      times.push(new Date(points[i].date + "T00:00:00").getTime());
      values.push(points[i].value);
    }
    var tMin = times[0], tMax = times[times.length - 1];
    var vMin = values[0], vMax = values[0];
    for(i=1;i<values.length;i++){
      if(values[i] < vMin) vMin = values[i];
      if(values[i] > vMax) vMax = values[i];
    }
    var calcMin, calcMax;
    if(vMax === vMin){
      calcMin = vMin - 1;
      calcMax = vMax + 1;
    } else {
      var pad = (vMax - vMin) * 0.08;
      calcMin = vMin - pad;
      calcMax = vMax + pad;
    }
    function round1(v){ return Math.round(v * 10) / 10; }
    function xAt(t){
      if(tMax === tMin) return 175;
      return round1(40 + (t - tMin) / (tMax - tMin) * 270);
    }
    function yAt(v){ return round1(110 - (v - calcMin) / (calcMax - calcMin) * 98); }
    function fmtValue(v){ return String(v).replace(".", ","); }

    var coords = [];
    for(i=0;i<points.length;i++){
      coords.push({ x: xAt(times[i]), y: yAt(values[i]) });
    }
    var last = coords[coords.length - 1];
    var linePoints = coords.map(function(c){ return c.x + "," + c.y; }).join(" ");
    var areaPoints = coords[0].x + ",110 " + linePoints + " " + last.x + ",110";

    var dots = "";
    if(coords.length <= 14){
      dots = coords.map(function(c){
        return '<circle cx="' + c.x + '" cy="' + c.y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
      }).join("");
    } else {
      dots = '<circle cx="' + coords[0].x + '" cy="' + coords[0].y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
    }
    dots += '<circle cx="' + last.x + '" cy="' + last.y + '" r="3.5" fill="var(--brass)" stroke="none"></circle>';

    var label = (points.length === 1)
      ? titlePrefix + " " + formatDateShortFI(points[0].date) + ", " + fmtValue(values[0]) + " " + unit
      : titlePrefix + " " +
        formatDateShortFI(points[0].date) + "–" + formatDateShortFI(points[points.length - 1].date) + ", " +
        fmtValue(values[0]) + " " + unit + " → " + fmtValue(values[values.length - 1]) + " " + unit;
    var safeLabel = escapeHtml(label);

    var xAxisLabels = (points.length === 1)
      ? '<text x="175" y="126" text-anchor="middle" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>'
      : '<text x="40" y="126" text-anchor="start" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>' +
        '<text x="310" y="126" text-anchor="end" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[points.length - 1].date)) + '</text>';

    return '<svg viewBox="0 0 320 130" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block; height:auto; margin:2px 0 12px;" role="img" aria-label="' + safeLabel + '">' +
      '<title>' + safeLabel + '</title>' +
      '<line x1="40" y1="12" x2="310" y2="12" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<line x1="40" y1="110" x2="310" y2="110" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<polygon points="' + areaPoints + '" fill="rgba(201,162,39,0.10)" stroke="none"></polygon>' +
      '<polyline points="' + linePoints + '" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      dots +
      '<text x="34" y="' + round1(yAt(vMax) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMax) + '</text>' +
      '<text x="34" y="' + round1(yAt(vMin) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMin) + '</text>' +
      xAxisLabels +
      '</svg>';
  }
  function renderKehitysCard(item){

      ["Koko historian aikana", renderDeltaValue(p.current, p.allTime), p.allTime]

      '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">' +
      '<div style="font-weight:600; font-size:15px;">' + escapeHtml(item.name) + '</div>' +

  // Päivän yhteenveto: liikkeiden määrä ja nostettu kokonaispaino.
  function historyDaySummary(entry){
    var keys = Object.keys((entry && entry.exercises) || {});
    var totalKg = 0;
    keys.forEach(function(k){
      ((entry.exercises[k] || {}).sets || []).forEach(function(s){
        var w = toNumber(s.weight), r = toNumber(s.reps);
        if(isFinite(w) && isFinite(r)) totalKg += w * r;
      });
    });
    var parts = [plural(keys.length, "liike", "liikettä")];
    if(totalKg > 0) parts.push(totalKg.toLocaleString("fi-FI") + " kg");
    return parts.join(" · ");
  }
  function renderHistoryDate(date){
    var expanded = state.expandedHistoryDate === date;
    var entry = state.historyCache[date];
    var inner = "";
    if(expanded){
      var keys = Object.keys((entry && entry.exercises) || {});
      if(keys.length === 0){
        inner = '<div style="color:var(--mist); font-size:var(--fs-sm); margin-top:8px;">Ei kirjattuja liikkeitä.</div>';
      } else {
        inner = keys.map(function(key){
          var data = entry.exercises[key];
          var name = data.name || key;
          var setsStr = (data.sets || []).map(function(s, i){
            return (i+1) + ": " + (s.weight || "–") + " kg × " + (s.reps || "–") + (s.notes ? " (" + escapeHtml(s.notes) + ")" : "");
          }).join(" · ");
          return '<div style="margin-top:10px;"><div style="font-weight:600; font-size:var(--fs-md);">' + escapeHtml(name) + '</div>' +
            '<div style="color:var(--mist); font-size:var(--fs-sm); font-variant-numeric:tabular-nums; margin-top:2px;">' + setsStr + '</div></div>';
        }).join("");
      }
      // Poisto on toissijainen toiminto: pieni tekstipainike kortin alareunassa,
      // ei pääsisällön kanssa yhtä näkyvä palkki. Vahvistus vaihtaa sen
      // tuhoavaksi painikkeeksi.
      var confirming = state.confirmingDeleteDate === date;
      inner += '<div style="display:flex; justify-content:flex-end; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);">' +
        '<button class="' + (confirming ? "btn-danger btn-sm btn-auto" : "btn-tertiary btn-sm") + '" data-delete-history data-date="' + date + '" type="button"' + (confirming ? "" : ' style="color:var(--danger-text);"') + '>' +
        icon("poista", 16) + '<span>' + (confirming ? "Vahvista poisto" : "Poista päivä") + '</span></button></div>';
    }
    return '<div class="history-date">' +
      '<div class="history-date-head" data-history-date data-date="' + date + '" role="button" tabindex="0" aria-expanded="' + (expanded ? "true" : "false") + '">' +
      '<span style="min-width:0;"><span style="display:block;">' + capitalize(formatDateFI(date)) + '</span>' +
      (entry ? '<span style="display:block; color:var(--mist); font-size:var(--fs-sm); font-weight:400; margin-top:2px;">' + escapeHtml(historyDaySummary(entry)) + '</span>' : '') +
      '</span>' +
      '<span class="chevron" style="display:inline-block;' + (expanded ? "transform:rotate(90deg);color:var(--brass);" : "") + '">›</span>' +
      '</div>' + inner + '</div>';
  }
  function maxExerciseNames(){

      '<div class="exercise" style="padding:16px;">' +
