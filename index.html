<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treenipäiväkirja">
<meta name="theme-color" content="#12161d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Treenipäiväkirja</title>
<style>
  :root{
    --ink:#12161d;
    --surface:#1c222b;
    --surface-2:#262e39;
    --line:#333c48;
    /* Interaktiivisten kontrollien (kentät, painikkeet, kytkin) reunaväri.
       WCAG 1.4.11 vaatii 3:1 komponentin tunnistamiseen tarvittavalle
       rajaukselle; --line jää koristeellisiin erottimiin ja korttien reunoihin.
       Kontrastit: 3,67:1 korttia (--surface) ja 4,17:1 taustaa (--ink) vasten. */
    --line-strong:#6e7a8c;
    --brass:#c9a227;
    --chalk:#eeeae2;
    --mist:#98a1b0;
    --danger:#c1633c;
    --danger-text:#e08a5f;
    --success:#6fae6f;
    --radius:14px;
    --radius-sm:8px;
    /* Typografia-asteikko. Leipäteksti ei koskaan alle 13 px:n mobiilissa;
       12 px on varattu versaaliotsikoille ja merkeille, joissa kirjainväli
       kompensoi kokoa. */
    --fs-xs:12px;
    --fs-sm:13px;
    --fs-md:14px;
    --fs-lg:16px;
    --fs-xl:18px;
    --fs-2xl:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--chalk);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 48px);}
  /* Kelluvan alanavigaation alle jäävä tila, jotta sisällön loppu ei jää palkin taakse. */
  #app.has-bottom-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 108px);}
  *:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 2px 18px;}
  .app-title{margin:0; font-size:0; line-height:0;}
  .app-logo{display:block; height:40px; width:auto;}
  /* Asetukset ei ole enää välilehti vaan rataskuvake näkymän oikeassa yläkulmassa. */
  .icon-btn{flex-shrink:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center; padding:0; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:999px; color:var(--mist); cursor:pointer;}
  /* Aktiivinen tila on sama kaikilla navigaatioelementeillä: täytetty
     messinkipilleri tummalla kuvakkeella/tekstillä (ks. .tab.active). */
  .icon-btn.active{color:var(--ink); border-color:var(--brass); background:var(--brass);}

  /* Kelluva alanavigaatio. Sama väri- ja tekstikieli kuin muualla sovelluksessa
     (surface-2 + line, samat pienet versaalit kuin aiemmassa yläreunan
     välilehtirivissä — ei uutta ikonistoa), mutta täysin pyöristetty pilleri
     (999px) sekä ulkokehyksessä että aktiivisen välilehden korostuksessa. */
  /* Palkki nousee irti tummista korteista kahdella keinolla yhtä aikaa:
     lasimainen, sumennettu puoliläpinäkyvä pinta (syvyys) ja ohut
     messinkireunus (väriero). Sisävalo (inset-valkoinen hiusviiva) antaa
     lasireunan kiillon. Jos selain ei tue backdrop-filteriä, pinta
     palautetaan läpinäkymättömäksi @supports-lohkossa. */
  .bottom-nav{position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:70; margin:0 auto; max-width:448px; display:flex; gap:2px; padding:6px; background:rgba(38,46,57,.78); -webkit-backdrop-filter:blur(16px) saturate(120%); backdrop-filter:blur(16px) saturate(120%); border:1px solid var(--brass); border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10);}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .bottom-nav{background:var(--surface-2);}
  }
  /* Välilehdessä on kuvake ja teksti päällekkäin: kuvake nopeuttaa silmäilyä
     ja teksti nousee lukukelpoiseen 11 px:n kokoon, kun sen ei enää tarvitse
     yksin kantaa merkitystä. */
  .tab{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:50px; padding:5px 2px 4px; border-radius:999px; text-align:center; font-size:11px; font-weight:700; color:var(--mist); text-transform:uppercase; letter-spacing:.03em; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; -webkit-tap-highlight-color:transparent;}
  .tab svg{display:block;}
  /* Aktiivinen osio täytettynä messinkipillerinä — sama aksenttiväri kuin
     muissakin toimintopainikkeissa, mutta ainoana täytettynä pintana. */
  .tab.active{color:var(--ink); background:var(--brass); font-weight:800;}

  .day-heading{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--mist); margin:20px 2px 8px; font-weight:700;}
  .day-heading:first-of-type{margin-top:0;}

  .exercise{background:var(--surface); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; border:1px solid rgba(255,255,255,0.04);}

  /* ---------- Päiväkortti ----------
     Otsikkona päivän nimi, alarivillä tila ja liikemäärä. Nimiosa on
     painike (avaa/sulkee), oikealla joko nuoli tai seuraavan treenin
     "Aloita"-painike — sisarelementteinä, ei sisäkkäin. */
  .day-card-head{display:flex; align-items:center; gap:10px; padding:13px 14px 13px 16px; min-height:44px;}
  .day-card-main{flex:1; min-width:0; display:flex; align-items:center; gap:12px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .day-ring{flex-shrink:0; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--brass);}
  .day-ring.partial{border-color:var(--brass);}
  .day-ring.done{background:var(--success); border-color:var(--success); color:var(--ink); font-size:15px;}
  .day-exercises{margin:0 0 16px; padding-left:0;}
  .day-exercises .exercise:last-child{margin-bottom:0;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  /* ---------- Asetusten riviluettelo ja alinäkymän otsikko ---------- */
  .view-title{font-size:var(--fs-xl); font-weight:800; margin:0 0 14px; letter-spacing:-.01em;}
  .subview-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .settings-list{background:var(--surface); border-radius:var(--radius); border:1px solid rgba(255,255,255,0.04); overflow:hidden; margin-bottom:14px;}
  .settings-row{display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px 12px 16px; background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--chalk); text-align:left; font:inherit; cursor:pointer; min-height:60px; -webkit-tap-highlight-color:transparent;}
  .settings-row:last-child{border-bottom:0;}
  .settings-row:active{background:var(--surface-2);}
  .settings-row:focus-visible{outline:2px solid var(--brass); outline-offset:-2px;}
  .settings-row .choice-icon{width:38px; height:38px; border-radius:10px;}
  .settings-row-body{flex:1; min-width:0; display:block;}
  .settings-row-title{display:block; font-size:var(--fs-lg); font-weight:700; line-height:1.25;}
  .settings-row-sub{display:block; font-size:var(--fs-sm); color:var(--mist); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---------- Ohjelman muokkaustila ----------
     Viikko-, päivä- ja liikerivit ovat samaa muotoa: nimiosa (avaa tai
     muokkaa), siirto ylös/alas ja ⋮-valikko, jonka takana ovat harvemmat
     toiminnot (kopioi, aloita uudelleen, poista). Avatun viikon ja päivän
     nimi on rivillä tekstikenttänä. */
  .editor-row{padding:0; margin-bottom:8px;}
  .editor-head{display:flex; align-items:center; gap:6px; padding:6px 8px 6px 6px; min-height:52px;}
  .editor-title{flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:transparent; border:0; color:var(--chalk); text-align:left; font:inherit; padding:6px 4px; cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:8px;}
  .editor-title .chev{color:var(--mist); flex-shrink:0; display:flex;}
  .editor-name{flex:1; min-width:0; padding:8px 10px;}
  .editor-icon{width:34px; height:36px; padding:0; background:transparent; border:1px solid var(--line-strong); border-radius:8px; color:var(--mist); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; -webkit-tap-highlight-color:transparent;}
  .editor-icon.on{color:var(--brass); border-color:var(--brass);}
  .editor-icon:disabled{opacity:.3; cursor:default;}
  .editor-strip{display:flex; flex-wrap:wrap; gap:8px; padding:0 12px 12px;}
  .editor-children{margin:0 0 12px 10px; padding-left:10px; border-left:2px solid var(--line);}
  .editor-add{width:auto; margin-bottom:4px;}
  .edit-bar{position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:70; margin:0 auto; max-width:448px; display:flex; gap:8px; padding:6px; background:rgba(38,46,57,.92); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid var(--brass); border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .edit-bar .btn-secondary, .edit-bar .btn-primary, .edit-bar .btn-danger{min-height:44px; flex:1; padding:8px 12px;}

  /* ---------- Kaksiosainen valitsin ---------- */
  .segmented{display:inline-flex; padding:3px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:999px;}
  .segmented button{font:inherit; font-size:var(--fs-sm); font-weight:700; color:var(--mist); background:transparent; border:0; border-radius:999px; padding:5px 13px; min-height:30px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .segmented button.on{background:var(--brass); color:var(--ink);}
  .exercise-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer; min-height:44px;}
  .exercise-head-main{flex:1; min-width:0; cursor:pointer;}
  .exercise-name{font-weight:600; font-size:15px;}
  .exercise-target{font-size:var(--fs-sm); color:var(--mist); margin-top:3px; font-variant-numeric:tabular-nums;}
  .chevron{color:var(--mist); font-size:20px; transition:transform .2s, color .2s; flex-shrink:0; margin-left:10px;}
  .exercise.open .chevron{transform:rotate(90deg); color:var(--brass);}
  .chevron-btn{background:none; border:none; padding:0; margin:0; cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; flex-shrink:0;}

  .ledger{padding:0 16px 16px;}
  /* Sarjarivi: numero, paino, toistot, valmis ja lisävalikko yhdellä rivillä.
     Säätimet (±2,5 kg) näkyvät vain aktiivisen sarjan alla ja huomiokenttä
     lisävalikon takana, jolloin kolme sarjaa mahtuu puoleen entisestä. */
  .ledger-row{display:grid; grid-template-columns:24px 1fr 0.72fr 42px 30px; gap:6px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line);}
  .ledger-row:last-of-type{border-bottom:none;}
  .ledger-row.has-extra{border-bottom:none; padding-bottom:4px;}
  .set-extra{display:flex; gap:8px; align-items:center; padding:0 0 8px 30px; border-bottom:1px dashed var(--line);}
  .set-more{width:30px; height:36px; padding:0; margin:0; background:transparent; border:0; border-radius:8px; color:var(--mist); display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .set-more.on{color:var(--brass);}
  .weight-step-row.hidden{display:none;}
  /* Tallennuslohko ei ole kiinnitetty: kiinnitettynä se peitti sarjarivit
     heti kortin avautuessa, koska kortti on näyttöä korkeampi. Viimeisen
     sarjan merkinnyt käyttäjä on joka tapauksessa jo kortin alareunassa. */
  .ledger-save{margin-top:10px;}
  .ledger-head{font-size:10px; text-transform:uppercase; color:var(--mist); letter-spacing:.06em; padding-bottom:6px;}
  .weight-step-row{display:flex; gap:8px; margin:-2px 0 8px; padding-left:30px;}
  /* 22px täyte + rivin 8px väli = 30px = sarjan numero -sarake (24px) + ledger-rivin
     oma 6px väli, jotta painikerivi alkaa täsmälleen painokentän vasemmasta reunasta. */
  .weight-step-spacer{flex:0 0 22px;}
  /* Pikasäätönapit ovat ääriviivatyyliä (läpinäkyvä tausta + messinkireunus),
     jotta täytetty messinkipinta jää yksinomaan hyväksyntänapille ja
     "Tallenna merkintä" -painikkeelle — ne ovat rivin varsinaiset toiminnot. */
  .weight-step-btn{flex:0 0 auto; height:36px; padding:0 10px; font-size:12.5px; white-space:nowrap; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--brass); border:1px solid var(--brass); border-radius:999px; font-weight:800; cursor:pointer;}
  /* margin-left:auto työntää Valmis-napin rivin oikeaan reunaan (Poista sarja
     -napin kohdalle) riippumatta -/+ -nappien kutistuneesta leveydestä. */
  .set-done-btn{flex:0 0 auto; width:42px; height:38px; padding:0; font-size:19px; display:flex; align-items:center; justify-content:center; background:transparent; color:var(--brass); border:1px solid var(--brass); border-radius:999px; font-weight:500; cursor:pointer;}
  .set-num{background:none; border:none; padding:0; margin:0; font-family:inherit; color:var(--brass); font-weight:700; font-variant-numeric:tabular-nums; font-size:var(--fs-sm); width:24px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .set-num.done{background:var(--success); color:var(--ink); font-size:14px;}
  .ledger-input{background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--radius-sm); color:var(--chalk); padding:8px 7px; font-size:16px; width:100%; font-variant-numeric:tabular-nums;}
  /* Selaimen oletusvaalennus vihjetekstille jää alle kontrastivaatimuksen, joten väri asetetaan itse. */
  /* Ilman näitä pudotusvalikon sisältö renderöityy useassa selaimessa
     järjestelmän vaalealla oletusvärillä tumman teeman päälle. */
  .ledger-input option{background:var(--surface-2); color:var(--chalk);}
  .ledger-input optgroup{color:var(--brass); font-weight:700;}
  .ledger-input::placeholder, .date-picker-row input[type=date]::placeholder{color:var(--mist); opacity:1;}
  .ledger-input::-webkit-input-placeholder, .date-picker-row input[type=date]::-webkit-input-placeholder{color:var(--mist); opacity:1;}
  .remove-set{background:none; border:none; color:var(--mist); font-size:18px; cursor:pointer; padding:0; line-height:1; width:100%; min-height:44px; display:flex; align-items:center; justify-content:center;}

  .add-set-btn{width:100%; margin-top:10px; padding:11px; background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:999px; color:var(--mist); font-size:13px; font-weight:700; cursor:pointer;}
  .subtotal{display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--mist);}
  .subtotal b{color:var(--brass); font-variant-numeric:tabular-nums;}
  /* ---------- Painikehierarkia ----------
     Neljä tasoa, jotta jokaisella ruudulla erottuu yksi ensisijainen toiminto:
       .btn-primary    täytetty messinki, tumma teksti — ruudun päätoiminto
       .btn-secondary  ääriviiva harmaalla — vaihtoehtoiset toiminnot
       .btn-tertiary   pelkkä teksti — vähäiset, toistuvat toiminnot
       .btn-danger     ääriviiva vaaravärillä — tuhoavat toiminnot
     .save-btn on säilytetty aliaksena .btn-primary:lle, jotta vanhat
     kutsupaikat toimivat ennallaan; uusi koodi käyttää .btn-primary-nimeä.
     Kokoa säätävät .btn-sm (40 px) ja leveyttä .btn-auto. */
  .btn-primary, .btn-secondary, .btn-tertiary, .btn-danger, .save-btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:48px; padding:12px 18px; border-radius:999px; font:inherit; font-size:var(--fs-md); font-weight:700; line-height:1.2; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .08s, opacity .15s, background-color .15s, color .15s;}
  .btn-primary, .save-btn{background:var(--brass); border:1px solid var(--brass); color:var(--ink); font-weight:800;}
  .save-btn{margin-top:12px;}
  .btn-secondary{background:var(--surface-2); border:1px solid var(--line-strong); color:var(--chalk);}
  .btn-tertiary{background:transparent; border:1px solid transparent; color:var(--mist); font-weight:600; min-height:40px; padding:8px 12px; width:auto;}
  .btn-tertiary:hover{color:var(--chalk);}
  .btn-danger{background:transparent; border:1px solid var(--danger); color:var(--danger-text);}
  .btn-sm{min-height:40px; padding:8px 14px; font-size:var(--fs-sm);}
  .btn-auto{width:auto;}
  .btn-primary:active, .save-btn:active, .btn-secondary:active, .btn-danger:active{transform:scale(.98); opacity:.9;}
  .btn-primary:disabled, .btn-secondary:disabled, .btn-tertiary:disabled, .btn-danger:disabled, .save-btn:disabled, .add-set-btn:disabled{opacity:.4; cursor:default; transform:none;}
  .btn-primary svg, .btn-secondary svg, .btn-tertiary svg, .btn-danger svg, .save-btn svg{flex-shrink:0;}

  /* ---------- Merkki (chip) ----------
     Pieni pyöristetty tilamerkki: teho (MAX, %), tila (Tehty, Kesken) ja
     päivämäärä. Sama muoto kaikkialla, sävy kertoo merkityksen. */
  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.02em; border:1px solid transparent; vertical-align:middle; white-space:nowrap; line-height:1.3;}
  .chip-brass{color:var(--brass); border-color:var(--brass); background:transparent;}
  .chip-muted{background:rgba(136,145,160,0.2); color:var(--chalk);}
  .chip-success{background:rgba(111,174,111,0.18); color:var(--success);}

  /* ---------- Banneri ----------
     Yksi komponentti kolmella sävyllä korvaa aiemmat erilliset laatikot
     (aloitusnäyttövinkki, varmuuskopiomuistutus, tuontivaroitukset, PDF-virhe,
     palautuksen vahvistus). Kuvake vasemmalla, toiminnot omalla rivillään. */
  .banner{display:flex; gap:10px; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--brass); background:rgba(201,162,39,0.10); font-size:var(--fs-sm); line-height:1.5; margin-bottom:16px; text-align:left;}
  .banner-icon{flex-shrink:0; width:22px; height:22px; color:var(--brass); margin-top:1px; display:flex; align-items:center; justify-content:center;}
  .banner-body{flex:1; min-width:0;}
  .banner-title{font-weight:800; color:var(--brass); margin-bottom:3px;}
  .banner-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .banner-danger{border-color:var(--danger); background:rgba(193,99,60,0.12);}
  .banner-danger .banner-icon, .banner-danger .banner-title{color:var(--danger-text);}
  .banner-info{border-color:var(--line-strong); background:var(--surface);}
  .banner-info .banner-icon, .banner-info .banner-title{color:var(--chalk);}

  .setting-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .toggle-switch{position:relative; flex-shrink:0; width:46px; height:26px; padding:0; border:1px solid var(--line-strong); border-radius:999px; background:var(--surface-2); cursor:pointer;}
  .toggle-switch .toggle-thumb{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--mist); transition:transform .2s, background-color .2s;}
  .toggle-switch.on{background:rgba(201,162,39,0.3); border-color:var(--brass);}
  .toggle-switch.on .toggle-thumb{transform:translateX(20px); background:var(--brass);}
  .setting-disabled{opacity:.45; pointer-events:none;}

  /* ---------- Tiedostonvalitsin ----------
     Natiivi <input type=file> on selaimen näköinen ja englanninkielinen.
     Se jää DOM:iin (change-tapahtumat ja id:t toimivat ennallaan) mutta
     piirtyy läpinäkyvänä painikkeen päälle: napautus osuu inputiin, ja
     näppäimistöllä input saa fokuksen, jonka rengas piirtyy painikkeeseen. */
  .file-picker{position:relative; overflow:hidden;}
  .file-picker input[type=file]{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0; margin:0; padding:0;}
  .file-picker:focus-within{outline:2px solid var(--brass); outline-offset:2px;}

  /* ---------- Päivämääräsirpale ----------
     Sama idea: natiivi päivämääräkenttä läpinäkyvänä sirpaleen päällä. */
  .date-picker-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:var(--fs-sm); color:var(--mist); min-height:36px;}
  .date-chip{position:relative; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:6px 12px 6px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--chalk); font-size:var(--fs-sm); font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer;}
  .date-chip input[type=date]{position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; padding:0; border:0; cursor:pointer; font-size:16px;}
  .date-chip:focus-within{outline:2px solid var(--brass); outline-offset:2px;}
  .date-chip svg{color:var(--brass);}

  .upload-box{border:1px dashed var(--line); border-radius:var(--radius); padding:26px 18px; margin-top:6px;}

  /* ---------- Tervetuloruutu ---------- */
  .welcome{padding:12px 4px 8px; text-align:center;}
  .welcome-logo{display:block; margin:18px auto 14px; height:64px; width:auto;}
  .welcome h1{font-size:var(--fs-2xl); font-weight:800; margin:0 0 8px; letter-spacing:-.01em;}
  .welcome-lead{color:var(--mist); font-size:var(--fs-md); line-height:1.55; margin:0 auto 22px; max-width:32ch;}
  .welcome-features{text-align:left; margin:0 0 22px;}
  .welcome-feature{display:flex; align-items:center; gap:12px; padding:10px 0;}
  .welcome-feature + .welcome-feature{border-top:1px dashed var(--line);}
  .welcome-feature .choice-icon{width:40px; height:40px;}
  .welcome-feature-text{font-size:var(--fs-md); line-height:1.4;}
  .welcome-terms{text-align:left; font-size:var(--fs-xs); color:var(--mist); line-height:1.5; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); margin-bottom:16px;}
  .welcome-terms b{color:var(--chalk);}

  /* ---------- Valintakortti ----------
     Aloitusruudun kolme tapaa saada ohjelma. Koko kortti on kosketuskohde;
     tiedostopohjaisissa korteissa natiivi input on kortin päällä läpinäkyvänä
     (ks. .file-picker), joten napautus avaa suoraan tiedostovalitsimen. */
  .choice-card{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); color:var(--chalk); cursor:pointer; font:inherit; margin:0 0 10px; position:relative; -webkit-tap-highlight-color:transparent; transition:border-color .15s, transform .08s;}
  .choice-card:hover{border-color:var(--line-strong);}
  .choice-card:active{transform:scale(.99);}
  .choice-card:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  .choice-icon{flex-shrink:0; width:44px; height:44px; border-radius:12px; background:var(--surface-2); color:var(--brass); display:flex; align-items:center; justify-content:center;}
  .choice-body{flex:1; min-width:0; display:block;}
  .choice-title{display:block; font-size:var(--fs-lg); font-weight:700; line-height:1.25;}

  .choice-chevron{color:var(--mist); flex-shrink:0; display:flex;}
  .start-title{font-size:var(--fs-2xl); font-weight:800; margin:6px 0 6px; letter-spacing:-.01em;}
  .start-lead{color:var(--mist); font-size:var(--fs-md); line-height:1.5; margin:0 0 18px;}
  .start-links{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px; margin-top:8px;}

  /* ---------- Pohjalevy ----------
     Alhaalta nouseva paneeli lisätiedolle ja valinnoille. Sulkeutuu
     taustaa napauttamalla, sulkupainikkeesta ja Escape-näppäimestä. */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:480px; max-height:86vh; overflow:auto; background:var(--surface); border-radius:var(--radius) var(--radius) 0 0; padding:12px 18px calc(env(safe-area-inset-bottom) + 20px); box-shadow:0 -8px 32px rgba(0,0,0,.5); border-top:1px solid var(--line-strong);}
  .sheet-handle{width:40px; height:4px; border-radius:2px; background:var(--line-strong); margin:0 auto 12px;}
  .sheet-title{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:var(--fs-lg); font-weight:800; margin-bottom:10px;}
  .sheet p{color:var(--mist); font-size:var(--fs-sm); line-height:1.55; margin:0 0 10px;}
  .sheet .csv-example{margin-bottom:12px;}
  .pick-list{display:flex; flex-direction:column; gap:4px;}
  .pick-group{font-size:var(--fs-xs); font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--mist); margin:10px 0 2px;}
  .pick-item{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; min-height:44px; color:var(--chalk); font:inherit; font-size:var(--fs-md); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .pick-item:hover, .pick-item:focus-visible{border-color:var(--brass);}
  .pick-item.pick-free{border-style:dashed; color:var(--brass);}
  .editor-note{padding:0 12px 10px; font-size:var(--fs-xs); line-height:1.45;}
  .editor-row.needs-review{border-color:var(--brass); background:rgba(201,162,39,0.08);}
  .upload-box p{color:var(--mist); font-size:var(--fs-md); line-height:1.55; margin:0 0 12px;}
  .csv-example{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; background:var(--surface-2); padding:10px; border-radius:8px; overflow-x:auto; white-space:nowrap; color:var(--mist); margin-bottom:16px;}

  .history-date{background:var(--surface); border-radius:var(--radius); margin-bottom:10px; padding:14px 16px;}
  .history-date-head{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; cursor:pointer; min-height:32px;}

  .empty{text-align:center; color:var(--mist); padding:48px 20px; font-size:var(--fs-md); line-height:1.6;}

  /* Ilmoitusruutu nousee alhaalta navigaation yläpuolelle: se ei peitä
     yläpalkkia eikä logoa, ja sijainti on sama, johon peukalo jo katsoo. */
  .toast{position:fixed; bottom:calc(env(safe-area-inset-bottom) + 84px); left:50%; transform:translateX(-50%) translateY(8px); max-width:calc(100% - 32px); text-align:center; background:var(--brass); color:var(--ink); padding:10px 18px; border-radius:999px; font-weight:800; font-size:var(--fs-sm); box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Näkymäsiirtymät (View Transitions). Ylempi liikkeen vähentämistä koskeva
     sääntö ei osu luotettavasti rajapinnan omiin pseudoelementteihin, joten
     ne nollataan tässä erikseen. */
  @media (prefers-reduced-motion: reduce){
    ::view-transition-group(*),
    ::view-transition-old(*),
    ::view-transition-new(*){
      animation: none !important;
    }
  }
  /* Sama kesto ja käyrä kuin muissakin siirtymissä (chevron, kytkin). */
  ::view-transition-old(root),
  ::view-transition-new(root){
    animation-duration: 0.22s;
    animation-timing-function: ease;
  }

  function pad2(n){ return n < 10 ? "0" + n : String(n); }
  // Paikallinen kalenteripäivä, ei UTC — toISOString() siirtäisi päivämäärän
  // väärään päivään esim. heti keskiyön jälkeen UTC:tä edellä olevissa aikavyöhykkeissä.
  function toLocalISO(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function todayISO(){ return toLocalISO(new Date()); }
  function daysAgoISO(n){ var d = new Date(); d.setDate(d.getDate() - n); return toLocalISO(d); }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  // Suomen lukusanataivutus: yksi saa yksikön, muut partitiivin.
  function plural(n, yksikko, monikko){ return n + " " + (n === 1 ? yksikko : monikko); }
  function isStandaloneDisplay(){
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

    return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");

    var d = new Date(iso + "T00:00:00");

    var s = String(raw).trim();

    var matches = s.match(/\d+(?:[.,]\d+)?\s*%/g);
    if(matches && matches.length){
      var percents = matches.map(function(m){ return toNumber(m.replace("%", "")); }).filter(function(n){ return isFinite(n); });

  var dayIdCounter = 0;

  function weekDisplayNameIn(program, weekKey){
    var lbl = program && program.weekLabels ? program.weekLabels[weekKey] : null;
    return (lbl && String(lbl).trim()) ? String(lbl).trim() : "Viikko " + weekKey;
  }
  function weekDisplayName(weekKey){ return weekDisplayNameIn(state.program, weekKey); }
  function dayDisplayNameIn(program, day){
    var label = day.label || dayLabelFromName(day);
    return (day.week !== null && day.week !== undefined && day.week !== "") ? weekDisplayNameIn(program, day.week) + " · " + label : label;
  }
  function dayDisplayName(day){ return dayDisplayNameIn(state.program, day); }
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // ---------- CSV parsing ----------
  // Monet Excel-vientityökalut (etenkin suomenkielisellä Windowsilla) tallentavat CSV:n
  // Windows-1252/ANSI-koodauksella, ei UTF-8:lla. Jos tiukka UTF-8-tulkinta epäonnistuu,
  // luetaan tiedosto Windows-1252:na, jotta ä/ö eivät korruptoidu eivätkä siten myöskään
  // sarakeotsikoiden tai liikkeiden nimien tunnistus.
  function decodeFileBuffer(buffer){
    try{ return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
    catch(e){ return new TextDecoder("windows-1252").decode(buffer); }
  }
  function readFileAsText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){ resolve(decodeFileBuffer(e.target.result)); };
      reader.onerror = function(){ reject(new Error("Tiedoston luku epäonnistui")); };
      reader.readAsArrayBuffer(file);
    });
  }
  function detectDelimiter(headerLine){
    var semi = (headerLine.match(/;/g) || []).length;
    var comma = (headerLine.match(/,/g) || []).length;
    var tab = (headerLine.match(/\t/g) || []).length;
    if(tab >= semi && tab >= comma && tab > 0) return "\t";
    return semi > comma ? ";" : ",";
  }
  function parseCSVLine(line, delim){
    var result = [], cur = "", inQ = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(c === '"'){
        if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if(c === delim && !inQ){ result.push(cur); cur = ""; }
      else cur += c;
    }
    result.push(cur);
    return result.map(function(s){ return s.trim(); });
  }
  function parseCSV(text){
    var lines = text.split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length > 0; });
    if(lines.length === 0) return [];
    var delim = detectDelimiter(lines[0]);
    var headers = parseCSVLine(lines[0], delim).map(function(h){ return h.toLowerCase().trim(); });
    var out = [];
    for(var i=1;i<lines.length;i++){
      var vals = parseCSVLine(lines[i], delim);
      var obj = {};
      headers.forEach(function(h, idx){ obj[h] = vals[idx] !== undefined ? vals[idx] : ""; });
      out.push(obj);
    }
    return out;
  }
  function mapHeaders(headers){
    var map = {};
    Object.keys(ALIASES).forEach(function(key){
      var aliases = ALIASES[key];
      // Tarkka täsmäys ensin: esim. "Liikejärjestys"-sarake ei saa varastaa "Liike"-saraketta
      // vain siksi, että se sisältää "liike"-aliaksen alkuosanaan.
      var found = headers.find(function(h){ return aliases.indexOf(h) !== -1; });
      if(!found){
        found = headers.find(function(h){
          return aliases.some(function(a){ return h.indexOf(a) !== -1; });
        });
      }
      if(found) map[key] = found;
    });
    return map;
  }
  function parseProgramCSV(text, idPrefix){
    text = text.replace(/^\uFEFF/, "");
    // Jokainen tuonti saa oman, uniikin id-etuliitteen: nain uuden CSV:n rivit eivat
    // koskaan tormaa saman rivijarjestyksen (esim. "ex-0") kautta vanhaan, jo kirjattuun
    // historiaan, joka aiemmin saattoi liittaa vanhan merkinnan vaaraan, uuteen liikkeeseen.
    var prefix = idPrefix || "ex-" + Date.now();
    var rows = parseCSV(text);
    if(rows.length === 0) throw new Error("CSV-tiedosto on tyhjä.");
    var headers = Object.keys(rows[0]);
    var map = mapHeaders(headers);
    if(!map.exercise) throw new Error('CSV:stä puuttuu liikkeen nimen sisältävä sarake (esim. "Liike" tai "Exercise").');
    // Jos CSV:ssä on vain lisävariaatiosarake, se ei saa osua myös variaatioksi
    // osittaistäsmäyksen kautta ("lisävariaatio" sisältää sanan "variaatio").
    if(map.variant && map.variant === map.subvariant) delete map.variant;
    var dayMap = new Map();
    var weekOrder = [];
    rows.forEach(function(row, idx){
      var weekVal = map.week ? (row[map.week] || "").trim() : "";
      var dayVal = map.day ? (row[map.day] || "").trim() : "";
      var groupName;
      if(weekVal && dayVal) groupName = "Viikko " + weekVal + " · Päivä " + dayVal;
      else if(weekVal) groupName = "Viikko " + weekVal;
      else if(dayVal) groupName = dayVal;
      else groupName = "Ohjelma";
      if(!dayMap.has(groupName)){
        dayMap.set(groupName, {
          id: newDayId(),
          label: (weekVal && dayVal) ? "Päivä " + dayVal : groupName,
          week: weekVal || null,
          exercises: []
        });
        if(weekVal && weekOrder.indexOf(weekVal) === -1) weekOrder.push(weekVal);
      }
      var intensityRaw = map.intensity ? row[map.intensity] : (map.notes ? row[map.notes] : "");
      // Variaatio ja lisävariaatio ovat omissa sarakkeissaan. Ne yhdistetään
      // liikkeen nimeen samalla kaavalla kuin liikekatalogi käyttää, jotta
      // variaatio näkyy ohjelmanäkymässä ja nimi vastaa katalogin riviä —
      // silloin myös tietopalkki ja ohjattu variaatiovalinta tunnistavat sen.
      var baseName = (row[map.exercise] || "").trim();
      var variantVal = map.variant ? (row[map.variant] || "").trim() : "";
      var subVariantVal = map.subvariant ? (row[map.subvariant] || "").trim() : "";
      dayMap.get(groupName).exercises.push({
        id: prefix + "-" + idx,
        name: baseName ? composeVariantName(baseName, variantVal, subVariantVal) : "Nimetön liike",
        sets: map.sets ? row[map.sets] : "",
        reps: map.reps ? row[map.reps] : "",
        unit: map.unit ? row[map.unit] : "",
        weight: map.weight ? row[map.weight] : "",
        notes: map.notes ? row[map.notes] : (map.intensity ? row[map.intensity] : ""),
        intensity: parseIntensity(intensityRaw),
        // CSV-rivi on aina tavallinen sarjat × toistot -liike, joten painolaskuri
        // saa ehdottaa painoa. Kentät ovat samat kuin PDF-tuonnissa, jotta
        // ohjelmarakenne on identtinen riippumatta tuontireitistä.
        kind: "plain",
        autoCalc: true
      });
    });
    var days = [];
    dayMap.forEach(function(group, name){ days.push({ id: group.id, label: group.label, name: name, week: group.week, exercises: group.exercises }); });
    return { days: days, weeks: weekOrder, weekLabels: {} };
  }

// ---------- PDF-ohjelmatuonnin jäsennin (prototyyppi) ----------
// Koodityyli: var-määrittelyt, function-lausekkeet, ei arrow-funktioita, ei let/const.
//
// Syöte: sivut, joissa jokainen rivi on taulukko tekstipaloja:
//   pages = [ [ [ {text, x, x1, font, size}, ... ], ... ], ... ]
// Rivit muodostetaan pdf.js:n getTextContent()-paloista y-koordinaatin perusteella
// (transform[5]); tämä on välttämätöntä, koska palojen luontijärjestys ei vastaa
// visuaalista rivijärjestystä.
//
// Tuloste: { program: {days, weeks}, review: [...], skipped: [...] }
// program-rakenne on täsmälleen sama kuin parseProgramCSV():n tuottama.

var PDF_COLUMN_GAP_MIN = 30;   // pt — pienin vaakaväli, joka tulkitaan sarakerajaksi
var PDF_COLUMN_TOL     = 4;    // pt — kuinka tarkasti tavoite osuu sarakeankkuriin
var PDF_PROSE_MAX_LEN  = 55;   // merkkiä — tätä pidemmät yksisarakkeiset rivit ovat ohjetekstiä

function rowText(items){
  var parts = [];
  items.forEach(function(it){ parts.push(it.text); });
  return parts.join(" ").replace(/\s+/g, " ").trim();
}

// Rungon perustyyli = yleisin fontti+koko-yhdistelmä. Otsikot tunnistetaan
// poikkeamana tästä, ei fontin nimen perusteella (nimet ovat dokumenttikohtaisia).
function detectBodyStyle(pages){
  var counts = {}, best = null, bestN = 0;
  pages.forEach(function(rows){
    rows.forEach(function(items){
      items.forEach(function(it){
        var key = it.font + "|" + it.size;
        counts[key] = (counts[key] || 0) + 1;
        if(counts[key] > bestN){ bestN = counts[key]; best = key; }
      });
    });
  });
  var split = (best || "|0").split("|");
  return { font: split[0], size: parseFloat(split[1]) };
}

// Tavoitesarakkeen x määritetään rivien suurimmista vaakaväleistä: liikkeen nimen
// sisäiset sanavälit ovat pieniä, nimen ja tavoitteen välinen väli on suuri.
function detectColumnX(pages){
  var counts = {}, best = 0, bestN = 0;
  pages.forEach(function(rows){
    rows.forEach(function(items){
      var i, gap, cand = 0, gapMax = 0;
      for(i = 1; i < items.length; i++){
        gap = items[i].x - items[i-1].x1;
        if(gap > gapMax){ gapMax = gap; cand = items[i].x; }
      }
      if(gapMax >= PDF_COLUMN_GAP_MIN){
        var key = String(Math.round(cand));
        counts[key] = (counts[key] || 0) + 1;
        if(counts[key] > bestN){ bestN = counts[key]; best = parseFloat(key); }
      }
    });
  });
  return bestN >= 3 ? best : null;
}

function isProseRow(text){
  if(/\s=\s/.test(text)) return true;          // "Cluster = ...", "PC = ..."
  if(/^-/.test(text)) return true;             // "-Tauot sarjojen välillä..."
  if(/[.!?]$/.test(text)) return true;         // "KATSO VIDEO TARKASTI."
  if(text.length > PDF_PROSE_MAX_LEN) return true;
  return false;
}

// Tavoitekentän tulkinta. Palauttaa aina objektin; tuntematon muoto merkitään
// review-lipulla eikä sitä arvata numeroiksi.
function parseTarget(raw){
  var text = (raw || "").trim();
  var out = { sets: "", reps: "", unit: "", notes: "", method: "", perSet: null,
              variant: "", kind: "plain", autoCalc: false, review: false, raw: text };
  if(!text){ out.review = true; return out; }

  var m;

  // "3x10 Merkkaa kuormat!" — erotetaan perässä oleva vapaa huomautus
  m = text.match(/^(.*?)(\s+[A-ZÄÖ][^0-9]*!)\s*$/);
  if(m){ out.notes = m[2].trim(); text = m[1].trim(); }

  // "3x10", "3x15/käsi", "3x12/puoli", "3x10+3", "2x10/jalka"
  m = text.match(/^(\d+)\s*[xX×]\s*(\d+)(\+\d+)?(?:\s*\/\s*([A-Za-zÄÖäö]+))?$/);
  if(m){
    out.sets = m[1];
    out.reps = m[2] + (m[3] || "");
    // "/jalka", "/käsi", "/puoli" on liikkeen variaatio, ei mittayksikkö: se
    // siirretään liikkeen nimeen, jotta ledger-rivi pysyy yksiselitteisenä.
    if(m[4]) out.variant = m[4];
    out.autoCalc = !m[3];                 // "10+3" = rest-pause/pakkotoisto → ei automatiikkaa
    if(m[3]){ out.method = "rest-pause/pakkotoisto"; out.kind = "restpause"; }
    return out;
  }

  // "2xCluster", "2x drop" — sarjamäärä tiedossa, toistotavoite menetelmäkohtainen
  m = text.match(/^(\d+)\s*[xX×]\s*([A-Za-zÄÖäö][A-Za-zÄÖäö\s]*)$/);
  if(m){
    out.sets = m[1];
    out.method = m[2].trim();
    out.kind = /cluster/i.test(m[2]) ? "cluster" : (/drop/i.test(m[2]) ? "drop" : "method");
    out.notes = (out.notes ? out.notes + " " : "") + m[2].trim();
    return out;
  }

  // "6, 10, 10" / "5, 10, 15" / "1, 3, 3" — sarjakohtaiset toistotavoitteet
  m = text.match(/^\d+(\s*,\s*\d+)+$/);
  if(m){
    var nums = text.split(",").map(function(s){ return s.trim(); });
    out.sets = String(nums.length);
    out.reps = nums.join(", ");
    out.perSet = nums;
    out.kind = "perset";
    out.autoCalc = true;
    return out;
  }

  // "15min", "20min"
  m = text.match(/^(\d+)\s*min$/i);
  if(m){ out.sets = "1"; out.reps = m[1]; out.unit = "min"; out.kind = "duration"; return out; }

  out.notes = (out.notes ? out.notes + " " : "") + text;
  out.review = true;
  return out;
}


// Ohjeteksti ei ole roskaa: "Cluster = ...", "drop = ...", "10+3 = ..." ovat juuri
// niiden rivien selitykset, joille laskuri ei osaa ehdottaa painoa. Ne kerätään
// määritelmiksi ja liitetään liikkeisiin, joiden method vastaa määriteltyä termiä.
function collectDefinitions(noteRows){
  var defs = [], current = null, prevY = null;
  // Rivivälien mediaani kertoo, milloin kyse on kappalerajasta eikä rivinvaihdosta.
  var gaps = [], i;
  for(i = 1; i < noteRows.length; i++){
    if(noteRows[i].y > noteRows[i-1].y) gaps.push(noteRows[i].y - noteRows[i-1].y);
  }
  gaps.sort(function(a, b){ return a - b; });
  var median = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 0;

  noteRows.forEach(function(row){
    var isBreak = prevY === null || row.y < prevY ||
                  (median > 0 && (row.y - prevY) > median * 1.5);
    prevY = row.y;
    if(isBreak) current = null;
    var m = row.text.match(/^([A-Za-zÄÖäö0-9+\-]{1,14})\s*=\s*(.+)$/);
    if(m){
      current = { term: m[1], text: m[2] };
      defs.push(current);
      return;
    }
    if(current){ current.text += " " + row.text; }
  });
  return defs;
}

function attachDefinitions(days, defs){
  var index = {};
  defs.forEach(function(d){ index[d.term.toLowerCase()] = d.text; });
  days.forEach(function(day){
    day.exercises.forEach(function(ex){
      var keys = [];
      if(ex.method) keys.push(ex.method.toLowerCase());
      if(/^10\+3$/.test(ex.reps || "")) keys.push("10+3");
      if(!ex.sets){
        var head = (ex.name || "").split(" ")[0].toLowerCase();
        if(head) keys.push(head);
      }
      var i;
      for(i = 0; i < keys.length; i++){
        if(index[keys[i]]){ ex.methodNote = index[keys[i]]; return; }
      }
    });
  });
}

function parseProgramPDF(pages, fileLabel, idPrefix){
  var body = detectBodyStyle(pages);
  var columnX = detectColumnX(pages);
  var prefix = idPrefix || "pdf-" + Date.now();

  var week = null;
  var days = [];
  var weeks = [];
  var review = [];
  var skipped = [];
  var currentDay = null;
  var counter = 0;

  var inProse = false;              // ohjelohko jatkuu sivunvaihdon yli; nollautuu osiootsikosta
  pages.forEach(function(rows){
    rows.forEach(function(items){
      if(!items.length) return;
      var text = rowText(items);
      if(!text) return;

      var wk = text.match(/^Viikko\s+(\d+)$/i);
      if(wk){ week = wk[1]; if(weeks.indexOf(week) === -1) weeks.push(week); return; }

      // Sarakejako tehdään ankkurin perusteella: tavoite alkaa aina tarkalleen
      // tavoitesarakkeen x-kohdasta. Pelkkä "x suurempi kuin raja" katkaisisi myös
      // pitkät yksisarakkeiset rivit, joiden loppuosa ulottuu rajan yli.
      var left = items, right = [], k;
      if(columnX !== null){
        for(k = 1; k < items.length; k++){
          if(Math.abs(items[k].x - columnX) <= PDF_COLUMN_TOL &&
             items[k-1].x1 <= columnX + PDF_COLUMN_TOL){
            left = items.slice(0, k);
            right = items.slice(k);
            break;
          }
        }
      }

      // Sarakejako hyväksytään vain, jos oikea puoli tosiaan jäsentyy tavoitteeksi.
      // Muuten kyse on yksisarakkeisesta rivistä, jonka sana sattui ankkurin kohdalle.
      var target = right.length ? parseTarget(rowText(right)) : null;
      if(target && target.review){ left = items; right = []; target = null; }

      if(right.length && left.length){
        if(inProse) return;
        var name = rowText(left);
        if(!currentDay){
          currentDay = { name: week ? "Viikko " + week + " · Ohjelma" : "Ohjelma",
                         week: week, exercises: [] };
          days.push(currentDay);
        }
        var ex = {
          id: prefix + "-" + (counter++),
          name: target.variant ? name + " (per " + target.variant + ")" : name,
          sets: target.sets,
          reps: target.reps,
          unit: target.unit,
          weight: "",
          notes: target.notes,
          kind: target.kind,
          intensity: null,
          method: target.method,
          perSet: target.perSet,
          autoCalc: target.autoCalc
        };
        currentDay.exercises.push(ex);
        if(target.review){
          review.push({ file: fileLabel, day: currentDay.name, name: name, raw: target.raw,
                        reason: "tavoitteen muotoa ei tunnistettu" });
        }
        return;
      }

      // Yksisarakkeinen rivi
      var isHeading = (items[0].size > body.size + 0.5) || (items[0].font !== body.font);
      if(isHeading && !/[.!?]$/.test(text)){
        currentDay = { name: (week ? "Viikko " + week + " · " : "") + text,
                       week: week, exercises: [] };
        days.push(currentDay);
        inProse = false;
        return;
      }

      if(inProse || isProseRow(text)){ inProse = true; skipped.push({ file: fileLabel, text: text, y: items[0].y }); return; }

      // Lyhyt yksisarakkeinen rivi liikelistan sisällä: PC-tikapuu, yhdistelmäfinisseri,
      // kestoperusteinen cardio. Otetaan mukaan, mutta ilman tavoitetta → tarkistuslistalle.
      if(currentDay){
        var dur = text.match(/^(.+?)\s+(\d+)\s*min$/i);
        if(dur){
          currentDay.exercises.push({
            id: prefix + "-" + (counter++), name: dur[1].trim(), sets: "1", reps: dur[2],
            unit: "min", weight: "", notes: "", kind: "duration", intensity: null,
            method: "", perSet: null, autoCalc: false
          });
          return;
        }
        currentDay.exercises.push({
          id: prefix + "-" + (counter++), name: text, sets: "", reps: "", unit: "",
          weight: "", notes: "", kind: "circuit", intensity: null, method: "", perSet: null,
          autoCalc: false
        });
        review.push({ file: fileLabel, day: currentDay.name, name: text, raw: "",
                      reason: "rivillä ei tavoitesaraketta" });
      } else {
        skipped.push({ file: fileLabel, text: text, y: items[0].y });
      }
    });
  });

  // Kansilehdeltä syntyneet tyhjät päivät pois
  days = days.filter(function(d){ return d.exercises.length > 0; });

  var definitions = collectDefinitions(skipped);
  attachDefinitions(days, definitions);

  // "skipped" ei ole hylättyä vaan ohjelman mukana kulkevaa ohjetekstiä.
  return { program: { days: days, weeks: weeks, notes: skipped, definitions: definitions },
           review: review, columnX: columnX, body: body };
}

  // ---------- PDF-tuonnin apurit ----------
  // pdf.js ladataan vasta kun käyttäjä valitsee PDF-tuonnin: kirjasto on iso
  // eikä CSV-tuonti tarvitse sitä lainkaan. Tiedostot ovat index.html:n
  // rinnalla samassa kansiossa, eivät CDN:ssä — ohjelman sisältö ei saa
  // lähteä laitteelta minnekään. ”Yksi tiedosto” on siis tässä kohtaa
  // ”yksi tiedosto plus kirjasto”, tietoinen kompromissi.
  var PDFJS_SRC = "pdf.min.js";
  var PDFJS_WORKER_SRC = "pdf.worker.min.js";
  var PDF_ROW_TOLERANCE = 3;   // pt — saman rivin palojen suurin y-ero
  var pdfjsLoadPromise = null;

  function loadPdfJs(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if(pdfjsLoadPromise) return pdfjsLoadPromise;
    pdfjsLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = PDFJS_SRC;
      s.onload = function(){
        if(!window.pdfjsLib){ pdfjsLoadPromise = null; reject(new Error("pdf.min.js latautui, mutta kirjastoa ei löytynyt.")); return; }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_SRC;
        resolve(window.pdfjsLib);
      };
      s.onerror = function(){
        pdfjsLoadPromise = null;
        reject(new Error("PDF-lukijaa ei voitu ladata. Varmista, että pdf.min.js ja pdf.worker.min.js ovat samassa kansiossa kuin index.html."));
      };
      document.head.appendChild(s);
    });
    return pdfjsLoadPromise;
  }

  // pdf.js palauttaa tekstipalat siinä järjestyksessä kuin ne on kirjoitettu
  // sivun sisältövirtaan, mikä ei vastaa visuaalista rivijärjestystä. Rivit
  // muodostetaan siksi y-koordinaatista (transform[5]) ja lajitellaan rivin
  // sisällä x:n mukaan (transform[4]) — tämä on koko jäsennyksen perusta.
  function groupItemsIntoRows(items){
    var pieces = [];
    items.forEach(function(item){
      if(!item.str || !item.str.trim()) return;
      var t = item.transform;
      // Fontin koko luetaan muunnosmatriisista; item.height ei kerro sitä
      // luotettavasti kaikilla tuottajaohjelmilla.
      var size = Math.sqrt(t[2]*t[2] + t[3]*t[3]);
      pieces.push({
        text: item.str.trim(),
        x: t[4],
        x1: t[4] + (item.width || 0),
        y: t[5],
        font: item.fontName || "",
        size: Math.round(size * 100) / 100
      });
    });
    // PDF:n y kasvaa ylöspäin, joten sivun ylin rivi on suurin y.
    pieces.sort(function(a, b){ return b.y - a.y; });
    var rows = [], current = null;
    pieces.forEach(function(p){
      if(!current || Math.abs(current.y - p.y) > PDF_ROW_TOLERANCE){
        current = { y: p.y, items: [] };
        rows.push(current);
      }
      current.items.push(p);
    });
    rows.forEach(function(r){ r.items.sort(function(a, b){ return a.x - b.x; }); });
    return rows.map(function(r){ return r.items; });
  }

  async function extractPdfPages(file){
    var lib = await loadPdfJs();
    var buffer = await file.arrayBuffer();
    var doc = await lib.getDocument({ data: new Uint8Array(buffer), isEvalSupported: false }).promise;
    var pages = [];
    var itemCount = 0;
    var i, page, content, rows;
    for(i = 1; i <= doc.numPages; i++){
      page = await doc.getPage(i);
      content = await page.getTextContent();
      rows = groupItemsIntoRows(content.items);
      rows.forEach(function(r){ itemCount += r.length; });
      pages.push(rows);
    }
    try{ await doc.destroy(); }catch(e){ /* ei kriittinen */ }
    if(itemCount === 0){
      // Skannattu PDF: sivulla on vain kuva, ei tekstikerrosta. Tätä ei saa
      // ohittaa hiljaa — muuten käyttäjä luulisi tuonnin vain epäonnistuneen.
      throw new Error("Tiedostossa ”" + file.name + "” ei ole tekstikerrosta — se näyttää olevan skannattu kuva. Sovellus lukee vain PDF-tiedostoja, joissa teksti on tekstinä. Käytä CSV-tuontia.");
    }
    return pages;
  }

  // review-rivit yhdistetään takaisin niihin liikkeisiin, joista ne syntyivät,
  // jotta ne voidaan näyttää oman treenipäivänsä kohdalla eikä vain erillisenä
  // listana irrallaan asiayhteydestä.
  function flagReviewRows(res){
    (res.review || []).forEach(function(item){
      var day = res.program.days.find(function(d){ return d.name === item.day; });
      if(!day) return;
      var ex = day.exercises.find(function(e){ return e.name === item.name && !e.needsReview; });
      if(ex){ ex.needsReview = item.reason; if(item.raw) ex.rawTarget = item.raw; }
    });
  }

  async function parseProgramPDFFiles(files){
    var stamp = Date.now();
    var merged = { days: [], weeks: [], notes: [], definitions: [] };
    var review = [];
    var fileIdx, file, pages, res, fallbackWeek;
    for(fileIdx = 0; fileIdx < files.length; fileIdx++){
      file = files[fileIdx];
      pages = await extractPdfPages(file);
      // Oma id-etuliite tiedostoa kohden: eri tiedostojen rivit eivät saa
      // törmätä toistensa id-numerointiin.
      res = parseProgramPDF(pages, file.name, "pdf-" + stamp + "-" + fileIdx);
      flagReviewRows(res);
      // Jos kansilehdellä ei ole viikkonumeroa, käytetään valintajärjestystä.
      fallbackWeek = String(fileIdx + 1);
      res.program.days.forEach(function(day){
        if(!day.week){
          day.week = fallbackWeek;
          day.name = "Viikko " + fallbackWeek + " · " + day.name;
        }
        if(merged.weeks.indexOf(day.week) === -1) merged.weeks.push(day.week);
        merged.days.push(day);
      });
      (res.program.notes || []).forEach(function(n){ merged.notes.push(n); });
      (res.program.definitions || []).forEach(function(d){ merged.definitions.push(d); });
      (res.review || []).forEach(function(r){ review.push(r); });
    }
    ensureProgramShape(merged);
    merged.weeks.sort(function(a, b){
      var na = parseInt(a, 10), nb = parseInt(b, 10);
      if(isFinite(na) && isFinite(nb) && na !== nb) return na - nb;
      return String(a).localeCompare(String(b), "fi");
    });
    return { program: merged, review: review };
  }

  // ---------- storage adapter ----------
  // Kokeilee järjestyksessä: Claude-tallennus -> selaimen oma tallennustila -> muisti.
  var storageMode = "claude";
  var memoryStore = {};
  var LOCAL_PREFIX = "treenipk:";

  function localAvailable(){
    try{
      if(typeof localStorage === "undefined" || !localStorage) return false;
      localStorage.setItem(LOCAL_PREFIX + "__t", "1");
      localStorage.removeItem(LOCAL_PREFIX + "__t");
      return true;
    }catch(e){ return false; }
  }
  function demoteStorage(err, silent){
    var msg = (err && err.message) ? err.message : String(err);
    if(storageMode === "claude"){
      storageMode = localAvailable() ? "local" : "memory";
    } else if(storageMode === "local"){
      storageMode = "memory";
    }
    state.storageMode = storageMode;
    if(!silent || storageMode === "memory"){
      state.lastError = msg;
      state.storageWarn = true;
    }
  }
  async function storeSet(key, value){
    if(storageMode === "claude"){
      try{
        var r = await window.storage.set(key, value, false);
        if(r) return r;
        throw new Error("Tyhjä vastaus tallennuksesta");
      }catch(e){ demoteStorage(e); }
    }
    if(storageMode === "local"){
      try{ localStorage.setItem(LOCAL_PREFIX + key, value); return { key: key, value: value }; }
      catch(e){ demoteStorage(e); }
    }
    memoryStore[key] = value;
    return { key: key, value: value };
  }
  async function storeGet(key){
    if(storageMode === "claude"){
      try{
        var r = await window.storage.get(key, false);
        return r || null;
      }catch(e){ return null; }
    }
    if(storageMode === "local"){
      try{
        var v = localStorage.getItem(LOCAL_PREFIX + key);
        return (v === null) ? null : { key: key, value: v };
      }catch(e){ return null; }
    }
    return memoryStore.hasOwnProperty(key) ? { key: key, value: memoryStore[key] } : null;
  }
  async function storeDelete(key){
    if(storageMode === "claude"){
      try{ return await window.storage.delete(key, false); }catch(e){ return null; }
    }
    if(storageMode === "local"){
      try{ localStorage.removeItem(LOCAL_PREFIX + key); return { key: key, deleted: true }; }catch(e){ return null; }
    }
    delete memoryStore[key];
    return { key: key, deleted: true };
  }
  async function storeList(prefix){
    if(storageMode === "claude"){
      try{
        var r = await window.storage.list(prefix, false);
        return { keys: (r && r.keys) || [] };
      }catch(e){ return { keys: [] }; }
    }
    if(storageMode === "local"){
      try{
        var out = [];
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k && k.indexOf(LOCAL_PREFIX) === 0){
            var bare = k.slice(LOCAL_PREFIX.length);
            if(!prefix || bare.indexOf(prefix) === 0) out.push(bare);
          }
        }
        return { keys: out };
      }catch(e){ return { keys: [] }; }
    }
    var mk = Object.keys(memoryStore).filter(function(k){ return !prefix || k.indexOf(prefix) === 0; });
    return { keys: mk };
  }

  // ---------- storage helpers ----------
  async function loadEntry(date){
    try{
      var res = await storeGet("entries:" + date);
      return (res && res.value) ? JSON.parse(res.value) : { date: date, exercises: {} };
    }catch(e){
      return { date: date, exercises: {} };
    }
  }
  async function buildExerciseLogIndex(){
    // Kokoaa jokaiselle liikkeen id:lle sen päivän, jolle liike on viimeksi
    // tallennettu, käymällä läpi koko historian (sama kuvio kuin
    // computeDefaultActiveWeek/buildAllOneRepMaxSeries jo tekevät). Jos sama
    // id löytyy useammalta päivältä (esim. merkintä korjattu jälkikäteen
    // takautuvalla päivämäärällä), viimeisin päivämäärä voittaa.
    var index = {};
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          index[ek] = { date: date, data: entry.exercises[ek] };
        }
      }
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return index;
  }

    return list;

  function knownExerciseNames(){
    // Kaikki sovelluksen tuntemat liikenimet: ohjelma, käsin lisätyt sekä
    // historiassa olevat nimet. Historian nimet ovat mukana siksi, että juuri
    // niiden kohdalla eri kirjoitusasu aloittaisi historian huomaamatta alusta.
    var seen = {};
    var names = [];
    function lisaa(display){
      var norm = normalizeName(display);
      if(!norm || seen[norm]) return;
      seen[norm] = true;
      names.push(display);
    }
    allExercises().forEach(function(ex){ if(ex && ex.name) lisaa(ex.name); });
    Object.keys(state.lastSet).forEach(function(norm){ lisaa(capitalize(norm)); });
    Object.keys(state.manualMax).forEach(function(norm){ lisaa(capitalize(norm)); });
    names.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return names;
  }

  function levenshtein(a, b){
    // Tavallinen muokkausetäisyys yhdellä vierivällä rivillä.
    var la = a.length, lb = b.length;
    if(la === 0) return lb;
    if(lb === 0) return la;
    var row = [];
    var i, j;
    for(j=0;j<=lb;j++){ row[j] = j; }
    for(i=1;i<=la;i++){
      var prev = row[0];
      row[0] = i;
      for(j=1;j<=lb;j++){
        var temp = row[j];
        var cost = (a.charAt(i-1) === b.charAt(j-1)) ? 0 : 1;
        var min = row[j] + 1;
        if(row[j-1] + 1 < min) min = row[j-1] + 1;
        if(prev + cost < min) min = prev + cost;
        row[j] = min;
        prev = temp;
      }
    }
    return row[lb];
  }

  // ”(per jalka)” / ”(per käsi)” on PDF-tuonnin lisäämä variaatiomerkintä,
  // ei osa liikkeen nimeä. Ilman karsintaa etäisyysraja ei koskaan tavoittaisi
  // historiassa olevaa samaa liikettä ilman päätettä.
  function stripPerSuffix(s){
    return String(s == null ? "" : s).replace(/\s*\(per\s+[^)]*\)\s*$/i, "").trim();
  }

  function findSimilarName(input, candidates){
    var target = normalizeName(stripPerSuffix(input));
    if(!target || !candidates || !candidates.length) return null;
    var i;
    var norms = [];
    for(i=0;i<candidates.length;i++){
      var norm = normalizeName(stripPerSuffix(candidates[i]));
      if(norm === target) return null;
      norms.push(norm);
    }
    // Pelkkä välilyöntien ero, esim. "Peckdeck" vs. "Peck deck".
    var targetTight = target.replace(/\s+/g, "");
    for(i=0;i<candidates.length;i++){
      if(norms[i].replace(/\s+/g, "") === targetTight) return candidates[i];
    }
    var best = null, bestNorm = "", bestDist = 0;
    for(i=0;i<candidates.length;i++){
      var dist = levenshtein(target, norms[i]);
      if(best === null || dist < bestDist){ best = candidates[i]; bestNorm = norms[i]; bestDist = dist; }
    }
    if(best === null) return null;
    var longer = Math.max(target.length, bestNorm.length);
    var limit = (longer >= 6) ? 2 : 1;
    return (bestDist <= limit) ? best : null;
  }
