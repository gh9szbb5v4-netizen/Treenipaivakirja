  // ---------------------------------------------------------------------------
  // Tallennusavain käyttäjän itse lisäämille liikkeille. Sama nimeämiskaava
  // kuin muilla STORAGE_*_KEY-vakioilla (STORAGE_PROGRAM_KEY,
  // STORAGE_MANUAL_MAX_KEY jne.) — lisää tämä samaan kohtaan niiden kanssa.
  // ---------------------------------------------------------------------------
  var STORAGE_USER_EXERCISES_KEY = "user-exercises";

  // ---------------------------------------------------------------------------
  // Hakufunktiot katalogin päälle. Kaikki lukevat AINA allExerciseVariants()-
  // funktion kautta, ei koskaan suoraan EXERCISE_VARIANTS:sta, jotta käyttäjän
  // itse lisäämät liikkeet näkyvät kaikkialla samalla tavalla kuin valmiit.
  // Ei arrow-funktioita, ei let/const — sama tyyli kuin muualla index.html:ssä.
  // ---------------------------------------------------------------------------

  function normLiikeName(s){
    return String(s || "").trim().toLowerCase();
  }

  // state.userExercises alustetaan tyhjäksi taulukoksi state-oliossa ja
  // ladataan storeGet(STORAGE_USER_EXERCISES_KEY):lla init()-funktiossa,
  // samaan tapaan kuin state.manualMax jo ladataan.
  function allExerciseVariants(){
    return EXERCISE_VARIANTS.concat(state.userExercises || []);
  }

  function knownBaseExerciseNames(){
    var seen = {};
    var names = [];
    allExerciseVariants().forEach(function(row){
      var key = normLiikeName(row.liike);
      if(!seen[key]){ seen[key] = true; names.push(row.liike); }
    });
    names.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return names;
  }

  function variantRowsForLiike(liike){
    var key = normLiikeName(liike);
    return allExerciseVariants().filter(function(row){ return normLiikeName(row.liike) === key; });
  }

  // hasPlain: onko liikkeellä myös rivi ilman variaatiota (esim.
  // "Kyykky, etu, Smith-laitteessa" perusversio Pysäytyksin-variantin rinnalla).
  function variaatioOptionsFor(liike){
    var rows = variantRowsForLiike(liike);
    var seen = {};
    var options = [];
    var hasPlain = false;
    rows.forEach(function(row){
      if(!row.variaatio){ hasPlain = true; return; }
      if(!seen[row.variaatio]){ seen[row.variaatio] = true; options.push(row.variaatio); }
    });
    return { options: options, hasPlain: hasPlain };
  }

  function lisavariaatioOptionsFor(liike, variaatio){
    var key = normLiikeName(liike);
    var rows = allExerciseVariants().filter(function(row){
      return normLiikeName(row.liike) === key && row.variaatio === variaatio;
    });
    var seen = {};
    var options = [];
    var hasPlain = false;
    rows.forEach(function(row){
      if(!row.lisavariaatio){ hasPlain = true; return; }
      if(!seen[row.lisavariaatio]){ seen[row.lisavariaatio] = true; options.push(row.lisavariaatio); }
    });
    return { options: options, hasPlain: hasPlain };
  }

  function findVariantRow(liike, variaatio, lisavariaatio){
    var key = normLiikeName(liike);
    var rows = allExerciseVariants();
    for(var i=0;i<rows.length;i++){
      var row = rows[i];
      if(normLiikeName(row.liike) === key &&
         (row.variaatio || null) === (variaatio || null) &&
         (row.lisavariaatio || null) === (lisavariaatio || null)){
        return row;
      }
    }
    return null;
  }

  function composeVariantName(liike, variaatio, lisavariaatio){
    var name = liike;
    if(variaatio) name += ", " + variaatio;
    if(lisavariaatio) name += ", " + lisavariaatio;
    return name;
  }

  // Tunnistaa liikkeen nimestä (ohjelman ex.name) vastaavan katalogirivin,
  // jotta tietopalkki ja variaatiovalitsin osaavat esitäyttyä oikein myös
  // silloin kun liike on jo aiemmin vaihdettu variaatioksi.
  function resolveCatalogMatch(name){
    var trimmed = String(name || "").trim();
    if(!trimmed) return null;
    var normTarget = normLiikeName(trimmed);
    var rows = allExerciseVariants();
    for(var i=0;i<rows.length;i++){
      var row = rows[i];
      var composed = composeVariantName(row.liike, row.variaatio, row.lisavariaatio);
      if(normLiikeName(composed) === normTarget){
        return { liike: row.liike, variaatio: row.variaatio, lisavariaatio: row.lisavariaatio };
      }
    }
    var baseNames = knownBaseExerciseNames();
    for(var j=0;j<baseNames.length;j++){
      if(normLiikeName(baseNames[j]) === normTarget){
        return { liike: baseNames[j], variaatio: null, lisavariaatio: null };
      }
    }
    return null;
  }

  // Lisää käyttäjän itse kirjoittaman uuden liikkeen/variaation paikalliseen,
  // laitekohtaiseen listaan ja tallentaa sen selaimen tallennustilaan. Ei
  // KOSKAAN kirjoita EXERCISE_VARIANTS-vakioon — se pysyy kehittäjän
  // ylläpitämänä lähtödatana riippumatta siitä, mitä käyttäjä lisää ajossa.
  // row: { liike (pakollinen), variaatio, lisavariaatio, lihasryhma } — vain
  // liike on pakollinen, loput saa jättää null/tyhjäksi.
  async function addUserExerciseVariant(row){
    var clean = {
      liike: String((row && row.liike) || "").trim(),
      variaatio: (row && row.variaatio) ? String(row.variaatio).trim() : null,
      lisavariaatio: (row && row.lisavariaatio) ? String(row.lisavariaatio).trim() : null,
      lihasryhma: (row && row.lihasryhma) ? String(row.lihasryhma).trim() : null
    };
    if(!clean.liike) return null;
    if(!state.userExercises) state.userExercises = [];
    state.userExercises.push(clean);
    try{ await storeSet(STORAGE_USER_EXERCISES_KEY, JSON.stringify(state.userExercises)); }
    catch(e){ /* hiljainen virhe — liike jää silti käyttöön tämän istunnon ajaksi */ }
    return clean;
  }

  // ---------- actions ----------
  // Yhteinen tallennuspolku kaikille tuontireiteille (CSV-tuonti ja PDF-tuonnin
  // tarkistusnäkymän "Valmis"): ohjelma otetaan käyttöön täsmälleen samalla
  // tavalla riippumatta siitä, mistä rakenne on peräisin. Ei uutta
  // tallennuslogiikkaa — sama saveProgram() kuin ennenkin.
  async function applyImportedProgram(program, successMessage){
    var isFirstImport = !state.program;
    // Verrataan tuodun ohjelman liikenimiä historiassa jo oleviin nimiin: eri
    // kirjoitusasu aloittaisi historian huomaamatta alusta. Vain huomautus,
    // mitään ei nimetä uudelleen automaattisesti.
    state.importNameWarnings = [];
    var historyNorms = {};
    Object.keys(state.lastSet).forEach(function(norm){ historyNorms[normalizeName(norm)] = true; });
    Object.keys(state.manualMax).forEach(function(norm){ historyNorms[normalizeName(norm)] = true; });
    var historyNames = Object.keys(historyNorms).map(function(norm){ return capitalize(norm); });
    if(historyNames.length){
      historyNames.sort(function(a, b){ return a.localeCompare(b, "fi"); });
      var seenImport = {};
      program.days.forEach(function(day){
        (day.exercises || []).forEach(function(ex){
          var impName = (ex.name || "").trim();
          if(!impName) return;
          var impNorm = normalizeName(impName);
          if(!impNorm || seenImport[impNorm] || historyNorms[impNorm]) return;
          seenImport[impNorm] = true;
          var match = findSimilarName(impName, historyNames);
          if(match){ state.importNameWarnings.push({ imported: impName, historical: match }); }
        });
      });
    }
    state.program = program;
    state.manualExercises = [];
    state.draftSets = {};
    state.dirtySets = {};
    state.openExercise = null;
    state.showAllWeeks = false;
    state.showProgramNotes = false;
    state.builder = null;
    await saveProgram();
    await computeDefaultActiveWeek();
    state.todayEntry = await loadEntry(state.draftDate);
    state.exerciseLogIndex = await buildExerciseLogIndex();
    state.view = "ohjelma";
    showToast(successMessage || "Ohjelma tuotu onnistuneesti");
    if(isFirstImport && !state.homescreenHintDismissed && !isStandaloneDisplay()){ state.showHomescreenHint = true; }
    if(isFirstImport){
      // Varmuuskopiomuistutuksen kello lähtee käyntiin ensimmäisestä
      // tuonnista, ei tyhjästä — muuten muistutus ei koskaan laukeaisi
      // käyttäjälle, joka ei ole vielä kertaakaan vienyt merkintöjään.
      state.lastExportDate = todayISO();
      try{ await storeSet(STORAGE_LAST_EXPORT_KEY, state.lastExportDate); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
    }
    render();
  }

  async function handleFile(file){
    var text;
    try{ text = await readFileAsText(file); }
    catch(e){ showToast("Tiedoston luku epäonnistui"); return; }
    try{
      var program = parseProgramCSV(text);
      state.pdfImport = null;
      state.pdfImportError = null;
      await applyImportedProgram(program, "Ohjelma tuotu onnistuneesti");
    }catch(err){
      showToast(err.message || "CSV:n luku epäonnistui");
    }
  }

  // PDF-tuonti ei tallenna suoraan: jäsennystulos viedään tarkistusnäkymään,
  // jossa käyttäjä hyväksyy tai korjaa rivit. Vasta "Valmis" tallentaa.
  async function handlePdfFiles(files){
    state.pdfImportError = null;
    showToast("Luetaan PDF-tiedostoja…", 6000);
    var res;
    try{ res = await parseProgramPDFFiles(files); }
    catch(err){
      state.pdfImportError = (err && err.message) ? err.message : "PDF:n luku epäonnistui.";
      showToast("PDF:n luku epäonnistui");
      render();
      return;
    }
    if(!res.program.days.length){
      // Tyhjää tulosta ei viedä tarkistusnäkymään lainkaan: käyttäjälle
      // kerrotaan suoraan, ettei tiedostosta löytynyt ohjelmaa.
      state.pdfImportError = "PDF:stä ei löytynyt yhtään liikettä. Ohjelma voi olla muodossa, jota jäsennin ei tunnista, tai teksti voi olla kuvana. Voit tuoda ohjelman CSV-tiedostona tai rakentaa sen käsin.";
      showToast("PDF:stä ei löytynyt liikkeitä");
      render();
      return;
    }
    state.pdfImport = {
      program: res.program,
      review: res.review,
      files: files.map(function(f){ return f.name; })
    };
    state.view = "tuonti";
    showToast("Tarkista jäsennetty ohjelma ennen tallennusta", 4000);
    render();
  }

  async function savePdfImport(){
    if(!state.pdfImport) return;
    var program = state.pdfImport.program;
    // Käyttäjä on nyt nähnyt ja hyväksynyt tarkistuslistan rivit, joten
    // väliaikainen merkintä poistetaan ennen tallennusta.
    program.days.forEach(function(day){
      day.exercises.forEach(function(ex){ delete ex.needsReview; delete ex.rawTarget; });
    });
    state.pdfImport = null;
    state.pdfImportError = null;
    await applyImportedProgram(program, "Ohjelma tallennettu");
  }

  function cancelPdfImport(){
    state.pdfImport = null;
    state.pdfImportError = null;
    state.view = "ohjelma";
    render();
  }

  function removePdfReviewExercise(dayIdx, exIdx){
    if(!state.pdfImport) return;
    var day = state.pdfImport.program.days[dayIdx];
    if(!day) return;
    day.exercises.splice(exIdx, 1);
    // Tyhjäksi jäänyt treenipäivä poistetaan, jottei ohjelmaan tallennu
    // päiviä joissa ei ole yhtään liikettä.
    if(!day.exercises.length) state.pdfImport.program.days.splice(dayIdx, 1);
    render();
  }

  // ---------- Ohjelman rakentaminen sovelluksessa ----------
  // Vaihtoehto CSV- ja PDF-tuonnille: käyttäjä kokoaa ohjelman viikoista,
  // treenipäivistä ja liikkeistä suoraan sovelluksessa. Luonnos elää vain
  // state.builder-kentässä, ja ”Valmis” kokoaa siitä täsmälleen samanmuotoisen
  // rakenteen kuin parseProgramCSV() tuottaa ja tallentaa sen samaa
  // applyImportedProgram()-polkua pitkin — ei omaa tallennuslogiikkaa.
  function newBuilderExercise(name){
    // Yksikkö on valmiiksi ”toistoa”, koska se on ohjelmien yleisin tapaus;
    // kenttä on silti vapaasti muokattavissa (esim. ”min”, ”käsi”).
    return { name: name, sets: "", reps: "", unit: "toistoa", teho: "" };
  }
  // Uuden viikon ja treenipäivän oletusnimi on ensimmäinen vapaa numero: kaksi
  // samannimistä viikkoa tekisi viikkovalitsimesta arvaamattoman ja kaksi
  // samannimistä päivää törmäisi dayKey():n kautta samaan avaimeen.
  function nextBuilderWeekLabel(weeks){
    var used = {};
    weeks.forEach(function(w){ used[String(w.label || "").trim()] = true; });
    var n = 1;
    while(used[String(n)]) n++;
    return String(n);
  }
  function nextBuilderDayName(week){
    var used = {};
    week.days.forEach(function(d){ used[String(d.name || "").trim()] = true; });
    var n = 1;
    while(used["Päivä " + n]) n++;
    return "Päivä " + n;
  }
  function newBuilderWeek(label){
    var week = { label: label, days: [] };
    week.days.push({ name: nextBuilderDayName(week), exercises: [] });
    return week;
  }
  function startProgramBuilder(){
    state.builder = { weeks: [ newBuilderWeek("1") ], picker: null };
    state.pdfImportError = null;
    state.view = "rakenna";
    render();
  }
  function cancelProgramBuilder(){
    state.builder = null;
    state.view = "ohjelma";
    render();
  }
  function builderAddWeek(){
    var b = state.builder;
    if(!b) return;
    b.weeks.push(newBuilderWeek(nextBuilderWeekLabel(b.weeks)));
    b.picker = null;
    render();
  }
  // Treeniohjelman viikot toistuvat lähes aina samanlaisina, joten viikon
  // monistaminen säästää suurimman osan käsin naputtelusta.
  function builderDuplicateWeek(wi){
    var b = state.builder;
    if(!b || !b.weeks[wi]) return;
    b.weeks.push({
      label: nextBuilderWeekLabel(b.weeks),
      days: b.weeks[wi].days.map(function(day){
        return { name: day.name, exercises: day.exercises.map(function(ex){ return Object.assign({}, ex); }) };
      })
    });
    b.picker = null;
    render();
  }
  function builderRemoveWeek(wi){
    var b = state.builder;
    // Viimeistä viikkoa ei poisteta: ohjelmassa on aina vähintään yksi viikko,
    // johon liikkeitä voi lisätä.
    if(!b || b.weeks.length <= 1 || !b.weeks[wi]) return;
    b.weeks.splice(wi, 1);
    b.picker = null;
    render();
  }
  function builderAddDay(wi){
    var b = state.builder;
    if(!b || !b.weeks[wi]) return;
    b.weeks[wi].days.push({ name: nextBuilderDayName(b.weeks[wi]), exercises: [] });
    b.picker = null;
    render();
  }
  function builderRemoveDay(wi, di){
    var b = state.builder;
    if(!b || !b.weeks[wi] || !b.weeks[wi].days[di]) return;
    b.weeks[wi].days.splice(di, 1);
    b.picker = null;
    render();
  }
  function builderRemoveExercise(wi, di, ei){
    var b = state.builder;
    var day = b && b.weeks[wi] && b.weeks[wi].days[di];
    if(!day) return;
    day.exercises.splice(ei, 1);
    render();
  }
  function builderOpenPicker(wi, di){
    if(!state.builder) return;
    state.builder.picker = { wi: wi, di: di, liike: null, variaatio: null, lisavariaatio: null,
      variaatioTouched: false, lisavariaatioTouched: false, free: false, freeName: "", nameHint: null };
    render();
  }
  function builderClosePicker(){
    if(state.builder) state.builder.picker = null;
    render();
  }
  // Valitun liikkeen nimi: joko katalogin liike variaatioineen tai vapaa teksti.
  // Liikelista on ehdotus, ei rajoite — nimi saa aina olla mikä tahansa.
  function builderPickerName(){
    var p = state.builder && state.builder.picker;
    if(!p) return "";
    if(p.free) return String(p.freeName || "").trim();
    if(!p.liike) return "";
    return composeVariantName(p.liike, p.variaatio, p.lisavariaatio);
  }
  function builderPickerValid(){
    var p = state.builder && state.builder.picker;
    if(!p) return false;
    if(p.free) return !!String(p.freeName || "").trim();
    if(!p.liike) return false;
    // Sama sääntö kuin liikkeen vaihdossa: valinta kelpaa vasta kun sitä
    // vastaava rivi löytyy katalogista.
    return !!findVariantRow(p.liike, p.variaatio, p.lisavariaatio);
  }
  function builderAddExercise(){
    var b = state.builder;
    var p = b && b.picker;
    if(!p || !builderPickerValid()) return;
    var day = b.weeks[p.wi] && b.weeks[p.wi].days[p.di];
    if(!day) return;
    day.exercises.push(newBuilderExercise(builderPickerName()));
    b.picker = null;
    render();
  }
  // Kokoaa luonnoksesta täsmälleen samanmuotoisen rakenteen kuin
  // parseProgramCSV(): samat kentät samassa muodossa ja oma id-etuliite tälle
  // tuonnille. Liikkeettömät päivät ja viikot jätetään pois. Palauttaa
  // virhetekstin, jos ohjelmaa ei voi tallentaa.
  function builderProgramFromDraft(){
    var b = state.builder;
    if(!b) return { error: "Ohjelmaa ei ole rakenteilla." };
    var prefix = "ex-" + Date.now();
    var days = [];
    var weekOrder = [];
    var seenWeek = {};
    var idx = 0;
    for(var wi=0; wi<b.weeks.length; wi++){
      var week = b.weeks[wi];
      var weekLabel = String(week.label || "").trim();
      if(!weekLabel) return { error: (wi+1) + ". viikolta puuttuu nimi." };
      var weekDays = [];
      var seenDay = {};
      for(var di=0; di<week.days.length; di++){
        var day = week.days[di];
        var dayLabel = String(day.name || "").trim();
        if(!dayLabel) return { error: "Viikon " + weekLabel + " " + (di+1) + ". treenipäivältä puuttuu nimi." };
        if(seenDay[dayLabel]) return { error: "Viikossa " + weekLabel + " on kaksi treenipäivää nimellä ”" + dayLabel + "”." };
        seenDay[dayLabel] = true;
        if(!day.exercises.length) continue;
        weekDays.push({
          name: "Viikko " + weekLabel + " · " + dayLabel,
          week: weekLabel,
          exercises: day.exercises.map(function(ex){
            var built = {
              id: prefix + "-" + idx,
              name: String(ex.name || "").trim() || "Nimetön liike",
              sets: String(ex.sets == null ? "" : ex.sets).trim(),
              reps: String(ex.reps == null ? "" : ex.reps).trim(),
              unit: String(ex.unit == null ? "" : ex.unit).trim(),
              weight: "",
              notes: "",
              intensity: parseIntensity(ex.teho),
              // Rakentajan liike on aina tavallinen sarjat × toistot -liike,
              // kuten CSV-rivikin: painolaskuri saa ehdottaa painoa.
              kind: "plain",
              autoCalc: true
            };
            idx++;
            return built;
          })
        });
      }
      if(!weekDays.length) continue;
      if(seenWeek[weekLabel]) return { error: "Viikon nimi ”" + weekLabel + "” esiintyy kahdesti. Anna jokaiselle viikolle oma nimi." };
      seenWeek[weekLabel] = true;
      weekOrder.push(weekLabel);
      days = days.concat(weekDays);
    }
    if(!days.length) return { error: "Lisää ohjelmaan vähintään yksi liike ennen tallennusta." };
    return { program: { days: days, weeks: weekOrder } };
  }
  async function saveProgramBuilder(){
    var res = builderProgramFromDraft();
    if(res.error){ showToast(res.error, 4000); return; }
    state.builder = null;
    state.pdfImportError = null;
    await applyImportedProgram(res.program, "Ohjelma tallennettu");
  }

  async function toggleExercise(id){
    if(state.openExercise === id){
      var openEx = findExerciseById(id);
      if(openEx && !isExerciseFullyDone(openEx, id)){
        showToast("Merkitse kaikki sarjat valmiiksi ennen sulkemista");
        return;
      }
      await completeAndAdvance(id);
      return;
    }
    var ex = findExerciseById(id);
    if(!ex) return;
    state.openExercise = id;
    if(!state.draftSets[id] || !state.dirtySets[id]){
      // exerciseLogIndex kattaa merkinnän riippumatta siitä, minä päivänä se on
      // tallennettu — sama liike avataan aina valmiiksi merkittynä, ei vain
      // silloin kun se sattuu olemaan tallennettu juuri tälle valitulle päivälle.
      var logged = state.exerciseLogIndex[id];
      var existing = logged && logged.data;
      if(existing && existing.sets && existing.sets.length){
        // Aiemmin tallennettu merkintä: sarjat näytetään jo valmiiksi merkittyinä,
        // mutta arvoja voi silti muokata (ks. isRowDoneEligible/data-set-field).
        state.draftSets[id] = existing.sets.map(function(s){ return Object.assign({}, s, { done: true }); });
        state.autoCalcInfo[id] = { type:"saved", date: logged.date };
      } else {
        state.draftSets[id] = buildDraftRows(ex, id);
      }
    }
    render();
  }

  function isCombo(name){
    return String(name).indexOf("/") !== -1;
  }
  function exerciseRequiresWeightForDone(ex){
    // Yhdistelmäliikkeet (esim. "Cardiolaite / Punnerrus / Burpee, 12 min") eivät
    // muutenkaan kuulu painoon perustuvaan logiikkaan (ks. lastSet/1RM-käsittely),
    // joten niille "kirjattu" tarkoittaa samaa kuin saveExerciseLog:n data-tarkistus.
    // Sama koskee kiertoharjoittelua ja kestoperusteisia liikkeitä (kind), joille
    // PDF-ohjelma ei anna painotavoitetta lainkaan — niissä kirjaus on vapaata
    // tekstiä, eikä paino saa estää sarjan merkitsemistä valmiiksi.
    if(ex.kind === "circuit" || ex.kind === "duration") return false;
    return !isCombo(ex.name);
  }
  function isRowDoneEligible(ex, row){
    return exerciseRequiresWeightForDone(ex) ? !!row.weight : !!(row.weight || row.reps || row.notes);
  }
  function isExerciseFullyDone(ex, id){
    var rows = state.draftSets[id];
    if(!rows || !rows.length) return false;
    for(var i=0;i<rows.length;i++){ if(!rows[i].done) return false; }
    return true;
  }
  function isExerciseLogged(ex){
    // Liike on merkitty tehdyksi riippumatta siltä, minä päivänä se on
    // tallennettu — vuorokauden vaihtuminen ei saa "unohtaa" jo tehtyä treeniä.
    return !!(state.exerciseLogIndex && state.exerciseLogIndex[ex.id]);
  }
  function isDayFullyDone(day){
    // Koko treenipäivä lasketaan tehdyksi kun jokainen sen liike löytyy
    // exerciseLogIndexistä eli on tallennettu jollekin päivälle — ei väliä
    // onko se sama päivä kuin nyt valittu draftDate.
    if(!day.exercises || !day.exercises.length) return false;
    for(var i=0;i<day.exercises.length;i++){ if(!isExerciseLogged(day.exercises[i])) return false; }
    return true;
  }
  function dayKey(day){
    return String(day.week) + "|" + day.name;
  }
  function isProgramExercise(id){
    // Vain ohjelmaan kuuluvan liikkeen voi vaihtaa; käsin lisätyt ovat kertaluontoisia.
    if(!state.program) return false;
    for(var i=0;i<state.program.days.length;i++){
      var list = state.program.days[i].exercises;
      for(var j=0;j<list.length;j++){ if(list[j].id === id) return true; }
    }
    return false;
  }
  function programExerciseOccurrences(name){
    // Sama liike toistuu tyypillisesti joka viikolla, joten vaihto voi koskea
    // yhtä kohtaa tai kaikkia saman nimisiä.
    var norm = String(name).trim().toLowerCase();
    var list = [];
    if(state.program){
      state.program.days.forEach(function(day){
        day.exercises.forEach(function(ex){
          if(String(ex.name).trim().toLowerCase() === norm) list.push(ex);
        });
      });
    }
    return list;
  }
  async function swapProgramExercise(id){
    // Ohut kääre: lukee lomakkeen kentät ja jättää varsinaisen vaihtologiikan
    // applyExerciseSwap:lle, jota myös ohjattu variaatiovalinta käyttää.
    var input = document.getElementById("swap-name-input");
    var newName = input ? input.value.trim() : "";
    if(!newName){ showToast("Kirjoita liikkeen nimi"); return; }
    var allWeeksEl = document.getElementById("swap-all-weeks");
    await applyExerciseSwap(id, newName, !!(allWeeksEl && allWeeksEl.checked));
  }

  async function applyExerciseSwap(id, newName, allWeeks){
    var ex = findExerciseById(id);
    if(!ex) return;
    var oldName = ex.name;
    if(newName.toLowerCase() === String(oldName).trim().toLowerCase()){
      state.swapExercise = null;
      render();
      return;
    }
    var targets = allWeeks ? programExerciseOccurrences(oldName) : [ex];
    var stamp = Date.now();
    var newId = null;
    targets.forEach(function(target, i){
      // Uusi id jokaiselle vaihdetulle kohdalle: vanhaan id:hen sidottu tämän
      // päivän merkintä ei saa siirtyä uudelle liikkeelle, vaan jää historiaan
      // vanhalla nimellään. Samalla siivotaan vanhan id:n väliaikainen tila.
      var targetId = "swap-" + stamp + "-" + i;
      delete state.draftSets[target.id];
      delete state.dirtySets[target.id];
      delete state.autoCalcInfo[target.id];
      if(target.id === id) newId = targetId;
      target.id = targetId;
      target.name = newName;
    });
    await saveProgram();
    state.swapExercise = null;
    // Vaihdettu liike jää auki, mutta sarjat lasketaan uudelleen uudelle nimelle.
    state.openExercise = newId;
    var swapped = newId ? findExerciseById(newId) : null;
    if(swapped) state.draftSets[newId] = buildDraftRows(swapped, newId);
    showToast(targets.length > 1 ? "Liike vaihdettu " + targets.length + " kohdassa" : "Liike vaihdettu");
    render();
  }

  function getExerciseGroupList(id){
    if(state.program){
      for(var i=0;i<state.program.days.length;i++){
        var day = state.program.days[i];
        for(var j=0;j<day.exercises.length;j++){ if(day.exercises[j].id === id) return day.exercises; }
      }
    }
    for(var k=0;k<state.manualExercises.length;k++){ if(state.manualExercises[k].id === id) return state.manualExercises; }
    return null;
  }
  // Sarjakohtainen toistotavoite ("6, 10, 10") ohittaa yhteisen reps-arvon.
  function draftRepsFor(ex, idx){
    if(ex.perSet && ex.perSet.length){
      return ex.perSet[idx] !== undefined ? ex.perSet[idx] : ex.perSet[ex.perSet.length - 1];
    }
    return ex.reps || "";
  }
  function draftRowCount(ex){
    var explicit = parseInt(ex.sets, 10);
    if(explicit && explicit > 0) return explicit;
    if(ex.perSet && ex.perSet.length) return ex.perSet.length;
    return 1;
  }
  function buildDraftRows(ex, id){
    var explicitCount = parseInt(ex.sets, 10);

    // autoCalc === false: tavoite on menetelmäkohtainen (rest-pause, cluster,
    // drop) eikä siihen voi laskea painoa kaavalla. Väärä ehdotus on pahempi
    // kuin tyhjä kenttä, joten mitään ei ehdoteta. Vanhoissa, ennen PDF-tuontia
    // tallennetuissa ohjelmissa kenttää ei ole lainkaan, joten vain
    // nimenomainen false estää laskennan.
    if(ex.autoCalc === false){
      delete state.autoCalcInfo[id];
      var manualRows = [];
      var mc = draftRowCount(ex);
      for(var mi=0; mi<mc; mi++){ manualRows.push({ weight:"", reps: draftRepsFor(ex, mi), notes:"", done:false }); }
      return manualRows;
    }

    // Liikkeet, joille on määritelty teho (MAX tai prosentti), eivät kuulu
    // toistopainolaskurin progressiologiikkaan: niiden painoehdotus perustuu
    // aina liikkeen manuaalisesti syötettyyn 1RM-arvoon.
    if(ex.intensity){
      var percents = !ex.intensity.isMax ? ex.intensity.percents : [];
      var count = (explicitCount && explicitCount > 0) ? explicitCount : (percents.length || 1);
      var maxEntry = state.manualMax[ex.name.trim().toLowerCase()];
      var usedMax = false;
      var maxRows = [];
      for(var i=0;i<count;i++){
        var weightVal = "";
        if(maxEntry && isFinite(maxEntry.weight)){
          if(ex.intensity.isMax){
            weightVal = String(maxEntry.weight);
          } else {
            var pct = percents.length ? (percents[i] !== undefined ? percents[i] : percents[percents.length-1]) : null;
            if(pct !== null) weightVal = String(roundToStep(maxEntry.weight * pct / 100, 2.5));
          }
          usedMax = true;
        }
        maxRows.push({ weight: weightVal, reps: draftRepsFor(ex, i), notes: "", done: false });
      }
      if(usedMax){ state.autoCalcInfo[id] = { type:"max", weight: maxEntry.weight, isMax: ex.intensity.isMax, percents: percents }; }
      else{ delete state.autoCalcInfo[id]; }
      return maxRows;
    }

    var count2 = draftRowCount(ex);

    if(!isCombo(ex.name)){
      var normName = ex.name.trim().toLowerCase();
      var last = state.lastSet[normName];
      if(last && last.sets && last.sets.length){
        var refSet = last.sets[last.sets.length - 1];
        var refReps = toNumber(refSet.reps);
        var refWeight = toNumber(refSet.weight);
        var targetReps = toNumber(ex.reps);
        if(isFinite(targetReps) && isFinite(refReps) && isFinite(refWeight) && refWeight > 0){
          // Epley-kaava (sama vakio 30 kuin buildAllOneRepMaxSeries)
          // edellisen sarjan 1RM-arviolle, kerrottuna progressiokertoimella, ja
          // takaisin tavoitetoistomäärän painoksi. Kun targetReps === refReps,
          // tämä supistuu muotoon refWeight * PROGRESSION_COEFFICIENT.
          var estimatedOneRepMax = refWeight * (1 + refReps/30);
          var targetOneRepMax = estimatedOneRepMax * PROGRESSION_COEFFICIENT;
          var computed = roundToStep(targetOneRepMax / (1 + targetReps/30), 2.5);
          var formulaRows = [];
          for(var k=0;k<count2;k++){ formulaRows.push({ weight: String(computed), reps: draftRepsFor(ex, k), notes: "", done: false }); }
          state.autoCalcInfo[id] = { type:"formula", refWeight: refWeight, refReps: refReps, date: last.date, progressionPercent: (PROGRESSION_COEFFICIENT - 1) * 100 };
          return formulaRows;
        }
      }
    }

    delete state.autoCalcInfo[id];
    var blankRows = [];
    for(var m=0;m<count2;m++){ blankRows.push({ weight:"", reps: draftRepsFor(ex, m), notes:"", done: false }); }
    return blankRows;
  }

  async function saveExerciseLog(id){
    var ex = findExerciseById(id);
    if(!ex) return;
    var sets = (state.draftSets[id] || []).filter(function(s){ return s.weight || s.reps || s.notes; });
    if(sets.length === 0){ showToast("Lisää vähintään yksi sarja ennen tallennusta"); return; }
    if(!state.todayEntry) state.todayEntry = { date: state.draftDate, exercises: {} };
    state.todayEntry.exercises[id] = { name: ex.name, sets: sets, loggedAt: new Date().toISOString() };
    if(!isCombo(ex.name)){
      state.lastSet[ex.name.trim().toLowerCase()] = {
        sets: sets.map(function(s){ return { weight: s.weight, reps: s.reps }; }),
        date: state.draftDate
      };
      await saveLastSet();
    }
    var maxUpdated = false;
    if(ex.intensity && ex.intensity.isMax){
      var maxWeight = toNumber(sets[0].weight);
      if(isFinite(maxWeight) && maxWeight > 0){
        // Uusi kirjattu MAX-arvo korvaa aina Asetuksiin tallennetun vanhan 1RM:n.
        state.manualMax[ex.name.trim().toLowerCase()] = { weight: maxWeight, date: state.draftDate };
        await saveManualMax();
        maxUpdated = true;
      }
    }
    try{
      await storeSet("entries:" + state.draftDate, JSON.stringify(state.todayEntry));
      delete state.dirtySets[id];
      state.kehitys = undefined;
      // Päivitetään indeksi suoraan tähän tallennukseen — ei tarvitse skannata
      // koko historiaa uudelleen jokaisen tallennuksen jälkeen.
      state.exerciseLogIndex[id] = { date: state.draftDate, data: state.todayEntry.exercises[id] };
      showToast(maxUpdated ? "Tallennettu — 1RM päivitetty Asetuksiin" : "Merkintä tallennettu");
      state.openExercise = null;
      render();
    }catch(e){
      state.lastError = (e && e.message) ? e.message : String(e);
      showToast("Tallennus epäonnistui: " + state.lastError, 4500);
    }
  }

  async function completeAndAdvance(id){
    // Kutsutaan vasta kun kaikki liikkeen sarjat on merkitty valmiiksi: tallentaa
    // (saveExerciseLog sulkee liikkeen state.openExercise = null onnistuessaan) ja
    // avaa sen jälkeen automaattisesti seuraavan liikkeen samasta päivän ryhmästä.
    var groupList = getExerciseGroupList(id);
    var idx = -1;
    if(groupList){ for(var i=0;i<groupList.length;i++){ if(groupList[i].id === id){ idx = i; break; } } }
    var nextEx = (groupList && idx !== -1 && idx + 1 < groupList.length) ? groupList[idx + 1] : null;
    await saveExerciseLog(id);
    if(state.openExercise === null && nextEx){ await toggleExercise(nextEx.id); }
    // Kun koko treenipäivä valmistuu, se niputetaan takaisin kiinni omaksi
    // "tehty"-kortikseen, vaikka käyttäjä olisi itse avannut sen aiemmin
    // (muuten se jäisi auki listana, koska avaus jätti expandedDaySummaries-
    // lipun päälle). saveExerciseLog on jo ehtinyt piirtää kerran tämän
    // funktion sisällä, joten tarvitaan vielä oma render(), jotta kiinni
    // menevä kortti näkyy heti.
    var doneDay = findGroupForExerciseId(id);
    if(doneDay && isDayFullyDone(doneDay) && state.expandedDaySummaries[dayKey(doneDay)]){
      delete state.expandedDaySummaries[dayKey(doneDay)];
      render();
    }
  }

  async function buildAllOneRepMaxSeries(){
    var seriesByName = {};
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          var name = (data.name || "").trim();
          if(!name || isCombo(name)) continue;
          var norm = name.toLowerCase();
          // Sama Epley-kaava (1RM = w × (1 + r/30)) jokaiselle merkinnälle riippumatta
          // siitä, oliko sen teho MAX, prosentti vai vapaa — ei erillistä MAX-oikotietä.
          // Päivän RASKAIN sarja (suurin laskennallinen 1RM) määrittää päivän arvon,
          // ei esim. ensimmäinen sarja — sarjat voivat olla nousujohteisia (esim.
          // 40/60/70 kg), jolloin ensimmäinen sarja aliarvioisi liikkeen 1RM:n rajusti.
          var value = null;
          var sets = data.sets || [];
          for(var s=0;s<sets.length;s++){
            var refReps = toNumber(sets[s].reps), refWeight = toNumber(sets[s].weight);
            if(isFinite(refReps) && isFinite(refWeight) && refWeight > 0){
              var setValue = roundToStep(refWeight * (1 + refReps/30), 2.5);
              if(value === null || setValue > value){ value = setValue; }
            }
          }
          if(value === null) continue;
          if(!seriesByName[norm]) seriesByName[norm] = { displayName: name, points: [], byDate: {} };
          var store = seriesByName[norm];
          var at = data.loggedAt || date;
          if(store.byDate[date] === undefined){
            store.byDate[date] = store.points.length;
            store.points.push({ date: date, value: value, at: at });
          } else {
            var pt = store.points[store.byDate[date]];
            if(value > pt.value){ pt.value = value; }
            if(at > pt.at){ pt.at = at; }
          }
        }
      }
      Object.keys(seriesByName).forEach(function(norm){
        seriesByName[norm].points.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
        delete seriesByName[norm].byDate;
      });
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return seriesByName;
  }

  async function buildTotalWeightSeries(){
    // Sama tietolähde kuin buildAllOneRepMaxSeries, mutta liikkeen 1RM:n sijaan
    // summataan koko treenipäivän nostettu kokonaispaino (paino × toistot,
    // kaikki sarjat kaikista liikkeistä yhteen laskettuna).
    var points = [];
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var total = 0;
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var sets = entry.exercises[exKeys[j]].sets || [];
          for(var k=0;k<sets.length;k++){
            var w = toNumber(sets[k].weight), r = toNumber(sets[k].reps);
            if(isFinite(w) && isFinite(r)) total += w * r;
          }
        }
        if(total > 0) points.push({ date: date, value: Math.round(total * 10) / 10 });
      }
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return points;
  }

  function computeProgress(points){
    if(!points || points.length === 0) return null;
    var current = points[points.length - 1].value;
    var currentDate = points[points.length - 1].date;
    var previous = points.length >= 2 ? points[points.length - 2].value : null;
    function valueAsOf(cutoffISO){
      var found = null;
      for(var i=0;i<points.length;i++){
        if(points[i].date <= cutoffISO) found = points[i].value; else break;
      }
      return found;
    }
    return {
      current: current,
      currentDate: currentDate,
      previous: previous,
      month: valueAsOf(daysAgoISO(30)),
      halfYear: valueAsOf(daysAgoISO(182)),
      year: valueAsOf(daysAgoISO(365)),
      allTime: points[0].value
    };
  }

  async function loadKehitys(){
    state.kehitysLoading = true; render();
    try{
      var seriesByName = await buildAllOneRepMaxSeries();
      var names = Object.keys(seriesByName).sort();
      var results = [];
      names.forEach(function(norm){
        var series = seriesByName[norm];
        var progress = computeProgress(series.points);
        if(progress){ results.push({ name: capitalize(series.displayName), progress: progress, points: series.points }); }
      });
      state.kehitys = results;
      state.kehitysTotalWeight = await buildTotalWeightSeries();
    }catch(e){ state.kehitys = []; state.kehitysTotalWeight = []; }
    state.kehitysLoading = false;
    render();
  }

  async function rebuildTrackersForName(name){
    var norm = name.trim().toLowerCase();
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var bestSet = null, bestSetAt = "";
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          if((data.name || "").trim().toLowerCase() !== norm) continue;
          var at = data.loggedAt || date;
          if(at > bestSetAt){ bestSetAt = at; bestSet = { sets: data.sets, date: date }; }
        }
      }
      if(bestSet){ state.lastSet[norm] = bestSet; } else { delete state.lastSet[norm]; }
      await saveLastSet();
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  async function rebuildManualMaxForName(name){
    var norm = name.trim().toLowerCase();
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var bestMax = null, bestMaxAt = "";
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          if((data.name || "").trim().toLowerCase() !== norm) continue;
          var srcEx = findExerciseById(ek);
          if(!(srcEx && srcEx.intensity && srcEx.intensity.isMax)) continue;
          var best = 0;
          (data.sets || []).forEach(function(s){ var w = toNumber(s.weight); if(isFinite(w) && w > best) best = w; });
          var at = data.loggedAt || date;
          if(best > 0 && at > bestMaxAt){ bestMaxAt = at; bestMax = { weight: best, date: date }; }
        }
      }
      if(bestMax){ state.manualMax[norm] = bestMax; } else { delete state.manualMax[norm]; }
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  // ---------- simulointi ----------
  // Täyttää koko ohjelman synteettisillä merkinnöillä, jotta Historia- ja
  // Kehitys-näkymiä voi tarkastella ilman että treenejä oikeasti kirjaa.
  // Painot kasvavat lineaarisesti ohjelman ensimmäisestä päivästä viimeiseen
  // niin, että viimeinen päivä on SIMULATION_GROWTH (30 %) korkeampi kuin
  // ensimmäinen — sama kaava jota sovellus muutenkin käyttää (MAX-teholle
  // suoraan arvo, prosenttiteholle osuus siitä, tehottomalle liikkeelle
  // kasvava paino samalla toistomäärällä kuin ohjelmassa on tavoitteena).
  function simulationBaseline(name){
    var n = String(name).toLowerCase();
    if(n.indexOf("penkki") !== -1 || n.indexOf("bench") !== -1) return 60;
    if(n.indexOf("kyykky") !== -1 || n.indexOf("squat") !== -1) return 90;
    if(n.indexOf("maasta") !== -1 || n.indexOf("deadlift") !== -1) return 110;
    var hash = 0;
    for(var i=0;i<n.length;i++){ hash = (hash*31 + n.charCodeAt(i)) >>> 0; }
    return 15 + (hash % 26);
  }
  async function runSimulation(){
    if(state.simulationBusy) return;
    if(!state.program || !state.program.days || state.program.days.length === 0){
      showToast("Tuo ensin treeniohjelma");
      return;
    }
    state.simulationBusy = true;
    render();
    try{
      var res = await storeList("entries:");
      var existing = (res && res.keys) || [];
      if(existing.length > 0){
        showToast("Simulointia ei voi käynnistää, koska merkintöjä on jo tallennettu.", 4200);
        return;
      }
      var days = state.program.days;
      var total = days.length;
      var todayD = new Date();
      var simDates = [];
      // Neljä treeniä per kalenteriviikko (esim. ma/ke/pe/la-tyyppinen jako), jotta
      // ohjelma jakautuu realistisesti usealle viikolle ja Kehitys-näkymään saadaan
      // dataa myös yli kuukauden takaa vertailua varten. Viimeinen treeni osuu tälle päivälle.
      var weekOffsets = [0, 2, 4, 5];
      var perWeek = weekOffsets.length;
      var totalWeeksNeeded = Math.ceil(total / perWeek);
      var lastPosInFinalWeek = (total - 1) % perWeek;
      var finalWeekStart = new Date(todayD);
      finalWeekStart.setDate(finalWeekStart.getDate() - weekOffsets[lastPosInFinalWeek]);
      for(var i=0;i<total;i++){
        var day = days[i];
        var weekIdx = Math.floor(i / perWeek);
        var posInWeek = i % perWeek;
        var weeksBeforeFinal = (totalWeeksNeeded - 1) - weekIdx;
        var d = new Date(finalWeekStart);
        d.setDate(d.getDate() - weeksBeforeFinal * 7 + weekOffsets[posInWeek]);
        var dateISO = toLocalISO(d);
        var growth = 1 + SIMULATION_GROWTH * (total > 1 ? (i / (total - 1)) : 1);
        var entry = { date: dateISO, exercises: {} };
        var hasAny = false;
        day.exercises.forEach(function(ex){
          if(isCombo(ex.name)) return;
          var normName = ex.name.trim().toLowerCase();
          var explicitCount = parseInt(ex.sets, 10);
          var count = (explicitCount && explicitCount > 0) ? explicitCount : 1;
          var targetReps = toNumber(ex.reps);
          var repsVal = isFinite(targetReps) ? targetReps : 1;
          var sets = [];
          if(ex.intensity && ex.intensity.isMax){
            var weight = roundToStep(simulationBaseline(ex.name) * growth, 2.5);
            for(var k=0;k<count;k++){ sets.push({ weight: String(weight), reps: String(repsVal), notes: "" }); }
            state.manualMax[normName] = { weight: weight, date: dateISO };
          } else if(ex.intensity){
            var maxEntry = state.manualMax[normName];
            if(!maxEntry) return;
            var percents = ex.intensity.percents || [];
            for(var k2=0;k2<count;k2++){
              var pct = percents.length ? (percents[k2] !== undefined ? percents[k2] : percents[percents.length-1]) : 100;
              sets.push({ weight: String(roundToStep(maxEntry.weight * pct / 100, 2.5)), reps: String(repsVal), notes: "" });
            }
          } else {
            var weight2 = roundToStep(simulationBaseline(ex.name) * growth, 2.5);
            for(var k3=0;k3<count;k3++){ sets.push({ weight: String(weight2), reps: String(repsVal), notes: "" }); }
          }
          if(sets.length === 0) return;
          entry.exercises[ex.id] = { name: ex.name, sets: sets, loggedAt: dateISO + "T12:00:00.000Z" };
          if(!isCombo(ex.name)){
            state.lastSet[normName] = { sets: sets.map(function(s){ return { weight: s.weight, reps: s.reps }; }), date: dateISO };
          }
          hasAny = true;
        });
        if(hasAny){
          await storeSet("entries:" + dateISO, JSON.stringify(entry));
          simDates.push(dateISO);
        }
      }
      await saveLastSet();
      await saveManualMax();
      state.simulation = { active: true, dates: simDates };
      await saveSimulationState();
      state.historyDates = undefined;
      state.historyCache = {};
      state.kehitys = undefined;
      state.todayEntry = await loadEntry(state.draftDate);
      state.exerciseLogIndex = await buildExerciseLogIndex();
      showToast("Simulointi käynnistetty — " + simDates.length + " päivää täytetty");
    }catch(e){
      showToast("Simulointi epäonnistui: " + ((e && e.message) || String(e)), 4200);
    }finally{
      state.simulationBusy = false;
      render();
    }
  }
  async function stopSimulation(){
    if(state.simulationBusy) return;
    state.simulationBusy = true;
    render();
    try{
      var dates = (state.simulation && state.simulation.dates) || [];
      var names = {};
      for(var i=0;i<dates.length;i++){
        var entry = await loadEntry(dates[i]);
        Object.keys(entry.exercises || {}).forEach(function(ek){
          var nm = (entry.exercises[ek].name || "").trim().toLowerCase();
          if(nm) names[nm] = true;
        });
        await storeDelete("entries:" + dates[i]);
      }
      var nameList = Object.keys(names);
      for(var j=0;j<nameList.length;j++){
        await rebuildTrackersForName(nameList[j]);
        await rebuildManualMaxForName(nameList[j]);
      }
      await saveManualMax();
      state.simulation = { active: false, dates: [] };
      await saveSimulationState();
      state.historyDates = undefined;
      state.historyCache = {};
      state.kehitys = undefined;
      state.todayEntry = await loadEntry(state.draftDate);
      state.exerciseLogIndex = await buildExerciseLogIndex();
      showToast("Simulointi sammutettu ja poistettu");
    }catch(e){
      showToast("Simuloinnin sammutus epäonnistui: " + ((e && e.message) || String(e)), 4200);
    }finally{
      state.simulationBusy = false;
      render();
    }
  }

  async function changeLogDate(newDate){
    state.draftDate = newDate;
    state.draftSets = {};
    state.dirtySets = {};
    state.openExercise = null;
    state.swapExercise = null;
    state.expandedDaySummaries = {};
    state.todayEntry = await loadEntry(newDate);
    render();
  }

  function findGroupForExerciseId(id){
    if(!state.program) return null;
    for(var i=0;i<state.program.days.length;i++){
      var day = state.program.days[i];
      for(var j=0;j<day.exercises.length;j++){
        if(day.exercises[j].id === id) return day;
      }
    }
    return null;
  }

  async function computeDefaultActiveWeek(){
    if(!state.program || !state.program.weeks || state.program.weeks.length === 0){
      state.activeWeek = null;
      return;
    }
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=dates.length-1;i>=0;i--){
        var entry = await loadEntry(dates[i]);
        var exKeys = Object.keys(entry.exercises || {});
        exKeys.sort(function(a,b){
          var la = entry.exercises[a].loggedAt || "";
          var lb = entry.exercises[b].loggedAt || "";
          return lb < la ? -1 : (lb > la ? 1 : 0);
        });
        for(var j=0;j<exKeys.length;j++){
          var grp = findGroupForExerciseId(exKeys[j]);
          if(grp && grp.week){ state.activeWeek = grp.week; return; }
        }
      }
    }catch(e){}
    state.activeWeek = state.program.weeks[0];
  }

  async function deleteHistoryEntry(date){
    try{
      var entry = state.historyCache[date] || await loadEntry(date);
      var exKeys = Object.keys(entry.exercises || {});
      var namesToRebuild = {};
      exKeys.forEach(function(ek){
        var data = entry.exercises[ek];
        var nm = (data.name || "").trim().toLowerCase();
        if(nm) namesToRebuild[nm] = true;
        delete state.draftSets[ek];
        delete state.dirtySets[ek];
        delete state.autoCalcInfo[ek];

      await storeDelete("entries:" + date);
      state.historyDates = state.historyDates.filter(function(d){ return d !== date; });
      delete state.historyCache[date];
      state.expandedHistoryDate = null;
      state.confirmingDeleteDate = null;

      if(state.draftDate === date){
        state.todayEntry = { date: date, exercises: {} };
      }

      var names = Object.keys(namesToRebuild);
      for(var i=0;i<names.length;i++){ await rebuildTrackersForName(names[i]); }
      state.kehitys = undefined;

  async function exportAllCSV(){
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var rows = [["Päivämäärä","Liike","Sarja","Paino (kg)","Toistot","Huomiot","Tyyppi"]];
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        Object.keys(entry.exercises || {}).forEach(function(exKey){
          var data = entry.exercises[exKey];
          var exName = data.name || exKey;
          var kind = data.kind || "plain";
          (data.sets || []).forEach(function(s, idx){
            rows.push([date, exName, idx+1, s.weight || "", s.reps || "", (s.notes || "").replace(/"/g,'""'), kind]);
          });
        });
      }
      var csv = rows.map(function(r){ return r.map(function(v){ return '"' + String(v) + '"'; }).join(","); }).join("\n");
      // UTF-8-BOM eteen, jotta Excel (etenkin Windowsilla) ei arvaa merkistöksi
      // ANSI/Windows-1252:tä ja muuta ä/ö-merkkejä symboleiksi tiedostoa avattaessa.
      var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "treenipaivakirja_" + todayISO() + ".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Vienti valmis");
      // render() tehdään tässä, jotta muistutusbanneri katoaa heti onnistuneen
      // viennin jälkeen riippumatta siitä, piirtääkö kutsupaikka uudelleen.
      state.lastExportDate = todayISO();
      state.exportReminderDismissed = false;
      try{ await storeSet(STORAGE_LAST_EXPORT_KEY, state.lastExportDate); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
      render();
    }catch(e){ showToast("Viennin luonti epäonnistui"); }
  }

  function parseEntriesCSV(text){
    text = text.replace(/^\uFEFF/, "");
    var rows = parseCSV(text);
    if(rows.length === 0) throw new Error("Tiedosto on tyhjä.");
    var headers = Object.keys(rows[0]);
    function findCol(cands){
      return headers.find(function(h){ return cands.some(function(c){ return h === c || h.indexOf(c) !== -1; }); });
    }
    var cDate = findCol(["päivämäärä","paivamaara","date","pvm"]);
    var cName = findCol(["liike","exercise","harjoitus"]);
    var cSet  = findCol(["sarja","set"]);
    var cW    = findCol(["paino","weight","kg"]);
    var cReps = findCol(["toistot","toistoa","reps"]);
    var cNote = findCol(["huomiot","huomio","notes","kommentti"]);
    var cKind = findCol(["tyyppi","kind"]);
    if(!cDate || !cName) throw new Error("Tiedostosta puuttuu päivämäärä- tai liikesarake. Käytä tällä sovelluksella tehtyä vientitiedostoa.");

    var byDate = {};
    var counters = {};
    rows.forEach(function(row){
      var date = (row[cDate] || "").trim();
      var name = (row[cName] || "").trim();
      if(!date || !name) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      var kind = cKind ? ((row[cKind] || "").trim().toLowerCase() || "plain") : "plain";
      if(["max","percent","plain"].indexOf(kind) === -1) kind = "plain";
      var setNo = cSet ? parseInt(row[cSet], 10) : NaN;

      if(!byDate[date]) { byDate[date] = []; counters[date] = null; }
      var blocks = byDate[date];
      var lastBlock = blocks.length ? blocks[blocks.length-1] : null;
      var startsNew = !lastBlock || lastBlock.name !== name || lastBlock.kind !== kind ||
                      (isFinite(setNo) && setNo === 1);
      if(startsNew){
        lastBlock = { name: name, kind: kind, sets: [] };
        blocks.push(lastBlock);
      }
      lastBlock.sets.push({
        weight: cW ? String(row[cW] || "").trim() : "",
        reps: cReps ? String(row[cReps] || "").trim() : "",
        notes: cNote ? String(row[cNote] || "").trim() : ""
      });
    });
    return byDate;
  }

  // Varmuuskopion CSV:ssä on vain päivämäärä ja liikkeen nimi — ei ohjelman
  // liike-id:tä, joka syntyy uudelleen jokaisessa ohjelman tuonnissa. Ilman
  // sidontaa tuodut merkinnät jäisivät irrallisiksi: ne näkyisivät Historiassa
  // ja Kehityksessä (jotka lukevat nimen perusteella) mutta eivät Ohjelma-
  // näkymässä, joka kysyy liike-id:llä onko treeni tehty.
  //
  // Sidonta tehdään treenipäivä kerrallaan: jokainen tuotu päivä osoitetaan
  // sille ohjelman päivälle, jonka liikkeisiin sen nimet parhaiten täsmäävät.
  // Päivät käydään aikajärjestyksessä ja kukin ohjelmapäivä varataan kerran,
  // jolloin peräkkäiset samanmuotoiset treenit osuvat viikoille 1, 2, 3 …
  // Nimi yksin ei riitä, koska sama liike toistuu ohjelmassa joka viikko.
  function matchImportedDatesToProgramDays(byDate){
    var matches = {};
    if(!state.program || !state.program.days || !state.program.days.length) return matches;
    var dates = Object.keys(byDate).sort();
    var used = {};
    dates.forEach(function(date){
      var logged = {};
      byDate[date].forEach(function(block){ logged[normalizeName(block.name)] = true; });
      var bestIdx = null, bestScore = 0, bestUsed = true;
      state.program.days.forEach(function(day, idx){
        var score = 0;
        (day.exercises || []).forEach(function(ex){
          if(logged[normalizeName(ex.name)]) score++;
        });
        if(score === 0) return;
        var isUsed = !!used[idx];
        // Paras osuma voittaa; tasatilanteessa vielä varaamaton päivä ja
        // ohjelmajärjestyksessä aiempi viikko.
        if(score > bestScore || (score === bestScore && bestUsed && !isUsed)){
          bestIdx = idx; bestScore = score; bestUsed = isUsed;
        }
      });
      if(bestIdx !== null){ used[bestIdx] = true; matches[date] = state.program.days[bestIdx]; }
    });
    return matches;
  }

  async function importEntriesFile(file){
    var text;
    try{ text = await readFileAsText(file); }
    catch(e){ showToast("Tiedoston luku epäonnistui"); return; }

    var byDate;
    try{ byDate = parseEntriesCSV(text); }
    catch(e){ showToast(e.message || "Tuonti epäonnistui", 4500); return; }

    var dates = Object.keys(byDate);
    if(dates.length === 0){ showToast("Tiedostosta ei löytynyt tuotavia merkintöjä", 4000); return; }

    var dayMatches = matchImportedDatesToProgramDays(byDate);
    var addedBlocks = 0, skippedBlocks = 0, touchedNames = {}, failedDates = 0, boundBlocks = 0;
    for(var i=0;i<dates.length;i++){
      var date = dates[i];
      var matchedDay = dayMatches[date];
      var takenProgramIds = {};
      var entry = await loadEntry(date);
      if(!entry.exercises) entry.exercises = {};
      var existingKeys = Object.keys(entry.exercises);
      var signatures = {};
      existingKeys.forEach(function(k){
        var d = entry.exercises[k];
        var sig = (d.name || "").trim().toLowerCase() + "|" + (d.kind || "plain") + "|" +
          (d.sets || []).map(function(s){ return (s.weight||"") + "x" + (s.reps||""); }).join(";");
        signatures[sig] = true;
      });

      var counter = 0;
      byDate[date].forEach(function(block){
        var sig = block.name.trim().toLowerCase() + "|" + block.kind + "|" +
          block.sets.map(function(s){ return (s.weight||"") + "x" + (s.reps||""); }).join(";");
        if(signatures[sig]){ skippedBlocks++; return; }
        var newId = null;
        if(matchedDay){
          // Sama liike voi esiintyä päivässä kahdesti (esim. MAX + prosentti),
          // joten kukin ohjelmarivi varataan vain kerran päivää kohti eikä
          // päivällä jo olevan merkinnän päälle kirjoiteta.
          var normBlock = normalizeName(block.name);
          for(var p=0;p<matchedDay.exercises.length;p++){
            var pex = matchedDay.exercises[p];
            if(takenProgramIds[pex.id]) continue;
            if(normalizeName(pex.name) !== normBlock) continue;
            if(entry.exercises.hasOwnProperty(pex.id)) continue;
            takenProgramIds[pex.id] = true;
            newId = pex.id;
            boundBlocks++;
            break;
          }
        }
        if(!newId){
          do { newId = "imp-" + date + "-" + (counter++); } while(entry.exercises.hasOwnProperty(newId));
        }
        entry.exercises[newId] = {
          name: block.name,
          sets: block.sets,
          kind: block.kind,
          loggedAt: date + "T12:00:00.000Z"
        };
        signatures[sig] = true;
        touchedNames[block.name.trim().toLowerCase()] = block.name;
        addedBlocks++;
      });

      try{ await storeSet("entries:" + date, JSON.stringify(entry)); }
      catch(e){ failedDates++; }
    }

    var names = Object.keys(touchedNames);
    for(var j=0;j<names.length;j++){ await rebuildTrackersForName(touchedNames[names[j]]); }

    state.historyDates = undefined;
    state.historyCache = {};
    state.kehitys = undefined;
    state.draftSets = {};
    state.dirtySets = {};
    state.autoCalcInfo = {};
    state.openExercise = null;
    state.swapExercise = null;
    state.todayEntry = await loadEntry(state.draftDate);
    state.exerciseLogIndex = await buildExerciseLogIndex();

    var msg = "Tuotu " + addedBlocks + " merkintää";
    if(skippedBlocks > 0) msg += ", ohitettu " + skippedBlocks + " jo olemassa olevaa";
    // Kerrotaan erikseen, jos osa jäi ilman ohjelmavastinetta: ne näkyvät
    // Historiassa ja Kehityksessä mutta eivät Ohjelma-näkymän merkintöinä.
    if(addedBlocks > boundBlocks) msg += " — " + (addedBlocks - boundBlocks) + " ei täsmännyt ohjelman liikkeisiin";
    if(failedDates > 0) msg += " — " + failedDates + " päivän tallennus epäonnistui";
    showToast(msg, 4500);
    render();
  }

  function showToast(msg, durationMs){
    var t = document.getElementById("toast");
    if(!t){
      t = document.createElement("div"); t.id = "toast"; t.className = "toast";
      // role=status + aria-live: ilmoitukset ("Merkintä tallennettu", virheet)
      // välittyvät myös ruudunlukijalle, ei pelkästään näkyvänä tekstinä.
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.classList.remove("show"); }, durationMs || 2200);
  }

  // ---------- lepoajastin ----------
  // Ajastin ei koskaan kutsu koko sovelluksen render()-funktiota tikityksen
  // takia (se rakentaisi #app:n DOM:n uudelleen sekunnin välein ja rikkoisi
  // esim. kesken olevan tekstikentän fokuksen). Ylivuoto piirretään suoraan
  // document.body:hyn #app:n ulkopuolelle, samaan tapaan kuin showToast, joten
  // render()-kutsut #app:lle eivät koskaan kosketa sitä. render() kutsutaan
  // vain kolmessa merkittävässä tilasiirtymässä: käynnistys, pysäytys, päättyminen.
  var wakeLockSentinel = null;

  function ensureRestTimerOverlay(){
    var el = document.getElementById("rest-timer-overlay");
    if(el) return el;
    el = document.createElement("div");
    el.id = "rest-timer-overlay";
    // Tausta peittää koko näytön (fokusansan ja taustan himmennyksen vuoksi),
    // mutta itse ajastin on neliönmuotoinen, näytön levyinen kortti keskellä.
    el.style.cssText = "position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; background:rgba(18,22,29,.82); transition:background-color .3s;";
    // Modaali: ruudunlukija tunnistaa dialogiksi eikä lue taustan sisältöä.
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", "Lepoajastin");
    el.setAttribute("tabindex", "-1");
    el.innerHTML =
      '<div id="rest-timer-card" style="width:100%; max-width:480px; aspect-ratio:1/1; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--surface); border-radius:28px; box-shadow:0 8px 24px rgba(0,0,0,.45); transition:background-color .3s;">' +
      '<div style="color:var(--mist); font-size:16px; letter-spacing:.1em; text-transform:uppercase;">Lepo</div>' +
      // Sekunneittain muuttuvaa lukemaa ei lueta ääneen (olisi jatkuvaa hälyä);
      // päättymisestä kerrotaan erikseen status-alueen kautta.
      '<div id="rest-timer-count" aria-hidden="true" style="color:var(--brass); font-weight:800; font-variant-numeric:tabular-nums; font-size:clamp(56px, 18vw, 120px); line-height:1; margin-top:4px;">--:--</div>' +
      '<div id="rest-timer-status" role="status" aria-live="polite" style="color:var(--chalk); font-size:16px; min-height:22px; margin-top:6px;"></div>' +
      '<div style="display:flex; gap:12px; margin-top:28px; width:100%; max-width:340px;">' +
      '<button id="rest-timer-minimize-btn" type="button" class="btn-secondary" style="min-height:44px;">Pienennä</button>' +
      '<button id="rest-timer-stop-btn" type="button" class="btn-secondary" style="min-height:44px; color:var(--danger-text); border-color:var(--danger);">Lopeta lepo</button>' +
      '</div>' +
      '</div>';
    document.body.appendChild(el);
    document.getElementById("rest-timer-minimize-btn").addEventListener("click", function(){
      minimizeRestTimer();
    });
    document.getElementById("rest-timer-stop-btn").addEventListener("click", function(){ stopRestTimer(); });
    // Fokus ei saa karata taustalle modaalin ollessa auki. inert hoitaa tämän
    // uusissa selaimissa; vanhemmille jää tämä kierrätys kahden painikkeen välillä.
    el.addEventListener("keydown", function(e){
      if(e.key !== "Tab") return;
      var first = document.getElementById("rest-timer-minimize-btn");
      var last = document.getElementById("rest-timer-stop-btn");
      if(!first || !last) return;
      if(document.activeElement === el){ e.preventDefault(); (e.shiftKey ? last : first).focus(); }
      else if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    });
    return el;
  }
  var restTimerPrevFocus = null;
  function activateRestTimerOverlay(el){
    // Fokus siirretään modaaliin ja tausta poistetaan kohdistusjärjestyksestä.
    if(!restTimerPrevFocus) restTimerPrevFocus = document.activeElement;
    var app = document.getElementById("app");
    if(app) app.inert = true;
    try{ el.focus(); }catch(e){}
  }
  function releaseRestTimerOverlay(){
    var app = document.getElementById("app");
    if(app) app.inert = false;
    if(restTimerPrevFocus && document.contains(restTimerPrevFocus)){
      try{ restTimerPrevFocus.focus(); }catch(e){}
    }
    restTimerPrevFocus = null;
  }

  function ensureRestTimerMiniBar(){
    var el = document.getElementById("rest-timer-mini");
    if(el) return el;
    el = document.createElement("div");
    el.id = "rest-timer-mini";
    // Asettuu kelluvan alanavigaation yläpuolelle (navi: 12px + 58px korkea).
    el.style.cssText = "position:fixed; bottom:calc(env(safe-area-inset-bottom) + 82px); left:16px; right:16px; margin:0 auto; max-width:448px; z-index:79; display:none; align-items:center; justify-content:center; gap:10px; padding:10px 16px; border-radius:999px; background:var(--brass); color:var(--ink); font-weight:800; font-size:15px; cursor:pointer;";
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.innerHTML =
      '<span>Lepo · <span id="rest-timer-mini-count" style="font-variant-numeric:tabular-nums;">--:--</span></span>' +
      '<span style="font-size:12px; text-decoration:underline;">Näytä</span>';
    document.body.appendChild(el);
    el.addEventListener("click", function(){ restoreRestTimer(); });
    el.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); restoreRestTimer(); }
    });
    return el;
  }

  function minimizeRestTimer(){
    var el = document.getElementById("rest-timer-overlay");
    if(el) el.style.display = "none";
    var mini = ensureRestTimerMiniBar();
    mini.style.display = "flex";
    paintRestTimerCount(computeRestRemaining());
    // Modaali väistyi: tausta takaisin käyttöön ja fokus näkyvään palkkiin,
    // jotta näppäimistökäyttäjä ei menetä paikkaansa.
    var app = document.getElementById("app");
    if(app) app.inert = false;
    restTimerPrevFocus = null;
    try{ mini.focus(); }catch(e){}
  }

  function restoreRestTimer(){
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    activateRestTimerOverlay(el);
  }

  function computeRestRemaining(){
    if(!state.restTimer) return 0;
    return Math.max(0, Math.round((state.restTimer.endAt - Date.now()) / 1000));
  }

  function paintRestTimerCount(remaining){
    var mins = Math.floor(remaining / 60), secs = remaining % 60;
    var text = mins + ":" + (secs < 10 ? "0" + secs : secs);
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.textContent = text;
    var miniCountEl = document.getElementById("rest-timer-mini-count");
    if(miniCountEl) miniCountEl.textContent = text;
  }

  function updateRestTimerDisplay(){
    if(!state.restTimer) return;
    var remaining = computeRestRemaining();
    paintRestTimerCount(remaining);
    if(remaining <= 0){ finishRestTimer(); }
  }

  async function persistRestTimer(data){
    // Paras yritys -tallennus: jos se epäonnistuu, ajastin toimii silti tämän
    // istunnon ajan setIntervalin ja state.restTimerin varassa.
    try{
      if(data){ await storeSet(STORAGE_REST_TIMER_KEY, JSON.stringify(data)); }
      else{ await storeDelete(STORAGE_REST_TIMER_KEY); }
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  async function requestRestWakeLock(){
    // Wake Lock estää vain näytön automaattisen himmenemisen/sammumisen levon
    // aikana — se EI estä käyttäjää itse lukitsemasta puhelinta virtapainikkeella
    // eikä sovelluksesta poistumista, joten se ratkaisee vain osan ongelmasta.
    try{
      if(state.restTimer && "wakeLock" in navigator){
        wakeLockSentinel = await navigator.wakeLock.request("screen");
      }
    }catch(e){ wakeLockSentinel = null; }
  }
  function releaseRestWakeLock(){
    if(wakeLockSentinel){
      try{ wakeLockSentinel.release(); }catch(e){}
      wakeLockSentinel = null;
    }
  }

  function playRestTimerSound(){
    try{
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      var ctx = new AudioCtx();
      var beepAt = function(t){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      };
      var now = ctx.currentTime;
      beepAt(now); beepAt(now + 0.45); beepAt(now + 0.9);
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1600);
    }catch(e){ /* Web Audio ei käytettävissä, ei kriittinen */ }
  }

  function vibrateRestTimerEnd(){
    // HUOM: iOS Safari ei tue Vibration API:a lainkaan — navigator.vibrate
    // puuttuu tai ei tee mitään, joten värinä ei toimi iPhonella. Ääni yhdessä
    // ruudun väriväläyksen kanssa on iOS:lla ainoa luotettava ilmoituskanava.
    try{ if(navigator.vibrate){ navigator.vibrate([200,100,200,100,400]); } }catch(e){}
  }

  function notifyRestTimerEnd(){
    // Parhaan yrityksen lisäominaisuus: iOS Safari ei pysty näyttämään
    // ilmoitusta luotettavasti kun sovellusprosessi on kokonaan taustalla tai
    // suljettu, koska se vaatisi push-palvelimen — sovelluksella ei ole eikä
    // roadmapin/README:n mukaisesti tule olemaan palvelinpuolta. Toimii
    // parhaiten Androidilla tai kun sivu on auki taustavälilehtenä.
    try{
      if("Notification" in window && Notification.permission === "granted"){
        new Notification("Lepo ohi", { body: "Seuraava sarja odottaa.", tag: "treenipk-rest" });
      }
    }catch(e){}
  }

  function finishRestTimer(){
    clearInterval(window.__restTimerInterval);
    state.restTimer = null;
    persistRestTimer(null);
    releaseRestWakeLock();
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    activateRestTimerOverlay(el);
    var flashCard = document.getElementById("rest-timer-card");
    if(flashCard) flashCard.style.background = "var(--brass)";
    paintRestTimerCount(0);
    // Kirkkaalla taustavälähdyksellä lukemat ja teksti vaihtuvat tummiksi,
    // jotta ne pysyvät luettavina — muuten ne sulautuisivat samaan brass-väriin.
    // Ilmoitus EI sulkeudu itsestään (aiemmin 3 sekunnin setTimeout) — käyttäjän
    // on suljettava se itse "Pienennä"- tai "Lopeta lepo" -painikkeesta, jotta
    // ilmoitus ei ehdi jäädä huomaamatta ennen katoamistaan.
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.style.color = "var(--ink)";
    var statusEl = document.getElementById("rest-timer-status");
    if(statusEl){ statusEl.textContent = "Lepo ohi"; statusEl.style.color = "var(--ink)"; }
    playRestTimerSound();
    vibrateRestTimerEnd();
    if(document.hidden) notifyRestTimerEnd();
    render();
  }

  function stopRestTimer(){
    clearInterval(window.__restTimerInterval);
    state.restTimer = null;
    persistRestTimer(null);
    releaseRestWakeLock();
    var el = document.getElementById("rest-timer-overlay");
    if(el) el.style.display = "none";
    var card = document.getElementById("rest-timer-card");
    if(card) card.style.background = "var(--surface)";
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    releaseRestTimerOverlay();
    render();
  }

  function startRestTimer(seconds){
    if(!state.restTimerEnabled) return;
    clearInterval(window.__restTimerInterval);
    state.restTimer = { endAt: Date.now() + seconds * 1000, seconds: seconds };
    persistRestTimer(state.restTimer);
    requestRestWakeLock();
    // Ilmoituslupa kysytään vain ensimmäisellä käynnistyskerralla: jos selain on
    // jo joskus vastannut (granted/denied), Notification.permission ei enää ole
    // "default", joten kysely ei toistu uudestaan myöhemmillä käynnistyksillä.
    try{
      if("Notification" in window && Notification.permission === "default"){
        Notification.requestPermission();
      }
    }catch(e){}
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    activateRestTimerOverlay(el);
    var startCard = document.getElementById("rest-timer-card");
    if(startCard) startCard.style.background = "var(--surface)";
    // Palautetaan värit oletukseen, jos edellinen ajastin ehti juuri päättyä
    // (surface-taustalla lukemat eivät saa jäädä tummiksi edellisen
    // väläytyksen jäljiltä).
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.style.color = "var(--brass)";
    var statusEl = document.getElementById("rest-timer-status");
    if(statusEl){ statusEl.textContent = ""; statusEl.style.color = "var(--chalk)"; }
    updateRestTimerDisplay();
    window.__restTimerInterval = setInterval(updateRestTimerDisplay, 1000);
    render();
  }

  function handleRestTimerVisibilityChange(){
    if(!state.restTimer) return;
    // setInterval hidastuu tai pysähtyy kokonaan taustalla/lukitulla näytöllä,
    // joten jäljellä oleva aika lasketaan aina uudelleen oikeasta kellonajasta
    // sen sijaan että luotettaisiin tikityksen kertymään.
    updateRestTimerDisplay();
    if(state.restTimer && document.visibilityState === "visible"){
      requestRestWakeLock();
    }
  }

  window.addEventListener("focus", handleRestTimerVisibilityChange);
  window.addEventListener("pageshow", handleRestTimerVisibilityChange);
