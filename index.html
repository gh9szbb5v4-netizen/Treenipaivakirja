<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treenipäiväkirja">
<meta name="theme-color" content="#12161d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Treenipäiväkirja</title>
<style>
  :root{
    --ink:#12161d;
    --surface:#1c222b;
    --surface-2:#262e39;
    --line:#333c48;
    --brass:#c9a227;
    --chalk:#eeeae2;
    --mist:#98a1b0;
    --danger:#c1633c;
    --danger-text:#e08a5f;
    --success:#6fae6f;
    --radius:14px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--chalk);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 48px);}
  *:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .header{padding:6px 2px 18px;}
  .eyebrow{text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--brass); font-weight:700;}
  .date{font-size:26px; font-weight:800; letter-spacing:-0.01em; margin-top:5px; font-variant-numeric:tabular-nums;}

  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tab{flex:1; min-width:0; text-align:center; padding:10px 2px; font-size:10.5px; font-weight:700; color:var(--mist); text-transform:uppercase; letter-spacing:.02em; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tab.active{color:var(--chalk); border-bottom-color:var(--brass);}

  .day-heading{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--mist); margin:20px 2px 8px; font-weight:700;}
  .day-heading:first-of-type{margin-top:0;}

  .exercise{background:var(--surface); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; border:1px solid rgba(255,255,255,0.04);}
  .exercise-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer; min-height:44px;}
  .exercise-name{font-weight:600; font-size:15px;}
  .exercise-target{font-size:12px; color:var(--mist); margin-top:3px; font-variant-numeric:tabular-nums;}
  .chevron{color:var(--mist); font-size:20px; transition:transform .2s, color .2s; flex-shrink:0; margin-left:10px;}
  .exercise.open .chevron{transform:rotate(90deg); color:var(--brass);}
  .chevron-btn{background:none; border:none; padding:0; margin:0; cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; flex-shrink:0;}

  .ledger{padding:0 16px 16px;}
  .ledger-row{display:grid; grid-template-columns:24px 1.5fr 0.55fr 1.3fr 32px; gap:6px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line);}
  .ledger-row:last-of-type{border-bottom:none;}
  .ledger-head{font-size:10px; text-transform:uppercase; color:var(--mist); letter-spacing:.06em; padding-bottom:6px;}
  .weight-step-row{display:flex; gap:8px; margin:-4px 0 10px;}
  /* 22px täyte + rivin 8px väli = 30px = sarjan numero -sarake (24px) + ledger-rivin
     oma 6px väli, jotta painikerivi alkaa täsmälleen painokentän vasemmasta reunasta. */
  .weight-step-spacer{flex:0 0 22px;}
  .weight-step-btn{flex:0 0 auto; height:36px; padding:0 10px; font-size:12.5px; white-space:nowrap; display:flex; align-items:center; justify-content:center; background:var(--brass); color:var(--ink); border:none; border-radius:var(--radius-sm); font-weight:800; cursor:pointer;}
  /* margin-left:auto työntää Valmis-napin rivin oikeaan reunaan (Poista sarja
     -napin kohdalle) riippumatta -/+ -nappien kutistuneesta leveydestä. */
  .set-done-btn{flex:0 0 auto; margin-left:auto; width:40px; height:36px; padding:0; font-size:17px; display:flex; align-items:center; justify-content:center; background:var(--brass); color:var(--ink); border:none; border-radius:var(--radius-sm); font-weight:800; cursor:pointer;}
  .set-num{background:none; border:none; padding:0; margin:0; font-family:inherit; color:var(--brass); font-weight:700; font-variant-numeric:tabular-nums; font-size:13px; width:22px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center;}
  .set-num.done{background:var(--success); color:var(--ink); font-size:14px;}
  .ledger-input{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); color:var(--chalk); padding:8px 7px; font-size:16px; width:100%; font-variant-numeric:tabular-nums;}
  /* Selaimen oletusvaalennus vihjetekstille jää alle kontrastivaatimuksen, joten väri asetetaan itse. */
  .ledger-input::placeholder, .date-picker-row input[type=date]::placeholder{color:var(--mist); opacity:1;}
  .ledger-input::-webkit-input-placeholder, .date-picker-row input[type=date]::-webkit-input-placeholder{color:var(--mist); opacity:1;}
  .remove-set{background:none; border:none; color:var(--mist); font-size:18px; cursor:pointer; padding:0; line-height:1; width:100%; min-height:44px; display:flex; align-items:center; justify-content:center;}

  .add-set-btn{width:100%; margin-top:10px; padding:11px; background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--radius-sm); color:var(--mist); font-size:13px; font-weight:700; cursor:pointer;}
  .subtotal{display:flex; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--mist);}
  .subtotal b{color:var(--brass); font-variant-numeric:tabular-nums;}
  .save-btn{width:100%; margin-top:12px; padding:13px; background:var(--brass); border:none; border-radius:var(--radius-sm); color:var(--ink); font-weight:800; font-size:14px; cursor:pointer;}
  .save-btn:active{opacity:.85;}

  .btn-secondary{background:var(--surface-2); border:1px solid var(--line); color:var(--chalk); padding:12px; border-radius:var(--radius-sm); font-weight:700; font-size:14px; width:100%; cursor:pointer;}

  .setting-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .toggle-switch{position:relative; flex-shrink:0; width:46px; height:26px; padding:0; border:1px solid var(--line); border-radius:999px; background:var(--surface-2); cursor:pointer;}
  .toggle-switch .toggle-thumb{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--mist); transition:transform .2s, background-color .2s;}
  .toggle-switch.on{background:rgba(201,162,39,0.3); border-color:var(--brass);}
  .toggle-switch.on .toggle-thumb{transform:translateX(20px); background:var(--brass);}
  .setting-disabled{opacity:.45; pointer-events:none;}

  .date-picker-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:13px; color:var(--mist);}
  .date-picker-row input[type=date]{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); color:var(--chalk); padding:8px 10px; font-size:16px;}

  .upload-box{border:1px dashed var(--line); border-radius:var(--radius); padding:26px 18px; margin-top:6px;}
  .upload-box p{color:var(--mist); font-size:13px; line-height:1.55; margin:0 0 12px;}
  .csv-example{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; background:var(--surface-2); padding:10px; border-radius:8px; overflow-x:auto; white-space:nowrap; color:var(--mist); margin-bottom:16px;}

  .history-date{background:var(--surface); border-radius:var(--radius); margin-bottom:10px; padding:14px 16px;}
  .history-date-head{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; cursor:pointer; min-height:32px;}

  .empty{text-align:center; color:var(--mist); padding:48px 20px; font-size:14px; line-height:1.6;}

  .toast{position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%) translateY(-8px); max-width:calc(100% - 32px); text-align:center; background:var(--brass); color:var(--ink); padding:10px 18px; border-radius:999px; font-weight:800; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_PROGRAM_KEY = "workout-program";
  var STORAGE_LASTSET_KEY = "last-set-log";
  var STORAGE_MANUAL_MAX_KEY = "manual-1rm";
  var STORAGE_SIMULATION_KEY = "simulation-state";
  var STORAGE_APP_VERSION_KEY = "app-version";
  var APP_VERSION = "0.1.0";
  var STORAGE_CONSENT_KEY = "koekaytto-hyvaksytty";
  var FEEDBACK_EMAIL = "jarkko_palokangas@hotmail.com";
  var STORAGE_HOMESCREEN_HINT_KEY = "homescreen-hint-dismissed";
  var REST_DURATION_SECONDS = 90;
  var STORAGE_REST_DURATION_KEY = "rest-duration-seconds";
  var STORAGE_REST_ENABLED_KEY = "rest-timer-enabled";
  var STORAGE_REST_TIMER_KEY = "rest-timer-state";
  var SIMULATION_GROWTH = 0.30;
  var PROGRESSION_COEFFICIENT = 1.0125; // Progressiokerroin p: 1,0125 = 1,25 % tavoiteltu kehitys per treenikerta

  var ALIASES = {
    week: ["viikko","week","vko"],
    day: ["day","päivä","paiva","pv","viikonpäivä"],
    exercise: ["exercise","liike","harjoitus","harjoite","liikkeen nimi"],
    sets: ["sets","sarjat","sarjaa"],
    reps: ["reps","toistot","toistoa"],
    unit: ["yksikot","yksiköt","yksikkö","unit","units"],
    weight: ["weight","paino","kg"],
    notes: ["notes","huomiot","lisätiedot","huomio","kommentti"],
    intensity: ["teho","intensity","rpe"]
  };

  var state = {
    loading: true,
    consentChecked: false,
    consentGiven: false,
    homescreenHintDismissed: false,
    restDurationSeconds: REST_DURATION_SECONDS,
    restTimerEnabled: true,
    restTimer: null,
    expandedDaySummaries: {},
    showHomescreenHint: false,
    program: null,
    manualExercises: [],
    manualNameDraft: "",
    manualNameSuggestion: null,
    importNameWarnings: [],
    view: "ohjelma",
    openExercise: null,
    draftSets: {},
    draftDate: todayISO(),
    todayEntry: null,
    historyDates: undefined,
    historyLoading: false,
    historyCache: {},
    expandedHistoryDate: null,
    confirmingReset: false,
    confirmingDeleteDate: null,
    lastSet: {},
    manualMax: {},
    autoCalcInfo: {},
    dirtySets: {},
    confirmingDeleteMax: null,
    simulation: { active: false, dates: [] },
    simulationBusy: false,
    kehitys: undefined,
    kehitysTotalWeight: undefined,
    kehitysLoading: false,
    storageMode: "claude",
    storageWarn: false,
    lastError: null,
    activeWeek: null,
    showAllWeeks: false
  };

  // ---------- utils ----------
  function pad2(n){ return n < 10 ? "0" + n : String(n); }
  // Paikallinen kalenteripäivä, ei UTC — toISOString() siirtäisi päivämäärän
  // väärään päivään esim. heti keskiyön jälkeen UTC:tä edellä olevissa aikavyöhykkeissä.
  function toLocalISO(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function todayISO(){ return toLocalISO(new Date()); }
  function daysAgoISO(n){ var d = new Date(); d.setDate(d.getDate() - n); return toLocalISO(d); }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function isStandaloneDisplay(){
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }
  function normalizeName(s){
    return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");
  }
  function formatDateFI(iso){
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("fi-FI", { weekday:"long", day:"numeric", month:"long" });
  }
  function formatDateShortFI(iso){
    var d = new Date(iso + "T00:00:00");
    return d.getDate() + "." + (d.getMonth() + 1) + ".";
  }
  function toNumber(str){
    if(str === null || str === undefined || str === "") return NaN;
    return parseFloat(String(str).replace(",", "."));
  }
  function roundToStep(value, step){
    var r = Math.round(value / step) * step;
    return Math.round(r * 100) / 100;
  }
  function parseIntensity(raw){
    if(!raw) return null;
    var s = String(raw).trim();
    if(!s) return null;
    if(/^max$/i.test(s)) return { isMax: true, percents: [] };
    var matches = s.match(/\d+(?:[.,]\d+)?\s*%/g);
    if(matches && matches.length){
      var percents = matches.map(function(m){ return toNumber(m.replace("%", "")); }).filter(function(n){ return isFinite(n); });
      if(percents.length) return { isMax: false, percents: percents };
    }
    return null;
  }
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  // ---------- CSV parsing ----------
  // Monet Excel-vientityökalut (etenkin suomenkielisellä Windowsilla) tallentavat CSV:n
  // Windows-1252/ANSI-koodauksella, ei UTF-8:lla. Jos tiukka UTF-8-tulkinta epäonnistuu,
  // luetaan tiedosto Windows-1252:na, jotta ä/ö eivät korruptoidu eivätkä siten myöskään
  // sarakeotsikoiden tai liikkeiden nimien tunnistus.
  function decodeFileBuffer(buffer){
    try{ return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
    catch(e){ return new TextDecoder("windows-1252").decode(buffer); }
  }
  function readFileAsText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){ resolve(decodeFileBuffer(e.target.result)); };
      reader.onerror = function(){ reject(new Error("Tiedoston luku epäonnistui")); };
      reader.readAsArrayBuffer(file);
    });
  }
  function detectDelimiter(headerLine){
    var semi = (headerLine.match(/;/g) || []).length;
    var comma = (headerLine.match(/,/g) || []).length;
    var tab = (headerLine.match(/\t/g) || []).length;
    if(tab >= semi && tab >= comma && tab > 0) return "\t";
    return semi > comma ? ";" : ",";
  }
  function parseCSVLine(line, delim){
    var result = [], cur = "", inQ = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(c === '"'){
        if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if(c === delim && !inQ){ result.push(cur); cur = ""; }
      else cur += c;
    }
    result.push(cur);
    return result.map(function(s){ return s.trim(); });
  }
  function parseCSV(text){
    var lines = text.split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length > 0; });
    if(lines.length === 0) return [];
    var delim = detectDelimiter(lines[0]);
    var headers = parseCSVLine(lines[0], delim).map(function(h){ return h.toLowerCase().trim(); });
    var out = [];
    for(var i=1;i<lines.length;i++){
      var vals = parseCSVLine(lines[i], delim);
      var obj = {};
      headers.forEach(function(h, idx){ obj[h] = vals[idx] !== undefined ? vals[idx] : ""; });
      out.push(obj);
    }
    return out;
  }
  function mapHeaders(headers){
    var map = {};
    Object.keys(ALIASES).forEach(function(key){
      var aliases = ALIASES[key];
      // Tarkka täsmäys ensin: esim. "Liikejärjestys"-sarake ei saa varastaa "Liike"-saraketta
      // vain siksi, että se sisältää "liike"-aliaksen alkuosanaan.
      var found = headers.find(function(h){ return aliases.indexOf(h) !== -1; });
      if(!found){
        found = headers.find(function(h){
          return aliases.some(function(a){ return h.indexOf(a) !== -1; });
        });
      }
      if(found) map[key] = found;
    });
    return map;
  }
  function parseProgramCSV(text, idPrefix){
    text = text.replace(/^\uFEFF/, "");
    // Jokainen tuonti saa oman, uniikin id-etuliitteen: nain uuden CSV:n rivit eivat
    // koskaan tormaa saman rivijarjestyksen (esim. "ex-0") kautta vanhaan, jo kirjattuun
    // historiaan, joka aiemmin saattoi liittaa vanhan merkinnan vaaraan, uuteen liikkeeseen.
    var prefix = idPrefix || "ex-" + Date.now();
    var rows = parseCSV(text);
    if(rows.length === 0) throw new Error("CSV-tiedosto on tyhjä.");
    var headers = Object.keys(rows[0]);
    var map = mapHeaders(headers);
    if(!map.exercise) throw new Error('CSV:stä puuttuu liikkeen nimen sisältävä sarake (esim. "Liike" tai "Exercise").');
    var dayMap = new Map();
    var weekOrder = [];
    rows.forEach(function(row, idx){
      var weekVal = map.week ? (row[map.week] || "").trim() : "";
      var dayVal = map.day ? (row[map.day] || "").trim() : "";
      var groupName;
      if(weekVal && dayVal) groupName = "Viikko " + weekVal + " · Päivä " + dayVal;
      else if(weekVal) groupName = "Viikko " + weekVal;
      else if(dayVal) groupName = dayVal;
      else groupName = "Ohjelma";
      if(!dayMap.has(groupName)){
        dayMap.set(groupName, { week: weekVal || null, exercises: [] });
        if(weekVal && weekOrder.indexOf(weekVal) === -1) weekOrder.push(weekVal);
      }
      var intensityRaw = map.intensity ? row[map.intensity] : (map.notes ? row[map.notes] : "");
      dayMap.get(groupName).exercises.push({
        id: prefix + "-" + idx,
        name: row[map.exercise] || "Nimetön liike",
        sets: map.sets ? row[map.sets] : "",
        reps: map.reps ? row[map.reps] : "",
        unit: map.unit ? row[map.unit] : "",
        weight: map.weight ? row[map.weight] : "",
        notes: map.notes ? row[map.notes] : (map.intensity ? row[map.intensity] : ""),
        intensity: parseIntensity(intensityRaw)
      });
    });
    var days = [];
    dayMap.forEach(function(group, name){ days.push({ name: name, week: group.week, exercises: group.exercises }); });
    return { days: days, weeks: weekOrder };
  }

  // ---------- storage adapter ----------
  // Kokeilee järjestyksessä: Claude-tallennus -> selaimen oma tallennustila -> muisti.
  var storageMode = "claude";
  var memoryStore = {};
  var LOCAL_PREFIX = "treenipk:";

  function localAvailable(){
    try{
      if(typeof localStorage === "undefined" || !localStorage) return false;
      localStorage.setItem(LOCAL_PREFIX + "__t", "1");
      localStorage.removeItem(LOCAL_PREFIX + "__t");
      return true;
    }catch(e){ return false; }
  }
  function demoteStorage(err, silent){
    var msg = (err && err.message) ? err.message : String(err);
    if(storageMode === "claude"){
      storageMode = localAvailable() ? "local" : "memory";
    } else if(storageMode === "local"){
      storageMode = "memory";
    }
    state.storageMode = storageMode;
    if(!silent || storageMode === "memory"){
      state.lastError = msg;
      state.storageWarn = true;
    }
  }
  async function storeSet(key, value){
    if(storageMode === "claude"){
      try{
        var r = await window.storage.set(key, value, false);
        if(r) return r;
        throw new Error("Tyhjä vastaus tallennuksesta");
      }catch(e){ demoteStorage(e); }
    }
    if(storageMode === "local"){
      try{ localStorage.setItem(LOCAL_PREFIX + key, value); return { key: key, value: value }; }
      catch(e){ demoteStorage(e); }
    }
    memoryStore[key] = value;
    return { key: key, value: value };
  }
  async function storeGet(key){
    if(storageMode === "claude"){
      try{
        var r = await window.storage.get(key, false);
        return r || null;
      }catch(e){ return null; }
    }
    if(storageMode === "local"){
      try{
        var v = localStorage.getItem(LOCAL_PREFIX + key);
        return (v === null) ? null : { key: key, value: v };
      }catch(e){ return null; }
    }
    return memoryStore.hasOwnProperty(key) ? { key: key, value: memoryStore[key] } : null;
  }
  async function storeDelete(key){
    if(storageMode === "claude"){
      try{ return await window.storage.delete(key, false); }catch(e){ return null; }
    }
    if(storageMode === "local"){
      try{ localStorage.removeItem(LOCAL_PREFIX + key); return { key: key, deleted: true }; }catch(e){ return null; }
    }
    delete memoryStore[key];
    return { key: key, deleted: true };
  }
  async function storeList(prefix){
    if(storageMode === "claude"){
      try{
        var r = await window.storage.list(prefix, false);
        return { keys: (r && r.keys) || [] };
      }catch(e){ return { keys: [] }; }
    }
    if(storageMode === "local"){
      try{
        var out = [];
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k && k.indexOf(LOCAL_PREFIX) === 0){
            var bare = k.slice(LOCAL_PREFIX.length);
            if(!prefix || bare.indexOf(prefix) === 0) out.push(bare);
          }
        }
        return { keys: out };
      }catch(e){ return { keys: [] }; }
    }
    var mk = Object.keys(memoryStore).filter(function(k){ return !prefix || k.indexOf(prefix) === 0; });
    return { keys: mk };
  }

  // ---------- storage helpers ----------
  async function loadEntry(date){
    try{
      var res = await storeGet("entries:" + date);
      return (res && res.value) ? JSON.parse(res.value) : { date: date, exercises: {} };
    }catch(e){
      return { date: date, exercises: {} };
    }
  }
  async function saveProgram(){
    try{ await storeSet(STORAGE_PROGRAM_KEY, JSON.stringify(state.program)); }
    catch(e){ state.lastError = (e && e.message) ? e.message : String(e); showToast("Ohjelman tallennus epäonnistui: " + state.lastError, 4500); }
  }
  async function saveLastSet(){

  // ---------- data helpers ----------
  function allExercises(){
    var list = state.manualExercises.slice();
    if(state.program){ state.program.days.forEach(function(d){ list = list.concat(d.exercises); }); }
    return list;
  }
  function findExerciseById(id){ return allExercises().find(function(e){ return e.id === id; }); }

  function knownExerciseNames(){
    // Kaikki sovelluksen tuntemat liikenimet: ohjelma, käsin lisätyt sekä
    // historiassa olevat nimet. Historian nimet ovat mukana siksi, että juuri
    // niiden kohdalla eri kirjoitusasu aloittaisi historian huomaamatta alusta.
    var seen = {};
    var names = [];
    function lisaa(display){
      var norm = normalizeName(display);
      if(!norm || seen[norm]) return;
      seen[norm] = true;
      names.push(display);
    }
    allExercises().forEach(function(ex){ if(ex && ex.name) lisaa(ex.name); });
    Object.keys(state.lastSet).forEach(function(norm){ lisaa(capitalize(norm)); });
    Object.keys(state.manualMax).forEach(function(norm){ lisaa(capitalize(norm)); });
    names.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return names;
  }

  function levenshtein(a, b){
    // Tavallinen muokkausetäisyys yhdellä vierivällä rivillä.
    var la = a.length, lb = b.length;
    if(la === 0) return lb;
    if(lb === 0) return la;
    var row = [];
    var i, j;
    for(j=0;j<=lb;j++){ row[j] = j; }
    for(i=1;i<=la;i++){
      var prev = row[0];
      row[0] = i;
      for(j=1;j<=lb;j++){
        var temp = row[j];
        var cost = (a.charAt(i-1) === b.charAt(j-1)) ? 0 : 1;
        var min = row[j] + 1;
        if(row[j-1] + 1 < min) min = row[j-1] + 1;
        if(prev + cost < min) min = prev + cost;
        row[j] = min;
        prev = temp;
      }
    }
    return row[lb];
  }

  function findSimilarName(input, candidates){
    var target = normalizeName(input);
    if(!target || !candidates || !candidates.length) return null;
    var i;
    var norms = [];
    for(i=0;i<candidates.length;i++){
      var norm = normalizeName(candidates[i]);
      if(norm === target) return null;
      norms.push(norm);
    }
    // Pelkkä välilyöntien ero, esim. "Peckdeck" vs. "Peck deck".
    var targetTight = target.replace(/\s+/g, "");
    for(i=0;i<candidates.length;i++){
      if(norms[i].replace(/\s+/g, "") === targetTight) return candidates[i];
    }
    var best = null, bestNorm = "", bestDist = 0;
    for(i=0;i<candidates.length;i++){
      var dist = levenshtein(target, norms[i]);
      if(best === null || dist < bestDist){ best = candidates[i]; bestNorm = norms[i]; bestDist = dist; }
    }
    if(best === null) return null;
    var longer = Math.max(target.length, bestNorm.length);
    var limit = (longer >= 6) ? 2 : 1;
    return (bestDist <= limit) ? best : null;
  }

  // ---------- actions ----------
  async function handleFile(file){
    var isFirstImport = !state.program;
    var text;
    try{ text = await readFileAsText(file); }
    catch(e){ showToast("Tiedoston luku epäonnistui"); return; }
    try{
      var program = parseProgramCSV(text);
      // Verrataan tuodun ohjelman liikenimiä historiassa jo oleviin nimiin: eri
      // kirjoitusasu aloittaisi historian huomaamatta alusta. Vain huomautus,
      // mitään ei nimetä uudelleen automaattisesti.
      state.importNameWarnings = [];
      var historyNorms = {};
      Object.keys(state.lastSet).forEach(function(norm){ historyNorms[normalizeName(norm)] = true; });
      Object.keys(state.manualMax).forEach(function(norm){ historyNorms[normalizeName(norm)] = true; });
      var historyNames = Object.keys(historyNorms).map(function(norm){ return capitalize(norm); });
      if(historyNames.length){
        historyNames.sort(function(a, b){ return a.localeCompare(b, "fi"); });
        var seenImport = {};
        program.days.forEach(function(day){
          (day.exercises || []).forEach(function(ex){
            var impName = (ex.name || "").trim();
            if(!impName) return;
            var impNorm = normalizeName(impName);
            if(!impNorm || seenImport[impNorm] || historyNorms[impNorm]) return;
            seenImport[impNorm] = true;
            var match = findSimilarName(impName, historyNames);
            if(match){ state.importNameWarnings.push({ imported: impName, historical: match }); }
          });
        });
      }
      state.program = program;
      state.manualExercises = [];
      state.draftSets = {};
      state.dirtySets = {};
      state.openExercise = null;
      state.showAllWeeks = false;
      await saveProgram();
      await computeDefaultActiveWeek();
      state.todayEntry = await loadEntry(state.draftDate);
      state.view = "ohjelma";
      showToast("Ohjelma tuotu onnistuneesti");
      if(isFirstImport && !state.homescreenHintDismissed && !isStandaloneDisplay()){ state.showHomescreenHint = true; }
      render();
    }catch(err){
      showToast(err.message || "CSV:n luku epäonnistui");
    }
  }

  function addManualExerciseByName(name){
    // Sama lisäyslogiikka kuin ennen; jaettu, koska liike voidaan lisätä joko
    // suoraan tai kirjoitusasuehdotuksen kautta.
    var newId = "manual-" + Date.now();
    var manualEx = { id:newId, name:name, sets:"", reps:"", weight:"", notes:"" };
    state.manualExercises.push(manualEx);
    state.openExercise = newId;
    state.draftSets[newId] = buildDraftRows(manualEx, newId);
    render();
  }

  async function toggleExercise(id){
    if(state.openExercise === id){
      var openEx = findExerciseById(id);
      if(openEx && !isExerciseFullyDone(openEx, id)){
        showToast("Merkitse kaikki sarjat valmiiksi ennen sulkemista");
        return;
      }
      await completeAndAdvance(id);
      return;
    }
    var ex = findExerciseById(id);
    if(!ex) return;
    state.openExercise = id;
    if(!state.draftSets[id] || !state.dirtySets[id]){
      var existing = state.todayEntry && state.todayEntry.exercises[id];
      if(existing && existing.sets && existing.sets.length){
        // Aiemmin tallennettu merkintä: sarjat näytetään jo valmiiksi merkittyinä,
        // mutta arvoja voi silti muokata (ks. isRowDoneEligible/data-set-field).
        state.draftSets[id] = existing.sets.map(function(s){ return Object.assign({}, s, { done: true }); });
        state.autoCalcInfo[id] = { type:"saved" };
      } else {
        state.draftSets[id] = buildDraftRows(ex, id);
      }
    }
    render();
  }

  function isCombo(name){
    return String(name).indexOf("/") !== -1;
  }
  function exerciseRequiresWeightForDone(ex){
    // Yhdistelmäliikkeet (esim. "Cardiolaite / Punnerrus / Burpee, 12 min") eivät
    // muutenkaan kuulu painoon perustuvaan logiikkaan (ks. lastSet/1RM-käsittely),
    // joten niille "kirjattu" tarkoittaa samaa kuin saveExerciseLog:n data-tarkistus.
    return !isCombo(ex.name);
  }
  function isRowDoneEligible(ex, row){
    return exerciseRequiresWeightForDone(ex) ? !!row.weight : !!(row.weight || row.reps || row.notes);
  }
  function isExerciseFullyDone(ex, id){
    var rows = state.draftSets[id];
    if(!rows || !rows.length) return false;
    for(var i=0;i<rows.length;i++){ if(!rows[i].done) return false; }
    return true;
  }
  function isExerciseSavedToday(ex){
    return !!(state.todayEntry && state.todayEntry.exercises && state.todayEntry.exercises[ex.id]);
  }
  function isDayFullyDone(day){
    // Koko treenipäivä lasketaan tehdyksi vasta kun jokainen sen liike on
    // tallennettu draftSets-tilan sarjakohtaisen valmiiksi-merkinnän kautta
    // (ei riitä, että liike on ollut tallennettu jonain aiempana päivänä).
    if(!day.exercises || !day.exercises.length) return false;
    for(var i=0;i<day.exercises.length;i++){ if(!isExerciseSavedToday(day.exercises[i])) return false; }
    return true;
  }
  function dayKey(day){
    return String(day.week) + "|" + day.name;
  }
  function getExerciseGroupList(id){
    if(state.program){
      for(var i=0;i<state.program.days.length;i++){
        var day = state.program.days[i];
        for(var j=0;j<day.exercises.length;j++){ if(day.exercises[j].id === id) return day.exercises; }
      }
    }
    for(var k=0;k<state.manualExercises.length;k++){ if(state.manualExercises[k].id === id) return state.manualExercises; }
    return null;
  }
  function buildDraftRows(ex, id){
    var explicitCount = parseInt(ex.sets, 10);

    // Liikkeet, joille on määritelty teho (MAX tai prosentti), eivät kuulu
    // toistopainolaskurin progressiologiikkaan: niiden painoehdotus perustuu
    // aina liikkeen manuaalisesti syötettyyn 1RM-arvoon.
    if(ex.intensity){
      var percents = !ex.intensity.isMax ? ex.intensity.percents : [];
      var count = (explicitCount && explicitCount > 0) ? explicitCount : (percents.length || 1);
      var maxEntry = state.manualMax[ex.name.trim().toLowerCase()];
      var usedMax = false;
      var maxRows = [];
      for(var i=0;i<count;i++){
        var weightVal = "";
        if(maxEntry && isFinite(maxEntry.weight)){
          if(ex.intensity.isMax){
            weightVal = String(maxEntry.weight);
          } else {
            var pct = percents.length ? (percents[i] !== undefined ? percents[i] : percents[percents.length-1]) : null;
            if(pct !== null) weightVal = String(roundToStep(maxEntry.weight * pct / 100, 2.5));
          }
          usedMax = true;
        }
        maxRows.push({ weight: weightVal, reps: ex.reps || "", notes: "", done: false });
      }
      if(usedMax){ state.autoCalcInfo[id] = { type:"max", weight: maxEntry.weight, isMax: ex.intensity.isMax, percents: percents }; }
      else{ delete state.autoCalcInfo[id]; }
      return maxRows;
    }

    var count2 = (explicitCount && explicitCount > 0) ? explicitCount : 1;

    if(!isCombo(ex.name)){
      var normName = ex.name.trim().toLowerCase();
      var last = state.lastSet[normName];
      if(last && last.sets && last.sets.length){
        var refSet = last.sets[last.sets.length - 1];
        var refReps = toNumber(refSet.reps);
        var refWeight = toNumber(refSet.weight);
        var targetReps = toNumber(ex.reps);
        if(isFinite(targetReps) && isFinite(refReps) && isFinite(refWeight) && refWeight > 0){
          // Epley-kaava (sama vakio 30 kuin buildAllOneRepMaxSeries)
          // edellisen sarjan 1RM-arviolle, kerrottuna progressiokertoimella, ja
          // takaisin tavoitetoistomäärän painoksi. Kun targetReps === refReps,
          // tämä supistuu muotoon refWeight * PROGRESSION_COEFFICIENT.
          var estimatedOneRepMax = refWeight * (1 + refReps/30);
          var targetOneRepMax = estimatedOneRepMax * PROGRESSION_COEFFICIENT;
          var computed = roundToStep(targetOneRepMax / (1 + targetReps/30), 2.5);
          var formulaRows = [];
          for(var k=0;k<count2;k++){ formulaRows.push({ weight: String(computed), reps: ex.reps || "", notes: "", done: false }); }
          state.autoCalcInfo[id] = { type:"formula", refWeight: refWeight, refReps: refReps, date: last.date, progressionPercent: (PROGRESSION_COEFFICIENT - 1) * 100 };
          return formulaRows;
        }
      }
    }

    delete state.autoCalcInfo[id];
    var blankRows = [];
    for(var m=0;m<count2;m++){ blankRows.push({ weight:"", reps: ex.reps || "", notes:"", done: false }); }
    return blankRows;
  }

  async function saveExerciseLog(id){
    var ex = findExerciseById(id);
    if(!ex) return;
    var sets = (state.draftSets[id] || []).filter(function(s){ return s.weight || s.reps || s.notes; });
    if(sets.length === 0){ showToast("Lisää vähintään yksi sarja ennen tallennusta"); return; }
    if(!state.todayEntry) state.todayEntry = { date: state.draftDate, exercises: {} };
    state.todayEntry.exercises[id] = { name: ex.name, sets: sets, loggedAt: new Date().toISOString() };
    if(!isCombo(ex.name)){
      state.lastSet[ex.name.trim().toLowerCase()] = {
        sets: sets.map(function(s){ return { weight: s.weight, reps: s.reps }; }),
        date: state.draftDate
      };
      await saveLastSet();
    }
    var maxUpdated = false;
    if(ex.intensity && ex.intensity.isMax){
      var maxWeight = toNumber(sets[0].weight);
      if(isFinite(maxWeight) && maxWeight > 0){
        // Uusi kirjattu MAX-arvo korvaa aina Asetuksiin tallennetun vanhan 1RM:n.
        state.manualMax[ex.name.trim().toLowerCase()] = { weight: maxWeight, date: state.draftDate };
        await saveManualMax();
        maxUpdated = true;
      }
    }
    try{
      await storeSet("entries:" + state.draftDate, JSON.stringify(state.todayEntry));
      delete state.dirtySets[id];
      state.kehitys = undefined;
      showToast(maxUpdated ? "Tallennettu — 1RM päivitetty Asetuksiin" : "Merkintä tallennettu");
      state.openExercise = null;
      render();
    }catch(e){
      state.lastError = (e && e.message) ? e.message : String(e);
      showToast("Tallennus epäonnistui: " + state.lastError, 4500);
    }
  }

  async function completeAndAdvance(id){
    // Kutsutaan vasta kun kaikki liikkeen sarjat on merkitty valmiiksi: tallentaa
    // (saveExerciseLog sulkee liikkeen state.openExercise = null onnistuessaan) ja
    // avaa sen jälkeen automaattisesti seuraavan liikkeen samasta päivän ryhmästä.
    var groupList = getExerciseGroupList(id);
    var idx = -1;
    if(groupList){ for(var i=0;i<groupList.length;i++){ if(groupList[i].id === id){ idx = i; break; } } }
    var nextEx = (groupList && idx !== -1 && idx + 1 < groupList.length) ? groupList[idx + 1] : null;
    await saveExerciseLog(id);
    if(state.openExercise === null && nextEx){ await toggleExercise(nextEx.id); }
  }

  async function buildAllOneRepMaxSeries(){
    var seriesByName = {};
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          var name = (data.name || "").trim();
          if(!name || isCombo(name)) continue;
          var norm = name.toLowerCase();
          // Sama Epley-kaava (1RM = w × (1 + r/30)) jokaiselle merkinnälle riippumatta
          // siitä, oliko sen teho MAX, prosentti vai vapaa — ei erillistä MAX-oikotietä.
          // Päivän RASKAIN sarja (suurin laskennallinen 1RM) määrittää päivän arvon,
          // ei esim. ensimmäinen sarja — sarjat voivat olla nousujohteisia (esim.
          // 40/60/70 kg), jolloin ensimmäinen sarja aliarvioisi liikkeen 1RM:n rajusti.
          var value = null;
          var sets = data.sets || [];
          for(var s=0;s<sets.length;s++){
            var refReps = toNumber(sets[s].reps), refWeight = toNumber(sets[s].weight);
            if(isFinite(refReps) && isFinite(refWeight) && refWeight > 0){
              var setValue = roundToStep(refWeight * (1 + refReps/30), 2.5);
              if(value === null || setValue > value){ value = setValue; }
            }
          }
          if(value === null) continue;
          if(!seriesByName[norm]) seriesByName[norm] = { displayName: name, points: [], byDate: {} };
          var store = seriesByName[norm];
          var at = data.loggedAt || date;
          if(store.byDate[date] === undefined){
            store.byDate[date] = store.points.length;
            store.points.push({ date: date, value: value, at: at });
          } else {
            var pt = store.points[store.byDate[date]];
            if(value > pt.value){ pt.value = value; }
            if(at > pt.at){ pt.at = at; }
          }
        }
      }
      Object.keys(seriesByName).forEach(function(norm){
        seriesByName[norm].points.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
        delete seriesByName[norm].byDate;
      });
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return seriesByName;
  }

  async function buildTotalWeightSeries(){
    // Sama tietolähde kuin buildAllOneRepMaxSeries, mutta liikkeen 1RM:n sijaan
    // summataan koko treenipäivän nostettu kokonaispaino (paino × toistot,
    // kaikki sarjat kaikista liikkeistä yhteen laskettuna).
    var points = [];
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var total = 0;
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var sets = entry.exercises[exKeys[j]].sets || [];
          for(var k=0;k<sets.length;k++){
            var w = toNumber(sets[k].weight), r = toNumber(sets[k].reps);
            if(isFinite(w) && isFinite(r)) total += w * r;
          }
        }
        if(total > 0) points.push({ date: date, value: Math.round(total * 10) / 10 });
      }
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return points;
  }

  function computeProgress(points){
    if(!points || points.length === 0) return null;
    var current = points[points.length - 1].value;
    var currentDate = points[points.length - 1].date;
    var previous = points.length >= 2 ? points[points.length - 2].value : null;
    function valueAsOf(cutoffISO){
      var found = null;
      for(var i=0;i<points.length;i++){
        if(points[i].date <= cutoffISO) found = points[i].value; else break;
      }
      return found;
    }
    return {
      current: current,
      currentDate: currentDate,
      previous: previous,
      month: valueAsOf(daysAgoISO(30)),
      halfYear: valueAsOf(daysAgoISO(182)),
      year: valueAsOf(daysAgoISO(365)),
      allTime: points[0].value
    };
  }

  async function loadKehitys(){
    state.kehitysLoading = true; render();
    try{
      var seriesByName = await buildAllOneRepMaxSeries();
      var names = Object.keys(seriesByName).sort();
      var results = [];
      names.forEach(function(norm){
        var series = seriesByName[norm];
        var progress = computeProgress(series.points);
        if(progress){ results.push({ name: capitalize(series.displayName), progress: progress, points: series.points }); }
      });
      state.kehitys = results;
      state.kehitysTotalWeight = await buildTotalWeightSeries();
    }catch(e){ state.kehitys = []; state.kehitysTotalWeight = []; }
    state.kehitysLoading = false;
    render();
  }

  async function rebuildTrackersForName(name){
    var norm = name.trim().toLowerCase();
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var bestSet = null, bestSetAt = "";
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          if((data.name || "").trim().toLowerCase() !== norm) continue;
          var at = data.loggedAt || date;
          if(at > bestSetAt){ bestSetAt = at; bestSet = { sets: data.sets, date: date }; }
        }
      }
      if(bestSet){ state.lastSet[norm] = bestSet; } else { delete state.lastSet[norm]; }
      await saveLastSet();
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  async function rebuildManualMaxForName(name){
    var norm = name.trim().toLowerCase();
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var bestMax = null, bestMaxAt = "";
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          if((data.name || "").trim().toLowerCase() !== norm) continue;
          var srcEx = findExerciseById(ek);
          if(!(srcEx && srcEx.intensity && srcEx.intensity.isMax)) continue;
          var best = 0;
          (data.sets || []).forEach(function(s){ var w = toNumber(s.weight); if(isFinite(w) && w > best) best = w; });
          var at = data.loggedAt || date;
          if(best > 0 && at > bestMaxAt){ bestMaxAt = at; bestMax = { weight: best, date: date }; }
        }
      }
      if(bestMax){ state.manualMax[norm] = bestMax; } else { delete state.manualMax[norm]; }
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  // ---------- simulointi ----------
  // Täyttää koko ohjelman synteettisillä merkinnöillä, jotta Historia- ja
  // Kehitys-näkymiä voi tarkastella ilman että treenejä oikeasti kirjaa.
  // Painot kasvavat lineaarisesti ohjelman ensimmäisestä päivästä viimeiseen
  // niin, että viimeinen päivä on SIMULATION_GROWTH (30 %) korkeampi kuin
  // ensimmäinen — sama kaava jota sovellus muutenkin käyttää (MAX-teholle
  // suoraan arvo, prosenttiteholle osuus siitä, tehottomalle liikkeelle
  // kasvava paino samalla toistomäärällä kuin ohjelmassa on tavoitteena).
  function simulationBaseline(name){
    var n = String(name).toLowerCase();
    if(n.indexOf("penkki") !== -1 || n.indexOf("bench") !== -1) return 60;
    if(n.indexOf("kyykky") !== -1 || n.indexOf("squat") !== -1) return 90;
    if(n.indexOf("maasta") !== -1 || n.indexOf("deadlift") !== -1) return 110;
    var hash = 0;
    for(var i=0;i<n.length;i++){ hash = (hash*31 + n.charCodeAt(i)) >>> 0; }
    return 15 + (hash % 26);
  }
  async function runSimulation(){
    if(state.simulationBusy) return;
    if(!state.program || !state.program.days || state.program.days.length === 0){
      showToast("Tuo ensin treeniohjelma");
      return;
    }
    state.simulationBusy = true;
    render();
    try{
      var res = await storeList("entries:");
      var existing = (res && res.keys) || [];
      if(existing.length > 0){
        showToast("Simulointia ei voi käynnistää, koska merkintöjä on jo tallennettu.", 4200);
        return;
      }
      var days = state.program.days;
      var total = days.length;
      var todayD = new Date();
      var simDates = [];
      // Neljä treeniä per kalenteriviikko (esim. ma/ke/pe/la-tyyppinen jako), jotta
      // ohjelma jakautuu realistisesti usealle viikolle ja Kehitys-näkymään saadaan
      // dataa myös yli kuukauden takaa vertailua varten. Viimeinen treeni osuu tälle päivälle.
      var weekOffsets = [0, 2, 4, 5];
      var perWeek = weekOffsets.length;
      var totalWeeksNeeded = Math.ceil(total / perWeek);
      var lastPosInFinalWeek = (total - 1) % perWeek;
      var finalWeekStart = new Date(todayD);
      finalWeekStart.setDate(finalWeekStart.getDate() - weekOffsets[lastPosInFinalWeek]);
      for(var i=0;i<total;i++){
        var day = days[i];
        var weekIdx = Math.floor(i / perWeek);
        var posInWeek = i % perWeek;
        var weeksBeforeFinal = (totalWeeksNeeded - 1) - weekIdx;
        var d = new Date(finalWeekStart);
        d.setDate(d.getDate() - weeksBeforeFinal * 7 + weekOffsets[posInWeek]);
        var dateISO = toLocalISO(d);
        var growth = 1 + SIMULATION_GROWTH * (total > 1 ? (i / (total - 1)) : 1);
        var entry = { date: dateISO, exercises: {} };
        var hasAny = false;
        day.exercises.forEach(function(ex){
          if(isCombo(ex.name)) return;
          var normName = ex.name.trim().toLowerCase();
          var explicitCount = parseInt(ex.sets, 10);
          var count = (explicitCount && explicitCount > 0) ? explicitCount : 1;
          var targetReps = toNumber(ex.reps);
          var repsVal = isFinite(targetReps) ? targetReps : 1;
          var sets = [];
          if(ex.intensity && ex.intensity.isMax){
            var weight = roundToStep(simulationBaseline(ex.name) * growth, 2.5);
            for(var k=0;k<count;k++){ sets.push({ weight: String(weight), reps: String(repsVal), notes: "" }); }
            state.manualMax[normName] = { weight: weight, date: dateISO };
          } else if(ex.intensity){
            var maxEntry = state.manualMax[normName];
            if(!maxEntry) return;
            var percents = ex.intensity.percents || [];
            for(var k2=0;k2<count;k2++){
              var pct = percents.length ? (percents[k2] !== undefined ? percents[k2] : percents[percents.length-1]) : 100;
              sets.push({ weight: String(roundToStep(maxEntry.weight * pct / 100, 2.5)), reps: String(repsVal), notes: "" });
            }
          } else {
            var weight2 = roundToStep(simulationBaseline(ex.name) * growth, 2.5);
            for(var k3=0;k3<count;k3++){ sets.push({ weight: String(weight2), reps: String(repsVal), notes: "" }); }
          }
          if(sets.length === 0) return;
          entry.exercises[ex.id] = { name: ex.name, sets: sets, loggedAt: dateISO + "T12:00:00.000Z" };
          if(!isCombo(ex.name)){
            state.lastSet[normName] = { sets: sets.map(function(s){ return { weight: s.weight, reps: s.reps }; }), date: dateISO };
          }
          hasAny = true;
        });
        if(hasAny){
          await storeSet("entries:" + dateISO, JSON.stringify(entry));
          simDates.push(dateISO);
        }
      }
      await saveLastSet();
      await saveManualMax();
      state.simulation = { active: true, dates: simDates };
      await saveSimulationState();
      state.historyDates = undefined;
      state.historyCache = {};
      state.kehitys = undefined;
      state.todayEntry = await loadEntry(state.draftDate);
      showToast("Simulointi käynnistetty — " + simDates.length + " päivää täytetty");
    }catch(e){
      showToast("Simulointi epäonnistui: " + ((e && e.message) || String(e)), 4200);
    }finally{
      state.simulationBusy = false;
      render();
    }
  }
  async function stopSimulation(){
    if(state.simulationBusy) return;
    state.simulationBusy = true;
    render();
    try{
      var dates = (state.simulation && state.simulation.dates) || [];
      var names = {};
      for(var i=0;i<dates.length;i++){
        var entry = await loadEntry(dates[i]);
        Object.keys(entry.exercises || {}).forEach(function(ek){
          var nm = (entry.exercises[ek].name || "").trim().toLowerCase();
          if(nm) names[nm] = true;
        });
        await storeDelete("entries:" + dates[i]);
      }
      var nameList = Object.keys(names);
      for(var j=0;j<nameList.length;j++){
        await rebuildTrackersForName(nameList[j]);
        await rebuildManualMaxForName(nameList[j]);
      }
      await saveManualMax();
      state.simulation = { active: false, dates: [] };
      await saveSimulationState();
      state.historyDates = undefined;
      state.historyCache = {};
      state.kehitys = undefined;
      state.todayEntry = await loadEntry(state.draftDate);
      showToast("Simulointi sammutettu ja poistettu");
    }catch(e){
      showToast("Simuloinnin sammutus epäonnistui: " + ((e && e.message) || String(e)), 4200);
    }finally{
      state.simulationBusy = false;
      render();
    }
  }

  async function computeDefaultActiveWeek(){
    if(!state.program || !state.program.weeks || state.program.weeks.length === 0){
      state.activeWeek = null;
      return;
    }
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=dates.length-1;i>=0;i--){
        var entry = await loadEntry(dates[i]);
        var exKeys = Object.keys(entry.exercises || {});
        exKeys.sort(function(a,b){
          var la = entry.exercises[a].loggedAt || "";
          var lb = entry.exercises[b].loggedAt || "";
          return lb < la ? -1 : (lb > la ? 1 : 0);
        });
        for(var j=0;j<exKeys.length;j++){
          var grp = findGroupForExerciseId(exKeys[j]);
          if(grp && grp.week){ state.activeWeek = grp.week; return; }
        }
      }
    }catch(e){}
    state.activeWeek = state.program.weeks[0];
  }

  async function exportAllCSV(){

          var kind = data.kind || "plain";
          (data.sets || []).forEach(function(s, idx){
            rows.push([date, exName, idx+1, s.weight || "", s.reps || "", (s.notes || "").replace(/"/g,'""'), kind]);
          });
        });
      }
      var csv = rows.map(function(r){ return r.map(function(v){ return '"' + String(v) + '"'; }).join(","); }).join("\n");
      // UTF-8-BOM eteen, jotta Excel (etenkin Windowsilla) ei arvaa merkistöksi
      // ANSI/Windows-1252:tä ja muuta ä/ö-merkkejä symboleiksi tiedostoa avattaessa.
      var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "treenipaivakirja_" + todayISO() + ".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Vienti valmis");
    }catch(e){ showToast("Viennin luonti epäonnistui"); }
  }

  function parseEntriesCSV(text){
    text = text.replace(/^\uFEFF/, "");
    var rows = parseCSV(text);
    if(rows.length === 0) throw new Error("Tiedosto on tyhjä.");
    var headers = Object.keys(rows[0]);
    function findCol(cands){
      return headers.find(function(h){ return cands.some(function(c){ return h === c || h.indexOf(c) !== -1; }); });
    }
    var cDate = findCol(["päivämäärä","paivamaara","date","pvm"]);
    var cName = findCol(["liike","exercise","harjoitus"]);
    var cSet  = findCol(["sarja","set"]);
    var cW    = findCol(["paino","weight","kg"]);
    var cReps = findCol(["toistot","toistoa","reps"]);
    var cNote = findCol(["huomiot","huomio","notes","kommentti"]);
    var cKind = findCol(["tyyppi","kind"]);
    if(!cDate || !cName) throw new Error("Tiedostosta puuttuu päivämäärä- tai liikesarake. Käytä tällä sovelluksella tehtyä vientitiedostoa.");

    var byDate = {};
    var counters = {};
    rows.forEach(function(row){
      var date = (row[cDate] || "").trim();
      var name = (row[cName] || "").trim();
      if(!date || !name) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      var kind = cKind ? ((row[cKind] || "").trim().toLowerCase() || "plain") : "plain";
      if(["max","percent","plain"].indexOf(kind) === -1) kind = "plain";
      var setNo = cSet ? parseInt(row[cSet], 10) : NaN;

      if(!byDate[date]) { byDate[date] = []; counters[date] = null; }
      var blocks = byDate[date];
      var lastBlock = blocks.length ? blocks[blocks.length-1] : null;
      var startsNew = !lastBlock || lastBlock.name !== name || lastBlock.kind !== kind ||
                      (isFinite(setNo) && setNo === 1);
      if(startsNew){
        lastBlock = { name: name, kind: kind, sets: [] };
        blocks.push(lastBlock);
      }
      lastBlock.sets.push({
        weight: cW ? String(row[cW] || "").trim() : "",
        reps: cReps ? String(row[cReps] || "").trim() : "",
        notes: cNote ? String(row[cNote] || "").trim() : ""
      });
    });
    return byDate;
  }

  async function importEntriesFile(file){
    var text;
    try{ text = await readFileAsText(file); }
    catch(e){ showToast("Tiedoston luku epäonnistui"); return; }

    var byDate;
    try{ byDate = parseEntriesCSV(text); }
    catch(e){ showToast(e.message || "Tuonti epäonnistui", 4500); return; }

    var dates = Object.keys(byDate);
    if(dates.length === 0){ showToast("Tiedostosta ei löytynyt tuotavia merkintöjä", 4000); return; }

    var addedBlocks = 0, skippedBlocks = 0, touchedNames = {}, failedDates = 0;
    for(var i=0;i<dates.length;i++){
      var date = dates[i];
      var entry = await loadEntry(date);
      if(!entry.exercises) entry.exercises = {};
      var existingKeys = Object.keys(entry.exercises);
      var signatures = {};
      existingKeys.forEach(function(k){
        var d = entry.exercises[k];
        var sig = (d.name || "").trim().toLowerCase() + "|" + (d.kind || "plain") + "|" +
          (d.sets || []).map(function(s){ return (s.weight||"") + "x" + (s.reps||""); }).join(";");
        signatures[sig] = true;
      });

      var counter = 0;
      byDate[date].forEach(function(block){
        var sig = block.name.trim().toLowerCase() + "|" + block.kind + "|" +
          block.sets.map(function(s){ return (s.weight||"") + "x" + (s.reps||""); }).join(";");
        if(signatures[sig]){ skippedBlocks++; return; }
        var newId;
        do { newId = "imp-" + date + "-" + (counter++); } while(entry.exercises.hasOwnProperty(newId));
        entry.exercises[newId] = {
          name: block.name,
          sets: block.sets,
          kind: block.kind,
          loggedAt: date + "T12:00:00.000Z"
        };
        signatures[sig] = true;
        touchedNames[block.name.trim().toLowerCase()] = block.name;
        addedBlocks++;
      });

      try{ await storeSet("entries:" + date, JSON.stringify(entry)); }
      catch(e){ failedDates++; }
    }

    var names = Object.keys(touchedNames);
    for(var j=0;j<names.length;j++){ await rebuildTrackersForName(touchedNames[names[j]]); }

    state.historyDates = undefined;
    state.historyCache = {};
    state.kehitys = undefined;
    state.draftSets = {};
    state.dirtySets = {};
    state.autoCalcInfo = {};
    state.openExercise = null;
    state.todayEntry = await loadEntry(state.draftDate);

    var msg = "Tuotu " + addedBlocks + " merkintää";
    if(skippedBlocks > 0) msg += ", ohitettu " + skippedBlocks + " jo olemassa olevaa";
    if(failedDates > 0) msg += " — " + failedDates + " päivän tallennus epäonnistui";
    showToast(msg, 4500);
    render();
  }

  function computeRestRemaining(){
    if(!state.restTimer) return 0;
    return Math.max(0, Math.round((state.restTimer.endAt - Date.now()) / 1000));
  }

  function paintRestTimerCount(remaining){
    var mins = Math.floor(remaining / 60), secs = remaining % 60;
    var text = mins + ":" + (secs < 10 ? "0" + secs : secs);
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.textContent = text;
    var miniCountEl = document.getElementById("rest-timer-mini-count");
    if(miniCountEl) miniCountEl.textContent = text;

  async function requestRestWakeLock(){
    // Wake Lock estää vain näytön automaattisen himmenemisen/sammumisen levon
    // aikana — se EI estä käyttäjää itse lukitsemasta puhelinta virtapainikkeella
    // eikä sovelluksesta poistumista, joten se ratkaisee vain osan ongelmasta.

  function playRestTimerSound(){
    try{
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      var ctx = new AudioCtx();
      var beepAt = function(t){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      };
      var now = ctx.currentTime;
      beepAt(now); beepAt(now + 0.45); beepAt(now + 0.9);
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1600);
    }catch(e){ /* Web Audio ei käytettävissä, ei kriittinen */ }
  }

  function vibrateRestTimerEnd(){
    // HUOM: iOS Safari ei tue Vibration API:a lainkaan — navigator.vibrate
    // puuttuu tai ei tee mitään, joten värinä ei toimi iPhonella. Ääni yhdessä
    // ruudun väriväläyksen kanssa on iOS:lla ainoa luotettava ilmoituskanava.
    try{ if(navigator.vibrate){ navigator.vibrate([200,100,200,100,400]); } }catch(e){}
  }

  function notifyRestTimerEnd(){
    // Parhaan yrityksen lisäominaisuus: iOS Safari ei pysty näyttämään
    // ilmoitusta luotettavasti kun sovellusprosessi on kokonaan taustalla tai
    // suljettu, koska se vaatisi push-palvelimen — sovelluksella ei ole eikä
    // roadmapin/README:n mukaisesti tule olemaan palvelinpuolta. Toimii
    // parhaiten Androidilla tai kun sivu on auki taustavälilehtenä.
    try{
      if("Notification" in window && Notification.permission === "granted"){
        new Notification("Lepo ohi", { body: "Seuraava sarja odottaa.", tag: "treenipk-rest" });
      }
    }catch(e){}
  }

  function finishRestTimer(){
    clearInterval(window.__restTimerInterval);
    state.restTimer = null;
    persistRestTimer(null);
    releaseRestWakeLock();
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    el.style.background = "var(--brass)";
    paintRestTimerCount(0);
    // Kirkkaalla taustavälähdyksellä lukemat ja teksti vaihtuvat tummiksi,
    // jotta ne pysyvät luettavina — muuten ne sulautuisivat samaan brass-väriin.
    // Ilmoitus EI sulkeudu itsestään (aiemmin 3 sekunnin setTimeout) — käyttäjän
    // on suljettava se itse "Pienennä"- tai "Lopeta lepo" -painikkeesta, jotta
    // ilmoitus ei ehdi jäädä huomaamatta ennen katoamistaan.
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.style.color = "var(--ink)";
    var statusEl = document.getElementById("rest-timer-status");
    if(statusEl){ statusEl.textContent = "Lepo ohi"; statusEl.style.color = "var(--ink)"; }
    playRestTimerSound();
    vibrateRestTimerEnd();
    if(document.hidden) notifyRestTimerEnd();
    render();
  }

  function stopRestTimer(){
    clearInterval(window.__restTimerInterval);
    state.restTimer = null;
    persistRestTimer(null);
    releaseRestWakeLock();
    var el = document.getElementById("rest-timer-overlay");
    if(el){ el.style.display = "none"; el.style.background = "var(--ink)"; }
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    render();
  }

  function startRestTimer(seconds){
    if(!state.restTimerEnabled) return;
    clearInterval(window.__restTimerInterval);
    state.restTimer = { endAt: Date.now() + seconds * 1000, seconds: seconds };
    persistRestTimer(state.restTimer);
    requestRestWakeLock();
    // Ilmoituslupa kysytään vain ensimmäisellä käynnistyskerralla: jos selain on
    // jo joskus vastannut (granted/denied), Notification.permission ei enää ole
    // "default", joten kysely ei toistu uudestaan myöhemmillä käynnistyksillä.
    try{
      if("Notification" in window && Notification.permission === "default"){
        Notification.requestPermission();
      }
    }catch(e){}
    var mini = document.getElementById("rest-timer-mini");
    if(mini) mini.style.display = "none";
    var el = ensureRestTimerOverlay();
    el.style.display = "flex";
    el.style.background = "var(--ink)";
    // Palautetaan värit oletukseen, jos edellinen ajastin ehti juuri päättyä
    // (var(--ink)-taustalla lukemat eivät saa jäädä tummiksi edellisen
    // väläytyksen jäljiltä).
    var countEl = document.getElementById("rest-timer-count");
    if(countEl) countEl.style.color = "var(--brass)";
    var statusEl = document.getElementById("rest-timer-status");
    if(statusEl){ statusEl.textContent = ""; statusEl.style.color = "var(--chalk)"; }
    updateRestTimerDisplay();
    window.__restTimerInterval = setInterval(updateRestTimerDisplay, 1000);
    render();
  }

  function handleRestTimerVisibilityChange(){
    if(!state.restTimer) return;
    // setInterval hidastuu tai pysähtyy kokonaan taustalla/lukitulla näytöllä,
    // joten jäljellä oleva aika lasketaan aina uudelleen oikeasta kellonajasta
    // sen sijaan että luotettaisiin tikityksen kertymään.
    updateRestTimerDisplay();
    if(state.restTimer && document.visibilityState === "visible"){
      requestRestWakeLock();
    }
  }

  window.addEventListener("focus", handleRestTimerVisibilityChange);
  window.addEventListener("pageshow", handleRestTimerVisibilityChange);

  function tehoBadge(ex){

      label = ex.intensity.percents.map(function(p){ return String(p).replace(".", ","); }).join("/") + " %";

      return "";

    return '<span style="display:inline-block; margin-left:8px; padding:2px 7px; border-radius:999px; font-size:10.5px; font-weight:800; letter-spacing:.02em; background:' + bg + '; color:' + fg + '; vertical-align:middle;">' + escapeHtml(label) + '</span>';
  }
  function renderDaySummary(day){
    var totalKg = 0;
    day.exercises.forEach(function(ex){
      var data = state.todayEntry.exercises[ex.id];
      (data.sets || []).forEach(function(s){
        var w = toNumber(s.weight), r = toNumber(s.reps);
        if(isFinite(w) && isFinite(r)) totalKg += w * r;
      });
    });
    var dateStr = capitalize(formatDateFI(state.todayEntry.date || state.draftDate));
    var detailParts = [dateStr, day.exercises.length + " liikettä"];
    if(totalKg > 0) detailParts.push(totalKg.toLocaleString("fi-FI") + " kg nostettu");
    return '<div class="exercise" style="border-color:rgba(111,174,111,0.35);">' +

  function autoCalcHint(info, id){
    if(!info) return "";
    var text;
    if(info.type === "max"){
      var maxWeightStr = String(info.weight).replace(".", ",") + " kg";
      if(info.isMax){
        text = "Paino perustuu manuaalisesti syötettyyn 1RM:ään (" + maxWeightStr + ") — muokattavissa.";
      } else {
        var pctStr = (info.percents || []).map(function(p){ return String(p).replace(".", ",") + " %"; }).join(" / ");
        text = "Paino laskettu " + pctStr + " liikkeen 1RM:stä (" + maxWeightStr + ") — muokattavissa.";
      }
    } else if(info.type === "formula"){
      var progressionStr = String(Math.round(info.progressionPercent * 100) / 100).replace(".", ",");
      text = "Paino laskettu Epley-kaavalla edellisestä merkinnästä (" + String(info.refWeight).replace(".", ",") + " kg × " + info.refReps + " toistoa, " + info.date + "), tavoitteena " + progressionStr + " % kehitys — muokattavissa.";
    } else if(info.type === "saved"){
      text = "Tämä merkintä on jo tallennettu tälle päivälle — arvot ladattu aiemmasta tallennuksesta, ei tuoreesta laskennasta.";
    } else {
      return "";
    }
    var html = '<div style="font-size:11.5px; color:var(--mist); margin-bottom:10px; line-height:1.4;">' + text;
    if(info.type === "saved"){
      html += '<button class="btn-secondary" data-recalc data-id="' + id + '" type="button" style="margin-top:8px; padding:8px; font-size:12px; width:auto; display:block;">Poista merkintä ja laske uudelleen</button>';
    }
    html += '</div>';
    return html;
  }

        '<input class="ledger-input" type="text" placeholder="huom." data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="notes" value="' + escapeHtml(s.notes) + '">' +

      '<div class="subtotal"><span>Nostettu yhteensä</span><b>' + (total>0 ? total.toLocaleString("fi-FI") : "0") + ' kg</b></div>' +
      (allDone ? "" : '<div style="font-size:11.5px; color:var(--mist); margin-top:8px; text-align:center;">Merkitse jokainen sarja valmiiksi (✓) ennen tallennusta.</div>') +
      '<button class="save-btn" data-save-ex data-id="' + ex.id + '" type="button"' + (allDone ? "" : " disabled") + '>Tallenna merkintä</button>' +

  function fmtSignedKg(diff){
    var rounded = Math.round(diff * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return "+" + str + " kg";
    if(rounded < 0) return "−" + str + " kg";
    return "0 kg";
  }
  function fmtSignedPct(pct){
    if(pct === null || !isFinite(pct)) return "";
    var rounded = Math.round(pct * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return " (+" + str + " %)";
    if(rounded < 0) return " (−" + str + " %)";
    return " (0 %)";
  }
  function renderDeltaValue(current, past){
    if(past === null || past === undefined){
      return '<span style="color:var(--mist);">Ei dataa</span>';
    }
    var diff = current - past;
    var pct = (past !== 0) ? (diff / past * 100) : null;
    var color = diff > 0 ? "var(--brass)" : (diff < 0 ? "var(--danger-text)" : "var(--mist)");
    return '<span style="color:' + color + '; font-variant-numeric:tabular-nums; font-weight:600;">' + fmtSignedKg(diff) + fmtSignedPct(pct) + '</span>';
  }
  function renderOneRepMaxChart(points, name){

  function renderProgressChart(points, titlePrefix, unit){
    // Staattinen, yleiskäyttöinen SVG-viivakäyrä (käytetään sekä liikkeen
    // laskennalliselle 1RM:lle että treenipäivän kokonaispainolle). Vaaka-akseli
    // skaalataan todellisen ajan mukaan, jotta treenitauot näkyvät käyrässä.
    // Toimii myös yhden pisteen sarjalla: silloin piirretään pelkkä keskitetty
    // piste ilman viivaa (polyline/polygon jäävät ilman pinta-alaa yhdellä
    // koordinaatilla).
    if(!points || points.length === 0) return "";
    var i;
    var times = [], values = [];
    for(i=0;i<points.length;i++){
      times.push(new Date(points[i].date + "T00:00:00").getTime());
      values.push(points[i].value);
    }
    var tMin = times[0], tMax = times[times.length - 1];
    var vMin = values[0], vMax = values[0];
    for(i=1;i<values.length;i++){
      if(values[i] < vMin) vMin = values[i];
      if(values[i] > vMax) vMax = values[i];
    }
    var calcMin, calcMax;
    if(vMax === vMin){
      calcMin = vMin - 1;
      calcMax = vMax + 1;
    } else {
      var pad = (vMax - vMin) * 0.08;
      calcMin = vMin - pad;
      calcMax = vMax + pad;
    }
    function round1(v){ return Math.round(v * 10) / 10; }
    function xAt(t){
      if(tMax === tMin) return 175;
      return round1(40 + (t - tMin) / (tMax - tMin) * 270);
    }
    function yAt(v){ return round1(110 - (v - calcMin) / (calcMax - calcMin) * 98); }
    function fmtValue(v){ return String(v).replace(".", ","); }

    var coords = [];
    for(i=0;i<points.length;i++){
      coords.push({ x: xAt(times[i]), y: yAt(values[i]) });
    }
    var last = coords[coords.length - 1];
    var linePoints = coords.map(function(c){ return c.x + "," + c.y; }).join(" ");
    var areaPoints = coords[0].x + ",110 " + linePoints + " " + last.x + ",110";

    var dots = "";
    if(coords.length <= 14){
      dots = coords.map(function(c){
        return '<circle cx="' + c.x + '" cy="' + c.y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
      }).join("");
    } else {
      dots = '<circle cx="' + coords[0].x + '" cy="' + coords[0].y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
    }
    dots += '<circle cx="' + last.x + '" cy="' + last.y + '" r="3.5" fill="var(--brass)" stroke="none"></circle>';

    var label = (points.length === 1)
      ? titlePrefix + " " + formatDateShortFI(points[0].date) + ", " + fmtValue(values[0]) + " " + unit
      : titlePrefix + " " +
        formatDateShortFI(points[0].date) + "–" + formatDateShortFI(points[points.length - 1].date) + ", " +
        fmtValue(values[0]) + " " + unit + " → " + fmtValue(values[values.length - 1]) + " " + unit;
    var safeLabel = escapeHtml(label);

    var xAxisLabels = (points.length === 1)
      ? '<text x="175" y="126" text-anchor="middle" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>'
      : '<text x="40" y="126" text-anchor="start" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>' +
        '<text x="310" y="126" text-anchor="end" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[points.length - 1].date)) + '</text>';

    return '<svg viewBox="0 0 320 130" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block; height:auto; margin:2px 0 12px;" role="img" aria-label="' + safeLabel + '">' +
      '<title>' + safeLabel + '</title>' +
      '<line x1="40" y1="12" x2="310" y2="12" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<line x1="40" y1="110" x2="310" y2="110" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<polygon points="' + areaPoints + '" fill="rgba(201,162,39,0.10)" stroke="none"></polygon>' +
      '<polyline points="' + linePoints + '" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      dots +
      '<text x="34" y="' + round1(yAt(vMax) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMax) + '</text>' +
      '<text x="34" y="' + round1(yAt(vMin) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMin) + '</text>' +
      xAxisLabels +
      '</svg>';
  }
