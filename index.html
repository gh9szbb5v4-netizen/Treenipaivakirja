  function renderOhjelma(){
    var html = renderImportNameWarnings() +
      '<div class="date-picker-row"><label for="log-date">Kirjataan päivälle</label>' +
      '<input type="date" id="log-date" value="' + state.draftDate + '"></div>';

    var hasWeeks = state.program.weeks && state.program.weeks.length > 0;
    var groupsToShow = state.program.days;

    if(hasWeeks){
      if(!state.showAllWeeks){
        html += renderWeekStepper();
        groupsToShow = state.program.days.filter(function(d){ return d.week === state.activeWeek; });
      }
      html += '<div style="text-align:center; margin:2px 0 14px;"><button data-toggle-week-view type="button" style="background:none; border:none; color:var(--mist); font-size:12px; text-decoration:underline; padding:6px 4px;">' +
        (state.showAllWeeks ? "Näytä vain nykyinen viikko" : "Näytä koko ohjelma") + '</button></div>';
    }

    if(groupsToShow.length === 0){
      html += '<div class="empty">Tälle viikolle ei löytynyt liikkeitä.</div>';
    }
    groupsToShow.forEach(function(day){
      html += '<div class="day-heading">' + escapeHtml(day.name) + '</div>';
      // Jokainen treenipäivä niputetaan omaksi kortikseen riippumatta siitä,
      // onko sen liikkeitä vielä tehty — ei enää vain valmiiksi merkityille
      // päiville. Kortti on oletuksena kiinni (state.expandedDaySummaries
      // avaa sen), jotta ohjelmanäkymä pysyy skannattavana useamman päivän
      // ohjelmissa.
      var fullyDone = isDayFullyDone(day);
      if(!state.expandedDaySummaries[dayKey(day)]){
        html += renderDaySummary(day, fullyDone);
      } else {
        html += '<div style="text-align:center; margin:-2px 0 10px;"><button data-toggle-day-summary data-key="' + escapeHtml(dayKey(day)) + '" type="button" style="background:none; border:none; color:var(--mist); font-size:12px; text-decoration:underline; padding:6px 4px;">' + (fullyDone ? "Piilota valmiit liikkeet" : "Piilota liikkeet") + '</button></div>';
        day.exercises.forEach(function(ex){ html += renderExercise(ex); });
      }
    });
    // Kenttä, josta ohjelmaan kuulumattoman liikkeen sai lisätä käsin, on
    // poistettu näkymästä: yksittäisen liikkeen lisääminen ei ole hyödyllinen
    // ilman laajempaa ohjelman muokkausta (lisää/poista/järjestä), joka on
    // vasta suunnitteilla. Liikkeiden lukurakenne (state.manualExercises,
    // allExercises, getExerciseGroupList) on jätetty koskematta, joten
    // toiminnon palauttaminen vaatii vain syöttökentän ja sen käsittelijän
    // palauttamisen. Lista renderöidään yhä, jos taulukkoon joskus tulee
    // sisältöä muuta kautta.
    if(state.manualExercises.length){
      html += '<div class="day-heading">Lisätyt liikkeet</div>';
      state.manualExercises.forEach(function(ex){ html += renderExercise(ex); });
    }
    html += renderProgramNotes();
    return html;
  }
  function tehoBadge(ex){
    if(!ex.intensity) return "";
    var label, bg, fg, bd;
    if(ex.intensity.isMax){
      // MAX erottuu ääriviivamerkkinä, prosenttiteho täytettynä harmaana.
      label = "MAX"; bg = "transparent"; fg = "var(--brass)"; bd = "var(--brass)";
    } else if(ex.intensity.percents && ex.intensity.percents.length){
      label = ex.intensity.percents.map(function(p){ return String(p).replace(".", ","); }).join("/") + " %";
      bg = "rgba(136,145,160,0.2)"; fg = "var(--chalk)"; bd = "transparent";
    } else {
      return "";
    }
    return '<span style="display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:800; letter-spacing:.02em; background:' + bg + '; color:' + fg + '; border:1px solid ' + bd + '; vertical-align:middle;">' + escapeHtml(label) + '</span>';
  }
  function renderDaySummary(day, fullyDone){
    var totalKg = 0;
    var latestDate = null;
    var doneCount = 0;
    day.exercises.forEach(function(ex){
      var logged = state.exerciseLogIndex[ex.id];
      if(!logged) return;
      doneCount++;
      if(latestDate === null || logged.date > latestDate) latestDate = logged.date;
      (logged.data.sets || []).forEach(function(s){
        var w = toNumber(s.weight), r = toNumber(s.reps);
        if(isFinite(w) && isFinite(r)) totalKg += w * r;
      });
    });
    var total = day.exercises.length;
    var title, badgeHtml, borderStyle;
    if(fullyDone){
      title = "Treeni merkitty tehdyksi";
      borderStyle = "border-color:rgba(111,174,111,0.35);";
      badgeHtml = '<div style="width:26px; height:26px; border-radius:50%; background:var(--success); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; flex-shrink:0;">✓</div>';
    } else if(doneCount > 0){
      title = "Treeni kesken";
      borderStyle = "";
      badgeHtml = '<div style="width:26px; height:26px; border-radius:50%; border:1.5px solid var(--brass); color:var(--brass); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;">' + doneCount + "/" + total + '</div>';
    } else {
      title = "Treeniä ei vielä aloitettu";
      borderStyle = "";
      badgeHtml = '<div style="width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line-strong); flex-shrink:0;"></div>';
    }
    var detailParts = [];
    if(doneCount > 0) detailParts.push(capitalize(formatDateFI(latestDate || state.draftDate)));
    detailParts.push(total + " liikettä");
    if(totalKg > 0) detailParts.push(totalKg.toLocaleString("fi-FI") + " kg nostettu");
    return '<div class="exercise" style="' + borderStyle + '">' +
      '<div class="exercise-head" data-toggle-day-summary data-key="' + escapeHtml(dayKey(day)) + '" role="button" tabindex="0" aria-expanded="false">' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
      badgeHtml +
      '<div><div class="exercise-name">' + title + '</div>' +
      '<div class="exercise-target">' + escapeHtml(detailParts.join(" · ")) + '</div></div>' +
      '</div><div class="chevron">›</div></div>' +
      '</div>';
  }
  function renderExercise(ex){
    var open = state.openExercise === ex.id;
    var isSaved = isExerciseLogged(ex);
    var parts = [];
    if(ex.sets) parts.push(ex.sets + " sarjaa");
    if(ex.reps) parts.push(ex.reps + (ex.unit ? " " + ex.unit : ""));
    if(ex.weight) parts.push(ex.weight + " kg");
    if(ex.notes) parts.push(ex.notes);
    // Menetelmä (rest-pause, Cluster, drop) kuuluu tavoiteriville, mutta vain
    // kerran: jäsennin on osalle riveistä jo kopioinut sen huomautukseen.
    if(ex.method && String(ex.notes || "").indexOf(ex.method) === -1) parts.push(ex.method);
    var target = parts.join(" · ");
    var badge = isSaved
      ? '<div title="Tallennettu" style="width:22px; height:22px; border-radius:50%; background:var(--success); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; margin-left:8px;">✓</div>'
      : '';
    // Avoinna oleva liike suljetaan aina nuolesta erikseen, koskematta
    // tallennustilaan — muuten (kiinni) koko otsikkorivi avaa liikkeen.
    var chevronHtml = open
      ? '<button type="button" class="chevron-btn" data-close-ex data-id="' + ex.id + '" aria-label="Sulje liike"><span class="chevron">›</span></button>'
      : '<div class="chevron">›</div>';
    // Otsikkorivi on pelkkä säiliö; painikkeena toimii sen sisällä oleva nimiosa.
    // Näin sulkunuoli ei jää interaktiivisen elementin sisään (nested-interactive).
    return '<div class="exercise ' + (open ? "open" : "") + '" style="' + (isSaved ? "border-color:rgba(111,174,111,0.35);" : "") + '">' +
      '<div class="exercise-head">' +
      '<div class="exercise-head-main" data-toggle-ex data-id="' + ex.id + '" role="button" tabindex="0" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<div class="exercise-name">' + escapeHtml(ex.name) + tehoBadge(ex) + '</div>' +
      (target ? '<div class="exercise-target">' + escapeHtml(target) + '</div>' : '') +
      '</div><div style="display:flex; align-items:center;">' + badge + chevronHtml + '</div></div>' +
      (open ? renderLedger(ex) : '') +
      '</div>';
  }
  function autoCalcHint(info, id){
    if(!info) return "";
    var text;
    if(info.type === "max"){
      var maxWeightStr = String(info.weight).replace(".", ",") + " kg";
      if(info.isMax){
        text = "Paino perustuu manuaalisesti syötettyyn 1RM:ään (" + maxWeightStr + ") — muokattavissa.";
      } else {
        var pctStr = (info.percents || []).map(function(p){ return String(p).replace(".", ",") + " %"; }).join(" / ");
        text = "Paino laskettu " + pctStr + " liikkeen 1RM:stä (" + maxWeightStr + ") — muokattavissa.";
      }
    } else if(info.type === "formula"){
      var progressionStr = String(Math.round(info.progressionPercent * 100) / 100).replace(".", ",");
      text = "Paino laskettu Epley-kaavalla edellisestä merkinnästä (" + String(info.refWeight).replace(".", ",") + " kg × " + info.refReps + " toistoa, " + info.date + "), tavoitteena " + progressionStr + " % kehitys — muokattavissa.";
    } else if(info.type === "saved"){
      text = "Tämä merkintä on jo tallennettu (" + capitalize(formatDateFI(info.date)) + ") — arvot ladattu aiemmasta tallennuksesta, ei tuoreesta laskennasta.";
    } else {
      return "";
    }
    var html = '<div style="font-size:11.5px; color:var(--mist); margin-bottom:10px; line-height:1.4;">' + text;
    if(info.type === "saved"){
      html += '<button class="btn-secondary" data-recalc data-id="' + id + '" type="button" style="margin-top:8px; padding:8px; font-size:12px; width:auto; display:block;">Poista merkintä ja laske uudelleen</button>';
    }
    html += '</div>';
    return html;
  }
  function renderVariantInfo(ex){
    // Näkyy aina kun liike tunnistetaan katalogista ja sillä on variaatioita —
    // myös teholiikkeille, joilla ohjattua valintaa ei ole.
    var match = resolveCatalogMatch(ex.name);
    if(!match) return "";
    var vOpts = variaatioOptionsFor(match.liike);
    if(!vOpts.options.length) return "";
    var row = findVariantRow(match.liike, match.variaatio, match.lisavariaatio);
    var lihasryhma = (row && row.lihasryhma) ? row.lihasryhma : muscleGroupForLiike(match.liike);
    return '<div style="color:var(--mist); font-size:11.5px; line-height:1.5; margin-bottom:10px;">' +
      'Tunnetut variaatiot: ' + escapeHtml(vOpts.options.join(", ")) +
      (lihasryhma ? '<br>Lihasryhmä: ' + escapeHtml(lihasryhma) : "") +
      '</div>';
  }
  // Valmentajan selitys menetelmälle (esim. "Cluster = ...") kulkee ohjelman
  // mukana ja näytetään juuri sen liikkeen kohdalla, jota se koskee — muuten
  // liikkeille, joille painoa ei voi laskea, ei jäisi mitään ohjetta.
  function renderMethodNote(ex){
    if(!ex.methodNote) return "";
    return '<div style="background:rgba(201,162,39,0.10); border-left:2px solid var(--brass); border-radius:var(--radius-sm); padding:8px 10px; margin-bottom:10px; font-size:12px; line-height:1.5;">' +
      (ex.method ? '<b style="color:var(--brass);">' + escapeHtml(ex.method) + ':</b> ' : '') +
      escapeHtml(ex.methodNote) + '</div>';
  }
  function renderLedger(ex){
    var sets = state.draftSets[ex.id] || [{ weight:"", reps:"", notes:"", done:false }];
    var hint = renderVariantInfo(ex) + renderMethodNote(ex) + autoCalcHint(state.autoCalcInfo[ex.id], ex.id);
    var rows = sets.map(function(s, idx){
      // Sarjan numero on pelkkä visuaalinen merkki — hyväksyntä tehdään aina
      // erillisestä, selvästi nimetystä painikkeesta pikasäätönappien rivillä,
      // koska numeron toimiminen myös hyväksyntäpainikkeena ei ollut selvää.
      return '<div class="ledger-row">' +
        '<div class="set-num' + (s.done ? " done" : "") + '" aria-hidden="true">' + (s.done ? "✓" : String(idx+1)) + '</div>' +
        '<input class="ledger-input" type="text" inputmode="decimal" placeholder="kg" aria-label="Sarja ' + (idx+1) + ' paino kiloina" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="weight" value="' + escapeHtml(s.weight) + '">' +
        '<input class="ledger-input" type="text" inputmode="numeric" placeholder="toistot" aria-label="Sarja ' + (idx+1) + ' toistot" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="reps" value="' + escapeHtml(s.reps) + '">' +
        '<input class="ledger-input" type="text" placeholder="huom." aria-label="Sarja ' + (idx+1) + ' huomiot" data-set-field data-id="' + ex.id + '" data-idx="' + idx + '" data-field="notes" value="' + escapeHtml(s.notes) + '">' +
        '<button class="remove-set" data-remove-set data-id="' + ex.id + '" data-idx="' + idx + '" type="button" aria-label="Poista sarja">×</button>' +
        '</div>' +
        '<div class="weight-step-row">' +
        '<div class="weight-step-spacer" aria-hidden="true"></div>' +
        '<button class="weight-step-btn" data-weight-step data-id="' + ex.id + '" data-idx="' + idx + '" data-step="-2.5" type="button" aria-label="Vähennä painoa 2,5 kg">−2,5 kg</button>' +
        '<button class="weight-step-btn" data-weight-step data-id="' + ex.id + '" data-idx="' + idx + '" data-step="2.5" type="button" aria-label="Lisää painoa 2,5 kg">+2,5 kg</button>' +
        '<button type="button" class="set-done-btn" data-toggle-done data-id="' + ex.id + '" data-idx="' + idx + '" aria-pressed="' + (s.done ? "true" : "false") + '" aria-label="' + (s.done ? "Sarja " + (idx+1) + " merkitty valmiiksi" : "Merkitse sarja " + (idx+1) + " valmiiksi") + '">✓</button>' +
        '</div>';
    }).join("");
    var total = sets.reduce(function(sum, s){
      var w = parseFloat(String(s.weight).replace(",", ".")), r = parseFloat(String(s.reps).replace(",", "."));
      return sum + ((isFinite(w) && isFinite(r)) ? w*r : 0);
    }, 0);
    var allDone = isExerciseFullyDone(ex, ex.id);
    return '<div class="ledger">' +
      hint +
      '<div class="ledger-row ledger-head"><div></div><div>Paino</div><div>Toistot</div><div>Huom.</div><div></div></div>' +
      rows +
      '<button class="add-set-btn" data-add-set data-id="' + ex.id + '" type="button">+ Lisää sarja</button>' +
      '<div class="subtotal"><span>Nostettu yhteensä</span><b>' + (total>0 ? total.toLocaleString("fi-FI") : "0") + ' kg</b></div>' +
      (allDone ? "" : '<div style="font-size:11.5px; color:var(--mist); margin-top:8px; text-align:center;">Merkitse jokainen sarja valmiiksi (✓) ennen tallennusta.</div>') +
      '<button class="save-btn" data-save-ex data-id="' + ex.id + '" type="button"' + (allDone ? "" : " disabled") + '>Tallenna merkintä</button>' +
      renderSwapExercise(ex) +
      '</div>';
  }
  var VARIANT_ADD_NEW = "__addnew__";
  var VARIANT_PLAIN = "__plain__";

  function knownMuscleGroups(){
    var seen = {};
    var groups = [];
    allExerciseVariants().forEach(function(row){
      if(row.lihasryhma && !seen[row.lihasryhma]){ seen[row.lihasryhma] = true; groups.push(row.lihasryhma); }
    });
    groups.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return groups;
  }
  function muscleGroupForLiike(liike){
    // Liikkeen lihasryhmä on sen ensimmäisen katalogirivin mukainen.
    var rows = variantRowsForLiike(liike);
    return (rows.length && rows[0].lihasryhma) ? rows[0].lihasryhma : null;
  }
  function variantPickerValid(){
    var p = state.variantPicker;
    if(!p) return false;
    if(p.addNew) return !!String(p.newLiike || "").trim();
    if(!p.liike) return false;
    // Kelvollinen valinta on sellainen, jota vastaava rivi löytyy katalogista:
    // jos jokin taso on vielä valitsematta eikä liikkeellä ole sen tason
    // perusversiota, riviä ei löydy eikä vaihtoa voi vahvistaa.
    return !!findVariantRow(p.liike, p.variaatio, p.lisavariaatio);
  }
  function variantSelectOptions(list, selected, hasPlain, placeholder){
    var html = '<option value=""' + (selected ? "" : " selected") + '>' + escapeHtml(placeholder) + '</option>';
    if(hasPlain){
      html += '<option value="' + VARIANT_PLAIN + '"' + (selected === VARIANT_PLAIN ? " selected" : "") + '>Ei variaatiota</option>';
    }
    list.forEach(function(opt){
      html += '<option value="' + escapeHtml(opt) + '"' + (selected === opt ? " selected" : "") + '>' + escapeHtml(opt) + '</option>';
    });
    return html;
  }
  function renderVariantPickerAddNew(){
    var p = state.variantPicker;
    var groups = knownMuscleGroups();
    var groupOptions = '<option value="">Lihasryhmä (valinnainen)</option>';
    groups.forEach(function(g){

  function renderVariantNameHint(similar){

  // Liikelista lihasryhmittäin <optgroup>-ryhminä. Yhteinen sekä liikkeen

  function exerciseOptionsByGroup(selected){
    var byGroup = {};
    var groupOrder = [];
    knownBaseExerciseNames().forEach(function(name){
      var g = muscleGroupForLiike(name) || "Muut";
      if(!byGroup[g]){ byGroup[g] = []; groupOrder.push(g); }
      byGroup[g].push(name);

    groupOrder.sort(function(a, b){ return a.localeCompare(b, "fi"); });

      html += '<optgroup label="' + escapeHtml(g) + '">';

        html += '<option value="' + escapeHtml(name) + '"' + (selected === name ? " selected" : "") + '>' + escapeHtml(name) + '</option>';
      });
      html += '</optgroup>';

  function renderSwapExercise(ex){

  // Lähdetiedoston ohjeteksti ei ole roskaa: se kulkee ohjelman mukana

  function renderNotesList(notes){
    var byFile = [];
    var index = {};
    notes.forEach(function(n){
      var key = n.file || "";
      if(index[key] === undefined){ index[key] = byFile.length; byFile.push({ file: key, lines: [] }); }
      byFile[index[key]].lines.push(n.text);

    var multi = byFile.length > 1;
    return byFile.map(function(group){
      return (multi && group.file ? '<div style="color:var(--brass); font-size:11.5px; font-weight:700; margin:10px 0 4px;">' + escapeHtml(group.file) + '</div>' : '') +
        group.lines.map(function(t){
          return '<div style="color:var(--mist); font-size:12.5px; line-height:1.55; margin-bottom:4px;">' + escapeHtml(t) + '</div>';
        }).join("");
    }).join("");

  function renderProgramNotes(){

  function renderProgramReview(){

  function fmtSignedKg(diff){
    var rounded = Math.round(diff * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return "+" + str + " kg";
    if(rounded < 0) return "−" + str + " kg";
    return "0 kg";
  }
  function fmtSignedPct(pct){
    if(pct === null || !isFinite(pct)) return "";
    var rounded = Math.round(pct * 10) / 10;
    var abs = Math.abs(rounded);
    var str = (Math.round(abs * 10) % 10 === 0) ? String(Math.round(abs)) : String(abs.toFixed(1));
    str = str.replace(".", ",");
    if(rounded > 0) return " (+" + str + " %)";
    if(rounded < 0) return " (−" + str + " %)";
    return " (0 %)";
  }
  function renderDeltaValue(current, past){
    if(past === null || past === undefined){
      return '<span style="color:var(--mist);">Ei dataa</span>';
    }
    var diff = current - past;
    var pct = (past !== 0) ? (diff / past * 100) : null;
    var color = diff > 0 ? "var(--brass)" : (diff < 0 ? "var(--danger-text)" : "var(--mist)");
    return '<span style="color:' + color + '; font-variant-numeric:tabular-nums; font-weight:600;">' + fmtSignedKg(diff) + fmtSignedPct(pct) + '</span>';
  }
  function renderOneRepMaxChart(points, name){

  function renderProgressChart(points, titlePrefix, unit){
    // Staattinen, yleiskäyttöinen SVG-viivakäyrä (käytetään sekä liikkeen
    // laskennalliselle 1RM:lle että treenipäivän kokonaispainolle). Vaaka-akseli
    // skaalataan todellisen ajan mukaan, jotta treenitauot näkyvät käyrässä.
    // Toimii myös yhden pisteen sarjalla: silloin piirretään pelkkä keskitetty
    // piste ilman viivaa (polyline/polygon jäävät ilman pinta-alaa yhdellä
    // koordinaatilla).
    if(!points || points.length === 0) return "";
    var i;
    var times = [], values = [];
    for(i=0;i<points.length;i++){
      times.push(new Date(points[i].date + "T00:00:00").getTime());
      values.push(points[i].value);
    }
    var tMin = times[0], tMax = times[times.length - 1];
    var vMin = values[0], vMax = values[0];
    for(i=1;i<values.length;i++){
      if(values[i] < vMin) vMin = values[i];
      if(values[i] > vMax) vMax = values[i];
    }
    var calcMin, calcMax;
    if(vMax === vMin){
      calcMin = vMin - 1;
      calcMax = vMax + 1;
    } else {
      var pad = (vMax - vMin) * 0.08;
      calcMin = vMin - pad;
      calcMax = vMax + pad;
    }
    function round1(v){ return Math.round(v * 10) / 10; }
    function xAt(t){
      if(tMax === tMin) return 175;
      return round1(40 + (t - tMin) / (tMax - tMin) * 270);
    }
    function yAt(v){ return round1(110 - (v - calcMin) / (calcMax - calcMin) * 98); }
    function fmtValue(v){ return String(v).replace(".", ","); }

    var coords = [];
    for(i=0;i<points.length;i++){
      coords.push({ x: xAt(times[i]), y: yAt(values[i]) });
    }
    var last = coords[coords.length - 1];
    var linePoints = coords.map(function(c){ return c.x + "," + c.y; }).join(" ");
    var areaPoints = coords[0].x + ",110 " + linePoints + " " + last.x + ",110";

    var dots = "";
    if(coords.length <= 14){
      dots = coords.map(function(c){
        return '<circle cx="' + c.x + '" cy="' + c.y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
      }).join("");
    } else {
      dots = '<circle cx="' + coords[0].x + '" cy="' + coords[0].y + '" r="2.5" fill="var(--ink)" stroke="var(--brass)" stroke-width="1.5"></circle>';
    }
    dots += '<circle cx="' + last.x + '" cy="' + last.y + '" r="3.5" fill="var(--brass)" stroke="none"></circle>';

    var label = (points.length === 1)
      ? titlePrefix + " " + formatDateShortFI(points[0].date) + ", " + fmtValue(values[0]) + " " + unit
      : titlePrefix + " " +
        formatDateShortFI(points[0].date) + "–" + formatDateShortFI(points[points.length - 1].date) + ", " +
        fmtValue(values[0]) + " " + unit + " → " + fmtValue(values[values.length - 1]) + " " + unit;
    var safeLabel = escapeHtml(label);

    var xAxisLabels = (points.length === 1)
      ? '<text x="175" y="126" text-anchor="middle" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>'
      : '<text x="40" y="126" text-anchor="start" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[0].date)) + '</text>' +
        '<text x="310" y="126" text-anchor="end" font-size="9" fill="var(--mist)">' + escapeHtml(formatDateShortFI(points[points.length - 1].date)) + '</text>';

    return '<svg viewBox="0 0 320 130" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block; height:auto; margin:2px 0 12px;" role="img" aria-label="' + safeLabel + '">' +
      '<title>' + safeLabel + '</title>' +
      '<line x1="40" y1="12" x2="310" y2="12" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<line x1="40" y1="110" x2="310" y2="110" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"></line>' +
      '<polygon points="' + areaPoints + '" fill="rgba(201,162,39,0.10)" stroke="none"></polygon>' +
      '<polyline points="' + linePoints + '" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      dots +
      '<text x="34" y="' + round1(yAt(vMax) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMax) + '</text>' +
      '<text x="34" y="' + round1(yAt(vMin) + 3) + '" text-anchor="end" font-size="9" fill="var(--mist)">' + fmtValue(vMin) + '</text>' +
      xAxisLabels +
      '</svg>';
  }

      if(state.draftSets[id3] && state.draftSets[id3][idx3]){
        var current3 = toNumber(state.draftSets[id3][idx3].weight);
        if(!isFinite(current3)) current3 = 0;
        var next3 = Math.max(0, roundToStep(current3 + step3, 2.5));

      if(row4.done){

        // Ajastin käynnistyy sarjan valmiiksi merkitsemisestä heti, paitsi kun

        if(!isExerciseFullyDone(ex4, id4)){

      var logged = state.exerciseLogIndex[rid];
      if(logged){
        try{

          delete entryToEdit.exercises[rid];

      if(rex){ state.draftSets[rid] = buildDraftRows(rex, rid); }
      showToast("Merkintä poistettu, ehdotus laskettu uudelleen");

    if((el = e.target.closest("#simulation-toggle-btn"))){

      else{ await runSimulation(); }

    if((el = e.target.closest("#reset-btn"))){

      else{ await resetAll(); }

    if((el = e.target.closest("[data-history-date]"))){ await toggleHistoryDate(el.dataset.date); return; }
    if((el = e.target.closest("[data-delete-history]"))){
      var d = el.dataset.date;
      if(state.confirmingDeleteDate !== d){ state.confirmingDeleteDate = d; render(); }
      else{ await deleteHistoryEntry(d); }
      return;

    if((el = e.target.closest("#save-max-btn"))){
      var nameInput = document.getElementById("max-name-input");
      var weightInput = document.getElementById("max-weight-input");
      var mName = nameInput.value.trim();
      var mWeight = toNumber(weightInput.value);
      if(!mName){ showToast("Kirjoita liikkeen nimi"); return; }
      if(!isFinite(mWeight) || mWeight <= 0){ showToast("Kirjoita kelvollinen paino"); return; }
      state.manualMax[mName.toLowerCase()] = { weight: mWeight, date: todayISO() };
      await saveManualMax();
      nameInput.value = ""; weightInput.value = "";
      showToast("1RM tallennettu");
      render();
      return;
    }
    if((el = e.target.closest("[data-toggle-rest-enabled]"))){
      state.restTimerEnabled = !state.restTimerEnabled;
      if(!state.restTimerEnabled && state.restTimer){
        // Ajastimen kytkeminen pois käytöstä lopettaa myös juuri käynnissä
        // olevan levon välittömästi, ei vasta seuraavasta sarjasta alkaen.
        stopRestTimer();
      }
      await saveRestEnabled();
      showToast(state.restTimerEnabled ? "Lepoajastin käytössä" : "Lepoajastin pois käytöstä");
      render();
      return;
    }
    if((el = e.target.closest("#save-rest-duration-btn"))){
      var restInput = document.getElementById("rest-duration-input");
      var restSeconds = parseInt(restInput.value, 10);
      if(!isFinite(restSeconds) || restSeconds <= 0){ showToast("Kirjoita kelvollinen aika sekunteina"); return; }
      state.restDurationSeconds = restSeconds;
      await saveRestDuration();
      showToast("Lepoajastin tallennettu");
      render();
      return;
    }
    if((el = e.target.closest("[data-delete-max]"))){
      var mKey = el.dataset.name;
      if(state.confirmingDeleteMax !== mKey){ state.confirmingDeleteMax = mKey; render(); return; }
      delete state.manualMax[mKey];
      await saveManualMax();
      state.confirmingDeleteMax = null;
      showToast("1RM poistettu");
      render();
      return;
    }
  });

  app.addEventListener("change", function(e){
    if(e.target.id === "csv-input-initial" || e.target.id === "csv-input-settings"){
      var file = e.target.files[0];
      if(file) handleFile(file);
      return;
    }
    if(e.target.id === "pdf-input-initial" || e.target.id === "pdf-input-settings"){
      var pdfFiles = Array.prototype.slice.call(e.target.files || []);
      e.target.value = "";
      if(pdfFiles.length) handlePdfFiles(pdfFiles);
      return;
    }
    if(e.target.id === "import-entries-input"){
      var impFile = e.target.files[0];
      if(impFile){ showToast("Tuodaan merkintöjä…"); importEntriesFile(impFile); }
      e.target.value = "";
      return;
    }
    if(e.target.id === "log-date"){ changeLogDate(e.target.value); return; }
    if(state.builder && state.builder.picker){
      var bp = state.builder.picker;
      var bval = e.target.value;
      if(e.target.hasAttribute("data-builder-liike")){
        // Ylemmän tason vaihto nollaa aina alemmat tasot — sama sääntö kuin
        // liikkeen vaihdon valitsimessa.
        bp.free = (bval === VARIANT_ADD_NEW);
        bp.liike = (bval && bval !== VARIANT_ADD_NEW) ? bval : null;
        bp.variaatio = null; bp.lisavariaatio = null;
        bp.variaatioTouched = false; bp.lisavariaatioTouched = false;
        render();
        return;
      }
      if(e.target.hasAttribute("data-builder-variaatio")){
        bp.variaatio = (bval && bval !== VARIANT_PLAIN) ? bval : null;
        bp.variaatioTouched = !!bval;
        bp.lisavariaatio = null; bp.lisavariaatioTouched = false;
        render();
        return;
      }
      if(e.target.hasAttribute("data-builder-lisavariaatio")){
        bp.lisavariaatio = (bval && bval !== VARIANT_PLAIN) ? bval : null;
        bp.lisavariaatioTouched = !!bval;
        render();
        return;
      }
    }
    if(state.variantPicker){
      var pv = state.variantPicker;
      var val = e.target.value;
      if(e.target.id === "swap-all-weeks"){ pv.allWeeks = e.target.checked; return; }
      if(e.target.hasAttribute("data-variant-liike")){
        if(val === VARIANT_ADD_NEW){
          state.variantPicker = { liike: null, variaatio: null, lisavariaatio: null, addNew: true,
            newLiike: "", newVariaatio: "", newLisavariaatio: "", newLihasryhma: "", nameHint: null };
        } else {
          // Ylemmän tason vaihto nollaa aina alemmat tasot.
          pv.liike = val || null;
          pv.variaatio = null; pv.lisavariaatio = null;
          pv.variaatioTouched = false; pv.lisavariaatioTouched = false;
        }
        render();
        return;
      }
      if(e.target.hasAttribute("data-variant-variaatio")){
        pv.variaatio = (val && val !== VARIANT_PLAIN) ? val : null;
        pv.variaatioTouched = !!val;
        pv.lisavariaatio = null; pv.lisavariaatioTouched = false;
        render();
        return;
      }
      if(e.target.hasAttribute("data-variant-lisavariaatio")){
        pv.lisavariaatio = (val && val !== VARIANT_PLAIN) ? val : null;
        pv.lisavariaatioTouched = !!val;
        render();
        return;
      }
      if(e.target.hasAttribute("data-variant-new-lihasryhma")){
        pv.newLihasryhma = val;
        return;
      }
    }
  });

  app.addEventListener("input", function(e){
    var field = e.target.closest("[data-set-field]");
    if(field){
      var id = field.dataset.id, idx = parseInt(field.dataset.idx, 10), key = field.dataset.field;
      var row = state.draftSets[id] && state.draftSets[id][idx];
      if(row){
        row[key] = field.value;
        state.dirtySets[id] = true;
        // Jos muokkaus vie sarjan pois "valmis"-kelpoisuudesta (esim. paino
        // tyhjennetään), valmiiksi-merkintä puretaan. Ei render()-kutsua, jotta
        // fokus ei katoa kirjoitettaessa — merkki päivittyy seuraavassa piirrossa.
        if(row.done){
          var fieldEx = findExerciseById(id);
          if(fieldEx && !isRowDoneEligible(fieldEx, row)) row.done = false;
        }
      }
      return;
    }
    var reviewField = e.target.closest("[data-review-field]");
    if(reviewField && state.pdfImport){
      // Arvo talteen suoraan jäsennystulokseen ilman render()-kutsua, jotta
      // fokus ei katoa kesken kirjoittamisen.
      var rDay = state.pdfImport.program.days[parseInt(reviewField.dataset.di, 10)];
      var rEx = rDay && rDay.exercises[parseInt(reviewField.dataset.ei, 10)];
      if(rEx) rEx[reviewField.dataset.field] = reviewField.value;
      return;
    }
    var builderFieldEl = e.target.closest("[data-builder-field]");
    if(builderFieldEl && state.builder){
      // Arvo talteen suoraan luonnokseen ilman render()-kutsua, jotta fokus ei
      // katoa kesken kirjoittamisen — sama ratkaisu kuin tarkistusnäkymässä.
      var bWeek = state.builder.weeks[parseInt(builderFieldEl.dataset.wi, 10)];
      var bFieldName = builderFieldEl.dataset.field;
      if(!bWeek) return;
      if(bFieldName === "weekLabel"){ bWeek.label = builderFieldEl.value; return; }
      var bDay = bWeek.days[parseInt(builderFieldEl.dataset.di, 10)];
      if(!bDay) return;
      if(bFieldName === "dayName"){ bDay.name = builderFieldEl.value; return; }
      var bEx = bDay.exercises[parseInt(builderFieldEl.dataset.ei, 10)];
      if(bEx) bEx[bFieldName] = builderFieldEl.value;
      return;
    }
    if(state.builder && state.builder.picker && e.target.hasAttribute && e.target.hasAttribute("data-builder-free-name")){
      // Kuten vapaassa nimikentässä liikkeen vaihdossa: arvo talteen ilman
      // uudelleenpiirtoa, ja "Lisää liike" -napin tila päivitetään suoraan.
      state.builder.picker.freeName = e.target.value;
      var builderAddBtn = document.querySelector("[data-builder-picker-add]");
      if(builderAddBtn) builderAddBtn.disabled = !builderPickerValid();
      return;
    }
    if(state.variantPicker && state.variantPicker.addNew){
      // Kirjoitettu arvo talteen ilman render()-kutsua, jotta fokus säilyy.
      // "Vaihda"-napin tila päivitetään suoraan, koska sekin riippuu nimestä.
      var pi = state.variantPicker;
      if(e.target.hasAttribute("data-variant-new-liike")) pi.newLiike = e.target.value;
      else if(e.target.hasAttribute("data-variant-new-variaatio")) pi.newVariaatio = e.target.value;
      else if(e.target.hasAttribute("data-variant-new-lisavariaatio")) pi.newLisavariaatio = e.target.value;
      else return;
      var confirmBtn = document.querySelector("[data-swap-confirm]");
      if(confirmBtn) confirmBtn.disabled = !variantPickerValid();
    }
  });

  // Kirjoitusasun tarkistus vasta kentästä poistuttaessa, ei joka
  // näppäimenpainalluksella. Vihjerivi päivitetään suoraan DOM:iin, jotta
  // uudelleenpiirto ei vie fokusta tai nappia klikkauksen alta.
  app.addEventListener("focusout", function(e){
    if(state.builder && state.builder.picker && e.target.hasAttribute && e.target.hasAttribute("data-builder-free-name")){
      var bTyped = String(e.target.value || "").trim();
      var bSimilar = bTyped ? findSimilarName(bTyped, knownBaseExerciseNames()) : null;
      state.builder.picker.nameHint = bSimilar;
      var bHintEl = document.getElementById("builder-name-hint");
      if(bHintEl) bHintEl.innerHTML = bSimilar ? renderVariantNameHint(bSimilar) : "";
      return;
    }
    if(!state.variantPicker || !state.variantPicker.addNew) return;
    if(!e.target.hasAttribute || !e.target.hasAttribute("data-variant-new-liike")) return;
    var typed = String(e.target.value || "").trim();
    var similar = typed ? findSimilarName(typed, knownBaseExerciseNames()) : null;
    state.variantPicker.nameHint = similar;
    var hintEl = document.getElementById("variant-name-hint");
    if(hintEl) hintEl.innerHTML = similar ? renderVariantNameHint(similar) : "";
  });

  app.addEventListener("keydown", function(e){
    // Välilehdet, liikeotsikot ja historian päivät ovat div-elementtejä, joten
    // Enter ja välilyönti ohjataan olemassa olevaan click-käsittelijään.
    if(e.key !== "Enter" && e.key !== " ") return;
    var el = e.target.closest("[data-tab], [data-toggle-ex], [data-history-date], [data-toggle-day-summary]");
    if(!el) return;
    e.preventDefault();
    el.click();
  });

  // ---------- init ----------
  render();
  (async function init(){
    if(!window.storage || typeof window.storage.get !== "function" || typeof window.storage.set !== "function"){
      demoteStorage(new Error("Claude-tallennusrajapintaa ei löydy"), true);
    } else {
      await storeSet("storage-check", "ok");
    }
    state.storageMode = storageMode;
    try{
      var res = await storeGet(STORAGE_PROGRAM_KEY);
      if(res && res.value) state.program = JSON.parse(res.value);
    }catch(e){}
    if(state.program && state.program.days){
      var migrated = false;
      state.program.days.forEach(function(day){
        if(!("week" in day)){
          var wm = /^Viikko\s+(\S+)/.exec(day.name);
          day.week = wm ? wm[1] : null;
          migrated = true;
        }
        (day.exercises || []).forEach(function(ex){
          if(!("unit" in ex)){ ex.unit = ""; migrated = true; }
          if(!("intensity" in ex)){
            ex.intensity = parseIntensity(ex.notes);
            migrated = true;
          }
        });
      });
      if(!state.program.weeks){
        var wOrder = [];
        state.program.days.forEach(function(d){ if(d.week && wOrder.indexOf(d.week) === -1) wOrder.push(d.week); });
        state.program.weeks = wOrder;
        migrated = true;
      }
      if(migrated){
        try{ await saveProgram(); }catch(e){}
      }
    }
    try{
      var lastRes = await storeGet(STORAGE_LASTSET_KEY);
      if(lastRes && lastRes.value) state.lastSet = JSON.parse(lastRes.value);
    }catch(e){}
    try{
      var manualMaxRes = await storeGet(STORAGE_MANUAL_MAX_KEY);
      if(manualMaxRes && manualMaxRes.value) state.manualMax = JSON.parse(manualMaxRes.value);
    }catch(e){}
    try{
      var userExRes = await storeGet(STORAGE_USER_EXERCISES_KEY);
      if(userExRes && userExRes.value) state.userExercises = JSON.parse(userExRes.value);
    }catch(e){}
    try{
      var simRes = await storeGet(STORAGE_SIMULATION_KEY);
      if(simRes && simRes.value) state.simulation = JSON.parse(simRes.value);
    }catch(e){}
    try{
      var versionRes = await storeGet(STORAGE_APP_VERSION_KEY);
      state.storedAppVersion = (versionRes && versionRes.value) ? versionRes.value : null;
      if(state.storedAppVersion !== APP_VERSION){ await saveAppVersion(); }
    }catch(e){}
    try{
      var consentRes = await storeGet(STORAGE_CONSENT_KEY);
      if(consentRes && consentRes.value === "1"){ state.consentGiven = true; }
    }catch(e){}
    state.consentChecked = true;
    try{
      var homescreenHintRes = await storeGet(STORAGE_HOMESCREEN_HINT_KEY);
      if(homescreenHintRes && homescreenHintRes.value === "1"){ state.homescreenHintDismissed = true; }
    }catch(e){}
    try{
      var lastExportRes = await storeGet(STORAGE_LAST_EXPORT_KEY);
      if(lastExportRes && lastExportRes.value){ state.lastExportDate = lastExportRes.value; }
    }catch(e){}
    try{
      var restDurationRes = await storeGet(STORAGE_REST_DURATION_KEY);
      var storedRestDuration = restDurationRes ? parseInt(restDurationRes.value, 10) : NaN;
      if(isFinite(storedRestDuration) && storedRestDuration > 0){ state.restDurationSeconds = storedRestDuration; }
    }catch(e){}
    try{
      var restEnabledRes = await storeGet(STORAGE_REST_ENABLED_KEY);
      if(restEnabledRes && restEnabledRes.value === "0"){ state.restTimerEnabled = false; }
    }catch(e){}
    try{
      // Jos sivu ladataan kokonaan uudelleen kesken lepotauon (ei vain
      // taustalle siirryttäessä), käynnissä ollut ajastin jatkuu tallennetusta
      // päättymisajasta; jo umpeutunut ajastin siivotaan hiljaa pois.
      var restTimerRes = await storeGet(STORAGE_REST_TIMER_KEY);
      if(restTimerRes && restTimerRes.value){
        var restored = JSON.parse(restTimerRes.value);
        if(restored && isFinite(restored.endAt) && restored.endAt > Date.now()){
          state.restTimer = restored;
          var restoredEl = ensureRestTimerOverlay();
          restoredEl.style.display = "flex";
          activateRestTimerOverlay(restoredEl);
          updateRestTimerDisplay();
          window.__restTimerInterval = setInterval(updateRestTimerDisplay, 1000);
          requestRestWakeLock();
        } else {
          await persistRestTimer(null);
        }
      }
    }catch(e){}
    if(state.program){
      try{ state.todayEntry = await loadEntry(state.draftDate); }
      catch(e){ state.todayEntry = { date: state.draftDate, exercises:{} }; }
      state.exerciseLogIndex = await buildExerciseLogIndex();
      await computeDefaultActiveWeek();
    }
    state.loading = false;
    render();
  })();
})();
</script>
</body>
</html>
