    if((el = e.target.closest("[data-variant-cancel-new]"))){
      // Takaisin listavalintaan; kirjoitetut kentät unohdetaan.
      state.variantPicker = { liike: null, variaatio: null, lisavariaatio: null, addNew: false };
      render();
      return;
    }
    if((el = e.target.closest("[data-swap-confirm]"))){
      var confirmId = el.dataset.id;
      var confirmEx = findExerciseById(confirmId);
      if(confirmEx && !confirmEx.intensity && state.variantPicker){
        var p = state.variantPicker;
        if(!variantPickerValid()) return;
        var chosen;
        if(p.addNew){
          chosen = await addUserExerciseVariant({
            liike: p.newLiike,
            variaatio: p.newVariaatio,
            lisavariaatio: p.newLisavariaatio,
            lihasryhma: p.newLihasryhma
          });
          if(!chosen) return;
        } else {
          chosen = { liike: p.liike, variaatio: p.variaatio, lisavariaatio: p.lisavariaatio };
        }
        var allWeeksBox = document.getElementById("swap-all-weeks");
        state.variantPicker = null;
        await performExerciseSwap(confirmId, composeVariantName(chosen.liike, chosen.variaatio, chosen.lisavariaatio), !!(allWeeksBox && allWeeksBox.checked));
        return;
      }
      await swapProgramExercise(confirmId);
      return;
    }
    if((el = e.target.closest("[data-close-ex]"))){
      // Nuolesta sulkeminen on pelkkä näkymän piilotus — ei koske
      // draftSets/dirtySets/todayEntry-tilaan, joten tallennustila säilyy
      // täsmälleen sellaisena kuin se oli ennen sulkemista.
      state.openExercise = null;
      render();
      return;
    }
    if((el = e.target.closest("[data-toggle-ex]"))){ await toggleExercise(el.dataset.id); return; }
    if((el = e.target.closest("[data-toggle-day-summary]"))){
      var summaryKey = el.dataset.key;
      state.expandedDaySummaries[summaryKey] = !state.expandedDaySummaries[summaryKey];
      render();
      return;
    }
    if((el = e.target.closest("[data-start-day]"))){
      // Avaa päivän ja sen ensimmäisen kirjaamattoman liikkeen yhdellä
      // napautuksella — treenin aloitus ei vaadi kahta askelta.
      var startKey = el.dataset.key;
      state.expandedDaySummaries[startKey] = true;
      var startDay = null;
      state.program.days.forEach(function(d){ if(dayKey(d) === startKey) startDay = d; });
      var firstEx = startDay ? startDay.exercises.filter(function(x){ return !isExerciseLogged(x); })[0] : null;
      if(firstEx && state.openExercise !== firstEx.id){ await toggleExercise(firstEx.id); }
      else { render(); }
      return;
    }
    if((el = e.target.closest("[data-week-mode]"))){
      state.showAllWeeks = (el.dataset.weekMode === "all");
      render();
      return;
    }
    if((el = e.target.closest("[data-set-more]"))){
      var moreId = el.dataset.id, moreIdx = parseInt(el.dataset.idx, 10);
      if(!state.setExtra[moreId]) state.setExtra[moreId] = {};
      state.setExtra[moreId][moreIdx] = !state.setExtra[moreId][moreIdx];
      render();
      return;
    }
    if((el = e.target.closest("[data-add-set]"))){
      var id1 = el.dataset.id;
      if(!state.draftSets[id1]) state.draftSets[id1] = [];
      state.draftSets[id1].push({ weight:"", reps:"", notes:"", done:false, kind:"work" });
      state.dirtySets[id1] = true;
      render();
      return;
    }
    if((el = e.target.closest("[data-add-warmup]"))){
      var idw = el.dataset.id;
      if(!state.draftSets[idw]) state.draftSets[idw] = [];
      // Lämmittelyt ovat taulukon alussa; lepoajastinta ei käynnistetä.
      state.draftSets[idw].unshift({ weight:"", reps:"", rpe:null, notes:"", done:false, kind:"warmup" });
      state.dirtySets[idw] = true;
      render();
      return;
    }
    if((el = e.target.closest("[data-warmup-rpe]"))){
      var idr = el.dataset.id, idxr = parseInt(el.dataset.idx, 10);
      var rowr = state.draftSets[idr] && state.draftSets[idr][idxr];
      if(rowr){
        rowr.rpe = parseInt(el.dataset.rpe, 10);
        state.dirtySets[idr] = true;
        applyWarmupAdjustment(idr);
      }
      render();
      return;
    }
    if((el = e.target.closest("[data-remove-set]"))){
      var id2 = el.dataset.id, idx2 = parseInt(el.dataset.idx, 10);
      if(state.draftSets[id2]){
        state.draftSets[id2].splice(idx2, 1);
        if(state.draftSets[id2].length === 0) state.draftSets[id2].push({ weight:"", reps:"", notes:"", done:false, kind:"work" });
        state.dirtySets[id2] = true;
      }
      render();
      return;
    }
    if((el = e.target.closest("[data-weight-step]"))){
      var id3 = el.dataset.id, idx3 = parseInt(el.dataset.idx, 10), step3 = parseFloat(el.dataset.step);
      if(state.draftSets[id3] && state.draftSets[id3][idx3]){
        var current3 = toNumber(state.draftSets[id3][idx3].weight);
        if(!isFinite(current3)) current3 = 0;
        var next3 = Math.max(0, roundToStep(current3 + step3, 2.5));
        state.draftSets[id3][idx3].weight = String(next3);
        state.dirtySets[id3] = true;
      }
      render();
      return;
    }
    if((el = e.target.closest("[data-toggle-done]"))){
      var id4 = el.dataset.id, idx4 = parseInt(el.dataset.idx, 10);
      var ex4 = findExerciseById(id4);
      var row4 = state.draftSets[id4] && state.draftSets[id4][idx4];
      if(!ex4 || !row4){ return; }
      if(row4.done){
        row4.done = false;
        // Lämmittelyn peruminen lasketaan säätö uudelleen jäljellä olevista.
        if(isWarmupRow(row4)) applyWarmupAdjustment(id4);
      } else if(isRowDoneEligible(ex4, row4)){
        row4.done = true;
        state.justDone = { id: id4, idx: idx4 };
        if(isWarmupRow(row4)){
          // Lämmittely säätää työsarjat; lepoajastinta ei käynnistetä.
          applyWarmupAdjustment(id4);
        } else
        // Ajastin käynnistyy sarjan valmiiksi merkitsemisestä heti, paitsi kun
        // kyseessä on liikkeen VIIMEINEN vielä tekemätön sarja — silloin
        // seuraavaksi tallennetaan koko merkintä, ei levätä ennen seuraavaa
        // sarjaa (jota ei enää tule).
        if(!isExerciseFullyDone(ex4, id4)){
          startRestTimer(state.restDurationSeconds);
        }
      } else {
        showToast("Syötä paino ennen kuin merkitset sarjan valmiiksi");
        return;
      }
      state.dirtySets[id4] = true;
      // Kaikkien sarjojen valmiiksi merkitseminen EI enää sulje/tallenna liikettä
      // automaattisesti — liike jää auki "Tallenna merkintä" -painike aktiivisena,
      // ja käyttäjä päättää itse milloin tallentaa (ks. completeAndAdvance vain
      // data-save-ex-käsittelijässä ja avatun liikkeen otsikon klikkauksessa).
      render();
      return;
    }
    if((el = e.target.closest("[data-save-ex]"))){
      var saveId = el.dataset.id;
      var saveEx = findExerciseById(saveId);
      if(saveEx && !isExerciseFullyDone(saveEx, saveId)){
        showToast("Merkitse kaikki sarjat valmiiksi ennen tallennusta");
        return;
      }
      // Valmis-merkin animaatio: tallennettu liike ja mahdollisesti koko
      // valmistuva päivä saavat pop-luokan seuraavassa piirrossa.
      state.justSavedEx = saveId;
      var saveDay = findGroupForExerciseId(saveId);
      if(saveDay && saveDay.exercises.every(function(x){ return x.id === saveId || isExerciseLogged(x); })) state.justDoneDay = dayKey(saveDay);
      await completeAndAdvance(saveId);
      return;
    }
    if((el = e.target.closest("[data-recalc]"))){
      var rid = el.dataset.id;
      var rex = findExerciseById(rid);
      // Merkintä voi olla tallennettu millä päivälle tahansa (ei välttämättä
      // draftDate:lle) — poistetaan siltä oikealta päivältä, ei aina "tältä
      // päivältä", muuten poisto ei koskisi mitään ja vanha merkintä jäisi elämään.
      var logged = state.exerciseLogIndex[rid];
      if(logged){
        try{
          var entryToEdit = (logged.date === state.draftDate && state.todayEntry) ? state.todayEntry : await loadEntry(logged.date);
          delete entryToEdit.exercises[rid];
          await storeSet("entries:" + logged.date, JSON.stringify(entryToEdit));
          if(logged.date === state.draftDate) state.todayEntry = entryToEdit;
        }catch(e){ showToast("Poisto epäonnistui"); return; }
        delete state.exerciseLogIndex[rid];
      }
      if(rex){ await rebuildTrackersForName(rex.name); }
      delete state.draftSets[rid];
      delete state.dirtySets[rid];
      delete state.autoCalcInfo[rid];
      if(rex){ state.draftSets[rid] = buildDraftRows(rex, rid); }
      showToast("Merkintä poistettu, ehdotus laskettu uudelleen");
      render();
      return;
    }
    if((el = e.target.closest("[data-dismiss-import-warning]"))){
      state.importNameWarnings = [];
      render();
      return;
    }
    if((el = e.target.closest("#export-btn"))){ await exportAllCSV(); return; }
    if((el = e.target.closest("#export-pain-btn"))){ exportPainLogCSV(); return; }
    if((el = e.target.closest("#simulation-toggle-btn"))){
      if(state.simulationBusy) return;
      if(state.simulation.active){ await stopSimulation(); }
      else{ await runSimulation(); }
      return;
    }
    if((el = e.target.closest("#reset-btn"))){
      if(!state.confirmingReset){ state.confirmingReset = true; render(); }
      else{ await resetAll(); }
      return;
    }
    if((el = e.target.closest("[data-history-date]"))){ await toggleHistoryDate(el.dataset.date); return; }
    if((el = e.target.closest("[data-pain-open]"))){
      state.showPainForm = true;
      afterRender(function(){ var painSel = document.getElementById("pain-region"); if(painSel) painSel.focus(); });
      return;
    }
    if((el = e.target.closest("[data-pain-cancel]"))){
      state.showPainForm = false;
      state.painDraft = blankPainDraft();
      render();
      return;
    }
    if((el = e.target.closest("[data-pain-side]"))){
      painNoteFromDom();
      state.painDraft.side = el.dataset.side;
      render();
      return;
    }
    if((el = e.target.closest("[data-pain-severity]"))){
      painNoteFromDom();
      state.painDraft.severity = parseInt(el.dataset.severity, 10) || 1;
      render();
      return;
    }
    if((el = e.target.closest("[data-pain-save]"))){
      var painRegionEl = document.getElementById("pain-region");
      var painNoteEl = document.getElementById("pain-note");
      var painRegion = painRegionEl ? painRegionEl.value : "";
      var painNote = painNoteEl ? painNoteEl.value.trim() : "";
      if(!painRegion){ showToast("Valitse kehonosa"); return; }
      if(PAIN_PAIRED[painRegion] && !state.painDraft.side){ showToast("Valitse puoli"); return; }
      state.painLog.push({ id: "pain-" + Date.now(), date: state.draftDate, region: painRegion, side: PAIN_PAIRED[painRegion] ? state.painDraft.side : "", severity: state.painDraft.severity, note: painNote });
      await savePainLog();
      state.showPainForm = false;
      state.painDraft = blankPainDraft();
      // Kehitys lasketaan uudelleen seuraavalla avauksella.
      state.painAnalysis = undefined;
      state.kehitys = undefined;
      showToast("Vaiva kirjattu");
      render();
      return;
    }
    if((el = e.target.closest("[data-pain-delete]"))){
      var painId = el.dataset.id;
      if(state.confirmingDeletePain !== painId){ state.confirmingDeletePain = painId; render(); }
      else{
        state.painLog = state.painLog.filter(function(p){ return p.id !== painId; });
        state.confirmingDeletePain = null;
        await savePainLog();
        state.painAnalysis = undefined;
        // Poisto tehdään Kehitys-näkymässä, joten analyysi päivitetään heti.
        if(state.view === "kehitys") state.painAnalysis = await buildPainAnalysis();
        render();
      }
      return;
    }
    if((el = e.target.closest("[data-delete-history]"))){
      var d = el.dataset.date;
      if(state.confirmingDeleteDate !== d){ state.confirmingDeleteDate = d; render(); }
      else{ await deleteHistoryEntry(d); }
      return;
    }
    if((el = e.target.closest("#save-max-btn"))){
      var nameInput = document.getElementById("max-name-input");
      var weightInput = document.getElementById("max-weight-input");
      var mName = nameInput.value.trim();
      var mWeight = toNumber(weightInput.value);
      if(!mName){ showToast("Kirjoita liikkeen nimi"); return; }
      if(!isFinite(mWeight) || mWeight <= 0){ showToast("Kirjoita kelvollinen paino"); return; }
      state.manualMax[mName.toLowerCase()] = { weight: mWeight, date: todayISO() };
      await saveManualMax();
      nameInput.value = ""; weightInput.value = "";
      showToast("1RM tallennettu");
      render();
      return;
    }
    if((el = e.target.closest("[data-toggle-rest-enabled]"))){
      state.restTimerEnabled = !state.restTimerEnabled;
      if(!state.restTimerEnabled && state.restTimer){
        // Ajastimen kytkeminen pois käytöstä lopettaa myös juuri käynnissä
        // olevan levon välittömästi, ei vasta seuraavasta sarjasta alkaen.
        stopRestTimer();
      }
      await saveRestEnabled();
      showToast(state.restTimerEnabled ? "Lepoajastin käytössä" : "Lepoajastin pois käytöstä");
      render();
      return;
    }
    if((el = e.target.closest("#save-rest-duration-btn"))){
      var restInput = document.getElementById("rest-duration-input");
      var restSeconds = parseInt(restInput.value, 10);
      if(!isFinite(restSeconds) || restSeconds <= 0){ showToast("Kirjoita kelvollinen aika sekunteina"); return; }
      state.restDurationSeconds = restSeconds;
      await saveRestDuration();
      showToast("Lepoajastin tallennettu");
      render();
      return;
    }
    if((el = e.target.closest("[data-delete-max]"))){
      var mKey = el.dataset.name;
      if(state.confirmingDeleteMax !== mKey){ state.confirmingDeleteMax = mKey; render(); return; }
      delete state.manualMax[mKey];
      await saveManualMax();
      state.confirmingDeleteMax = null;
      showToast("1RM poistettu");
      render();
      return;
    }
  });

  app.addEventListener("change", function(e){
    if(state.editMode && e.target.hasAttribute && e.target.hasAttribute("data-editor-day-name")){
      if(!e.target.value.trim()){
        var rday = draftDayById(e.target.dataset.editorDayName);
        if(rday) e.target.value = rday.label;
        showToast("Päivän nimi ei voi olla tyhjä");
      }
      return;
    }
    if(e.target.id === "program-file-initial" || e.target.id === "program-file-settings"){
      var programFiles = Array.prototype.slice.call(e.target.files || []);
      e.target.value = "";
      handleProgramFiles(programFiles);
      return;
    }
    if(e.target.id === "import-entries-input"){
      var impFile = e.target.files[0];
      if(impFile){ showToast("Luetaan varmuuskopiota…"); readBackupFile(impFile); }
      e.target.value = "";
      return;
    }
    if(e.target.id === "pain-region"){
      painNoteFromDom();
      state.painDraft.region = e.target.value;
      state.painDraft.side = "";
      afterRender(function(){ var painSel = document.getElementById("pain-region"); if(painSel) painSel.focus(); });
      return;
    }
    if(e.target.id === "log-date"){ changeLogDate(e.target.value); return; }
    if(state.variantPicker){
      var pv = state.variantPicker;
      var val = e.target.value;
      if(e.target.id === "swap-all-weeks"){ pv.allWeeks = e.target.checked; return; }
      if(e.target.hasAttribute("data-variant-liike")){
        if(val === VARIANT_ADD_NEW){
          state.variantPicker = { liike: null, variaatio: null, lisavariaatio: null, addNew: true,
            newLiike: "", newVariaatio: "", newLisavariaatio: "", newLihasryhma: "", nameHint: null };
        } else {
          // Ylemmän tason vaihto nollaa aina alemmat tasot.
          pv.liike = val || null;
          pv.variaatio = null; pv.lisavariaatio = null;
          pv.variaatioTouched = false; pv.lisavariaatioTouched = false;
        }
        render();
        return;
      }
      if(e.target.hasAttribute("data-variant-variaatio")){
        pv.variaatio = (val && val !== VARIANT_PLAIN) ? val : null;
        pv.variaatioTouched = !!val;
        pv.lisavariaatio = null; pv.lisavariaatioTouched = false;
        render();
        return;
      }
      if(e.target.hasAttribute("data-variant-lisavariaatio")){
        pv.lisavariaatio = (val && val !== VARIANT_PLAIN) ? val : null;
        pv.lisavariaatioTouched = !!val;
        render();
        return;
      }
      if(e.target.hasAttribute("data-variant-new-lihasryhma")){
        pv.newLihasryhma = val;
        return;
      }
    }
  });

  app.addEventListener("input", function(e){
    if(e.target.id === "liike-haku"){
      // Hakulista päivitetään suoraan DOM:iin, jottei fokus katoa kentästä.
      state.editor.pickerQuery = e.target.value;
      var pickList = document.getElementById("liike-lista");
      if(pickList) pickList.innerHTML = renderExercisePickList(e.target.value);
      return;
    }
    if(state.editMode && state.programDraft){
      // Muokkaustilan kentät kirjoittavat suoraan luonnokseen ilman render()-
      // kutsua, jottei fokus katoa. Tyhjä päivän nimi hylätään change-
      // tapahtumassa (kentästä poistuttaessa).
      var pn = e.target.closest("[data-editor-program-name]");
      if(pn){ state.programDraft.name = pn.value; return; }
      var wn = e.target.closest("[data-editor-week-name]");
      if(wn){
        var wv = wn.value.trim();
        if(wv) state.programDraft.weekLabels[wn.dataset.editorWeekName] = wv;
        else delete state.programDraft.weekLabels[wn.dataset.editorWeekName];
        return;
      }
      var dn = e.target.closest("[data-editor-day-name]");
      if(dn){
        var dday = draftDayById(dn.dataset.editorDayName);
        if(dday && dn.value.trim()) dday.label = dn.value.trim();
        return;
      }
      var ff = e.target.closest("[data-editor-field]");
      if(ff && state.editor.form){ state.editor.form[ff.dataset.editorField] = ff.value; return; }
    }
    var field = e.target.closest("[data-set-field]");
    if(field){
      var id = field.dataset.id, idx = parseInt(field.dataset.idx, 10), key = field.dataset.field;
      var row = state.draftSets[id] && state.draftSets[id][idx];
      if(row){
        row[key] = field.value;
        state.dirtySets[id] = true;
        // Jos muokkaus vie sarjan pois "valmis"-kelpoisuudesta (esim. paino
        // tyhjennetään), valmiiksi-merkintä puretaan. Ei render()-kutsua, jotta
        // fokus ei katoa kirjoitettaessa — merkki päivittyy seuraavassa piirrossa.
        if(row.done){
          var fieldEx = findExerciseById(id);
          if(fieldEx && !isRowDoneEligible(fieldEx, row)) row.done = false;
        }
      }
      return;
    }
    if(state.variantPicker && state.variantPicker.addNew){
      // Kirjoitettu arvo talteen ilman render()-kutsua, jotta fokus säilyy.
      // "Vaihda"-napin tila päivitetään suoraan, koska sekin riippuu nimestä.
      var pi = state.variantPicker;
      if(e.target.hasAttribute("data-variant-new-liike")) pi.newLiike = e.target.value;
      else if(e.target.hasAttribute("data-variant-new-variaatio")) pi.newVariaatio = e.target.value;
      else if(e.target.hasAttribute("data-variant-new-lisavariaatio")) pi.newLisavariaatio = e.target.value;
      else return;
      var confirmBtn = document.querySelector("[data-swap-confirm]");
      if(confirmBtn) confirmBtn.disabled = !variantPickerValid();
    }
  });

  // Kirjoitusasun tarkistus vasta kentästä poistuttaessa, ei joka
  // näppäimenpainalluksella. Vihjerivi päivitetään suoraan DOM:iin, jotta
  // uudelleenpiirto ei vie fokusta tai nappia klikkauksen alta.
  // Kentän fokus tekee sarjasta aktiivisen: säätimet siirtyvät sen alle
  // suoraan DOM:ssa ilman render()-kutsua, jottei fokus katoa.
  app.addEventListener("focusin", function(e){
    var f = e.target.closest ? e.target.closest("[data-set-field]") : null;
    if(!f) return;
    var fid = f.dataset.id, fidx = parseInt(f.dataset.idx, 10);
    state.activeSet = { id: fid, idx: fidx };
    var ledger = f.closest(".ledger");
    if(!ledger) return;
    var rowsEl = ledger.querySelectorAll("[data-step-row]");
    for(var i=0;i<rowsEl.length;i++){
      var r = rowsEl[i];
      if(parseInt(r.dataset.idx, 10) === fidx) r.classList.remove("hidden"); else r.classList.add("hidden");
    }
  });
  app.addEventListener("focusout", function(e){
    if(!state.variantPicker || !state.variantPicker.addNew) return;
    if(!e.target.hasAttribute || !e.target.hasAttribute("data-variant-new-liike")) return;
    var typed = String(e.target.value || "").trim();
    var similar = typed ? findSimilarName(typed, knownBaseExerciseNames()) : null;
    state.variantPicker.nameHint = similar;
    var hintEl = document.getElementById("variant-name-hint");
    if(hintEl) hintEl.innerHTML = similar ? renderVariantNameHint(similar) : "";
  });

  // Escape kuunnellaan dokumenttitasolla: uudelleenpiirron jälkeen fokus voi
  // olla bodyssä, jolloin #app:n kuuntelija ei näkisi näppäintä lainkaan.
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && state.sheet){ e.preventDefault(); closeSheet(); }
    if(e.key === "Enter" && e.target && e.target.id === "liike-haku"){
      // Enter valitsee ensimmäisen katalogiosuman, tai kirjoitetun nimen
      // jos osumia ei ole.
      var firstPick = document.querySelector("#liike-lista [data-pick-exercise]:not([data-pick-free])") || document.querySelector("#liike-lista [data-pick-exercise]");
      if(firstPick){ e.preventDefault(); firstPick.click(); }
    }
  });
  app.addEventListener("keydown", function(e){
    // Välilehdet, liikeotsikot ja historian päivät ovat div-elementtejä, joten
    // Enter ja välilyönti ohjataan olemassa olevaan click-käsittelijään.
    if(e.key !== "Enter" && e.key !== " ") return;
    var el = e.target.closest("[data-tab], [data-toggle-ex], [data-history-date], [data-toggle-day-summary]");
    if(!el) return;
    e.preventDefault();
    el.click();
  });

  // ---------- init ----------
  render();
  (async function init(){
    if(!window.storage || typeof window.storage.get !== "function" || typeof window.storage.set !== "function"){
      demoteStorage(new Error("Claude-tallennusrajapintaa ei löydy"), true);
    } else {
      await storeSet("storage-check", "ok");
    }
    state.storageMode = storageMode;
    try{
      var res = await storeGet(STORAGE_PROGRAM_KEY);
      if(res && res.value) state.program = JSON.parse(res.value);
    }catch(e){}
    try{
      var libRes = await storeGet(STORAGE_PROGRAMS_KEY);
      if(libRes && libRes.value) state.programs = JSON.parse(libRes.value);
    }catch(e){}
    if(!Array.isArray(state.programs)) state.programs = [];
    var libChanged = false;
    state.programs.forEach(function(p){ if(ensureProgramShape(p)) libChanged = true; });
    if(libChanged) await saveProgramLibrary();
    if(state.program && state.program.days){
      var migrated = false;
      state.program.days.forEach(function(day){
        if(!("week" in day)){
          var wm = /^Viikko\s+(\S+)/.exec(day.name);
          day.week = wm ? wm[1] : null;
          migrated = true;
        }
        (day.exercises || []).forEach(function(ex){
          if(!("unit" in ex)){ ex.unit = ""; migrated = true; }
          if(!("intensity" in ex)){
            ex.intensity = parseIntensity(ex.notes);
            migrated = true;
          }
        });
      });
      if(!state.program.weeks){
        var wOrder = [];
        state.program.days.forEach(function(d){ if(d.week && wOrder.indexOf(d.week) === -1) wOrder.push(d.week); });
        state.program.weeks = wOrder;
        migrated = true;
      }
      // Viikkojen nimet sekä päivien tunnisteet ja nimet (ohjelman muokkaustila).
      if(ensureProgramShape(state.program)) migrated = true;
      if(migrated){
        try{ await saveProgram(); }catch(e){}
      }
    }
    try{
      var lastRes = await storeGet(STORAGE_LASTSET_KEY);
      if(lastRes && lastRes.value) state.lastSet = JSON.parse(lastRes.value);
    }catch(e){}
    Object.keys(state.lastSet).forEach(function(k){
      if(state.lastSet[k] && !Array.isArray(state.lastSet[k].prior)) state.lastSet[k].prior = [];
    });
    try{
      var manualMaxRes = await storeGet(STORAGE_MANUAL_MAX_KEY);
      if(manualMaxRes && manualMaxRes.value) state.manualMax = JSON.parse(manualMaxRes.value);
    }catch(e){}
    try{
      var painRes = await storeGet(STORAGE_PAIN_KEY);
      if(painRes && painRes.value){
        var painParsed = JSON.parse(painRes.value);
        if(Array.isArray(painParsed)) state.painLog = painParsed;
      }
    }catch(e){}
    try{
      var userExRes = await storeGet(STORAGE_USER_EXERCISES_KEY);
      if(userExRes && userExRes.value) state.userExercises = JSON.parse(userExRes.value);
    }catch(e){}
    try{
      var simRes = await storeGet(STORAGE_SIMULATION_KEY);
      if(simRes && simRes.value) state.simulation = JSON.parse(simRes.value);
    }catch(e){}
    try{
      var versionRes = await storeGet(STORAGE_APP_VERSION_KEY);
      state.storedAppVersion = (versionRes && versionRes.value) ? versionRes.value : null;
      if(state.storedAppVersion !== APP_VERSION){ await saveAppVersion(); }
    }catch(e){}
    try{
      var consentRes = await storeGet(STORAGE_CONSENT_KEY);
      if(consentRes && consentRes.value === "1"){ state.consentGiven = true; }
    }catch(e){}
    state.consentChecked = true;
    try{
      var homescreenHintRes = await storeGet(STORAGE_HOMESCREEN_HINT_KEY);
      if(homescreenHintRes && homescreenHintRes.value === "1"){ state.homescreenHintDismissed = true; }
    }catch(e){}
    try{
      var changelogRes = await storeGet(STORAGE_CHANGELOG_SEEN_KEY);
      if(changelogRes && changelogRes.value) state.changelogSeen = changelogRes.value;
      var firstLogHintRes = await storeGet(STORAGE_FIRST_LOG_HINT_KEY);
      if(firstLogHintRes && firstLogHintRes.value === "1"){ state.firstLogHintDismissed = true; }
    }catch(e){}
    try{
      var lastExportRes = await storeGet(STORAGE_LAST_EXPORT_KEY);
      if(lastExportRes && lastExportRes.value){ state.lastExportDate = lastExportRes.value; }
    }catch(e){}
    try{
      var restDurationRes = await storeGet(STORAGE_REST_DURATION_KEY);
      var storedRestDuration = restDurationRes ? parseInt(restDurationRes.value, 10) : NaN;
      if(isFinite(storedRestDuration) && storedRestDuration > 0){ state.restDurationSeconds = storedRestDuration; }
    }catch(e){}
    try{
      var restEnabledRes = await storeGet(STORAGE_REST_ENABLED_KEY);
      if(restEnabledRes && restEnabledRes.value === "0"){ state.restTimerEnabled = false; }
    }catch(e){}
    try{
      // Jos sivu ladataan kokonaan uudelleen kesken lepotauon (ei vain
      // taustalle siirryttäessä), käynnissä ollut ajastin jatkuu tallennetusta
      // päättymisajasta; jo umpeutunut ajastin siivotaan hiljaa pois.
      var restTimerRes = await storeGet(STORAGE_REST_TIMER_KEY);
      if(restTimerRes && restTimerRes.value){
        var restored = JSON.parse(restTimerRes.value);
        if(restored && isFinite(restored.endAt) && restored.endAt > Date.now()){
          state.restTimer = restored;
          var restoredEl = ensureRestTimerOverlay();
          restoredEl.style.display = "flex";
          activateRestTimerOverlay(restoredEl);
          updateRestTimerDisplay();
          window.__restTimerInterval = setInterval(updateRestTimerDisplay, 1000);
          requestRestWakeLock();
        } else {
          await persistRestTimer(null);
        }
      }
    }catch(e){}
    if(state.program){
      try{ state.todayEntry = await loadEntry(state.draftDate); }
      catch(e){ state.todayEntry = { date: state.draftDate, exercises:{} }; }
      state.exerciseLogIndex = await buildExerciseLogIndex();
      await computeDefaultActiveWeek();
    }
    state.loading = false;
    render();
  })();
})();
</script>
</body>
</html>
