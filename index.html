  // ---------------------------------------------------------------------------
  // Tallennusavain käyttäjän itse lisäämille liikkeille. Sama nimeämiskaava
  // kuin muilla STORAGE_*_KEY-vakioilla (STORAGE_PROGRAM_KEY,
  // STORAGE_MANUAL_MAX_KEY jne.) — lisää tämä samaan kohtaan niiden kanssa.
  // ---------------------------------------------------------------------------
  var STORAGE_USER_EXERCISES_KEY = "user-exercises";

  // ---------------------------------------------------------------------------
  // Hakufunktiot katalogin päälle. Kaikki lukevat AINA allExerciseVariants()-
  // funktion kautta, ei koskaan suoraan EXERCISE_VARIANTS:sta, jotta käyttäjän
  // itse lisäämät liikkeet näkyvät kaikkialla samalla tavalla kuin valmiit.
  // Ei arrow-funktioita, ei let/const — sama tyyli kuin muualla index.html:ssä.
  // ---------------------------------------------------------------------------

  function normLiikeName(s){
    return String(s || "").trim().toLowerCase();
  }

  // state.userExercises alustetaan tyhjäksi taulukoksi state-oliossa ja
  // ladataan storeGet(STORAGE_USER_EXERCISES_KEY):lla init()-funktiossa,
  // samaan tapaan kuin state.manualMax jo ladataan.
  function allExerciseVariants(){
    return EXERCISE_VARIANTS.concat(state.userExercises || []);
  }

  function knownBaseExerciseNames(){
    var seen = {};
    var names = [];
    allExerciseVariants().forEach(function(row){
      var key = normLiikeName(row.liike);
      if(!seen[key]){ seen[key] = true; names.push(row.liike); }
    });
    names.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return names;
  }

  function variantRowsForLiike(liike){
    var key = normLiikeName(liike);
    return allExerciseVariants().filter(function(row){ return normLiikeName(row.liike) === key; });
  }

  // hasPlain: onko liikkeellä myös rivi ilman variaatiota (esim.
  // "Kyykky, etu, Smith-laitteessa" perusversio Pysäytyksin-variantin rinnalla).
  function variaatioOptionsFor(liike){
    var rows = variantRowsForLiike(liike);
    var seen = {};
    var options = [];
    var hasPlain = false;
    rows.forEach(function(row){
      if(!row.variaatio){ hasPlain = true; return; }
      if(!seen[row.variaatio]){ seen[row.variaatio] = true; options.push(row.variaatio); }
    });
    return { options: options, hasPlain: hasPlain };
  }

  function lisavariaatioOptionsFor(liike, variaatio){
    var key = normLiikeName(liike);
    var rows = allExerciseVariants().filter(function(row){
      return normLiikeName(row.liike) === key && row.variaatio === variaatio;
    });
    var seen = {};
    var options = [];
    var hasPlain = false;
    rows.forEach(function(row){
      if(!row.lisavariaatio){ hasPlain = true; return; }
      if(!seen[row.lisavariaatio]){ seen[row.lisavariaatio] = true; options.push(row.lisavariaatio); }
    });
    return { options: options, hasPlain: hasPlain };
  }

  function findVariantRow(liike, variaatio, lisavariaatio){
    var key = normLiikeName(liike);
    var rows = allExerciseVariants();
    for(var i=0;i<rows.length;i++){
      var row = rows[i];
      if(normLiikeName(row.liike) === key &&
         (row.variaatio || null) === (variaatio || null) &&
         (row.lisavariaatio || null) === (lisavariaatio || null)){
        return row;
      }
    }
    return null;
  }

  function composeVariantName(liike, variaatio, lisavariaatio){
    var name = liike;
    if(variaatio) name += ", " + variaatio;
    if(lisavariaatio) name += ", " + lisavariaatio;
    return name;
  }

  // Tunnistaa liikkeen nimestä (ohjelman ex.name) vastaavan katalogirivin,
  // jotta tietopalkki ja variaatiovalitsin osaavat esitäyttyä oikein myös
  // silloin kun liike on jo aiemmin vaihdettu variaatioksi.
  function resolveCatalogMatch(name){
    var trimmed = String(name || "").trim();
    if(!trimmed) return null;
    var normTarget = normLiikeName(trimmed);
    var rows = allExerciseVariants();
    for(var i=0;i<rows.length;i++){
      var row = rows[i];
      var composed = composeVariantName(row.liike, row.variaatio, row.lisavariaatio);
      if(normLiikeName(composed) === normTarget){
        return { liike: row.liike, variaatio: row.variaatio, lisavariaatio: row.lisavariaatio };
      }
    }
    var baseNames = knownBaseExerciseNames();
    for(var j=0;j<baseNames.length;j++){
      if(normLiikeName(baseNames[j]) === normTarget){
        return { liike: baseNames[j], variaatio: null, lisavariaatio: null };
      }
    }
    return null;
  }

  // Lisää käyttäjän itse kirjoittaman uuden liikkeen/variaation paikalliseen,
  // laitekohtaiseen listaan ja tallentaa sen selaimen tallennustilaan. Ei
  // KOSKAAN kirjoita EXERCISE_VARIANTS-vakioon — se pysyy kehittäjän
  // ylläpitämänä lähtödatana riippumatta siitä, mitä käyttäjä lisää ajossa.
  // row: { liike (pakollinen), variaatio, lisavariaatio, lihasryhma } — vain
  // liike on pakollinen, loput saa jättää null/tyhjäksi.
  async function addUserExerciseVariant(row){
    var clean = {
      liike: String((row && row.liike) || "").trim(),
      variaatio: (row && row.variaatio) ? String(row.variaatio).trim() : null,
      lisavariaatio: (row && row.lisavariaatio) ? String(row.lisavariaatio).trim() : null,
      lihasryhma: (row && row.lihasryhma) ? String(row.lihasryhma).trim() : null
    };
    if(!clean.liike) return null;
    if(!state.userExercises) state.userExercises = [];
    state.userExercises.push(clean);
    await saveUserExercises();
    return clean;
  }

  // Varmuuskopion 1RM-arvot yhdistetään laitteella jo oleviin samalla säännöllä
  // kuin merkinnät: jo olemassa oleva arvo ohitetaan, jottei vanhemman
  // varmuuskopion palautus laskisi tuoreempaa 1RM:ää huomaamatta.
  async function mergeManualMax(values){
    var added = 0, skipped = 0;
    Object.keys(values).forEach(function(key){
      if(state.manualMax[key]){ skipped++; return; }
      state.manualMax[key] = values[key];
      added++;
    });
    if(added) await saveManualMax();
    return { added: added, skipped: skipped };
  }

  async function saveUserExercises(){
    try{ await storeSet(STORAGE_USER_EXERCISES_KEY, JSON.stringify(state.userExercises)); }
    catch(e){ /* hiljainen virhe — liikkeet jäävät silti käyttöön tämän istunnon ajaksi */ }
  }

  // Varmuuskopion omat liikkeet yhdistetään laitteella jo oleviin: sama rivi ei
  // kahdennu eikä mitään poisteta. Katalogissa valmiina olevaa riviä ei lisätä
  // käyttäjän listaan lainkaan, jottei liike näkyisi valintalistassa kahdesti.
  async function mergeUserExerciseVariants(rows){
    if(!state.userExercises) state.userExercises = [];
    function key(r){
      return normLiikeName(r.liike) + "|" + normLiikeName(r.variaatio || "") + "|" + normLiikeName(r.lisavariaatio || "");
    }
    var seen = {};
    EXERCISE_VARIANTS.forEach(function(r){ seen[key(r)] = true; });
    state.userExercises.forEach(function(r){ seen[key(r)] = true; });
    var added = 0;
    rows.forEach(function(r){
      var k = key(r);
      if(!r.liike || seen[k]) return;
      seen[k] = true;
      state.userExercises.push(r);
      added++;
    });
    if(added) await saveUserExercises();
    return added;
  }

  // ---------- actions ----------
  // Yhteinen tallennuspolku kaikille tuontireiteille (CSV-tuonti ja PDF-tuonnin
  // tarkistusnäkymän "Valmis"): ohjelma otetaan käyttöön täsmälleen samalla
  // tavalla riippumatta siitä, mistä rakenne on peräisin. Ei uutta
  // tallennuslogiikkaa — sama saveProgram() kuin ennenkin.
  async function applyImportedProgram(program, successMessage){
    var isFirstImport = !state.program;
    // Verrataan tuodun ohjelman liikenimiä historiassa jo oleviin nimiin: eri
    // kirjoitusasu aloittaisi historian huomaamatta alusta. Vain huomautus,
    // mitään ei nimetä uudelleen automaattisesti.
    state.importNameWarnings = [];
    var historyNames = historyExerciseNames();
    var historyNorms = {};
    historyNames.forEach(function(n){ historyNorms[normalizeName(n)] = true; });
    if(historyNames.length){
      var seenImport = {};
      program.days.forEach(function(day){
        (day.exercises || []).forEach(function(ex){
          var impName = (ex.name || "").trim();
          if(!impName) return;
          var impNorm = normalizeName(impName);
          if(!impNorm || seenImport[impNorm] || historyNorms[impNorm]) return;
          seenImport[impNorm] = true;
          var match = findSimilarName(impName, historyNames);
          if(match){ state.importNameWarnings.push({ imported: impName, historical: match }); }
        });
      });
    }
    state.program = program;
    state.manualExercises = [];
    state.draftSets = {};
    state.dirtySets = {};
    state.openExercise = null;
    state.showAllWeeks = false;
    state.showProgramNotes = false;
    await saveProgram();
    await computeDefaultActiveWeek();
    state.todayEntry = await loadEntry(state.draftDate);
    state.exerciseLogIndex = await buildExerciseLogIndex();
    state.view = "ohjelma";
    showToast(successMessage || "Ohjelma tuotu onnistuneesti");
    if(isFirstImport && !state.homescreenHintDismissed && !isStandaloneDisplay()){ state.showHomescreenHint = true; }
    if(isFirstImport){
      // Varmuuskopiomuistutuksen kello lähtee käyntiin ensimmäisestä
      // tuonnista, ei tyhjästä — muuten muistutus ei koskaan laukeaisi
      // käyttäjälle, joka ei ole vielä kertaakaan vienyt merkintöjään.
      state.lastExportDate = todayISO();
      try{ await storeSet(STORAGE_LAST_EXPORT_KEY, state.lastExportDate); }
      catch(e){ /* hiljainen virhe, ei kriittinen */ }
    }
    render();
  }

  async function handleFile(file){
    var text;
    try{ text = await readFileAsText(file); }
    catch(e){ showToast("Tiedoston luku epäonnistui"); return; }
    try{
      var program = parseProgramCSV(text);
      state.pdfImportError = null;
      await applyImportedProgram(program, "Ohjelma tuotu onnistuneesti");
    }catch(err){
      showToast(err.message || "CSV:n luku epäonnistui");
    }
  }

  // PDF-tuonti ei tallenna suoraan: jäsennystulos viedään tarkistusnäkymään,
  // jossa käyttäjä hyväksyy tai korjaa rivit. Vasta "Valmis" tallentaa.
  async function handlePdfFiles(files){
    state.pdfImportError = null;
    showToast("Luetaan PDF-tiedostoja…", 6000);
    var res;
    try{ res = await parseProgramPDFFiles(files); }
    catch(err){
      state.pdfImportError = (err && err.message) ? err.message : "PDF:n luku epäonnistui.";
      showToast("PDF:n luku epäonnistui");
      render();
      return;
    }
    if(!res.program.days.length){
      // Tyhjää tulosta ei viedä tarkistusnäkymään lainkaan: käyttäjälle
      // kerrotaan suoraan, ettei tiedostosta löytynyt ohjelmaa.
      state.pdfImportError = "PDF:stä ei löytynyt yhtään liikettä. Ohjelma voi olla muodossa, jota jäsennin ei tunnista, tai teksti voi olla kuvana. Voit tuoda ohjelman CSV-tiedostona tai rakentaa sen käsin.";
      showToast("PDF:stä ei löytynyt liikkeitä");
      render();
      return;
    }
    // Tarkistus tapahtuu muokkaustilassa: samat rivit, lomakkeet ja poistot
    // kuin ohjelman muokkauksessa, ei omaa tarkistusnäkymää.
    startProgramImport(res.program, files.map(function(f){ return f.name; }));
  }

  // ---------- Ohjelman muokkaustila ----------
  // Muokkaukset kohdistuvat vain state.programDraft-syväkopioon. "Valmis"
  // järjestää päivät viikkojärjestykseen, päivittää day.name-kentät ja
  // korvaa state.programin; "Peruuta" hylkää luonnoksen.
  function blankEditor(){
    return { mode: "edit", openWeeks: {}, openDays: {}, editingExercise: null, addingExerciseTo: null,
             confirmDelete: null, confirmCancel: false, swapAll: true, menuFor: null, form: null,
             baseline: "", returnView: null, importInfo: null, pickerQuery: "" };
  }
  // Muokkaustilalla on kolme tilaa: "edit" muokkaa nykyistä ohjelmaa, "new"
  // rakentaa uuden tyhjästä ja "import" tarkistaa PDF:stä jäsennetyn. Rivit,
  // lomakkeet ja toiminnot ovat samat; vain otsikko, yhteenveto ja Valmis-
  // painikkeen tallennuspolku eroavat.
  var EDITOR_TITLES = { "edit": "Muokkaa ohjelmaa", "new": "Rakenna ohjelma", "import": "Tarkista tuotu ohjelma" };
  function editorTitle(){ return EDITOR_TITLES[state.editor.mode] || EDITOR_TITLES["edit"]; }
  function enterEditor(draft, mode){
    state.openExercise = null;
    state.swapExercise = null;
    state.variantPicker = null;
    state.activeSet = null;
    state.setExtra = {};
    state.pdfImportError = null;
    state.programDraft = draft;
    state.editMode = true;
    state.editor = blankEditor();
    state.editor.mode = mode;
    // Peruutus palaa näkymään, josta rakentaja tai tuonti käynnistettiin.
    state.editor.returnView = mode === "edit" ? null : state.view;
    state.editor.baseline = JSON.stringify(draft);
  }
  async function startProgramEdit(){
    if(!state.program) return;
    if(ensureProgramShape(state.program)) await saveProgram();
    enterEditor(JSON.parse(JSON.stringify(state.program)), "edit");
    state.editor.openWeeks[state.activeWeek] = true;
    render();
  }
  // Rakentaja: muokkaustila tyhjälle luonnokselle, jossa on valmiina yksi
  // viikko ja yksi päivä.
  function startProgramBuilder(){
    var day = { id: newDayId(), label: "Päivä 1", name: "", week: "1", exercises: [] };
    enterEditor({ days: [day], weeks: ["1"], weekLabels: {} }, "new");
    state.editor.openWeeks["1"] = true;
    state.editor.openDays[day.id] = true;
    render();
  }
  // PDF-tarkistus: muokkaustila jäsennetylle ohjelmalle. Kaikki avataan
  // valmiiksi, koska käyttäjän on nähtävä jokainen rivi.
  function startProgramImport(program, fileNames){
    ensureProgramShape(program);
    var reviewCount = 0;
    program.days.forEach(function(day){ day.exercises.forEach(function(ex){ if(ex.needsReview) reviewCount++; }); });
    enterEditor(program, "import");
    state.editor.importInfo = { files: fileNames, reviewCount: reviewCount };
    program.weeks.forEach(function(w){ state.editor.openWeeks[w] = true; });
    program.days.forEach(function(d){ state.editor.openDays[d.id] = true; });
    showToast("Tarkista jäsennetty ohjelma ennen tallennusta", 4000);
    render();
  }
  function editorHasChanges(){
    return JSON.stringify(state.programDraft) !== state.editor.baseline;
  }
  function resetEditor(){
    state.programDraft = null;
    state.editMode = false;
    state.editor = blankEditor();
    if(state.sheet === "liike") state.sheet = null;
  }
  function cancelProgramEdit(){
    if(editorHasChanges() && !state.editor.confirmCancel){
      state.editor.confirmCancel = true;
      render();
      return;
    }
    var back = state.editor.returnView;
    resetEditor();
    if(back) state.view = back;
    render();
  }
  // Tarkistaa luonnoksen ennen tallennusta ja palauttaa virhetekstin tai null.
  // Samat säännöt kuin rakentajassa ennen tätä: vähintään yksi liike, ei kahta
  // samannimistä viikkoa (viikkovalitsin näyttää nimen) eikä saman viikon
  // kahta samannimistä päivää. Liikkeettömät päivät ohitetaan muissa kuin
  // muokkaustilassa, koska ne jätetään tallennuksesta pois.
  function draftProblem(draft, mode){
    var exCount = 0;
    draft.days.forEach(function(d){ exCount += d.exercises.length; });
    if(!exCount) return "Lisää ohjelmaan vähintään yksi liike ennen tallennusta.";
    var seenWeek = {};
    for(var i=0;i<draft.weeks.length;i++){
      var wname = weekDisplayNameIn(draft, draft.weeks[i]);
      var wkey = normalizeName(wname);
      if(seenWeek[wkey]) return "Viikon nimi ”" + wname + "” esiintyy kahdesti. Anna jokaiselle viikolle oma nimi.";
      seenWeek[wkey] = true;
    }
    var seenDay = {};
    for(var j=0;j<draft.days.length;j++){
      var d = draft.days[j];
      if(mode !== "edit" && !d.exercises.length) continue;
      var label = String(d.label || "").trim();
      if(!label) return "Treenipäivältä puuttuu nimi.";
      var dkey = (d.week || "") + "|" + normalizeName(label);
      if(seenDay[dkey]) return (d.week ? "Viikossa " + weekDisplayNameIn(draft, d.week) + " on" : "Ohjelmassa on") + " kaksi treenipäivää nimellä ”" + label + "”.";
      seenDay[dkey] = true;
    }
    return null;
  }
  async function finishProgramEdit(){
    var draft = state.programDraft, mode = state.editor.mode;
    if(!draft) return;
    if(mode === "edit" && !editorHasChanges()){ resetEditor(); render(); return; }
    var problem = draftProblem(draft, mode);
    if(problem){ showToast(problem, 4000); return; }
    // Päivät viikkojärjestykseen vakaasti: koko ohjelman näkymä iteroi
    // days-listaa sellaisenaan. Viikottomat päivät jäävät loppuun.
    var order = {};
    draft.weeks.forEach(function(w, i){ order[w] = i; });
    var indexed = draft.days.map(function(d, i){
      var w = (d.week !== null && d.week !== undefined && order[d.week] !== undefined) ? order[d.week] : Infinity;
      return { d: d, i: i, w: w };
    });
    indexed.sort(function(a, b){ return a.w === b.w ? a.i - b.i : a.w - b.w; });
    draft.days = indexed.map(function(x){ return x.d; });
    if(mode !== "edit"){
      // Liikkeetön päivä ja päivätön viikko jätetään pois, jottei
      // keskeneräinen rakenne päädy ohjelmaan.
      draft.days = draft.days.filter(function(d){ return d.exercises.length; });
      draft.weeks = draft.weeks.filter(function(w){
        return draft.days.some(function(d){ return d.week === w; });
      });
      Object.keys(draft.weekLabels).forEach(function(k){ if(draft.weeks.indexOf(k) === -1) delete draft.weekLabels[k]; });
    }
    draft.days.forEach(function(d){
      d.name = dayDisplayNameIn(draft, d);
      // Tarkistusmerkinnät ovat vain muokkaustilaa varten.
      d.exercises.forEach(function(ex){ delete ex.needsReview; delete ex.rawTarget; });
    });
    if(mode !== "edit"){
      // Uusi ohjelma korvaa nykyisen samaa polkua kuin CSV-tuonti.
      resetEditor();
      await applyImportedProgram(draft, "Ohjelma tallennettu");
      return;
    }
    state.program = draft;
    resetEditor();
    await saveProgram();
    // Poistuneiden liikkeiden väliaikainen tila siivotaan.
    ["draftSets", "dirtySets", "autoCalcInfo"].forEach(function(k){
      Object.keys(state[k]).forEach(function(id){ if(!findExerciseById(id)) delete state[k][id]; });
    });
    if(state.program.weeks.indexOf(state.activeWeek) === -1) await computeDefaultActiveWeek();
    state.expandedDaySummaries = {};
    showToast("Ohjelma tallennettu");
    render();
  }

  // --- luonnoksen luku ---
  function draftWeekDays(key){
    return state.programDraft.days.filter(function(d){ return d.week === key; });
  }
  function draftDayById(id){
    return state.programDraft.days.filter(function(d){ return d.id === id; })[0] || null;
  }
  function draftDayOfExercise(exId){
    var days = state.programDraft.days;
    for(var i=0;i<days.length;i++){
      for(var j=0;j<days[i].exercises.length;j++){ if(days[i].exercises[j].id === exId) return days[i]; }
    }
    return null;
  }
  // Pienin positiivinen kokonaisluku, joka ei vielä ole viikkoavaimena.
  function nextWeekKey(weeks){
    var n = 1;
    while(weeks.indexOf(String(n)) !== -1) n++;
    return String(n);
  }
  function cloneExercises(list){
    return list.map(function(ex){
      var c = JSON.parse(JSON.stringify(ex));
      c.id = newExerciseId(state.programDraft);
      return c;
    });
  }
  // "Aloita uudelleen": uudet id:t, jolloin tehty-tila (id-sidonnainen) nollautuu
  // mutta historia ja painoehdotukset (nimisidonnaiset) säilyvät. Sama
  // mekanismi kuin CSV:n uudelleentuonnissa.
  function restartExercises(list){
    list.forEach(function(ex){ ex.id = newExerciseId(state.programDraft); });
  }
  function insertDaysAfterWeek(key, newDays){
    var d = state.programDraft;
    var lastIdx = -1;
    d.days.forEach(function(day, idx){ if(day.week === key) lastIdx = idx; });
    var at = lastIdx === -1 ? d.days.length : lastIdx + 1;
    Array.prototype.splice.apply(d.days, [at, 0].concat(newDays));
  }

  // --- viikot ---
  function editorMoveWeek(key, dir){
    var w = state.programDraft.weeks;
    var i = w.indexOf(key), j = i + dir;
    if(i < 0 || j < 0 || j >= w.length) return;
    w[i] = w[j]; w[j] = key;
    render();
  }
  function editorCopyWeek(key){
    var d = state.programDraft;
    var newKey = nextWeekKey(d.weeks);
    var i = d.weeks.indexOf(key);
    d.weeks.splice(i + 1, 0, newKey);
    // Viikon nimeä ei kopioida: kopio saa oletusnimen.
    var copies = draftWeekDays(key).map(function(day){
      return { id: newDayId(), label: day.label, name: "", week: newKey, exercises: cloneExercises(day.exercises) };
    });
    insertDaysAfterWeek(key, copies);
    state.editor.openWeeks[newKey] = true;
    state.editor.menuFor = null;
    showToast("Kopioitu uudeksi viikoksi: " + weekDisplayNameIn(d, newKey));
    render();
  }
  function editorDeleteWeek(key){
    var d = state.programDraft;
    d.weeks = d.weeks.filter(function(k){ return k !== key; });
    delete d.weekLabels[key];
    d.days = d.days.filter(function(day){ return day.week !== key; });
    delete state.editor.openWeeks[key];
    state.editor.menuFor = null;
    state.editor.confirmDelete = null;
    render();
  }
  function editorAddWeek(){
    var d = state.programDraft;
    var key = nextWeekKey(d.weeks);
    d.weeks.push(key);
    state.editor.openWeeks[key] = true;
    render();
  }

  // --- päivät ---
  function editorAddDay(key){
    var d = state.programDraft;
    var count = key === null ? d.days.filter(function(x){ return !x.week; }).length : draftWeekDays(key).length;
    var day = { id: newDayId(), week: key, label: "Päivä " + (count + 1), name: "", exercises: [] };
    if(key === null) d.days.push(day); else insertDaysAfterWeek(key, [day]);
    state.editor.openDays[day.id] = true;
    render();
  }
  function editorMoveDay(id, dir){
    var d = state.programDraft;
    var day = draftDayById(id);
    if(!day) return;
    // Vain saman viikon päivien kesken.
    var idxs = [];
    d.days.forEach(function(x, i){ if(x.week === day.week) idxs.push(i); });
    var p = idxs.indexOf(d.days.indexOf(day)), q = p + dir;
    if(q < 0 || q >= idxs.length) return;
    var a = idxs[p], b = idxs[q];
    var tmp = d.days[a]; d.days[a] = d.days[b]; d.days[b] = tmp;
    render();
  }
  function editorCopyDay(id){
    var d = state.programDraft;
    var src = draftDayById(id);
    if(!src) return;
    var copy = { id: newDayId(), week: src.week, label: src.label + " (kopio)", name: "", exercises: cloneExercises(src.exercises) };
    d.days.splice(d.days.indexOf(src) + 1, 0, copy);
    state.editor.openDays[copy.id] = true;
    state.editor.menuFor = null;
    render();
  }
  function editorDeleteDay(id){
    var d = state.programDraft;
    d.days = d.days.filter(function(x){ return x.id !== id; });
    delete state.editor.openDays[id];
    state.editor.menuFor = null;
    state.editor.confirmDelete = null;
    render();
  }

  // --- liikkeet ---
  function editorMoveExercise(id, dir){
    var day = draftDayOfExercise(id);
    if(!day) return;
    var list = day.exercises;
    var i = -1;
    list.forEach(function(ex, idx){ if(ex.id === id) i = idx; });
    var j = i + dir;
    if(i < 0 || j < 0 || j >= list.length) return;
    var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    render();
  }
  function editorDeleteExercise(id){
    var day = draftDayOfExercise(id);
    if(!day) return;
    day.exercises = day.exercises.filter(function(ex){ return ex.id !== id; });
    if(state.editor.editingExercise === id){ state.editor.editingExercise = null; state.editor.form = null; }
    state.editor.menuFor = null;
    state.editor.confirmDelete = null;
    render();
  }
  function editorRestart(target){
    var d = state.programDraft;
    var list = [];
    if(target === "program"){
      d.days.forEach(function(day){ list = list.concat(day.exercises); });
    } else if(target.indexOf("week:") === 0){
      draftWeekDays(target.slice(5)).forEach(function(day){ list = list.concat(day.exercises); });
    } else if(target.indexOf("day:") === 0){
      var day = draftDayById(target.slice(4));
      if(day) list = day.exercises.slice();
    } else if(target.indexOf("ex:") === 0){
      var ex = findExerciseIn(d, target.slice(3));
      if(ex) list = [ex];
    }
    restartExercises(list);
    state.editor.confirmDelete = null;
    state.editor.menuFor = null;
    showToast(list.length ? plural(list.length, "liike", "liikettä") + " merkitty tekemättömäksi" : "Ei liikkeitä");
    render();
  }

  // --- liikkeen lomake ---
  function editorOpenForm(dayId, exId){
    var ed = state.editor;
    var ex = exId ? findExerciseIn(state.programDraft, exId) : null;
    ed.addingExerciseTo = ex ? null : dayId;
    ed.editingExercise = ex ? ex.id : null;
    ed.menuFor = null;
    ed.form = ex
      ? { name: ex.name || "", sets: ex.sets || "", reps: ex.reps || "", unit: ex.unit || "", teho: intensityToText(ex.intensity) }
      : { name: "", sets: "", reps: "", unit: "toistoa", teho: "" };
    ed.swapAll = true;
    if(!ex){
      // Uusi liike valitaan pohjalevyn hakukentästä; lomake jää sen alle.
      ed.pickerQuery = "";
      state.sheet = "liike";
      afterRender(function(){ var q = document.getElementById("liike-haku"); if(q) q.focus(); });
      return;
    }
    render();
  }
  function editorCloseForm(){
    var ed = state.editor;
    ed.addingExerciseTo = null;
    ed.editingExercise = null;
    ed.form = null;
    render();
  }
  function editorSaveForm(){
    var ed = state.editor, f = ed.form, d = state.programDraft;
    if(!f) return;
    var name = String(f.name || "").trim();
    if(!name){ showToast("Kirjoita liikkeen nimi"); return; }
    var teho = String(f.teho || "").trim();
    var sets = String(f.sets || "").trim(), reps = String(f.reps || "").trim(), unit = String(f.unit || "").trim();
    if(ed.editingExercise){
      var ex = findExerciseIn(d, ed.editingExercise);
      if(!ex){ editorCloseForm(); return; }
      var oldTeho = intensityToText(ex.intensity);
      if(normalizeName(name) !== normalizeName(ex.name)){
        // Nimen muutos on sama asia kuin liikkeen vaihto: uusi id, jotta vanha
        // merkintä jää historiaan vanhalla nimellä.
        var swapAllEl = document.getElementById("editor-swap-all");
        var all = swapAllEl ? swapAllEl.checked : ed.swapAll;
        var newId = applyExerciseSwap(d, ex.id, name, all);
        ex = findExerciseIn(d, newId) || ex;
        warnSimilarHistoryName(name);
      }
      ex.sets = sets; ex.reps = reps; ex.unit = unit;
      ex.intensity = parseIntensity(teho);
      // Huomautus seuraa tehotekstiä vain, jos se oli tyhjä tai sama kuin vanha
      // tehoteksti — käyttäjän oma huomautus jätetään rauhaan.
      if(!ex.notes || ex.notes === oldTeho) ex.notes = teho;
      // Muokattu rivi on tarkistettu.
      delete ex.needsReview; delete ex.rawTarget;
    } else {
      var day = draftDayById(ed.addingExerciseTo);
      if(!day){ editorCloseForm(); return; }
      // Täsmälleen sama muoto kuin parseProgramCSV tuottaa.
      day.exercises.push({ id: newExerciseId(d), name: name, sets: sets, reps: reps, unit: unit,
        weight: "", notes: teho, intensity: parseIntensity(teho), kind: "plain", autoCalc: true });
      warnSimilarHistoryName(name);
    }
    editorCloseForm();
  }

  async function toggleExercise(id){
    if(state.openExercise === id){
      var openEx = findExerciseById(id);
      if(openEx && !isExerciseFullyDone(openEx, id)){
        showToast("Merkitse kaikki sarjat valmiiksi ennen sulkemista");
        return;
      }
      await completeAndAdvance(id);
      return;
    }
    var ex = findExerciseById(id);
    if(!ex) return;
    state.openExercise = id;
    state.activeSet = null;
    if(!state.draftSets[id] || !state.dirtySets[id]){
      // exerciseLogIndex kattaa merkinnän riippumatta siitä, minä päivänä se on
      // tallennettu — sama liike avataan aina valmiiksi merkittynä, ei vain
      // silloin kun se sattuu olemaan tallennettu juuri tälle valitulle päivälle.
      var logged = state.exerciseLogIndex[id];
      var existing = logged && logged.data;
      if(existing && existing.sets && existing.sets.length){
        // Aiemmin tallennettu merkintä: sarjat näytetään jo valmiiksi merkittyinä,
        // mutta arvoja voi silti muokata (ks. isRowDoneEligible/data-set-field).
        state.draftSets[id] = existing.sets.map(function(s){ return Object.assign({}, s, { done: true }); });
        state.autoCalcInfo[id] = { type:"saved", date: logged.date };
      } else {
        state.draftSets[id] = buildDraftRows(ex, id);
      }
    }
    render();
  }

  function isCombo(name){
    return String(name).indexOf("/") !== -1;
  }
  function exerciseRequiresWeightForDone(ex){
    // Yhdistelmäliikkeet (esim. "Cardiolaite / Punnerrus / Burpee, 12 min") eivät
    // muutenkaan kuulu painoon perustuvaan logiikkaan (ks. lastSet/1RM-käsittely),
    // joten niille "kirjattu" tarkoittaa samaa kuin saveExerciseLog:n data-tarkistus.
    // Sama koskee kiertoharjoittelua ja kestoperusteisia liikkeitä (kind), joille
    // PDF-ohjelma ei anna painotavoitetta lainkaan — niissä kirjaus on vapaata
    // tekstiä, eikä paino saa estää sarjan merkitsemistä valmiiksi.
    if(ex.kind === "circuit" || ex.kind === "duration") return false;
    return !isCombo(ex.name);
  }
  function isRowDoneEligible(ex, row){
    return exerciseRequiresWeightForDone(ex) ? !!row.weight : !!(row.weight || row.reps || row.notes);
  }
  function isExerciseFullyDone(ex, id){
    var rows = state.draftSets[id];
    if(!rows || !rows.length) return false;
    for(var i=0;i<rows.length;i++){ if(!rows[i].done) return false; }
    return true;
  }
  function isExerciseLogged(ex){
    // Liike on merkitty tehdyksi riippumatta siltä, minä päivänä se on
    // tallennettu — vuorokauden vaihtuminen ei saa "unohtaa" jo tehtyä treeniä.
    return !!(state.exerciseLogIndex && state.exerciseLogIndex[ex.id]);
  }
  function isDayFullyDone(day){
    // Koko treenipäivä lasketaan tehdyksi kun jokainen sen liike löytyy
    // exerciseLogIndexistä eli on tallennettu jollekin päivälle — ei väliä
    // onko se sama päivä kuin nyt valittu draftDate.
    if(!day.exercises || !day.exercises.length) return false;
    for(var i=0;i<day.exercises.length;i++){ if(!isExerciseLogged(day.exercises[i])) return false; }
    return true;
  }
  function dayKey(day){
    // Pysyvä tunniste, jos päivällä on sellainen; vanha week|name muuten.
    return day.id ? day.id : String(day.week) + "|" + day.name;
  }
  function isProgramExercise(id){
    // Vain ohjelmaan kuuluvan liikkeen voi vaihtaa; käsin lisätyt ovat kertaluontoisia.
    if(!state.program) return false;
    for(var i=0;i<state.program.days.length;i++){
      var list = state.program.days[i].exercises;
      for(var j=0;j<list.length;j++){ if(list[j].id === id) return true; }
    }
    return false;
  }
  function programExerciseOccurrences(name){
    // Sama liike toistuu tyypillisesti joka viikolla, joten vaihto voi koskea
    // yhtä kohtaa tai kaikkia saman nimisiä.
    return exerciseOccurrencesIn(state.program, name);
  }
  async function swapProgramExercise(id){
    // Ohut kääre: lukee lomakkeen kentät ja jättää varsinaisen vaihtologiikan
    // applyExerciseSwap:lle, jota myös ohjattu variaatiovalinta käyttää.
    var input = document.getElementById("swap-name-input");
    var newName = input ? input.value.trim() : "";
    if(!newName){ showToast("Kirjoita liikkeen nimi"); return; }
    var allWeeksEl = document.getElementById("swap-all-weeks");
    await performExerciseSwap(id, newName, !!(allWeeksEl && allWeeksEl.checked));
  }

  // Liikkeet ja id:t annetussa ohjelmaoliossa (state.program tai muokkaustilan
  // luonnos). Nämä eivät koske tilaan, jotta sama logiikka toimii molemmille.
  function findExerciseIn(program, id){
    if(!program) return null;
    for(var i=0;i<program.days.length;i++){
      var list = program.days[i].exercises || [];
      for(var j=0;j<list.length;j++){ if(list[j].id === id) return list[j]; }
    }
    return null;
  }
  function exerciseOccurrencesIn(program, name){
    var norm = String(name).trim().toLowerCase();
    var list = [];
    if(program){
      program.days.forEach(function(day){
        (day.exercises || []).forEach(function(ex){
          if(String(ex.name).trim().toLowerCase() === norm) list.push(ex);
        });
      });
    }
    return list;
  }
  var exerciseIdCounter = 0;
  // Uusi liike-id, joka ei esiinny annetussa ohjelmassa. Aikaleima + juokseva
  // numero: laskuri takaa ainutkertaisuuden myös saman millisekunnin sisällä.
  function newExerciseId(program){
    var stamp = Date.now();
    var id;
    do { exerciseIdCounter++; id = "ex-" + stamp + "-" + exerciseIdCounter; } while(findExerciseIn(program, id));
    return id;
  }
  // Puhdas ydin liikkeen vaihdolle: asettaa uuden nimen ja uuden id:n
  // annetussa ohjelmassa, joko yhdelle kohdalle tai kaikille saman nimisille.
  // Uusi id on välttämätön: vanhaan id:hen sidottu tämän päivän merkintä ei
  // saa siirtyä uudelle liikkeelle, vaan jää historiaan vanhalla nimellään.
  // Palauttaa vaihdetun liikkeen uuden id:n. Ei tallenna eikä piirrä.
  function applyExerciseSwap(program, id, newName, allOccurrences){
    var ex = findExerciseIn(program, id);
    if(!ex) return null;
    var targets = allOccurrences ? exerciseOccurrencesIn(program, ex.name) : [ex];
    var newId = null;
    targets.forEach(function(target){
      var targetId = newExerciseId(program);
      if(target.id === id) newId = targetId;
      target.id = targetId;
      target.name = newName;
    });
    return newId;
  }
  // Historiassa (viimeisin sarja, 1RM) esiintyvät liikenimet
  // kirjoitusasuvertailua varten.
  function historyExerciseNames(){
    var norms = {};
    Object.keys(state.lastSet).forEach(function(n){ norms[normalizeName(n)] = true; });
    Object.keys(state.manualMax).forEach(function(n){ norms[normalizeName(n)] = true; });
    var names = Object.keys(norms).map(function(n){ return capitalize(n); });
    names.sort(function(a, b){ return a.localeCompare(b, "fi"); });
    return names;
  }
  function warnSimilarHistoryName(name){
    var similar = findSimilarName(name, historyExerciseNames());
    if(similar && normalizeName(similar) !== normalizeName(name)){
      showToast("Historiassa on samankaltainen liike ”" + similar + "” — tarkista kirjoitusasu", 4500);
    }
  }

  // Kirjausnäkymän "Vaihda liike toiseksi": käyttää puhdasta ydintä
  // state.programiin ja hoitaa tilan siivouksen, tallennuksen ja piirron.
  async function performExerciseSwap(id, newName, allWeeks){
    var ex = findExerciseById(id);
    if(!ex) return;
    var oldName = ex.name;
    if(newName.toLowerCase() === String(oldName).trim().toLowerCase()){
      state.swapExercise = null;
      render();
      return;
    }
    var targets = allWeeks ? programExerciseOccurrences(oldName) : [ex];
    targets.forEach(function(target){
      // Vanhan id:n väliaikainen tila siivotaan ennen id:n vaihtoa.
      delete state.draftSets[target.id];
      delete state.dirtySets[target.id];
      delete state.autoCalcInfo[target.id];
    });
    var newId = applyExerciseSwap(state.program, id, newName, allWeeks);
    await saveProgram();
    state.swapExercise = null;
    // Vaihdettu liike jää auki, mutta sarjat lasketaan uudelleen uudelle nimelle.
    state.openExercise = newId;
    var swapped = newId ? findExerciseById(newId) : null;
    if(swapped) state.draftSets[newId] = buildDraftRows(swapped, newId);
    showToast(targets.length > 1 ? "Liike vaihdettu " + targets.length + " kohdassa" : "Liike vaihdettu");
    render();
  }

  function getExerciseGroupList(id){
    if(state.program){
      for(var i=0;i<state.program.days.length;i++){
        var day = state.program.days[i];
        for(var j=0;j<day.exercises.length;j++){ if(day.exercises[j].id === id) return day.exercises; }
      }
    }
    for(var k=0;k<state.manualExercises.length;k++){ if(state.manualExercises[k].id === id) return state.manualExercises; }
    return null;
  }
  // Sarjakohtainen toistotavoite ("6, 10, 10") ohittaa yhteisen reps-arvon.
  function draftRepsFor(ex, idx){
    if(ex.perSet && ex.perSet.length){
      return ex.perSet[idx] !== undefined ? ex.perSet[idx] : ex.perSet[ex.perSet.length - 1];
    }
    return ex.reps || "";
  }
  function draftRowCount(ex){
    var explicit = parseInt(ex.sets, 10);
    if(explicit && explicit > 0) return explicit;
    if(ex.perSet && ex.perSet.length) return ex.perSet.length;
    return 1;
  }
  function buildDraftRows(ex, id){
    var explicitCount = parseInt(ex.sets, 10);

    // autoCalc === false: tavoite on menetelmäkohtainen (rest-pause, cluster,
    // drop) eikä siihen voi laskea painoa kaavalla. Väärä ehdotus on pahempi
    // kuin tyhjä kenttä, joten mitään ei ehdoteta. Vanhoissa, ennen PDF-tuontia
    // tallennetuissa ohjelmissa kenttää ei ole lainkaan, joten vain
    // nimenomainen false estää laskennan.
    if(ex.autoCalc === false){
      delete state.autoCalcInfo[id];
      var manualRows = [];
      var mc = draftRowCount(ex);
      for(var mi=0; mi<mc; mi++){ manualRows.push({ weight:"", reps: draftRepsFor(ex, mi), notes:"", done:false }); }
      return manualRows;
    }

    // Liikkeet, joille on määritelty teho (MAX tai prosentti), eivät kuulu
    // toistopainolaskurin progressiologiikkaan: niiden painoehdotus perustuu
    // aina liikkeen manuaalisesti syötettyyn 1RM-arvoon.
    if(ex.intensity){
      var percents = !ex.intensity.isMax ? ex.intensity.percents : [];
      var count = (explicitCount && explicitCount > 0) ? explicitCount : (percents.length || 1);
      var maxEntry = state.manualMax[ex.name.trim().toLowerCase()];
      var usedMax = false;
      var maxRows = [];
      for(var i=0;i<count;i++){
        var weightVal = "";
        if(maxEntry && isFinite(maxEntry.weight)){
          if(ex.intensity.isMax){
            weightVal = String(maxEntry.weight);
          } else {
            var pct = percents.length ? (percents[i] !== undefined ? percents[i] : percents[percents.length-1]) : null;
            if(pct !== null) weightVal = String(roundToStep(maxEntry.weight * pct / 100, 2.5));
          }
          usedMax = true;
        }
        maxRows.push({ weight: weightVal, reps: draftRepsFor(ex, i), notes: "", done: false });
      }
      if(usedMax){ state.autoCalcInfo[id] = { type:"max", weight: maxEntry.weight, isMax: ex.intensity.isMax, percents: percents }; }
      else{ delete state.autoCalcInfo[id]; }
      return maxRows;
    }

    var count2 = draftRowCount(ex);

    if(!isCombo(ex.name)){
      var normName = ex.name.trim().toLowerCase();
      var last = state.lastSet[normName];
      if(last && last.sets && last.sets.length){
        var refSet = last.sets[last.sets.length - 1];
        var refReps = toNumber(refSet.reps);
        var refWeight = toNumber(refSet.weight);
        var targetReps = toNumber(ex.reps);
        if(isFinite(targetReps) && isFinite(refReps) && isFinite(refWeight) && refWeight > 0){
          // Epley-kaava (sama vakio 30 kuin buildAllOneRepMaxSeries)
          // edellisen sarjan 1RM-arviolle, kerrottuna progressiokertoimella, ja
          // takaisin tavoitetoistomäärän painoksi. Kun targetReps === refReps,
          // tämä supistuu muotoon refWeight * PROGRESSION_COEFFICIENT.
          var estimatedOneRepMax = refWeight * (1 + refReps/30);
          var targetOneRepMax = estimatedOneRepMax * PROGRESSION_COEFFICIENT;
          var computed = roundToStep(targetOneRepMax / (1 + targetReps/30), 2.5);
          var formulaRows = [];
          for(var k=0;k<count2;k++){ formulaRows.push({ weight: String(computed), reps: draftRepsFor(ex, k), notes: "", done: false }); }
          state.autoCalcInfo[id] = { type:"formula", refWeight: refWeight, refReps: refReps, date: last.date, progressionPercent: (PROGRESSION_COEFFICIENT - 1) * 100 };
          return formulaRows;
        }
      }
    }

    delete state.autoCalcInfo[id];
    var blankRows = [];
    for(var m=0;m<count2;m++){ blankRows.push({ weight:"", reps: draftRepsFor(ex, m), notes:"", done: false }); }
    return blankRows;
  }

  async function saveExerciseLog(id){
    var ex = findExerciseById(id);
    if(!ex) return;
    var sets = (state.draftSets[id] || []).filter(function(s){ return s.weight || s.reps || s.notes; });
    if(sets.length === 0){ showToast("Lisää vähintään yksi sarja ennen tallennusta"); return; }
    if(!state.todayEntry) state.todayEntry = { date: state.draftDate, exercises: {} };
    state.todayEntry.exercises[id] = { name: ex.name, sets: sets, loggedAt: new Date().toISOString() };
    if(!isCombo(ex.name)){
      state.lastSet[ex.name.trim().toLowerCase()] = {
        sets: sets.map(function(s){ return { weight: s.weight, reps: s.reps }; }),
        date: state.draftDate
      };
      await saveLastSet();
    }
    var maxUpdated = false;
    if(ex.intensity && ex.intensity.isMax){
      var maxWeight = toNumber(sets[0].weight);
      if(isFinite(maxWeight) && maxWeight > 0){
        // Uusi kirjattu MAX-arvo korvaa aina Asetuksiin tallennetun vanhan 1RM:n.
        state.manualMax[ex.name.trim().toLowerCase()] = { weight: maxWeight, date: state.draftDate };
        await saveManualMax();
        maxUpdated = true;
      }
    }
    try{
      await storeSet("entries:" + state.draftDate, JSON.stringify(state.todayEntry));
      delete state.dirtySets[id];
      state.kehitys = undefined;
      // Päivitetään indeksi suoraan tähän tallennukseen — ei tarvitse skannata
      // koko historiaa uudelleen jokaisen tallennuksen jälkeen.
      state.exerciseLogIndex[id] = { date: state.draftDate, data: state.todayEntry.exercises[id] };
      showToast(maxUpdated ? "Tallennettu — 1RM päivitetty Asetuksiin" : "Merkintä tallennettu");
      state.openExercise = null;
      render();
    }catch(e){
      state.lastError = (e && e.message) ? e.message : String(e);
      showToast("Tallennus epäonnistui: " + state.lastError, 4500);
    }
  }

  async function completeAndAdvance(id){
    // Kutsutaan vasta kun kaikki liikkeen sarjat on merkitty valmiiksi: tallentaa
    // (saveExerciseLog sulkee liikkeen state.openExercise = null onnistuessaan) ja
    // avaa sen jälkeen automaattisesti seuraavan liikkeen samasta päivän ryhmästä.
    var groupList = getExerciseGroupList(id);
    var idx = -1;
    if(groupList){ for(var i=0;i<groupList.length;i++){ if(groupList[i].id === id){ idx = i; break; } } }
    var nextEx = (groupList && idx !== -1 && idx + 1 < groupList.length) ? groupList[idx + 1] : null;
    await saveExerciseLog(id);
    if(state.openExercise === null && nextEx){ await toggleExercise(nextEx.id); }
    // Kun koko treenipäivä valmistuu, se niputetaan takaisin kiinni omaksi
    // "tehty"-kortikseen, vaikka käyttäjä olisi itse avannut sen aiemmin
    // (muuten se jäisi auki listana, koska avaus jätti expandedDaySummaries-
    // lipun päälle). saveExerciseLog on jo ehtinyt piirtää kerran tämän
    // funktion sisällä, joten tarvitaan vielä oma render(), jotta kiinni
    // menevä kortti näkyy heti.
    var doneDay = findGroupForExerciseId(id);
    if(doneDay && isDayFullyDone(doneDay) && state.expandedDaySummaries[dayKey(doneDay)]){
      delete state.expandedDaySummaries[dayKey(doneDay)];
      render();
    }
  }

  async function buildAllOneRepMaxSeries(){
    var seriesByName = {};
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          var name = (data.name || "").trim();
          if(!name || isCombo(name)) continue;
          var norm = name.toLowerCase();
          // Sama Epley-kaava (1RM = w × (1 + r/30)) jokaiselle merkinnälle riippumatta
          // siitä, oliko sen teho MAX, prosentti vai vapaa — ei erillistä MAX-oikotietä.
          // Päivän RASKAIN sarja (suurin laskennallinen 1RM) määrittää päivän arvon,
          // ei esim. ensimmäinen sarja — sarjat voivat olla nousujohteisia (esim.
          // 40/60/70 kg), jolloin ensimmäinen sarja aliarvioisi liikkeen 1RM:n rajusti.
          var value = null;
          var sets = data.sets || [];
          for(var s=0;s<sets.length;s++){
            var refReps = toNumber(sets[s].reps), refWeight = toNumber(sets[s].weight);
            if(isFinite(refReps) && isFinite(refWeight) && refWeight > 0){
              var setValue = roundToStep(refWeight * (1 + refReps/30), 2.5);
              if(value === null || setValue > value){ value = setValue; }
            }
          }
          if(value === null) continue;
          if(!seriesByName[norm]) seriesByName[norm] = { displayName: name, points: [], byDate: {} };
          var store = seriesByName[norm];
          var at = data.loggedAt || date;
          if(store.byDate[date] === undefined){
            store.byDate[date] = store.points.length;
            store.points.push({ date: date, value: value, at: at });
          } else {
            var pt = store.points[store.byDate[date]];
            if(value > pt.value){ pt.value = value; }
            if(at > pt.at){ pt.at = at; }
          }
        }
      }
      Object.keys(seriesByName).forEach(function(norm){
        seriesByName[norm].points.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
        delete seriesByName[norm].byDate;
      });
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return seriesByName;
  }

  async function buildTotalWeightSeries(){
    // Sama tietolähde kuin buildAllOneRepMaxSeries, mutta liikkeen 1RM:n sijaan
    // summataan koko treenipäivän nostettu kokonaispaino (paino × toistot,
    // kaikki sarjat kaikista liikkeistä yhteen laskettuna).
    var points = [];
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=0;i<dates.length;i++){
        var date = dates[i];
        var entry = await loadEntry(date);
        var total = 0;
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var sets = entry.exercises[exKeys[j]].sets || [];
          for(var k=0;k<sets.length;k++){
            var w = toNumber(sets[k].weight), r = toNumber(sets[k].reps);
            if(isFinite(w) && isFinite(r)) total += w * r;
          }
        }
        if(total > 0) points.push({ date: date, value: Math.round(total * 10) / 10 });
      }
    }catch(e){ /* hiljainen virhe, palautetaan mitä ehdittiin koota */ }
    return points;
  }

  function computeProgress(points){
    if(!points || points.length === 0) return null;
    var current = points[points.length - 1].value;
    var currentDate = points[points.length - 1].date;
    var previous = points.length >= 2 ? points[points.length - 2].value : null;
    function valueAsOf(cutoffISO){
      var found = null;
      for(var i=0;i<points.length;i++){
        if(points[i].date <= cutoffISO) found = points[i].value; else break;
      }
      return found;
    }
    return {
      current: current,
      currentDate: currentDate,
      previous: previous,
      month: valueAsOf(daysAgoISO(30)),
      halfYear: valueAsOf(daysAgoISO(182)),
      year: valueAsOf(daysAgoISO(365)),
      allTime: points[0].value
    };
  }

  async function loadKehitys(){
    state.kehitysLoading = true; render();
    try{
      var seriesByName = await buildAllOneRepMaxSeries();
      var names = Object.keys(seriesByName).sort();
      var results = [];
      names.forEach(function(norm){
        var series = seriesByName[norm];
        var progress = computeProgress(series.points);
        if(progress){ results.push({ name: capitalize(series.displayName), progress: progress, points: series.points }); }
      });
      state.kehitys = results;
      state.kehitysTotalWeight = await buildTotalWeightSeries();
    }catch(e){ state.kehitys = []; state.kehitysTotalWeight = []; }
    state.kehitysLoading = false;
    render();
  }

  async function rebuildTrackersForName(name){
    var norm = name.trim().toLowerCase();
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var bestSet = null, bestSetAt = "";
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          if((data.name || "").trim().toLowerCase() !== norm) continue;
          var at = data.loggedAt || date;
          if(at > bestSetAt){ bestSetAt = at; bestSet = { sets: data.sets, date: date }; }
        }
      }
      if(bestSet){ state.lastSet[norm] = bestSet; } else { delete state.lastSet[norm]; }
      await saveLastSet();
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  async function rebuildManualMaxForName(name){
    var norm = name.trim().toLowerCase();
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var bestMax = null, bestMaxAt = "";
      for(var i=0;i<keys.length;i++){
        var date = keys[i].replace("entries:", "");
        var entry = await loadEntry(date);
        var exKeys = Object.keys(entry.exercises || {});
        for(var j=0;j<exKeys.length;j++){
          var ek = exKeys[j];
          var data = entry.exercises[ek];
          if((data.name || "").trim().toLowerCase() !== norm) continue;
          var srcEx = findExerciseById(ek);
          if(!(srcEx && srcEx.intensity && srcEx.intensity.isMax)) continue;
          var best = 0;
          (data.sets || []).forEach(function(s){ var w = toNumber(s.weight); if(isFinite(w) && w > best) best = w; });
          var at = data.loggedAt || date;
          if(best > 0 && at > bestMaxAt){ bestMaxAt = at; bestMax = { weight: best, date: date }; }
        }
      }
      if(bestMax){ state.manualMax[norm] = bestMax; } else { delete state.manualMax[norm]; }
    }catch(e){ /* hiljainen virhe, ei kriittinen */ }
  }

  // ---------- simulointi ----------
  // Täyttää koko ohjelman synteettisillä merkinnöillä, jotta Historia- ja
  // Kehitys-näkymiä voi tarkastella ilman että treenejä oikeasti kirjaa.
  // Painot kasvavat lineaarisesti ohjelman ensimmäisestä päivästä viimeiseen
  // niin, että viimeinen päivä on SIMULATION_GROWTH (30 %) korkeampi kuin
  // ensimmäinen — sama kaava jota sovellus muutenkin käyttää (MAX-teholle
  // suoraan arvo, prosenttiteholle osuus siitä, tehottomalle liikkeelle
  // kasvava paino samalla toistomäärällä kuin ohjelmassa on tavoitteena).
  function simulationBaseline(name){
    var n = String(name).toLowerCase();
    if(n.indexOf("penkki") !== -1 || n.indexOf("bench") !== -1) return 60;
    if(n.indexOf("kyykky") !== -1 || n.indexOf("squat") !== -1) return 90;
    if(n.indexOf("maasta") !== -1 || n.indexOf("deadlift") !== -1) return 110;
    var hash = 0;
    for(var i=0;i<n.length;i++){ hash = (hash*31 + n.charCodeAt(i)) >>> 0; }
    return 15 + (hash % 26);
  }
  async function runSimulation(){
    if(state.simulationBusy) return;
    if(!state.program || !state.program.days || state.program.days.length === 0){
      showToast("Tuo ensin treeniohjelma");
      return;
    }
    state.simulationBusy = true;
    render();
    try{
      var res = await storeList("entries:");
      var existing = (res && res.keys) || [];
      if(existing.length > 0){
        showToast("Simulointia ei voi käynnistää, koska merkintöjä on jo tallennettu.", 4200);
        return;
      }
      var days = state.program.days;
      var total = days.length;
      var todayD = new Date();
      var simDates = [];
      // Neljä treeniä per kalenteriviikko (esim. ma/ke/pe/la-tyyppinen jako), jotta
      // ohjelma jakautuu realistisesti usealle viikolle ja Kehitys-näkymään saadaan
      // dataa myös yli kuukauden takaa vertailua varten. Viimeinen treeni osuu tälle päivälle.
      var weekOffsets = [0, 2, 4, 5];
      var perWeek = weekOffsets.length;
      var totalWeeksNeeded = Math.ceil(total / perWeek);
      var lastPosInFinalWeek = (total - 1) % perWeek;
      var finalWeekStart = new Date(todayD);
      finalWeekStart.setDate(finalWeekStart.getDate() - weekOffsets[lastPosInFinalWeek]);
      for(var i=0;i<total;i++){
        var day = days[i];
        var weekIdx = Math.floor(i / perWeek);
        var posInWeek = i % perWeek;
        var weeksBeforeFinal = (totalWeeksNeeded - 1) - weekIdx;
        var d = new Date(finalWeekStart);
        d.setDate(d.getDate() - weeksBeforeFinal * 7 + weekOffsets[posInWeek]);
        var dateISO = toLocalISO(d);
        var growth = 1 + SIMULATION_GROWTH * (total > 1 ? (i / (total - 1)) : 1);
        var entry = { date: dateISO, exercises: {} };
        var hasAny = false;
        day.exercises.forEach(function(ex){
          if(isCombo(ex.name)) return;
          var normName = ex.name.trim().toLowerCase();
          var explicitCount = parseInt(ex.sets, 10);
          var count = (explicitCount && explicitCount > 0) ? explicitCount : 1;
          var targetReps = toNumber(ex.reps);
          var repsVal = isFinite(targetReps) ? targetReps : 1;
          var sets = [];
          if(ex.intensity && ex.intensity.isMax){
            var weight = roundToStep(simulationBaseline(ex.name) * growth, 2.5);
            for(var k=0;k<count;k++){ sets.push({ weight: String(weight), reps: String(repsVal), notes: "" }); }
            state.manualMax[normName] = { weight: weight, date: dateISO };
          } else if(ex.intensity){
            var maxEntry = state.manualMax[normName];
            if(!maxEntry) return;
            var percents = ex.intensity.percents || [];
            for(var k2=0;k2<count;k2++){
              var pct = percents.length ? (percents[k2] !== undefined ? percents[k2] : percents[percents.length-1]) : 100;
              sets.push({ weight: String(roundToStep(maxEntry.weight * pct / 100, 2.5)), reps: String(repsVal), notes: "" });
            }
          } else {
            var weight2 = roundToStep(simulationBaseline(ex.name) * growth, 2.5);
            for(var k3=0;k3<count;k3++){ sets.push({ weight: String(weight2), reps: String(repsVal), notes: "" }); }
          }
          if(sets.length === 0) return;
          entry.exercises[ex.id] = { name: ex.name, sets: sets, loggedAt: dateISO + "T12:00:00.000Z" };
          if(!isCombo(ex.name)){
            state.lastSet[normName] = { sets: sets.map(function(s){ return { weight: s.weight, reps: s.reps }; }), date: dateISO };
          }
          hasAny = true;
        });
        if(hasAny){
          await storeSet("entries:" + dateISO, JSON.stringify(entry));
          simDates.push(dateISO);
        }
      }
      await saveLastSet();
      await saveManualMax();
      state.simulation = { active: true, dates: simDates };
      await saveSimulationState();
      state.historyDates = undefined;
      state.historyCache = {};
      state.kehitys = undefined;
      state.todayEntry = await loadEntry(state.draftDate);
      state.exerciseLogIndex = await buildExerciseLogIndex();
      showToast("Simulointi käynnistetty — " + simDates.length + " päivää täytetty");
    }catch(e){
      showToast("Simulointi epäonnistui: " + ((e && e.message) || String(e)), 4200);
    }finally{
      state.simulationBusy = false;
      render();
    }
  }
  async function stopSimulation(){
    if(state.simulationBusy) return;
    state.simulationBusy = true;
    render();
    try{
      var dates = (state.simulation && state.simulation.dates) || [];
      var names = {};
      for(var i=0;i<dates.length;i++){
        var entry = await loadEntry(dates[i]);
        Object.keys(entry.exercises || {}).forEach(function(ek){
          var nm = (entry.exercises[ek].name || "").trim().toLowerCase();
          if(nm) names[nm] = true;
        });
        await storeDelete("entries:" + dates[i]);
      }
      var nameList = Object.keys(names);
      for(var j=0;j<nameList.length;j++){
        await rebuildTrackersForName(nameList[j]);
        await rebuildManualMaxForName(nameList[j]);
      }
      await saveManualMax();
      state.simulation = { active: false, dates: [] };
      await saveSimulationState();
      state.historyDates = undefined;
      state.historyCache = {};
      state.kehitys = undefined;
      state.todayEntry = await loadEntry(state.draftDate);
      state.exerciseLogIndex = await buildExerciseLogIndex();
      showToast("Simulointi sammutettu ja poistettu");
    }catch(e){
      showToast("Simuloinnin sammutus epäonnistui: " + ((e && e.message) || String(e)), 4200);
    }finally{
      state.simulationBusy = false;
      render();
    }
  }

  async function changeLogDate(newDate){
    state.draftDate = newDate;
    state.draftSets = {};
    state.dirtySets = {};
    state.openExercise = null;
    state.swapExercise = null;

  function findGroupForExerciseId(id){
    if(!state.program) return null;
    for(var i=0;i<state.program.days.length;i++){
      var day = state.program.days[i];
      for(var j=0;j<day.exercises.length;j++){
        if(day.exercises[j].id === id) return day;
      }
    }
    return null;
  }

  async function computeDefaultActiveWeek(){
    if(!state.program || !state.program.weeks || state.program.weeks.length === 0){
      state.activeWeek = null;
      return;
    }
    try{
      var res = await storeList("entries:");
      var keys = (res && res.keys) || [];
      var dates = keys.map(function(k){ return k.replace("entries:", ""); }).sort();
      for(var i=dates.length-1;i>=0;i--){
        var entry = await loadEntry(dates[i]);
        var exKeys = Object.keys(entry.exercises || {});
        exKeys.sort(function(a,b){
          var la = entry.exercises[a].loggedAt || "";
          var lb = entry.exercises[b].loggedAt || "";
          return lb < la ? -1 : (lb > la ? 1 : 0);
        });
        for(var j=0;j<exKeys.length;j++){
          var grp = findGroupForExerciseId(exKeys[j]);
          if(grp && grp.week){ state.activeWeek = grp.week; return; }
        }
      }
    }catch(e){}
    state.activeWeek = state.program.weeks[0];
  }

  async function loadHistory(){

      var keys = (res && res.keys) || [];

      // Merkinnät haetaan valmiiksi välimuistiin, jotta päiväkortin
      // yhteenvetorivi (liikkeet, nostettu paino) näkyy avaamatta korttia.
      for(var i=0;i<state.historyDates.length;i++){

        if(!state.historyCache[hd]) state.historyCache[hd] = await loadEntry(hd);

    state.expandedHistoryDate = date;

    try{

      exKeys.forEach(function(ek){
